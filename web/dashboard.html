<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>📊 Müşteri Paneli</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --dark-main: #0a0e1f;
      --deep2: #10162e;
      --green: #1fae70;
      --white: #f9f9ff;
      --text-dim: rgba(255,255,255,.6);
      --line: rgba(255,255,255,.12);
    }
    body {
      font-family: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--dark-main);
      color: #fff;
      min-height: 100vh;
    }
    .navbar {
      background: rgba(5,5,30,.7);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--line);
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .navbar-title {
      font-size: 20px;
      font-weight: 600;
      color: var(--green);
    }
    .logout-btn {
      padding: 10px 20px;
      background: rgba(255,255,255,.1);
      border: 1px solid var(--line);
      border-radius: 8px;
      color: #fff;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      transition: all .2s;
    }
    .logout-btn:hover {
      background: rgba(255,255,255,.15);
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 40px 20px;
    }
    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 30px;
      border-bottom: 1px solid var(--line);
    }
    .tab-btn {
      padding: 12px 20px;
      background: none;
      border: none;
      color: var(--text-dim);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: all .2s;
      text-transform: uppercase;
      letter-spacing: .05em;
    }
    .tab-btn.active {
      color: var(--green);
      border-bottom-color: var(--green);
    }
    .tab-content {
      display: none;
    }
    .tab-content.active {
      display: block;
    }
    .card {
      background: rgba(255,255,255,.04);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
    }
    .order-header {
      display: flex;
      justify-content: space-between;
      align-items: start;
      margin-bottom: 15px;
    }
    .order-num {
      font-weight: 600;
      font-size: 16px;
    }
    .status-badge {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .05em;
    }
    .status-pending { background: rgba(255,193,7,.2); color: #ffc107; }
    .status-approved { background: rgba(31,174,112,.2); color: var(--green); }
    .status-shipped { background: rgba(33,150,243,.2); color: #2196f3; }
    .status-delivered { background: rgba(76,175,80,.2); color: #4caf50; }
    .order-details {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 15px;
      font-size: 13px;
      color: var(--text-dim);
    }
    .detail-item {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .detail-label {
      text-transform: uppercase;
      font-size: 11px;
      letter-spacing: .05em;
      color: rgba(255,255,255,.4);
      font-weight: 600;
    }
    .notification {
      padding: 15px;
      background: rgba(31,174,112,.08);
      border-left: 3px solid var(--green);
      border-radius: 8px;
      margin-bottom: 15px;
      cursor: pointer;
      transition: all .2s;
    }
    .notification:hover {
      background: rgba(31,174,112,.12);
    }
    .notification.unread {
      background: rgba(31,174,112,.15);
      border-left-color: #ffc107;
    }
    .notification-header {
      display: flex;
      justify-content: space-between;
      align-items: start;
      gap: 10px;
      margin-bottom: 8px;
    }
    .notification-type {
      font-weight: 600;
      font-size: 13px;
      color: var(--green);
      text-transform: uppercase;
      letter-spacing: .05em;
    }
    .notification-time {
      font-size: 11px;
      color: rgba(255,255,255,.4);
    }
    .notification-subject {
      font-weight: 600;
      margin-bottom: 5px;
    }
    .notification-message {
      font-size: 13px;
      color: var(--text-dim);
      line-height: 1.4;
    }
    .empty {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-dim);
    }
    .empty-icon {
      font-size: 48px;
      margin-bottom: 15px;
      opacity: .5;
    }
    .empty p {
      font-size: 14px;
    }
    .loading {
      text-align: center;
      padding: 40px;
      color: var(--text-dim);
    }
  </style>
</head>
<body>
  <div class="navbar">
    <img src="/assets/logo/routex-logo-white.png" alt="RouteX Global" style="height:34px; display:block;">
    <button class="logout-btn" onclick="logout()">Çıkış Yap</button>
  </div>

  <div class="container">
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('orders')">📦 Siparişlerim</button>
      <button class="tab-btn" onclick="switchTab('notifications')">🔔 Bildirimler</button>
    </div>

    <div id="orders" class="tab-content active">
      <div id="ordersLoading" class="loading">⏳ Siparişler yükleniyor...</div>
      <div id="ordersList"></div>
    </div>

    <div id="notifications" class="tab-content">
      <div id="notificationsLoading" class="loading">⏳ Bildirimler yükleniyor...</div>
      <div id="notificationsList"></div>
    </div>
  </div>

  <script>
    const token = localStorage.getItem('access_token');
    const customerId = localStorage.getItem('customer_id');

    if (!token) {
      window.location.href = '/login.html';
    }

    function logout() {
      localStorage.removeItem('access_token');
      localStorage.removeItem('customer_id');
      window.location.href = '/login.html';
    }

    function switchTab(tab) {
      // Hide all
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));

      // Show active
      document.getElementById(tab).classList.add('active');
      event.target.classList.add('active');

      // Load data
      if (tab === 'orders') loadOrders();
      if (tab === 'notifications') loadNotifications();
    }

    async function loadOrders() {
      const container = document.getElementById('ordersList');
      const loading = document.getElementById('ordersLoading');

      try {
        loading.style.display = 'block';
        const response = await fetch('/api/orders', {
          headers: { 'Authorization': `Bearer ${token}` }
        });

        if (!response.ok) {
          const errData = await response.json().catch(() => ({}));
          throw new Error(errData.detail || 'Siparişler yüklenemedi');
        }

        const orders = await response.json();
        loading.style.display = 'none';

        if (!Array.isArray(orders) || orders.length === 0) {
          container.innerHTML = `
            <div class="empty">
              <div class="empty-icon">📭</div>
              <p>Henüz siparişiniz bulunmamaktadır.</p>
            </div>
          `;
          return;
        }

        container.innerHTML = orders.map(order => `
          <div class="card">
            <div class="order-header">
              <div>
                <div class="order-num">${order.quote_number || 'Sipariş #' + order.id}</div>
              </div>
              <span class="status-badge status-${order.status}">${order.status}</span>
            </div>
            <div class="order-details">
              <div class="detail-item">
                <div class="detail-label">GTİP</div>
                <div>${order.gtip || '—'}</div>
              </div>
              <div class="detail-item">
                <div class="detail-label">Mal Bedeli</div>
                <div>$${(order.mal_bedeli || 0).toFixed(2)}</div>
              </div>
              <div class="detail-item">
                <div class="detail-label">Toplam Maliyet</div>
                <div>$${(order.total_cost || 0).toFixed(2)}</div>
              </div>
              <div class="detail-item">
                <div class="detail-label">Tarih</div>
                <div>${new Date(order.order_date).toLocaleDateString('tr-TR')}</div>
              </div>
              <div class="detail-item">
                <div class="detail-label">Takip No</div>
                <div>${order.tracking_number || '—'}</div>
              </div>
            </div>
            ${order.notes ? `<div style="margin-top: 15px; padding-top: 15px; border-top: 1px solid var(--line); font-size: 13px; color: var(--text-dim);">📝 ${order.notes}</div>` : ''}
          </div>
        `).join('');
      } catch (err) {
        loading.style.display = 'none';
        container.innerHTML = `<div class="empty"><p>❌ ${err.message}</p></div>`;
      }
    }

    async function loadNotifications() {
      const container = document.getElementById('notificationsList');
      const loading = document.getElementById('notificationsLoading');

      try {
        loading.style.display = 'block';
        const response = await fetch('/api/notifications', {
          headers: { 'Authorization': `Bearer ${token}` }
        });

        if (!response.ok) {
          const errData = await response.json().catch(() => ({}));
          throw new Error(errData.detail || 'Bildirimler yüklenemedi');
        }

        const notifications = await response.json();
        loading.style.display = 'none';

        if (!Array.isArray(notifications) || notifications.length === 0) {
          container.innerHTML = `
            <div class="empty">
              <div class="empty-icon">📭</div>
              <p>Henüz bildirim bulunmamaktadır.</p>
            </div>
          `;
          return;
        }

        container.innerHTML = notifications.map(notif => `
          <div class="notification ${notif.is_read ? '' : 'unread'}" onclick="markAsRead(${notif.id})">
            <div class="notification-header">
              <div class="notification-type">${notif.type}</div>
              <div class="notification-time">${new Date(notif.sent_at).toLocaleDateString('tr-TR')}</div>
            </div>
            <div class="notification-subject">${notif.subject}</div>
            <div class="notification-message">${notif.message}</div>
          </div>
        `).join('');
      } catch (err) {
        loading.style.display = 'none';
        container.innerHTML = `<div class="empty"><p>❌ ${err.message}</p></div>`;
      }
    }

    async function markAsRead(notifId) {
      try {
        await fetch(`/api/notifications/${notifId}/read`, {
          method: 'POST',
          headers: { 'Authorization': `Bearer ${token}` }
        });
        loadNotifications();
      } catch (err) {
        console.error('Bildirim işaretlenemedi:', err);
      }
    }

    // İlk yükleme
    loadOrders();
  </script>
</body>
</html>
