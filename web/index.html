<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GTİP Vergi Hesaplama Motoru</title>
<style>
  :root{
    --bg:#f6f3ec; --bg-alt:#eee9dd; --surface:#ffffff; --text:#211d16; --text-muted:#6b6152;
    --accent:#a97230; --accent-ink:#7a5322; --accent2:#2f6f63; --accent2-ink:#1e4a42;
    --signal:#b6452e; --signal-ink:#8f3423; --border:#ded6c3;
    --font-display: "Iowan Old Style","Sitka Text",Georgia,"Times New Roman",ui-serif,serif;
    --font-body: -apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    --font-mono: ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#12151c; --bg-alt:#1a1f2b; --surface:#1c2230; --text:#eae6da; --text-muted:#9aa0ac;
      --accent:#d9a054; --accent-ink:#f0c07d; --accent2:#4fa593; --accent2-ink:#7ccabd;
      --signal:#e2795f; --signal-ink:#f0a58e; --border:#2a3140;
    }
  }
  *{box-sizing:border-box;}
  body{ margin:0; background:var(--bg); color:var(--text); font-family:var(--font-body); font-size:16px; line-height:1.5; }
  .wrap{ max-width:920px; margin:0 auto; padding:48px 24px 80px; }
  .banner{ display:flex; align-items:center; gap:10px; font-family:var(--font-mono); font-size:12px; color:var(--accent2-ink); background:color-mix(in srgb, var(--accent2) 12%, transparent); border:1px solid color-mix(in srgb, var(--accent2) 35%, transparent); padding:9px 14px; border-radius:3px; margin-bottom:24px; }
  header h1{ font-family:var(--font-display); font-weight:600; font-size:clamp(24px,4vw,34px); margin:0 0 6px; }
  header p{ color:var(--text-muted); font-size:14.5px; max-width:64ch; margin:0 0 32px; }
  .stats{ display:flex; gap:22px; flex-wrap:wrap; margin-bottom:32px; font-family:var(--font-mono); font-size:12.5px; color:var(--text-muted); }
  .stats b{ color:var(--accent-ink); font-family:var(--font-body); font-size:15px; display:block; }

  .search-wrap{ position:relative; }
  .panel{ background:var(--surface); border:1px solid var(--border); border-radius:4px; padding:24px; }
  label{ display:block; font-family:var(--font-mono); font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-muted); margin-bottom:7px; }
  input, select{ width:100%; font-size:15px; padding:11px 12px; border-radius:3px; border:1px solid var(--border); background:var(--bg); color:var(--text); font-family:inherit; }
  select{ height:44px; }
  input:focus, select:focus{ outline:2px solid var(--accent); outline-offset:1px; }
  .suggestions{ position:absolute; left:0; right:0; top:100%; margin-top:4px; background:var(--surface); border:1px solid var(--border); border-radius:3px; max-height:280px; overflow-y:auto; z-index:10; display:none; box-shadow:0 8px 20px rgba(0,0,0,.12); }
  .suggestions.show{ display:block; }
  .suggestion{ padding:10px 14px; cursor:pointer; border-bottom:1px solid var(--border); font-size:13.5px; }
  .suggestion:last-child{ border-bottom:none; }
  .suggestion:hover, .suggestion.active{ background:var(--bg-alt); }
  .suggestion .g{ font-family:var(--font-mono); color:var(--accent-ink); margin-right:8px; }

  .result{ margin-top:28px; display:none; }
  .result.show{ display:block; }
  .result-head{ margin-bottom:20px; }
  .result-head .g{ font-family:var(--font-mono); font-size:13px; color:var(--accent-ink); }
  .result-head h2{ font-family:var(--font-display); font-size:20px; margin:4px 0 0; }
  .btb-warn{ margin-bottom:20px; font-size:13px; line-height:1.5; color:var(--signal-ink); background:color-mix(in srgb, var(--signal) 10%, transparent); border:1px solid color-mix(in srgb, var(--signal) 30%, transparent); border-radius:3px; padding:10px 14px; }

  .summary-row{ display:grid; grid-template-columns:repeat(3,1fr); gap:1px; background:var(--border); border:1px solid var(--border); margin-bottom:2px; }
  .sum-tile{ background:var(--surface); padding:16px 16px; }
  .sum-tile .l{ font-family:var(--font-mono); font-size:10.5px; text-transform:uppercase; color:var(--text-muted); }
  .sum-tile .v{ font-family:var(--font-mono); font-size:20px; margin-top:4px; }

  .bedel-panel{ margin-top:20px; display:flex; gap:16px; align-items:flex-end; flex-wrap:wrap; }
  .bedel-field{ flex:1; min-width:180px; }
  .bedel-field input{ font-family:var(--font-mono); font-size:17px; }
  .vadeli-field{ display:flex; align-items:center; gap:8px; padding-bottom:11px; }
  .vadeli-field input[type=checkbox]{ width:auto; }
  .vadeli-field label{ margin:0; text-transform:none; font-family:var(--font-body); font-size:13.5px; color:var(--text); letter-spacing:0; }

  .tax-table{ margin-top:24px; border:1px solid var(--border); border-radius:4px; overflow:hidden; }
  .tax-table-head{ display:grid; grid-template-columns:1.6fr 1fr 1fr; gap:12px; padding:9px 16px; background:var(--bg-alt); font-family:var(--font-mono); font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-muted); }
  .tax-table-head .c3{ text-align:right; }
  .tax-row{ background:var(--surface); border-top:1px solid var(--border); }
  .tax-row.inactive .tax-head .name, .tax-row.inactive .tax-head .rate{ opacity:.45; }
  .tax-head{ display:grid; grid-template-columns:1.6fr 1fr 1fr; gap:12px; align-items:center; padding:13px 16px; cursor:pointer; }
  .tax-head:hover{ background:var(--bg-alt); }
  .name-col{ display:flex; align-items:center; gap:9px; min-width:0; }
  .dot{ width:8px; height:8px; border-radius:50%; flex:none; }
  .dot-duty{ background:var(--accent2); } .dot-igv{ background:var(--accent); }
  .dot-gozetim{ background:color-mix(in srgb, var(--accent) 55%, var(--signal) 45%); }
  .dot-damping{ background:var(--signal); } .dot-kdv{ background:color-mix(in srgb, var(--accent2) 55%, var(--accent) 45%); }
  .dot-kkdf{ background:var(--text-muted); }
  .dot-uygunluk{ background:color-mix(in srgb, var(--accent2) 70%, var(--accent) 30%); }
  .name{ font-family:var(--font-display); font-size:15.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .pill{ font-family:var(--font-mono); font-size:9.5px; text-transform:uppercase; letter-spacing:.03em; padding:2px 7px; border-radius:20px; flex:none; border:1px solid transparent; }
  .pill-tahmini{ color:var(--accent-ink); background:color-mix(in srgb, var(--accent) 14%, transparent); border-color:color-mix(in srgb, var(--accent) 35%, transparent); }
  .pill-kosullu{ color:var(--signal-ink); background:color-mix(in srgb, var(--signal) 12%, transparent); border-color:color-mix(in srgb, var(--signal) 32%, transparent); }
  .pill-bilinmiyor{ color:var(--text-muted); background:var(--bg-alt); border-color:var(--border); }
  .pill-gercek{ color:var(--accent2-ink); background:color-mix(in srgb, var(--accent2) 12%, transparent); border-color:color-mix(in srgb, var(--accent2) 32%, transparent); }
  .rate-c{ font-family:var(--font-mono); font-size:13px; color:var(--text-muted); text-align:right; }
  .amount-c{ font-family:var(--font-mono); font-size:15px; text-align:right; }
  .chev{ font-family:var(--font-mono); font-size:10px; color:var(--text-muted); margin-left:4px; }
  .explain{ padding:0 16px 15px 33px; font-size:13.5px; color:var(--text-muted); display:none; }
  .tax-row.open .explain{ display:block; }
  .tax-row.open .chev{ transform:rotate(90deg); display:inline-block; }
  .warn{ color: var(--signal-ink); font-family: var(--font-mono); font-size: 11.5px; }
  .odeme-secim{ display:flex; align-items:center; gap:7px; font-size:13.5px; color:var(--text); margin-bottom:8px; cursor:pointer; }
  .odeme-secim input{ width:auto; }
  .empty{ color:var(--text-muted); font-size:14px; margin-top:20px; }
  .err{ color:var(--signal-ink); margin-top:16px; font-size:14px; }

  .total-row{ margin-top:2px; background:var(--text); color:var(--bg); border-radius:3px; padding:18px 16px; display:flex; align-items:center; justify-content:space-between; }
  @media (prefers-color-scheme: dark){ .total-row{ background:var(--accent-ink); color:#171310; } }
  .total-row .l{ font-family:var(--font-display); font-size:17px; }
  .total-row .v{ font-family:var(--font-mono); font-size:24px; }
  .total-note{ font-size:12px; color:var(--text-muted); margin-top:10px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="banner">✓ Canlı veri — Ticaret Bakanlığı 2026 TGTC + İGV Kararı'ndan gerçek zamanlı sorgulanıyor</div>
  <header>
    <h1>GTİP Vergi Hesaplama Motoru</h1>
    <p>GTİP kodu veya ürün adı yazmaya başlayın. Çin menşeli ithalat varsayımıyla gümrük vergisi, İGV, gözetim ve KDV otomatik hesaplanır.</p>
    <div class="stats" id="stats"></div>
  </header>

  <div class="panel search-wrap">
    <label for="q">GTİP kodu veya ürün adı</label>
    <input id="q" type="text" placeholder="ör. 8536.69 veya priz" autocomplete="off">
    <div class="suggestions" id="suggestions"></div>
  </div>

  <div class="panel bedel-panel" style="margin-top:12px;">
    <div class="bedel-field" style="max-width:170px;">
      <label for="menseUlke">Menşe Ülke</label>
      <select id="menseUlke">
        <option value="CN">Çin</option>
        <option value="DE">Almanya</option>
        <option value="VN">Vietnam</option>
        <option value="KR">Güney Kore</option>
        <option value="US">ABD</option>
        <option value="GB">İngiltere</option>
      </select>
    </div>
    <div class="bedel-field">
      <label for="malBedeli">Mal Bedeli (Fatura / CIF, USD)</label>
      <input id="malBedeli" type="number" min="0" step="0.01" placeholder="ör. 10000" inputmode="decimal">
    </div>
    <div class="bedel-field" style="max-width:160px;">
      <label for="miktar">Miktar <span style="text-transform:none;">(opsiyonel)</span></label>
      <input id="miktar" type="number" min="0" step="0.01" placeholder="ör. 2500" inputmode="decimal">
    </div>
    <div class="bedel-field" style="max-width:120px;">
      <label for="miktarBirim">Birim</label>
      <select id="miktarBirim">
        <option value="Kg">Kg</option>
        <option value="Ton">Ton</option>
        <option value="Adet">Adet</option>
        <option value="M2">m²</option>
        <option value="M">Metre</option>
        <option value="Litre">Litre</option>
      </select>
    </div>
  </div>
  <div id="menseWarn"></div>

  <div class="result" id="result"></div>
</div>

<script>
const API = "";
const qInput = document.getElementById('q');
const sugBox = document.getElementById('suggestions');
const resultBox = document.getElementById('result');
let debounceTimer = null;

fetch(API + '/api/istatistik').then(r=>r.json()).then(s=>{
  document.getElementById('stats').innerHTML = `
    <div><b>${s.gtip_toplam.toLocaleString('tr-TR')}</b>toplam GTİP</div>
    <div><b>${s.igv_uygulanan.toLocaleString('tr-TR')}</b>İGV uygulanan</div>
    <div><b>${s.gozetim_bilinen}</b>gözetim kaydı</div>
    <div><b>${s.damping_bilinen}</b>damping kaydı</div>
  `;
}).catch(()=>{});

qInput.addEventListener('input', () => {
  clearTimeout(debounceTimer);
  const q = qInput.value.trim();
  if (q.length < 2) { sugBox.classList.remove('show'); return; }
  debounceTimer = setTimeout(async () => {
    const res = await fetch(API + '/api/ara?q=' + encodeURIComponent(q));
    const items = await res.json();
    if (!items.length) { sugBox.classList.remove('show'); return; }
    sugBox.innerHTML = items.map(it =>
      `<div class="suggestion" data-code="${it.gtip_no}"><span class="g">${it.gtip_no}</span>${it.aciklama}</div>`
    ).join('');
    sugBox.classList.add('show');
  }, 200);
});

sugBox.addEventListener('click', (e) => {
  const row = e.target.closest('.suggestion');
  if (!row) return;
  qInput.value = row.dataset.code;
  sugBox.classList.remove('show');
  loadGtip(row.dataset.code);
});

document.addEventListener('click', (e) => {
  if (!e.target.closest('.search-wrap')) sugBox.classList.remove('show');
});

const fmtPct = n => (n ?? 0).toLocaleString('tr-TR', {maximumFractionDigits:1}) + '%';
const fmtUsd = n => '$' + (n ?? 0).toLocaleString('tr-TR', {minimumFractionDigits:2, maximumFractionDigits:2});

let currentData = null;
let vadeliState = false;

async function loadGtip(kod) {
  resultBox.innerHTML = '<p class="empty">Yükleniyor…</p>';
  resultBox.classList.add('show');
  try {
    const res = await fetch(API + '/api/gtip/' + encodeURIComponent(kod));
    if (!res.ok) {
      const e = await res.json();
      currentData = null;
      resultBox.innerHTML = `<p class="err">${e.detail}</p>`;
      return;
    }
    currentData = await res.json();
    render(currentData);
  } catch (err) {
    currentData = null;
    resultBox.innerHTML = `<p class="err">Bağlantı hatası: ${err}</p>`;
  }
}

// Hesaplama mantığı ARTIK burada değil — tek doğruluk kaynağı backend'deki
// Rule Engine (src/rule_engine.py). Bu fonksiyon sadece /api/hesapla'yı çağırır
// ve sonucu render eder; kendi vergi hesabını yapmaz.
let renderSeq = 0;

function pill(kind, label) { return `<span class="pill pill-${kind}">${label}</span>`; }

// Bir vergi satırı üretir: dot rengi, isim, durum rozeti, oran, tutar, detay metni.
function taxRow(opts) {
  const { id, dotClass, name, badge, rate, amount, explain, active = true } = opts;
  return `
    <div class="tax-row ${active ? '' : 'inactive'}" data-row="${id}">
      <div class="tax-head" onclick="toggleRow('${id}')">
        <div class="name-col">
          <span class="dot ${dotClass}"></span>
          <span class="name">${name}</span>
          ${badge ? badge : ''}
          <span class="chev">▸</span>
        </div>
        <div class="rate-c">${rate}</div>
        <div class="amount-c">${amount || ''}</div>
      </div>
      <div class="explain">${explain}</div>
    </div>`;
}

function toggleRow(id) {
  const el = document.querySelector(`.tax-row[data-row="${id}"]`);
  if (el) el.classList.toggle('open');
}

async function renderTaxRows() {
  const d = currentData;
  if (!d) return;
  if (!checkMenseUlke()) {
    document.getElementById('taxList').innerHTML = '';
    document.getElementById('totalArea').innerHTML = '';
    return;
  }
  const bedel = parseFloat(document.getElementById('malBedeli').value) || 0;
  const miktar = parseFloat(document.getElementById('miktar').value) || null;
  const miktarBirim = document.getElementById('miktarBirim').value;
  const vadeli = vadeliState;

  const mySeq = ++renderSeq;
  let hesap = null;
  if (bedel > 0) {
    try {
      const res = await fetch(API + '/api/hesapla', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ gtip: d.gtip12, mal_bedeli: bedel, vadeli, miktar, miktar_birim: miktarBirim }),
      });
      if (res.ok) hesap = await res.json();
    } catch (err) { /* bağlantı hatası — hesap null kalır, oranlar yine de gösterilir */ }
  }
  if (mySeq !== renderSeq) return; // kullanıcı bu arada yeni bir değer girdiyse eski cevabı çizme

  const amt = v => hesap ? fmtUsd(v) : '';
  const rows = [];

  const TGTC_URL = 'https://ggm.ticaret.gov.tr/duyurular/istatistik-pozisyonlarina-bolunmus-turk-gumruk-tarife-cetveli-karar-sayisi-10781-yayimlanmistir';
  const IGV_URL = 'https://ticaret.gov.tr/ithalat/ithalat-mevzuati/ithalat-rejimi-karari-igv-karari-ve-ithalat-tebligleri/2-ithalatta-ilave-gumruk-vergisi-uygulanmasina-iliskin-karar-karar-sayisi-3351-karar-metni-ve-tablolar-konsolide-edilmis-olup-gunceldir';
  const KDV_URL = 'https://ticaret.gov.tr/gumruk-islemleri/mevzuat/tebligler/tarife';

  const gvGercek = d.gumruk_vergisi_guvenilirlik === 'ithalat_rejimi_ek2_du';
  rows.push(taxRow({
    id: 'gv', dotClass: 'dot-duty', name: 'Gümrük Vergisi',
    badge: gvGercek ? pill('gercek', 'gerçek') : pill('tahmini', 'tahmini'),
    rate: fmtPct(d.gumruk_vergisi_pct), amount: amt(hesap?.gumruk_vergisi),
    explain: gvGercek
      ? `Temel ithalat vergisi, Diğer Ülkeler sütunu (Çin bu sütuna girer). Matrah: mal bedeli. Kaynak: <a href="${IGV_URL}" target="_blank" rel="noopener">İthalat Rejimi Kararı (Karar 3350) Ek-2, Ticaret Bakanlığı</a>`
      : `<span class="warn">Bu fasıl (genelde tarım ürünleri, 1-24) henüz İthalat Rejimi Kararı'nın doğru sütunundan doğrulanmadı — TGTC'nin nominal "vergi haddi" değeri gösteriliyor, gerçek uygulanan oran farklı olabilir.</span> Kaynak: <a href="${TGTC_URL}" target="_blank" rel="noopener">2026 TGTC, Ticaret Bakanlığı</a>`,
  }));

  rows.push(taxRow({
    id: 'igv', dotClass: 'dot-igv', name: 'İlave Gümrük Vergisi', active: !!d.igv_pct,
    rate: d.igv_pct ? fmtPct(d.igv_pct) : 'Yok', amount: d.igv_pct ? amt(hesap?.igv) : '',
    explain: d.igv_pct
      ? `Çin menşeli eşyaya uygulanan ek vergi (Diğer Ülkeler sütunu). Matrah: mal bedeli. Kaynak: <a href="${IGV_URL}" target="_blank" rel="noopener">İGV Kararı (Karar 3351), Ticaret Bakanlığı</a>`
      : 'Bu GTİP için İGV uygulanmıyor.',
  }));

  const gzNotlar = (hesap?.notlar || []).filter(n => n.includes('Gözetim') || n.includes('gözetim') || n.includes('Beyan edilen birim'));
  rows.push(taxRow({
    id: 'gz', dotClass: 'dot-gozetim', name: 'Gözetim (Referans Değer)', active: !!d.gozetim,
    badge: d.gozetim ? pill('kosullu', 'eşik') : pill('bilinmiyor', 'bilinmiyor'),
    rate: d.gozetim ? `$${d.gozetim.referans_deger}/${d.gozetim.birim}` : '—',
    amount: '',
    explain: d.gozetim
      ? `Bu bir vergi değil, bir eşik: beyan edilen birim değer bu referansın altındaysa vergi tabanı yükseltilebilir (toplama dahil edilmez). Kaynak: <a href="${d.gozetim.kaynak_url}" target="_blank" rel="noopener">${d.gozetim.tebligno}</a>`
        + (gzNotlar.length ? '<br>' + gzNotlar.map(n => `<span class="warn">${n}</span>`).join('<br>') : (miktar ? '' : '<br><span class="warn">Karşılaştırma için yukarıda "Miktar" gir.</span>'))
      : 'Bu GTİP için gözetim veritabanımızda henüz kayıt yok — "bilinmiyor" anlamına gelir, kesin olarak "yok" değil. Ticaret Bakanlığı TARA üzerinden teyit edilmeli.',
  }));

  const dampingActive = d.damping && d.damping.length > 0;
  const dampingHasRate = dampingActive && d.damping.some(x => x.oran_pct != null || x.sabit_tutar != null);
  rows.push(taxRow({
    id: 'dp', dotClass: 'dot-damping', name: 'Dampinge Karşı Vergi', active: dampingActive,
    badge: dampingActive && !dampingHasRate ? pill('kosullu', 'oran yok') : (dampingActive ? pill('gercek', 'gerçek') : pill('bilinmiyor', 'bilinmiyor')),
    rate: dampingActive
      ? (dampingHasRate ? d.damping.map(x => x.oran_pct != null ? fmtPct(x.oran_pct) : (x.sabit_tutar + ' ' + (x.birim || ''))).join(' / ') : d.damping.length + ' kayıt')
      : '—',
    amount: dampingHasRate ? amt(hesap?.damping) : '',
    explain: dampingActive
      ? d.damping.map(x => `<b>${x.mense_ulke}</b>${x.oran_pct != null ? ': ' + fmtPct(x.oran_pct) + ' (CIF üzerinden)' : ''} — <a href="${x.kaynak_url}" target="_blank" rel="noopener">${x.tebligno}</a>${x.oran_pct == null ? ' <span class="warn">(oran henüz veritabanında yok, orijinal tebliğ teyit edilmeli)</span>' : ''}`).join('<br>') + (dampingHasRate ? '<br><span class="warn">Toplamda, kayıtlı en yüksek oran kullanıldı — gerçek oran üretici/ihracatçıya göre değişir.</span>' : '')
      : 'Bu GTİP için damping veritabanımızda henüz kayıt yok — "bilinmiyor" anlamına gelir, kesin olarak "yok" değil.',
  }));

  rows.push(taxRow({
    id: 'kdv', dotClass: 'dot-kdv', name: 'KDV',
    badge: d.kdv_guvenilirlik !== 'kesin' ? pill('tahmini', 'tahmini') : pill('gercek', 'gerçek'),
    rate: fmtPct(d.kdv_pct), amount: amt(hesap?.kdv),
    explain: (d.kdv_guvenilirlik === 'varsayilan_genel_oran'
      ? 'Genel oran varsayıldı (fasıl bazlı yaklaşık kural) — kesin liste teyidi gerekir.'
      : 'Fasıl bazlı yaklaşık kural ile belirlendi — kesin liste teyidi gerekir.') + ' Matrah: mal bedeli + gümrük vergisi + İGV + damping.',
  }));

  if (d.kkdf) {
    rows.push(taxRow({
      id: 'kkdf', dotClass: 'dot-kkdf', name: 'KKDF', active: vadeli,
      badge: pill('kosullu', 'koşula tabi'),
      rate: vadeli ? fmtPct(d.kkdf.oran_pct) : 'Peşinde yok',
      amount: vadeli ? amt(hesap?.kkdf) : '',
      explain: `<label class="odeme-secim"><input type="checkbox" id="vadeliChk" ${vadeli ? 'checked' : ''} onclick="event.stopPropagation()" onchange="vadeliState=this.checked; renderTaxRows();"> Vadeli ödeme (kabul kredili / vadeli akreditif / mal mukabili) — işaretlenirse KKDF hesaba katılır</label>`
        + `${d.kkdf.uygulama_kosulu}. Matrah: mal bedeli. <a href="${d.kkdf.kaynak_url}" target="_blank" rel="noopener">Hukuki dayanak: ${d.kkdf.hukuki_dayanak}</a>`
        + `<br><span class="warn">Ayrıca 2015/7511 sayılı Karar eki listede yer alan bazı hammadde/yatırım malı GTİP'lerinde oran ödeme şekli ne olursa olsun sıfırdır — bu liste henüz sistemimizde değil, teyit edilmeli.</span>`,
    }));
  }

  const uygunlukVar = d.uygunluk_belgeleri && d.uygunluk_belgeleri.length > 0;
  rows.push(taxRow({
    id: 'ug', dotClass: 'dot-uygunluk', name: 'Uygunluk / İthalat Denetimi', active: uygunlukVar,
    badge: uygunlukVar ? pill('gercek', 'gerekli') : pill('bilinmiyor', 'taranmadı'),
    rate: uygunlukVar ? d.uygunluk_belgeleri.map(u => u.kategori).filter((v, i, a) => a.indexOf(v) === i).join(', ') : '—',
    amount: '',
    explain: uygunlukVar
      ? d.uygunluk_belgeleri.map(u => `<b>${u.kategori}</b> — ${u.madde_ismi} — <a href="${u.kaynak_url}" target="_blank" rel="noopener">${u.teblig_no}</a>`).join('<br>') +
        (d.gerekli_belgeler && d.gerekli_belgeler.length ? '<br><br><b>Gerekli belgeler:</b><br>' + d.gerekli_belgeler.map(b => b.belgeler).join('<br>') : '')
      : 'Bu GTİP, şu ana kadar taranmış uygunluk denetimi tebliğlerinde bulunmadı. <span class="warn">Sistem henüz tüm ÜGD tebliğlerini (CE, Tarım, Sağlık, Tekstil vb.) taramadı — "yok" değil, "henüz taranmadı" anlamına gelir.</span>',
  }));

  const totalHtml = hesap ? `
    <div class="total-row">
      <div class="l">Toplam Vergi Yükü</div>
      <div class="v">${fmtUsd(hesap.toplam_vergi)}</div>
    </div>
    <div class="total-note">Mal bedeli $${bedel.toLocaleString('tr-TR')} üzerinden, CIF = mal bedeli varsayımıyla (navlun/sigorta hariçse gerçek CIF farklı olabilir). Gözetim toplamda ayrı — bir vergi değil, tabanı yükseltme eşiğidir. Nihai beyan öncesi gümrük müşaviri teyidi gerekir.</div>
  ` : '';

  document.getElementById('taxList').innerHTML = `
    <div class="tax-table-head"><div>Kalem</div><div class="c3" style="text-align:right">Oran</div><div class="c3">Tutar</div></div>
    ${rows.join('')}
  `;
  document.getElementById('totalArea').innerHTML = totalHtml;
}

function render(d) {
  resultBox.innerHTML = `
    <div class="result-head">
      <div class="g">${d.gtip_no}</div>
      <h2>${d.aciklama}</h2>
    </div>
    <div class="btb-warn">⚠ Bu bir <b>ön analizdir</b>, bağlayıcı bir tespit değildir. GTİP sınıflandırması eşyanın teknik özelliklerine göre tartışmalı olabilir — kesin ve hukuken bağlayıcı bir kod için Ticaret Bakanlığı'ndan <b>Bağlayıcı Tarife Bilgisi (BTB)</b> alınması, nihai beyan öncesi ise bir gümrük müşaviri teyidi önerilir.</div>
    <div class="summary-row">
      <div class="sum-tile"><div class="l">Ölçü Birimi</div><div class="v">${d.olcu_birimi || '—'}</div></div>
      <div class="sum-tile"><div class="l">Gümrük + İGV</div><div class="v">${fmtPct((d.gumruk_vergisi_pct||0) + (d.igv_pct||0))}</div></div>
      <div class="sum-tile"><div class="l">+ KDV</div><div class="v">${fmtPct(d.kdv_pct)}</div></div>
    </div>
    <div class="tax-table" id="taxList"></div>
    <div id="totalArea"></div>
  `;
  renderTaxRows();
}

function checkMenseUlke() {
  const val = document.getElementById('menseUlke').value;
  const warnBox = document.getElementById('menseWarn');
  if (val !== 'CN') {
    const adSelect = document.getElementById('menseUlke');
    const ad = adSelect.options[adSelect.selectedIndex].text;
    warnBox.innerHTML = `<div class="btb-warn" style="margin-top:12px;">⚠ <b>${ad} için henüz veri yok.</b> Sistemde şu an sadece Çin (Diğer Ülkeler sütunu) için gerçek vergi/mevzuat verisi var. Diğer ülkeler zamanla eklenecek — uydurma rakam göstermek yerine sonucu gizliyoruz.</div>`;
    return false;
  }
  warnBox.innerHTML = '';
  return true;
}
document.getElementById('menseUlke').addEventListener('change', () => {
  checkMenseUlke();
  if (currentData) renderTaxRows();
});
document.getElementById('malBedeli').addEventListener('input', renderTaxRows);
document.getElementById('miktar').addEventListener('input', renderTaxRows);
document.getElementById('miktarBirim').addEventListener('change', renderTaxRows);

// Enter tuşuyla tam kod girildiyse doğrudan sorgula
qInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    sugBox.classList.remove('show');
    loadGtip(qInput.value.trim());
  }
});
</script>
</body>
</html>
