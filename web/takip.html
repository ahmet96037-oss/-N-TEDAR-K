<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 40 40%22><rect width=%2240%22 height=%2240%22 rx=%229%22 fill=%22%230f3d63%22/><ellipse cx=%2220%22 cy=%2220%22 rx=%2214%22 ry=%227%22 fill=%22none%22 stroke=%22%23ffffff%22 stroke-opacity=%220.16%22 stroke-width=%221%22/><ellipse cx=%2220%22 cy=%2220%22 rx=%227%22 ry=%2214%22 fill=%22none%22 stroke=%22%23ffffff%22 stroke-opacity=%220.16%22 stroke-width=%221%22/><path d=%22M9,28 C15,24 25,16 31,12%22 fill=%22none%22 stroke=%22%23d99a2b%22 stroke-width=%222%22 stroke-linecap=%22round%22 stroke-dasharray=%220.5 4.2%22/><circle cx=%229%22 cy=%2228%22 r=%222.6%22 fill=%22%23ffffff%22/><circle cx=%2231%22 cy=%2212%22 r=%222.6%22 fill=%22%23d99a2b%22/></svg>">
<title>Sipariş Takip — Tedarik Ağı</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<style>
  :root{
    /* Marka paleti — ithalat/ihracat/lojistik sektörünün tanıdık dili: koyu lacivert + amber/sarı vurgu (TransitFlow ve benzeri profesyonel lojistik temalarından esinlenildi) */
    --bg:#fafafa; --bg-alt:#f4f4f5; --surface:#ffffff; --text:#09090b; --text-muted:#71717a;
    --good:#12b76a; --good-bg:#ecfdf3; --good-bd:#6ce9a6; --bad:#f04438; --bad-bg:#fef3f2; --bad-bd:#fda29b;
    --accent:#d99a2b; --accent-ink:#a8721a; --accent2:#465fff; --accent2-ink:#3641f5;
    --signal:#c0392b; --signal-ink:#96271b; --border:#dbe0e8;
    --font-display: "Inter",-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    --font-body: "Inter",-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    --font-code: "IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }
  /* Karanlık mod da aynı referans tasarımın (shadcn) kendi koyu paletiyle —
     eski lacivert marka rengi değil, nötr zinc tonları. */
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#09090b; --bg-alt:#18181b; --surface:#18181b; --text:#fafafa; --text-muted:#a1a1aa;
      --good:#6ce9a6; --good-bg:#052e16; --good-bd:#039855; --bad:#fda29b; --bad-bg:#450a0a; --bad-bd:#d92d20;
      --accent:#e8b355; --accent-ink:#f3c878; --accent2:#7592ff; --accent2-ink:#9cb9ff;
      --signal:#e2725f; --signal-ink:#f0a08e; --border:#27272a;
    }
  }
  :root[data-theme="dark"]{
    --bg:#09090b; --bg-alt:#18181b; --surface:#18181b; --text:#fafafa; --text-muted:#a1a1aa;
    --good:#6ce9a6; --good-bg:#052e16; --good-bd:#039855; --bad:#fda29b; --bad-bg:#450a0a; --bad-bd:#d92d20;
    --accent:#e8b355; --accent-ink:#f3c878; --accent2:#7592ff; --accent2-ink:#9cb9ff;
    --signal:#e2725f; --signal-ink:#f0a08e; --border:#27272a;
  }
  *{box-sizing:border-box;}
  body{ margin:0; background:var(--bg); color:var(--text); font-family:var(--font-body); font-size:16px; line-height:1.5; overflow-x:hidden; }
  a{ color:inherit; }
  ::selection{ background:var(--accent); color:#1c1508; }

  .theme-toggle{ position:fixed; top:16px; right:16px; z-index:80; display:flex; gap:2px; background:var(--surface); border:1px solid var(--border); border-radius:20px; padding:3px; box-shadow:0 4px 14px rgba(0,0,0,.1); }
  .theme-toggle button{ width:auto; border:none; background:transparent; color:var(--text-muted); font-family:var(--font-body); font-size:12.5px; font-weight:600; padding:6px 12px; border-radius:16px; cursor:pointer; }
  .theme-toggle button.active{ background:var(--accent2); color:#fff; }

  label{ display:block; font-family:var(--font-body); font-size:11.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-muted); margin-bottom:6px; font-weight:600;}
  input, textarea{ width:100%; font-size:15px; padding:11px 12px; border-radius:6px; border:1px solid var(--border); background:var(--bg); color:var(--text); font-family:inherit; margin-bottom:16px; }
  textarea{ min-height:80px; resize:vertical; }
  input:focus, textarea:focus{ outline:2px solid var(--accent); outline-offset:1px; }
  .row2{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  @media (max-width:600px){ .row2{ grid-template-columns:1fr; } }
  button.primary{ width:100%; background:var(--accent2); color:#fff; border:none; padding:13px; border-radius:30px; font-family:var(--font-body); font-weight:700; font-size:15px; cursor:pointer; letter-spacing:-.01em; transition:background .12s; }
  button.primary:hover{ background:var(--accent2-ink); }
  .linklike{ background:none; border:none; color:var(--accent-ink); font-weight:600; cursor:pointer; padding:0; font-size:14px; text-decoration:underline; }
  .toggle-row{ text-align:center; margin-top:16px; font-size:14px; color:var(--text-muted); }
  .err{ color:var(--signal-ink); font-size:13.5px; margin-bottom:12px; }
  .demo-box{ font-size:13px; line-height:1.5; color:var(--accent2-ink); background:color-mix(in srgb, var(--accent2) 10%, transparent); border:1px solid color-mix(in srgb, var(--accent2) 28%, transparent); border-radius:6px; padding:10px 13px; margin-bottom:18px; }

  /* Ana sayfayla tutarlı, sade blur-in giriş animasyonu — her render'da yeniden tetiklenir */
  .panel-fade{ animation:panelFadeIn .45s cubic-bezier(.2,.7,.3,1); }
  @keyframes panelFadeIn{ from{ opacity:0; filter:blur(6px); transform:translateY(8px); } to{ opacity:1; filter:blur(0); transform:translateY(0); } }
  @media (prefers-reduced-motion: reduce){ .panel-fade{ animation:none; } }
  h2{ font-family:var(--font-display); font-weight:700; font-size:24px; letter-spacing:-.01em; margin:0 0 6px; }
  .tarih{ font-variant-numeric:tabular-nums; }

  /* ================= PRE-AUTH: tam ekran fotoğraf + ortalanmış cam kart ================= */
  .auth-shell{ min-height:100vh; position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:40px 20px; overflow:hidden; }
  .auth-bg{ position:absolute; inset:0; z-index:0; }
  .auth-bg img{ width:100%; height:100%; object-fit:cover; }
  .auth-scrim{ position:absolute; inset:0; background:linear-gradient(175deg, rgba(9,9,11,.86) 0%, rgba(9,9,11,.78) 50%, rgba(9,9,11,.92) 100%); }
  .auth-glass-wrap{ position:relative; z-index:1; width:100%; max-width:400px; display:flex; flex-direction:column; align-items:center; }
  .auth-badge{ width:52px; height:52px; border-radius:50%; background:rgba(255,255,255,.12); display:flex; align-items:center; justify-content:center; margin-bottom:22px; box-shadow:0 8px 24px -8px rgba(0,0,0,.5); }
  .auth-badge svg{ width:30px; height:30px; }
  .auth-glass{ width:100%; background:linear-gradient(135deg, rgba(255,255,255,.08), rgba(255,255,255,.02)); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px); border:1px solid rgba(255,255,255,.12); border-radius:26px; box-shadow:0 24px 60px -12px rgba(0,0,0,.6); padding:36px 32px; }
  .auth-glass .back-home{ display:inline-block; margin-bottom:20px; font-size:13px; font-weight:600; color:rgba(255,255,255,.55); text-decoration:none; }
  .auth-glass h2{ font-size:24px; color:#fff; margin-bottom:8px; }
  .auth-glass .lede{ color:rgba(255,255,255,.6); font-size:14px; margin:0 0 24px; }
  .auth-glass label{ color:rgba(255,255,255,.7); }
  .auth-glass input, .auth-glass textarea{ background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.14); color:#fff; }
  .auth-glass input::placeholder{ color:rgba(255,255,255,.35); }
  .auth-glass input:focus, .auth-glass textarea:focus{ border-color:rgba(255,255,255,.35); background:rgba(255,255,255,.1); }
  .auth-glass .demo-box{ background:rgba(70,95,255,.16); border-color:rgba(70,95,255,.35); color:#c7d2ff; }
  .auth-glass .demo-box b{ color:#fff; }
  .auth-glass .toggle-row{ color:rgba(255,255,255,.55); }
  .auth-glass .linklike{ color:#8fa0ff; }
  .auth-glass .err{ color:#ff8a8a; }
  .auth-meta{ position:relative; z-index:1; display:flex; gap:26px; font-family:var(--font-code); font-size:11.5px; color:rgba(255,255,255,.5); margin-top:26px; flex-wrap:wrap; justify-content:center; }
  .auth-meta b{ display:block; color:#fff; font-family:var(--font-body); font-size:14px; margin-top:3px; font-weight:700; }
  @media (max-width:480px){ .auth-glass{ padding:28px 22px; } }

  /* ================= APP SHELL (post-auth panel) ================= */
  .app-shell{ display:flex; min-height:100vh; align-items:stretch; }
  /* ---- Sidebar: shadcn admin dashboard referansıyla birebir — açık/beyaz
     zemin, ince kenarlık, seçili sekme açık gri kapsül. ---- */
  .sidebar{ width:252px; flex:none; background:var(--surface); border-right:1px solid var(--border); padding:20px 14px; display:flex; flex-direction:column; }
  .brand-row{ display:flex; align-items:center; justify-content:space-between; padding:6px; margin-bottom:18px; border-radius:8px; }
  .brand-row:hover{ background:var(--bg-alt); }
  .brand-row .chev{ color:var(--text-muted); font-size:12px; }
  .sidebar .brand{ font-family:var(--font-display); font-weight:700; font-size:14px; text-decoration:none; color:var(--text); display:flex; align-items:center; gap:10px; margin:0; }
  .sidebar .brand svg{ width:26px; height:26px; flex:none; }
  .side-group-label{ font-size:11px; font-weight:600; color:var(--text-muted); padding:0 10px; margin:16px 0 6px; }
  .side-group-label:first-of-type{ margin-top:0; }
  .side-nav{ display:flex; flex-direction:column; gap:1px; }
  .side-nav button, .side-nav a{ display:flex; align-items:center; gap:11px; padding:7px 10px; border-radius:10px; font-weight:600; font-size:14px; color:var(--text); cursor:pointer; border:none; background:none; text-align:left; width:100%; font-family:var(--font-body); text-decoration:none; transition:background .12s, color .12s; }
  .side-nav button:hover, .side-nav a:hover{ background:var(--bg-alt); }
  .side-nav button.active{ background:color-mix(in srgb, var(--accent2) 12%, transparent); color:var(--accent2); font-weight:700; }
  .side-nav button.active .ico{ color:var(--accent2); }
  .side-nav .ico{ width:16px; text-align:center; flex:none; font-size:14.5px; color:var(--text-muted); }
  .sidebar-foot{ margin-top:auto; padding-top:14px; border-top:1px solid var(--border); }
  .user-chip{ display:flex; align-items:center; gap:10px; padding:6px; margin-bottom:6px; }
  .user-chip .av{ width:28px; height:28px; border-radius:50%; background:var(--accent2); color:#fff; display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-weight:700; font-size:12px; flex:none; }
  .user-chip .who{ min-width:0; }
  .user-chip .name{ font-size:13px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:var(--text); }
  .user-chip .role{ font-size:11px; color:var(--text-muted); }
  .main-col{ flex:1; display:flex; flex-direction:column; min-width:0; position:relative; }
  .main-col::before{ content:""; position:absolute; top:-60px; right:-60px; width:280px; height:280px; border-radius:50%; background:radial-gradient(circle, color-mix(in srgb, var(--accent2) 10%, transparent), transparent 70%); pointer-events:none; z-index:0; }
  .main{ position:relative; z-index:1; }
  .topbar{ display:flex; align-items:center; justify-content:flex-start; gap:16px; padding:12px 24px; border-bottom:1px solid var(--border); background:var(--surface); }
  .topbar-search{ display:flex; align-items:center; gap:8px; background:var(--bg); border:1px solid var(--border); border-radius:8px; padding:7px 12px; max-width:320px; flex:1; }
  .topbar-search .ico{ font-size:13px; opacity:.5; }
  .topbar-search input{ border:none; background:none; margin:0; padding:0; font-size:13.5px; flex:1; }
  .topbar-search input:focus{ outline:none; }
  .main{ flex:1; padding:28px 40px; width:100%; max-width:none; }
  @media (max-width:820px){
    .app-shell{ flex-direction:column; }
    .sidebar{ width:100%; flex-direction:row; align-items:center; padding:12px 16px; border-right:none; border-bottom:1px solid var(--border); }
    .sidebar .brand{ margin-bottom:0; margin-right:16px; }
    .side-nav{ flex-direction:row; }
    .sidebar-foot{ margin-top:0; margin-left:auto; padding-top:0; border-top:none; display:flex; align-items:center; }
    .user-chip{ margin-bottom:0; }
    .main{ padding:28px 18px; }
  }
  .panel-head{ display:flex; justify-content:space-between; align-items:flex-start; gap:16px; margin-bottom:26px; flex-wrap:wrap; }
  .panel-head p{ color:var(--text-muted); font-size:14.5px; margin:6px 0 0; }
  .btn{ display:inline-flex; align-items:center; gap:6px; padding:10px 18px; border-radius:30px; font-weight:700; font-size:13.5px; text-decoration:none; border:1px solid var(--border); cursor:pointer; font-family:var(--font-body); background:var(--surface); color:var(--text); }
  .btn:hover{ border-color:var(--accent); }
  .btn-primary{ background:var(--accent2); color:#fff; border-color:var(--accent2); }
  .btn-primary:hover{ background:var(--accent2-ink); border-color:var(--accent2-ink); }
  /* Gemi/konteyner takip linkleri — mobilde PC'deki gibi doğrudan, büyük ve
     tek dokunuşla tıklanabilir olsun diye tam genişlik + alt alta diziliyor
     (yan yana küçük butonlarda parmakla isabet etmek zorlaşıyordu). */
  /* Özet kartının hemen altında, sayfayı kaydırmaya gerek kalmadan gemi/konteyner
     takip kartına atlayan kısayol — özellikle mobilde işe yarıyor. */
  .jump-link{ display:inline-flex; align-items:center; gap:6px; margin-top:16px; font-size:13.5px; font-weight:700; color:var(--accent2-ink); text-decoration:none; background:color-mix(in srgb, var(--accent2) 10%, transparent); border:1px solid color-mix(in srgb, var(--accent2) 28%, transparent); padding:9px 14px; border-radius:6px; }
  .jump-link:hover{ background:color-mix(in srgb, var(--accent2) 16%, transparent); }
  .tracking-links{ display:flex; gap:10px; flex-wrap:wrap; }
  .tracking-links .btn{ padding:13px 20px; font-size:14px; }
  @media (max-width:560px){
    .tracking-links{ flex-direction:column; }
    .tracking-links .btn{ width:100%; justify-content:center; padding:15px 18px; }
  }

  /* shadcn/ui "Card" bileşeniyle birebir: rounded-lg + ince kenarlık + shadow-sm */
  .panel{ background:var(--surface); border:1px solid var(--border); border-radius:20px; padding:28px; margin-bottom:20px; box-shadow:0 4px 16px -4px rgba(70,95,255,.06); }
  .chart-row{ display:grid; grid-template-columns:1.4fr 1fr; gap:16px; margin-bottom:20px; }
  @media (max-width:820px){ .chart-row{ grid-template-columns:1fr; } }
  .panel h2{ letter-spacing:-.02em; }
  .tarih, .ozet-meta b, .durum-pill, .ilerleme-txt, .liste-baslik .no{ font-variant-numeric:tabular-nums; }
  .empty-state{ background:var(--surface); border:1px dashed var(--border); border-radius:16px; padding:40px; text-align:center; color:var(--text-muted); }

  /* Sipariş listesi — kutu-kutu kartlar yerine tek panel içinde satır satır
     liste (tablo hissi): bilgi yoğunluğu daha yüksek, gerçek bir SaaS
     panelindeki liste görünümüne daha yakın. */
  .siparis-liste{ background:var(--surface); border:1px solid var(--border); border-radius:8px; overflow:hidden; }
  .siparis-satir{ display:flex; align-items:center; gap:16px; padding:16px 20px; cursor:pointer; border-bottom:1px solid var(--border); transition:background .1s; }
  .siparis-satir:last-child{ border-bottom:none; }
  .siparis-satir:hover{ background:var(--bg-alt); }
  .siparis-satir .ico{ width:40px; height:40px; border-radius:50%; background:color-mix(in srgb, var(--accent2) 12%, transparent); color:var(--accent2); display:flex; align-items:center; justify-content:center; font-size:16px; flex:none; }
  .siparis-satir .info{ flex:1; min-width:0; }
  .siparis-satir .no{ font-weight:600; font-variant-numeric:tabular-nums; font-size:11.5px; color:var(--text-muted); letter-spacing:.01em; }
  .siparis-satir .ad{ font-weight:600; font-size:14.5px; margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .siparis-satir .sag{ display:flex; align-items:center; gap:14px; flex:none; }
  .siparis-satir .chev{ color:var(--text-muted); font-size:13px; }
  .pill{ display:inline-flex; align-items:center; gap:5px; font-family:var(--font-body); font-size:11.5px; font-weight:600; text-transform:none; letter-spacing:0; padding:4px 10px; border-radius:20px; background:var(--bg-alt); color:var(--text-muted); border:1px solid var(--border); white-space:nowrap; }
  .pill::before{ content:""; width:6px; height:6px; border-radius:50%; background:currentColor; }
  .back{ background:none; border:none; color:var(--text-muted); font-size:13.5px; cursor:pointer; margin-bottom:18px; padding:0; font-weight:600; display:inline-flex; align-items:center; gap:4px; }
  .back:hover{ color:var(--text); }
  .siparis-no-tag{ font-family:var(--font-code); font-variant-numeric:tabular-nums; font-weight:600; font-size:13px; color:var(--accent-ink); letter-spacing:.02em; margin-bottom:6px; }

  /* ================= Sipariş detay: özet kartı ================= */
  .ozet-card{ background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:26px 28px; margin-bottom:22px; }
  .ozet-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:16px; flex-wrap:wrap; margin-bottom:18px; }
  .ozet-top h2{ font-size:22px; margin:2px 0 0; }
  .durum-pill{ display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; padding:6px 13px; border-radius:20px; background:color-mix(in srgb, var(--accent) 14%, transparent); color:var(--accent-ink); border:1px solid color-mix(in srgb, var(--accent) 32%, transparent); white-space:nowrap; }
  /* Süreç fazına göre renklendirilmiş rozetler — admin paneliyle aynı dil. */
  .pill.st-blue{ background:#eff6ff; color:#1d4ed8; border-color:#bfdbfe; }
  .pill.st-purple{ background:#faf5ff; color:#7e22ce; border-color:#e9d5ff; }
  .pill.st-amber{ background:#fffbeb; color:#b45309; border-color:#fde68a; }
  .pill.st-cyan{ background:#ecfeff; color:#0e7490; border-color:#a5f3fc; }
  .pill.st-green{ background:var(--good-bg); color:var(--good); border-color:var(--good-bd); }
  .pill.st-red{ background:var(--bad-bg); color:var(--bad); border-color:var(--bad-bd); }
  .ozet-meta{ display:flex; gap:28px; flex-wrap:wrap; font-size:13.5px; color:var(--text-muted); margin-bottom:20px; }
  .ozet-meta b{ display:block; color:var(--text); font-family:var(--font-code); font-size:14px; margin-top:2px; font-weight:600; }
  /* Adım adım süreç göstergesi — kurumsal kargo takip siteleri gibi net,
     tek bakışta "neredeyim" cevabı. */
  .adim-takip{ display:flex; align-items:flex-start; padding:6px 4px; }
  .adim{ flex:1; display:flex; flex-direction:column; align-items:center; position:relative; text-align:center; }
  .adim-daire{ width:38px; height:38px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:15px; background:var(--bg-alt); color:var(--text-muted); border:2px solid var(--border); z-index:1; flex:none; transition:all .2s; }
  /* Tamamlanan aşama = her zaman yeşil (bitti hissi net olsun); sıradaki/aktif
     aşama = fazına özgü canlı renk (mavi/mor/turuncu/camgöbeği). Böylece şerit
     baştan sona tek renk değil, ilerledikçe renk renk yeşile dönüşüyor. */
  .adim.done .adim-daire{ background:var(--good); color:#fff; border-color:var(--good); }
  .adim.current .adim-daire{ background:#fff; color:var(--accent2); border-color:var(--accent2); box-shadow:0 0 0 4px color-mix(in srgb, var(--accent2) 16%, transparent); }
  .adim.iptal .adim-daire{ background:var(--bad-bg); color:var(--bad); border-color:var(--bad-bd); }
  .adim.current.renk-blue .adim-daire{ background:#fff; color:#2563eb; border-color:#2563eb; box-shadow:0 0 0 4px rgba(37,99,235,.16); }
  .adim.current.renk-purple .adim-daire{ background:#fff; color:#9333ea; border-color:#9333ea; box-shadow:0 0 0 4px rgba(147,51,234,.16); }
  .adim.current.renk-orange .adim-daire{ background:#fff; color:#ea580c; border-color:#ea580c; box-shadow:0 0 0 4px rgba(234,88,12,.16); }
  .adim.current.renk-cyan .adim-daire{ background:#fff; color:#0e7490; border-color:#0e7490; box-shadow:0 0 0 4px rgba(14,116,144,.16); }
  .adim.current.renk-green .adim-daire{ background:#fff; color:var(--good); border-color:var(--good); box-shadow:0 0 0 4px var(--good-bg); }
  .adim.done .adim-daire{ color:#fff; }
  .adim-ad{ font-size:11.5px; font-weight:600; color:var(--text-muted); margin-top:8px; max-width:80px; line-height:1.3; }
  .adim.done .adim-ad, .adim.current .adim-ad{ color:var(--text); }
  .adim-cizgi{ position:absolute; top:19px; left:50%; width:100%; height:2px; background:var(--border); z-index:0; }
  .adim.done .adim-cizgi{ background:var(--good); }
  @media (max-width:600px){ .adim-ad{ display:none; } .adim-daire{ width:30px; height:30px; font-size:12px; } .adim-cizgi{ top:15px; } }
  .ilerleme-bar-wrap{ display:flex; align-items:center; gap:12px; }
  .ilerleme-bar{ flex:1; height:8px; border-radius:6px; background:var(--bg-alt); overflow:hidden; }
  .ilerleme-bar .fill{ height:100%; background:linear-gradient(90deg, var(--accent2), var(--accent)); border-radius:6px; transition:width .3s; }
  .ilerleme-txt{ font-family:var(--font-code); font-size:12px; color:var(--text-muted); white-space:nowrap; }

  /* ================= Tabs ================= */
  .tabs{ display:flex; gap:4px; border-bottom:1px solid var(--border); margin-bottom:22px; }
  .tab-btn{ background:none; border:none; padding:11px 4px; margin-right:24px; font-family:var(--font-body); font-weight:700; font-size:14px; color:var(--text-muted); cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-1px; }
  .tab-btn.active{ color:var(--text); border-bottom-color:var(--accent); }
  .tab-btn .cnt{ font-family:var(--font-code); font-size:11px; color:var(--text-muted); margin-left:4px; }

  /* ================= Faz akordeonu ================= */
  .faz-list{ display:flex; flex-direction:column; gap:10px; }
  .faz{ background:var(--surface); border:1px solid var(--border); border-radius:8px; overflow:hidden; }
  .faz.current{ border-color:var(--accent2); }
  .faz-head{ display:flex; align-items:center; gap:14px; padding:16px 18px; cursor:pointer; user-select:none; }
  .faz-head:hover{ background:var(--bg-alt); }
  .faz-num{ width:30px; height:30px; border-radius:50%; flex:none; display:flex; align-items:center; justify-content:center; font-family:var(--font-code); font-weight:700; font-size:12.5px; background:var(--border); color:var(--text-muted); }
  .faz.done .faz-num{ background:var(--good); color:#fff; }
  .faz.current .faz-num{ background:var(--accent2); color:#fff; }
  .faz-title{ flex:1; min-width:0; }
  .faz-title .ad{ font-family:var(--font-display); font-weight:600; font-size:15.5px; }
  .faz-title .alt{ font-size:12.5px; color:var(--text-muted); margin-top:2px; }
  .faz-badge{ font-family:var(--font-code); font-size:11px; color:var(--text-muted); white-space:nowrap; }
  .faz.done .faz-badge{ color:var(--good); font-weight:600; }
  .faz.current .faz-badge{ color:var(--accent2-ink); font-weight:600; }
  .faz-chev{ color:var(--text-muted); font-size:12px; transition:transform .15s; flex:none; }
  .faz.open .faz-chev{ transform:rotate(90deg); }
  .faz-body{ display:none; padding:2px 18px 18px 62px; border-top:1px solid var(--border); }
  .faz.open .faz-body{ display:block; padding-top:14px; }
  /* Faza özgü canlı renk — .faz.current .faz-num artık her fazda aynı mavi yerine kendi rengi. */
  .faz.current.renk-blue .faz-num{ background:#2563eb; } .faz.current.renk-blue .faz-badge{ color:#2563eb; } .faz.current.renk-blue{ border-color:#2563eb; }
  .faz.current.renk-purple .faz-num{ background:#9333ea; } .faz.current.renk-purple .faz-badge{ color:#9333ea; } .faz.current.renk-purple{ border-color:#9333ea; }
  .faz.current.renk-orange .faz-num{ background:#ea580c; } .faz.current.renk-orange .faz-badge{ color:#ea580c; } .faz.current.renk-orange{ border-color:#ea580c; }
  .faz.current.renk-cyan .faz-num{ background:#0e7490; } .faz.current.renk-cyan .faz-badge{ color:#0e7490; } .faz.current.renk-cyan{ border-color:#0e7490; }
  .faz.current.renk-green .faz-num{ background:var(--good); } .faz.current.renk-green .faz-badge{ color:var(--good); } .faz.current.renk-green{ border-color:var(--good); }
  .mini-step{ display:flex; gap:10px; padding:9px 0; border-bottom:1px solid var(--border); align-items:baseline; }
  .mini-step:last-child{ border-bottom:none; }
  .mini-step .ico{ width:16px; flex:none; font-size:12px; color:var(--text-muted); }
  .mini-step.done .ico{ color:var(--good); font-weight:700; }
  .mini-step.current .ico{ color:var(--accent2-ink); }
  .mini-step .body{ flex:1; min-width:0; }
  .mini-step .ad{ font-size:14px; font-weight:600; }
  .mini-step.done .ad{ color:var(--good); }
  .mini-step.pending .ad{ color:var(--text-muted); font-weight:500; }
  .mini-step .not{ font-size:12.5px; color:var(--text-muted); margin-top:2px; }
  .mini-step .tarih{ font-family:var(--font-code); font-size:11px; color:var(--text-muted); flex:none; white-space:nowrap; }
  .faz.current .ico{ color:var(--accent2-ink); }
  .faz.current.renk-blue .mini-step.current .ico{ color:#2563eb; }
  .faz.current.renk-purple .mini-step.current .ico{ color:#9333ea; }
  .faz.current.renk-orange .mini-step.current .ico{ color:#ea580c; }
  .faz.current.renk-cyan .mini-step.current .ico{ color:#0e7490; }
  .faz.current.renk-green .mini-step.current .ico{ color:var(--good); }

  .belge-item{ display:flex; justify-content:space-between; align-items:center; padding:14px 16px; background:var(--surface); border:1px solid var(--border); border-radius:8px; margin-bottom:10px; }

</style>
</head>
<body>
<div class="theme-toggle" id="themeToggle">
  <button data-mode="light">☀ Açık</button>
  <button data-mode="dark">☾ Koyu</button>
  <button data-mode="system">Sistem</button>
</div>

<div id="app"></div>

<script>
const API = '';
let token = localStorage.getItem('tk_token');
let musteriAdi = localStorage.getItem('tk_ad') || '';
const _siparisParam = new URLSearchParams(location.search).get('siparis');
let view = token ? (_siparisParam ? 'detay' : 'liste') : (location.hash === '#rfq' ? 'rfq' : 'giris'); // giris | rfq | liste | detay
let aktifSiparisNo = _siparisParam || null;

function render() {
  const app = document.getElementById('app');
  if (view === 'giris') { app.innerHTML = authShell(girisEkrani()); return; }
  if (view === 'rfq') { app.innerHTML = authShell(rfqEkrani()); return; }
  // Post-auth: her zaman panel kabuğu (sidebar + içerik) — tüm kullanıcı işlemleri burada.
  app.innerHTML = panelShell('<div class="empty-state">Yükleniyor…</div>', view);
  if (view === 'liste') siparisListesiYukle();
  else if (view === 'detay') siparisDetayYukle(aktifSiparisNo);
}

function authShell(innerHtml) {
  return `
    <div class="auth-shell">
      <div class="auth-bg">
        <img src="assets/photos/terminal.jpg" alt="Konteyner terminali">
        <div class="auth-scrim"></div>
      </div>
      <div class="auth-glass-wrap">
        <a href="/" class="auth-badge"><svg viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="9" fill="#465fff"/><ellipse cx="20" cy="20" rx="14" ry="7" fill="none" stroke="#ffffff" stroke-opacity="0.25"/><ellipse cx="20" cy="20" rx="7" ry="14" fill="none" stroke="#ffffff" stroke-opacity="0.25"/><path d="M9,28 C15,24 25,16 31,12" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-dasharray="0.5 4.2"/><circle cx="9" cy="28" r="2.6" fill="#ffffff"/><circle cx="31" cy="12" r="2.6" fill="#ffffff"/></svg></a>
        <div class="auth-glass panel-fade">
          <a href="/" class="back-home">← Ana sayfaya dön</a>
          ${innerHtml}
        </div>
        <div class="auth-meta">
          <div>Süreç şeffaflığı<b>Canlı Takip</b></div>
          <div>Kalite güvencesi<b>Yerinde QC</b></div>
          <div>Risk yönetimi<b>Yazılı Taahhüt</b></div>
        </div>
      </div>
    </div>`;
}

function panelShell(innerHtml, activeView) {
  const initial = (musteriAdi || '?').trim().charAt(0).toUpperCase();
  return `
    <div class="app-shell">
      <div class="sidebar">
        <div class="brand-row">
          <a href="/" class="brand"><svg viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="9" fill="#0f3d63"/><ellipse cx="20" cy="20" rx="14" ry="7" fill="none" stroke="#ffffff" stroke-opacity="0.16"/><ellipse cx="20" cy="20" rx="7" ry="14" fill="none" stroke="#ffffff" stroke-opacity="0.16"/><path d="M9,28 C15,24 25,16 31,12" fill="none" stroke="#d99a2b" stroke-width="2" stroke-linecap="round" stroke-dasharray="0.5 4.2"/><circle cx="9" cy="28" r="2.6" fill="#ffffff"/><circle cx="31" cy="12" r="2.6" fill="#d99a2b"/></svg>Tedarik Ağı</a>
        </div>
        <div class="side-group-label">Genel</div>
        <div class="side-nav">
          <button class="${activeView==='liste'||activeView==='detay' ? 'active' : ''}" onclick="view='liste'; render();"><span class="ico"><i class="bi bi-box-seam"></i></span> Siparişlerim</button>
          <button onclick="view='rfq'; render();"><span class="ico"><i class="bi bi-plus-circle"></i></span> Yeni Talep</button>
          <a href="/hesapla.html"><span class="ico"><i class="bi bi-calculator"></i></span> Vergi Hesaplama</a>
        </div>
        <div class="sidebar-foot">
          <div class="user-chip">
            <div class="av">${initial}</div>
            <div class="who"><div class="name">${musteriAdi || 'Hesabım'}</div><div class="role">Müşteri Paneli</div></div>
          </div>
          <button class="linklike" style="font-size:13px;" onclick="cikisYap()">Çıkış Yap</button>
        </div>
      </div>
      <div class="main-col">
        <div class="topbar">
          <div class="topbar-search">
            <span class="ico"><i class="bi bi-search"></i></span>
            <input placeholder="Sipariş ara..." oninput="panelAra(this.value)">
          </div>
        </div>
        <div class="main">${innerHtml}</div>
      </div>
    </div>`;
}

function panelAra(v) {
  v = v.toLowerCase().trim();
  document.querySelectorAll('.siparis-satir').forEach(row => {
    row.style.display = row.textContent.toLowerCase().includes(v) ? '' : 'none';
  });
}

function girisEkrani() {
  return `
    <h2>Panelinize Giriş</h2>
    <p class="lede">Sipariş takibiniz, belgeleriniz ve süreç geçmişiniz tek panelde.</p>
    <div class="demo-box">
      <b>Hızlı test için:</b> Bilgiler otomatik dolduruldu, doğrudan "Giriş Yap"a basabilirsiniz.
    </div>
    <div id="girisErr" class="err"></div>
    <label for="gEmail">E-posta</label>
    <input id="gEmail" type="email" placeholder="ornek@firma.com" value="demo@cintedarikagi.com">
    <label for="gSifre">Şifre</label>
    <input id="gSifre" type="password" value="demo1234">
    <button class="primary" onclick="girisYap()">Giriş Yap</button>
    <div class="toggle-row">Hesabınız yok mu? <button class="linklike" onclick="view='rfq'; render();">Yeni talep oluşturun</button></div>`;
}

function rfqEkrani() {
  return `
    <h2>Yeni Talep (RFQ)</h2>
    <p class="lede">Ürün bilgilerinizi girin, fabrika görüşmelerine hemen başlayalım. Aynı anda bir panel hesabı oluşturulur.</p>
    <div id="rfqErr" class="err"></div>
    <div class="row2">
      <div><label for="rAd">Ad Soyad</label><input id="rAd"></div>
      <div><label for="rFirma">Firma (opsiyonel)</label><input id="rFirma"></div>
    </div>
    <div class="row2">
      <div><label for="rEmail">E-posta</label><input id="rEmail" type="email"></div>
      <div><label for="rTel">Telefon (opsiyonel)</label><input id="rTel"></div>
    </div>
    <label for="rSifre">Şifre belirleyin (panelinize giriş için)</label>
    <input id="rSifre" type="password">
    <label for="rUrun">Ürün açıklaması</label>
    <textarea id="rUrun" placeholder="Ne tür bir ürün, hangi özelliklerde?"></textarea>
    <div class="row2">
      <div><label for="rMiktar">Miktar</label><input id="rMiktar" placeholder="ör. 5000 adet"></div>
      <div><label for="rFiyat">Hedef fiyat (opsiyonel)</label><input id="rFiyat" placeholder="ör. 2000 USD"></div>
    </div>
    <button class="primary" onclick="rfqGonder()">Talebi Gönder</button>
    <div class="toggle-row">Zaten hesabınız var mı? <button class="linklike" onclick="view='giris'; render();">Giriş yapın</button></div>`;
}

async function girisYap() {
  const email = document.getElementById('gEmail').value.trim();
  const sifre = document.getElementById('gSifre').value;
  const errBox = document.getElementById('girisErr');
  errBox.textContent = '';
  try {
    const res = await fetch(API + '/api/tk/giris', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({email, sifre}) });
    if (!res.ok) { const d = await res.json(); errBox.textContent = d.detail || 'Giriş başarısız'; return; }
    const d = await res.json();
    token = d.token; localStorage.setItem('tk_token', token);
    musteriAdi = d.ad_soyad || ''; localStorage.setItem('tk_ad', musteriAdi);
    view = 'liste'; render();
  } catch (e) { errBox.textContent = 'Bağlantı hatası'; }
}

async function rfqGonder() {
  const body = {
    ad_soyad: document.getElementById('rAd').value.trim(),
    firma: document.getElementById('rFirma').value.trim() || null,
    email: document.getElementById('rEmail').value.trim(),
    telefon: document.getElementById('rTel').value.trim() || null,
    sifre: document.getElementById('rSifre').value,
    urun_aciklamasi: document.getElementById('rUrun').value.trim(),
    miktar: document.getElementById('rMiktar').value.trim() || null,
    hedef_fiyat: document.getElementById('rFiyat').value.trim() || null,
  };
  const errBox = document.getElementById('rfqErr');
  errBox.textContent = '';
  if (!body.ad_soyad || !body.email || !body.sifre || !body.urun_aciklamasi) {
    errBox.textContent = 'Ad soyad, e-posta, şifre ve ürün açıklaması zorunlu.'; return;
  }
  try {
    const res = await fetch(API + '/api/tk/rfq', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body) });
    if (!res.ok) { const d = await res.json(); errBox.textContent = d.detail || 'Bir hata oluştu'; return; }
    const d = await res.json();
    token = d.token; localStorage.setItem('tk_token', token);
    musteriAdi = body.ad_soyad; localStorage.setItem('tk_ad', musteriAdi);
    aktifSiparisNo = d.siparis_no;
    view = 'detay'; render();
  } catch (e) { errBox.textContent = 'Bağlantı hatası'; }
}

function cikisYap() { localStorage.removeItem('tk_token'); localStorage.removeItem('tk_ad'); token = null; musteriAdi = ''; view = 'giris'; render(); }

// Durum kodunu, tablo/pill'lerde kullanılan renk kategorisine çevirir — admin
// panelindeki durumRenkSinifi() ile birebir aynı mantık.
function durumRenkSinifi(durum) {
  if (durum === 'iptal_edildi') return 'st-red';
  if (['numune_revizyon_istendi','beklemede'].includes(durum)) return 'st-amber';
  if (durum === 'teslim_edildi') return 'st-green';
  if (['talep_alindi','fabrika_gorusuluyor','teklif_hazir'].includes(durum)) return 'st-blue';
  if (durum.startsWith('numune_')) return 'st-purple';
  if (durum.startsWith('uretim_') || durum === 'uretimde') return 'st-amber';
  if (['sevkiyat_belgeleri_hazirlaniyor','konteyner','yukleme_odeme_bekleniyor','gemide','teslimat_yolda'].includes(durum)) return 'st-cyan';
  if (durum.startsWith('gumruk_')) return 'st-cyan';
  return '';
}

// Müşterinin kendi siparişlerinden gerçek bir süreç-fazı dağılım grafiği —
// admin panelindeki barGrafigi() ile aynı mantık, tek müşteriye özel veriyle.
function musteriFazGrafigi(rows) {
  const fazlar = [
    ['Talep/Teklif', r => ['talep_alindi','fabrika_gorusuluyor','teklif_hazir'].includes(r.durum)],
    ['Numune', r => r.durum.startsWith('numune_')],
    ['Üretim', r => r.durum.startsWith('uretim_') || r.durum === 'uretimde'],
    ['Sevkiyat', r => ['sevkiyat_belgeleri_hazirlaniyor','konteyner','yukleme_odeme_bekleniyor','gemide','teslimat_yolda'].includes(r.durum)],
    ['Gümrük', r => r.durum.startsWith('gumruk_')],
    ['Teslim', r => r.durum === 'teslim_edildi'],
  ];
  const veriler = fazlar.map(([ad, f], i) => ({ad, n: rows.filter(f).length, renk: i % 2 === 0 ? '#ea580c' : '#14b8a6'}));
  if (!veriler.some(v => v.n > 0)) return '';
  const maxN = Math.max(1, ...veriler.map(v => v.n));
  const W = 560, H = 130, PAD = 20, barW = (W - PAD*2) / veriler.length * 0.55;
  const stepX = (W - PAD*2) / veriler.length;
  const bars = veriler.map((v,i) => {
    const h = (v.n / maxN) * (H - PAD*2 - 14);
    const x = PAD + i*stepX + (stepX - barW)/2;
    const y = H - PAD - h;
    return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${Math.max(h,2).toFixed(1)}" rx="3" fill="${v.renk}"/>
      <text x="${(x+barW/2).toFixed(1)}" y="${(y-6).toFixed(1)}" font-size="10" font-weight="700" fill="var(--text)" text-anchor="middle">${v.n}</text>
      <text x="${(x+barW/2).toFixed(1)}" y="${(H-PAD+12).toFixed(1)}" font-size="8.5" fill="var(--text-muted)" text-anchor="middle">${v.ad}</text>`;
  }).join('');
  return `<div class="panel" style="margin-bottom:0;">
    <h2 style="font-size:15px;">Siparişleriniz — Süreç Fazına Göre</h2>
    <p style="color:var(--text-muted); font-size:12.5px; margin:0 0 10px;">Toplam ${rows.length} sipariş, gerçek dağılım</p>
    <svg viewBox="0 0 ${W} ${H}" style="width:100%; height:auto; max-width:480px;">${bars}</svg>
  </div>`;
}

// Admin panelindeki halka grafikle birebir aynı dil — burada müşterinin
// KENDİ siparişlerinin teslim oranını gösteriyor.
function musteriTamamlanmaHalkasi(rows) {
  const toplam = rows.length;
  const tamamlanan = rows.filter(r => r.durum === 'teslim_edildi').length;
  const yuzde = toplam > 0 ? Math.round((tamamlanan / toplam) * 100) : 0;
  const R = 70, C = 2 * Math.PI * R;
  const dolu = (yuzde / 100) * C;
  return `<div class="panel" style="margin-bottom:0; display:flex; flex-direction:column; align-items:center; text-align:center;">
    <h2 style="font-size:15px; align-self:flex-start;">Teslimat Oranınız</h2>
    <p style="color:var(--text-muted); font-size:12.5px; margin:0 0 10px; align-self:flex-start;">Teslim edilen / toplam sipariş</p>
    <svg viewBox="0 0 180 180" style="width:150px; height:150px;">
      <circle cx="90" cy="90" r="${R}" fill="none" stroke="var(--bg-alt)" stroke-width="16"/>
      <circle cx="90" cy="90" r="${R}" fill="none" stroke="var(--accent2)" stroke-width="16" stroke-linecap="round"
        stroke-dasharray="${dolu.toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 90 90)"/>
      <text x="90" y="84" text-anchor="middle" font-size="28" font-weight="700" fill="var(--text)" font-family="var(--font-display)">%${yuzde}</text>
      <text x="90" y="106" text-anchor="middle" font-size="11" fill="var(--text-muted)">${tamamlanan}/${toplam}</text>
    </svg>
  </div>`;
}

async function siparisListesiYukle() {
  const main = document.querySelector('.main');
  try {
    const res = await fetch(API + '/api/tk/siparislerim', { headers: {'Authorization':'Bearer ' + token} });
    if (res.status === 401) { cikisYap(); return; }
    const rows = await res.json();
    let html = `<div class="panel-head">
      <div><h2>Siparişleriniz</h2><p>Tüm taleplerinizin durumu ve geçmişi.</p></div>
      <button class="btn btn-primary" onclick="view='rfq'; render();">＋ Yeni Talep</button>
    </div>`;
    if (rows.length === 0) {
      html += `<div class="empty-state">Henüz siparişiniz yok.<br><button class="linklike" style="margin-top:10px;" onclick="view='rfq'; render();">İlk talebinizi oluşturun →</button></div>`;
    } else {
      html += `<div class="chart-row">${musteriFazGrafigi(rows)}${musteriTamamlanmaHalkasi(rows)}</div>`;
      html += '<div class="siparis-liste">';
      rows.forEach(r => {
        html += `<div class="siparis-satir" onclick="aktifSiparisNo='${r.siparis_no}'; view='detay'; render();">
          <div class="ico"><i class="bi bi-box-seam"></i></div>
          <div class="info">
            <div class="no">${r.siparis_no}</div>
            <div class="ad">${r.urun_aciklamasi}</div>
          </div>
          <div class="sag">
            <span class="pill ${durumRenkSinifi(r.durum)}">${r.durum_adi}</span>
            <span class="chev">›</span>
          </div>
        </div>`;
      });
      html += '</div>';
    }
    main.innerHTML = '<div class="panel-fade">' + html + '</div>';
  } catch (e) { main.innerHTML = '<div class="panel err">Yüklenemedi, bağlantınızı kontrol edin.</div>'; }
}

// Süreç, kullanıcıya tek düz liste yerine altı mantıksal FAZ hâlinde gösterilir
// (RFQ→teklif, numune, üretim, sevkiyat, gümrük, teslimat — sunumun Bölüm 07-08
// ayrımıyla aynı). Tamamlanan/gelecek fazlar özet satıra sıkışır, mevcut faz
// otomatik açık gelir — 19 adımı tek uzun sütun hâlinde dökmek yerine.
const FAZLAR = [
  { ad: 'Talep &amp; Teklif', renk:'blue', kodlar: ['talep_alindi','fabrika_gorusuluyor','teklif_hazir'] },
  { ad: 'Numune', renk:'purple', kodlar: ['numune_odeme_bekleniyor','numune_uretiliyor','numune_kalite_kontrolde','numune_onayinizi_bekliyor'] },
  { ad: 'Üretim', renk:'orange', kodlar: ['uretim_odeme_bekleniyor','uretimde','uretim_kalite_kontrolde'] },
  { ad: 'Sevkiyat', renk:'cyan', kodlar: ['sevkiyat_belgeleri_hazirlaniyor','konteyner','yukleme_odeme_bekleniyor','gemide'] },
  { ad: 'Gümrük', renk:'cyan', kodlar: ['gumruk_beyanname','gumruk_vergi_odeme','gumruk_muayene'] },
  { ad: 'Teslimat', renk:'green', kodlar: ['teslimat_yolda','teslim_edildi'] },
];
let detayTab = 'surec';
let acikFazIndex = 0;
let detayVeriCache = null;

async function siparisDetayYukle(siparisNo) {
  const main = document.querySelector('.main');
  try {
    const res = await fetch(API + '/api/tk/siparis/' + encodeURIComponent(siparisNo), { headers: {'Authorization':'Bearer ' + token} });
    if (res.status === 401) { cikisYap(); return; }
    if (!res.ok) { main.innerHTML = '<div class="panel err">Sipariş bulunamadı.</div>'; return; }
    const d = await res.json();
    detayVeriCache = d;

    // Özel durum (revizyon/beklemede/iptal) ana akışta bir "adım" değil, üstüne
    // binen bir durum — ilerlemeyi en son ulaşılan LİNEER adıma göre hesaplıyoruz,
    // özel durumu ayrı bir uyarı bandında gösteriyoruz.
    const lineerKodlar = new Set(d.durum_sirasi.map(s => s.kod));
    let sonLineerDurum = null;
    for (let i = d.gecmis.length - 1; i >= 0; i--) {
      if (lineerKodlar.has(d.gecmis[i].durum)) { sonLineerDurum = d.gecmis[i].durum; break; }
    }
    if (sonLineerDurum === null && lineerKodlar.has(d.durum)) sonLineerDurum = d.durum;
    const suankiIndex = d.durum_sirasi.findIndex(s => s.kod === sonLineerDurum);
    acikFazIndex = FAZLAR.findIndex(f => f.kodlar.includes(sonLineerDurum));
    if (acikFazIndex < 0) acikFazIndex = 0;

    main.innerHTML = '<div class="panel-fade">' + detaySayfasi(d, suankiIndex) + '</div>';
  } catch (e) { main.innerHTML = '<div class="panel err">Yüklenemedi.</div>'; }
}

// Adım adım, kolay takip edilebilir yatay süreç göstergesi — 19 durumu tek tek
// değil, gerçek 6 ana faza indirger. Kargo takip siteleri gibi "neredeyim"
// sorusuna tek bakışta cevap verir.
const ANA_FAZLAR = [
  { ad:'Talep & Teklif', ico:'bi-file-earmark-text', renk:'blue', test: k => ['talep_alindi','fabrika_gorusuluyor','teklif_hazir'].includes(k) },
  { ad:'Numune', ico:'bi-flask', renk:'purple', test: k => k.startsWith('numune_') },
  { ad:'Üretim', ico:'bi-gear', renk:'orange', test: k => k.startsWith('uretim_') || k === 'uretimde' },
  { ad:'Sevkiyat', ico:'bi-truck', renk:'cyan', test: k => ['sevkiyat_belgeleri_hazirlaniyor','konteyner','yukleme_odeme_bekleniyor','gemide','teslimat_yolda'].includes(k) },
  { ad:'Gümrük', ico:'bi-shield-check', renk:'cyan', test: k => k.startsWith('gumruk_') },
  { ad:'Teslim', ico:'bi-box-seam', renk:'green', test: k => k === 'teslim_edildi' },
];
function adimTakipcisi(d) {
  let fazIdx = ANA_FAZLAR.findIndex(f => f.test(d.durum));
  if (fazIdx === -1 && d.durum === 'numune_revizyon_istendi') fazIdx = 1;
  const iptal = d.durum === 'iptal_edildi';
  return `<div class="adim-takip">
    ${ANA_FAZLAR.map((f, i) => {
      let durum = 'pending';
      if (iptal) durum = 'iptal';
      else if (i < fazIdx) durum = 'done';
      else if (i === fazIdx) durum = 'current';
      return `<div class="adim ${durum} renk-${f.renk}">
        <div class="adim-daire"><i class="bi ${durum==='done' ? 'bi-check-lg' : f.ico}"></i></div>
        <div class="adim-ad">${f.ad}</div>
        ${i < ANA_FAZLAR.length - 1 ? '<div class="adim-cizgi"></div>' : ''}
      </div>`;
    }).join('')}
  </div>`;
}

function detaySayfasi(d, suankiIndex) {
  const toplam = d.durum_sirasi.length;
  const tamamlanan = Math.max(suankiIndex, 0) + (suankiIndex >= 0 ? 1 : 0);
  const yuzde = d.durum === 'teslim_edildi' ? 100 : Math.round((tamamlanan / toplam) * 100);

  let ozelBanner = '';
  if (d.ozel_durum_mu) {
    const ozelBilgi = (d.ozel_durumlar || []).find(o => o.kod === d.durum);
    const sonKayit = d.gecmis[d.gecmis.length - 1];
    const renk = d.durum === 'iptal_edildi' ? 'var(--signal)' : 'var(--accent)';
    const bg = d.durum === 'iptal_edildi' ? 'color-mix(in srgb, var(--signal) 10%, transparent)' : 'color-mix(in srgb, var(--accent) 10%, transparent)';
    ozelBanner = `<div class="panel" style="border-color:${renk}; background:${bg}; padding:18px 22px; margin-bottom:20px;">
      <div style="font-weight:700; font-size:15px; color:${renk};">⚠ ${ozelBilgi ? ozelBilgi.ad : d.durum}</div>
      ${sonKayit && sonKayit.not_metni ? `<p style="margin:6px 0 0; color:var(--text-muted); font-size:14px;">${sonKayit.not_metni}</p>` : ''}
    </div>`;
  }

  const suankiAd = suankiIndex >= 0 ? d.durum_sirasi[suankiIndex].ad : 'Talep Alındı';

  let sevkiyatCard = '';
  if (d.sevkiyat) {
    const s = d.sevkiyat;
    sevkiyatCard = `<div class="panel" id="gemi-takip" style="margin-bottom:20px; scroll-margin-top:16px;">
      <h2 style="font-size:16px; margin-bottom:14px;">🚢 Gemi &amp; Taşıyıcı Takibi</h2>
      <div class="ozet-meta" style="margin-bottom:18px;">
        ${s.tasiyici_firma ? `<div>Taşıyıcı<b style="font-family:var(--font-body);">${s.tasiyici_firma}</b></div>` : ''}
        ${s.gemi_adi ? `<div>Gemi adı<b style="font-family:var(--font-body);">${s.gemi_adi}</b></div>` : ''}
        ${s.sefer_no ? `<div>Sefer no<b>${s.sefer_no}</b></div>` : ''}
        ${s.konsimento_no ? `<div>Konşimento (B/L)<b>${s.konsimento_no}</b></div>` : ''}
        ${s.konteyner_no ? `<div>Konteyner no<b>${s.konteyner_no}</b></div>` : ''}
      </div>
      <div class="tracking-links">
        ${s.tasiyici_takip_url ? `<a href="${s.tasiyici_takip_url}" target="_blank" rel="noopener" class="btn btn-primary">🚢 ${s.tasiyici_firma || 'Taşıyıcı'} Sitesinde Takip Et →</a>` : ''}
        ${s.konteyner_takip_url ? `<a href="${s.konteyner_takip_url}" target="_blank" rel="noopener" class="btn btn-primary">📦 Konteyner Takibi (${s.konteyner_no}) →</a>` : ''}
        ${s.marinetraffic_url ? `<a href="${s.marinetraffic_url}" target="_blank" rel="noopener" class="btn">🌊 Marine Traffic'te Ara →</a>` : ''}
        ${s.vesselfinder_url ? `<a href="${s.vesselfinder_url}" target="_blank" rel="noopener" class="btn">VesselFinder'da Ara →</a>` : ''}
      </div>
      ${s.konteyner_takip_kaynagi ? `<p style="font-size:11.5px; color:var(--text-muted); margin:10px 0 0;">Konteyner takibi kaynağı: ${s.konteyner_takip_kaynagi}${s.konteyner_takip_kaynagi.includes('genel') ? ' — bu taşıyıcı için otomatik firma linki henüz doğrulanmadı' : ' (taşıyıcıya göre otomatik seçildi)'}</p>` : ''}
    </div>`;
  }

  return `
    <button class="back" onclick="view='liste'; render();">← Siparişlerime dön</button>
    <div class="ozet-card">
      <div class="ozet-top">
        <div>
          <div class="siparis-no-tag">${d.siparis_no}</div>
          <h2>${d.urun_aciklamasi}</h2>
        </div>
        <span class="durum-pill">${d.ozel_durum_mu ? d.durum_adi : suankiAd}</span>
      </div>
      <div class="ozet-meta">
        <div>Miktar<b>${d.miktar || '—'}</b></div>
        <div>Hedef fiyat<b>${d.hedef_fiyat || '—'}</b></div>
        <div>Toplam aşama<b>${toplam}</b></div>
      </div>
      <div class="ilerleme-bar-wrap">
        <div class="ilerleme-bar"><div class="fill" style="width:${yuzde}%;"></div></div>
        <div class="ilerleme-txt">${yuzde}%</div>
      </div>
      ${d.sevkiyat ? `<a href="#gemi-takip" class="jump-link">🚢 Gemi &amp; Konteyner Takip Ekranına Git ↓</a>` : ''}
    </div>
    <div class="panel">${adimTakipcisi(d)}</div>
    ${ozelBanner}
    ${sevkiyatCard}
    <div class="tabs">
      <button class="tab-btn ${detayTab==='surec'?'active':''}" onclick="detayTab='surec'; rerenderDetay();">Süreç Takibi</button>
      <button class="tab-btn ${detayTab==='belgeler'?'active':''}" onclick="detayTab='belgeler'; rerenderDetay();">Belgeler <span class="cnt">${d.belgeler.length}</span></button>
    </div>
    <div id="detayIcerik">${detayTab === 'surec' ? fazAkordeonu(d, suankiIndex) : belgelerListesi(d)}</div>
  `;
}

function rerenderDetay() {
  if (!detayVeriCache) return;
  const d = detayVeriCache;
  const lineerKodlar = new Set(d.durum_sirasi.map(s => s.kod));
  let sonLineerDurum = null;
  for (let i = d.gecmis.length - 1; i >= 0; i--) {
    if (lineerKodlar.has(d.gecmis[i].durum)) { sonLineerDurum = d.gecmis[i].durum; break; }
  }
  const suankiIndex = d.durum_sirasi.findIndex(s => s.kod === sonLineerDurum);
  document.querySelector('.main').innerHTML = detaySayfasi(d, suankiIndex);
}

function fazToggle(i) {
  acikFazIndex = (acikFazIndex === i) ? -1 : i;
  document.getElementById('detayIcerik').innerHTML = fazAkordeonu(detayVeriCache, hesaplaSuankiIndex(detayVeriCache));
}

function hesaplaSuankiIndex(d) {
  const lineerKodlar = new Set(d.durum_sirasi.map(s => s.kod));
  let sonLineerDurum = null;
  for (let i = d.gecmis.length - 1; i >= 0; i--) {
    if (lineerKodlar.has(d.gecmis[i].durum)) { sonLineerDurum = d.gecmis[i].durum; break; }
  }
  // Geçmiş kaydında eşleşme yoksa (ör. durum elle/toplu güncellenmiş, geçmiş
  // satırı hiç oluşmamış) siparişin GERÇEK durumuna düşüyoruz — sessizce
  // "Talep Alındı"ya (index 0) geri dönüp yanlış aşama göstermek yerine.
  if (sonLineerDurum === null && lineerKodlar.has(d.durum)) sonLineerDurum = d.durum;
  return d.durum_sirasi.findIndex(s => s.kod === sonLineerDurum);
}

function fazAkordeonu(d, suankiIndex) {
  const suankiKod = suankiIndex >= 0 ? d.durum_sirasi[suankiIndex].kod : null;
  let html = '<div class="faz-list">';
  FAZLAR.forEach((faz, fi) => {
    const adimlar = faz.kodlar.map(kod => d.durum_sirasi.find(s => s.kod === kod)).filter(Boolean);
    const fazIndeksleri = adimlar.map(a => d.durum_sirasi.findIndex(s => s.kod === a.kod));
    const fazBaslangic = Math.min(...fazIndeksleri);
    const fazBitis = Math.max(...fazIndeksleri);
    const durumCls = fazBitis <= suankiIndex ? 'done' : (fazBaslangic <= suankiIndex && suankiIndex <= fazBitis ? 'current' : '');
    const tamamlananSayi = adimlar.filter(a => d.durum_sirasi.findIndex(s => s.kod === a.kod) <= suankiIndex).length;
    const acik = acikFazIndex === fi;
    const badge = durumCls === 'done' ? `✓ Tamamlandı (${adimlar.length}/${adimlar.length})`
      : durumCls === 'current' ? `${tamamlananSayi}/${adimlar.length} · sürüyor`
      : `${adimlar.length} aşama · başlamadı`;

    let miniSteps = '';
    adimlar.forEach(s => {
      const idx = d.durum_sirasi.findIndex(x => x.kod === s.kod);
      const gecmisKaydi = d.gecmis.find(g => g.durum === s.kod);
      const cls = idx < suankiIndex ? 'done' : (idx === suankiIndex ? 'current' : 'pending');
      const ico = cls === 'pending' ? '○' : (cls === 'current' ? '●' : '✓');
      miniSteps += `<div class="mini-step ${cls}">
        <div class="ico">${ico}</div>
        <div class="body">
          <div class="ad">${s.ad}</div>
          ${gecmisKaydi && gecmisKaydi.not_metni ? `<div class="not">${gecmisKaydi.not_metni}</div>` : ''}
        </div>
        ${gecmisKaydi ? `<div class="tarih">${new Date(gecmisKaydi.tarih).toLocaleDateString('tr-TR')}</div>` : ''}
      </div>`;
    });

    html += `<div class="faz ${durumCls} renk-${faz.renk} ${acik ? 'open' : ''}">
      <div class="faz-head" onclick="fazToggle(${fi})">
        <div class="faz-num">${durumCls === 'done' ? '✓' : (fi+1)}</div>
        <div class="faz-title">
          <div class="ad">${faz.ad}</div>
          <div class="alt">${adimlar.length} aşama</div>
        </div>
        <div class="faz-badge">${badge}</div>
        <div class="faz-chev">▸</div>
      </div>
      <div class="faz-body">${miniSteps}</div>
    </div>`;
  });
  html += '</div>';
  return html;
}

function belgelerListesi(d) {
  if (!d.belgeler.length) {
    return '<div class="empty-state">Henüz belge yüklenmedi. Süreç ilerledikçe konşimento, fatura ve diğer belgeler burada görünecek.</div>';
  }
  let html = '';
  d.belgeler.forEach(b => {
    html += `<div class="belge-item">
      <div><div class="ad">${b.dosya_adi}</div><div class="tip">${b.belge_tipi}</div></div>
      <a href="${b.dosya_url}" target="_blank" rel="noopener">İndir →</a>
    </div>`;
  });
  return html;
}

render();

(function initTheme() {
  const root = document.documentElement;
  const buttons = document.querySelectorAll('#themeToggle button');
  function apply(mode) {
    if (mode === 'light') root.setAttribute('data-theme', 'light');
    else if (mode === 'dark') root.setAttribute('data-theme', 'dark');
    else root.removeAttribute('data-theme');
    buttons.forEach(b => b.classList.toggle('active', b.dataset.mode === mode));
  }
  const saved = localStorage.getItem('tema') || 'system';
  apply(saved);
  buttons.forEach(b => b.addEventListener('click', () => { localStorage.setItem('tema', b.dataset.mode); apply(b.dataset.mode); }));
})();
</script>
</body>
</html>
