<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 40 40%22><rect width=%2240%22 height=%2240%22 rx=%229%22 fill=%22%230f3d63%22/><ellipse cx=%2220%22 cy=%2220%22 rx=%2214%22 ry=%227%22 fill=%22none%22 stroke=%22%23ffffff%22 stroke-opacity=%220.16%22 stroke-width=%221%22/><ellipse cx=%2220%22 cy=%2220%22 rx=%227%22 ry=%2214%22 fill=%22none%22 stroke=%22%23ffffff%22 stroke-opacity=%220.16%22 stroke-width=%221%22/><path d=%22M9,28 C15,24 25,16 31,12%22 fill=%22none%22 stroke=%22%23d99a2b%22 stroke-width=%222%22 stroke-linecap=%22round%22 stroke-dasharray=%220.5 4.2%22/><circle cx=%229%22 cy=%2228%22 r=%222.6%22 fill=%22%23ffffff%22/><circle cx=%2231%22 cy=%2212%22 r=%222.6%22 fill=%22%23d99a2b%22/></svg>">
<title>Sipariş Takip — Tedarik Ağı</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Adminator (puikinsh/Adminator-admin-dashboard, MIT) — admin panelle birebir aynı tasarım
     sistemi, gerçek kaynak koddan derlenmiş. -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link href="assets/adminator/adminator.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<style>
  :root[data-theme="light"]{ --primary:#18915d !important; --primary-light:#1fae70 !important; --primary-dark:#137a4d !important; --primary-soft:#e9f7f0 !important; --primary-ring:rgba(31,174,112,.18) !important; }
  :root[data-theme="dark"]{ --primary:#3db985 !important; --primary-light:#5fd39f !important; --primary-dark:#2f9d70 !important; --primary-soft:#0f2a20 !important; --primary-ring:rgba(61,185,133,.24) !important; }
</style>
<style>
  :root{
    /* Adminator'ın gerçek derlenmiş CSS'inden birebir alınan değerler — admin panelle aynı. */
    --bg:#F0F4F8; --bg-alt:#F1F5F9; --surface:#ffffff; --text:#1E293B; --text-muted:#64748B;
    --good:#10B981; --good-bg:#ECFDF5; --good-bd:#6ee7b7; --bad:#EF4444; --bad-bg:#FEF2F2; --bad-bd:#fca5a5;
    --accent:#F59E0B; --accent-ink:#b45309; --accent2:#18915d; --accent2-ink:#137a4d; --accent2-fill:#1fae70;
    --accent-blue:#0EA5E9; --accent-purple:#8B5CF6;
    --signal:#EF4444; --signal-ink:#b91c1c; --border:#E4E8EF;
    --sidebar-bg:var(--surface); --sidebar-text:var(--text); --sidebar-text-dim:var(--text-muted); --sidebar-hover:#F8FAFC;
    --radius-card:14px; --card-shadow:0 1px 3px 0 rgb(15 23 42 / 0.06), 0 1px 2px -1px rgb(15 23 42 / 0.04);
    --font-display: "Inter Tight","Inter",-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    --font-body: "Inter",-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    --font-code: "JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0B1120; --bg-alt:#1A2237; --surface:#141B2D; --text:#F1F5F9; --text-muted:#94A3B8;
      --good:#34D399; --good-bg:#0F2A20; --good-bd:#34D399; --bad:#F87171; --bad-bg:#2B1414; --bad-bd:#F87171;
      --accent:#FBBF24; --accent-ink:#fbbf24; --accent2:#3db985; --accent2-ink:#2f9d70; --accent2-fill:#368060;
      --accent-blue:#38BDF8; --accent-purple:#A78BFA;
      --signal:#F87171; --signal-ink:#fca5a5; --border:#222C42;
      --sidebar-hover:#1C2438; --card-shadow:0 1px 3px 0 rgb(0 0 0 / 0.3), 0 1px 2px -1px rgb(0 0 0 / 0.25);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0B1120; --bg-alt:#1A2237; --surface:#141B2D; --text:#F1F5F9; --text-muted:#94A3B8;
    --good:#34D399; --good-bg:#0F2A20; --good-bd:#34D399; --bad:#F87171; --bad-bg:#2B1414; --bad-bd:#F87171;
    --accent:#FBBF24; --accent-ink:#fbbf24; --accent2:#3db985; --accent2-ink:#2f9d70; --accent2-fill:#368060;
    --accent-blue:#38BDF8; --accent-purple:#A78BFA;
    --signal:#F87171; --signal-ink:#fca5a5; --border:#222C42;
    --sidebar-hover:#1C2438; --card-shadow:0 1px 3px 0 rgb(0 0 0 / 0.3), 0 1px 2px -1px rgb(0 0 0 / 0.25);
  }
  :root[data-theme="light"]{
    --bg:#F0F4F8; --bg-alt:#F1F5F9; --surface:#ffffff; --text:#1E293B; --text-muted:#64748B;
    --good:#10B981; --good-bg:#ECFDF5; --good-bd:#6ee7b7; --bad:#EF4444; --bad-bg:#FEF2F2; --bad-bd:#fca5a5;
    --accent:#F59E0B; --accent-ink:#b45309; --accent2:#18915d; --accent2-ink:#137a4d; --accent2-fill:#1fae70;
    --accent-blue:#0EA5E9; --accent-purple:#8B5CF6;
    --signal:#EF4444; --signal-ink:#b91c1c; --border:#E4E8EF;
    --sidebar-hover:#F8FAFC; --card-shadow:0 1px 3px 0 rgb(15 23 42 / 0.06), 0 1px 2px -1px rgb(15 23 42 / 0.04);
  }
  *{box-sizing:border-box;}
  body{ margin:0; background:var(--bg); color:var(--text); font-family:var(--font-body); font-size:16px; line-height:1.5; overflow-x:hidden; }
  a{ color:inherit; }
  ::selection{ background:var(--accent); color:#1c1508; }

  .theme-toggle{ position:fixed; top:16px; right:16px; z-index:80; display:flex; gap:2px; background:var(--surface); border:1px solid var(--border); border-radius:20px; padding:3px; box-shadow:0 4px 14px rgba(0,0,0,.1); }
  .theme-toggle button{ width:auto; border:none; background:transparent; color:var(--text-muted); font-family:var(--font-body); font-size:12.5px; font-weight:600; padding:6px 12px; border-radius:16px; cursor:pointer; }
  .theme-toggle button.active{ background:var(--accent2); color:#fff; }

  label{ display:block; font-family:var(--font-body); font-size:11.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-muted); margin-bottom:6px; font-weight:600;}
  input, textarea{ width:100%; font-size:15px; padding:11px 12px; border-radius:6px; border:1px solid var(--border); background:var(--bg); color:var(--text); font-family:inherit; margin-bottom:16px; }
  textarea{ min-height:80px; resize:vertical; }
  input:focus, textarea:focus{ outline:2px solid var(--accent); outline-offset:1px; }
  .row2{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  @media (max-width:600px){ .row2{ grid-template-columns:1fr; } }
  button.primary{ width:100%; background:var(--accent2-fill); color:#fff; border:none; padding:13px; border-radius:8px; font-family:var(--font-body); font-weight:600; font-size:15px; cursor:pointer; letter-spacing:-.01em; transition:background .12s; }
  button.primary:hover{ background:var(--accent2-ink); }
  .linklike{ background:none; border:none; color:var(--accent-ink); font-weight:600; cursor:pointer; padding:0; font-size:14px; text-decoration:underline; }
  .toggle-row{ text-align:center; margin-top:16px; font-size:14px; color:var(--text-muted); }
  .err{ color:var(--signal-ink); font-size:13.5px; margin-bottom:12px; }
  .demo-box{ font-size:13px; line-height:1.5; color:var(--accent2-ink); background:color-mix(in srgb, var(--accent2) 10%, transparent); border:1px solid color-mix(in srgb, var(--accent2) 28%, transparent); border-radius:6px; padding:10px 13px; margin-bottom:18px; }

  /* Ana sayfayla tutarlı, sade blur-in giriş animasyonu — her render'da yeniden tetiklenir */
  .panel-fade{ animation:panelFadeIn .45s cubic-bezier(.2,.7,.3,1); }
  @keyframes panelFadeIn{ from{ opacity:0; filter:blur(6px); transform:translateY(8px); } to{ opacity:1; filter:blur(0); transform:translateY(0); } }
  @media (prefers-reduced-motion: reduce){ .panel-fade{ animation:none; } }
  h2{ font-family:var(--font-display); font-weight:700; font-size:19px; letter-spacing:-.01em; margin:0 0 6px; }
  .tarih{ font-variant-numeric:tabular-nums; }

  /* ================= PRE-AUTH: Adminator'ın gerçek auth-shell/auth-aside/auth-main/auth-card
     sınıfları (admin.html ile birebir aynı) ================= */
  .auth-card .sub{ color:var(--t-muted); font-size:14px; margin:0 0 8px; }
  .auth-card .err{ color:var(--danger); font-size:13px; }
  .auth-card .toggle-row{ text-align:center; margin-top:16px; font-size:13.5px; color:var(--t-muted); }
  .auth-card .linklike{ color:var(--primary); font-weight:600; }

  /* ================= APP SHELL (post-auth panel) ================= */
  .app-shell{ display:flex; min-height:100vh; align-items:stretch; }
  /* ---- Sidebar: shadcn admin dashboard referansıyla birebir — açık/beyaz
     zemin, ince kenarlık, seçili sekme açık gri kapsül. ---- */
  /* Sidebar admin panelle aynı dilde — her zaman koyu, tema modundan bağımsız */
  .sidebar{ width:264px; flex:none; background:var(--sidebar-bg); border-right:1px solid rgba(255,255,255,.06); padding:20px 16px; display:flex; flex-direction:column; }
  .brand-row{ display:flex; align-items:center; justify-content:space-between; padding:8px; margin-bottom:22px; border-radius:12px; cursor:pointer; }
  .brand-row:hover{ background:var(--sidebar-hover); }
  .brand-row .chev{ color:var(--sidebar-text-dim); font-size:12px; transition:transform .15s; }
  .app-shell.is-collapsed .brand-row .chev{ transform:rotate(-90deg); }
  .sidebar .brand{ font-family:var(--font-display); font-weight:700; font-size:15.5px; letter-spacing:-.01em; text-decoration:none; color:var(--sidebar-text); display:flex; align-items:center; gap:11px; margin:0; }
  .sidebar .brand svg{ width:28px; height:28px; flex:none; border-radius:8px; }
  .side-group-label{ font-size:10.5px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--sidebar-text-dim); padding:0 12px; margin:22px 0 10px; }
  .side-group-label:first-of-type{ margin-top:0; }
  .side-nav{ display:flex; flex-direction:column; gap:3px; }
  .side-nav button, .side-nav a{ display:flex; align-items:center; gap:12px; padding:10px 12px; border-radius:10px; font-weight:600; font-size:14px; color:var(--sidebar-text-dim); cursor:pointer; border:none; background:none; text-align:left; width:100%; font-family:var(--font-body); text-decoration:none; transition:background .15s, color .15s; position:relative; }
  .side-nav button:hover, .side-nav a:hover{ background:var(--sidebar-hover); color:var(--sidebar-text); }
  .side-nav button:hover .ico, .side-nav a:hover .ico{ color:var(--sidebar-text); }
  .side-nav button.active{ background:color-mix(in srgb, var(--accent2) 12%, var(--sidebar-hover)); color:var(--sidebar-text); font-weight:700; }
  .side-nav button.active::before{ content:""; position:absolute; left:-16px; top:50%; transform:translateY(-50%);
    width:3px; height:18px; border-radius:0 3px 3px 0; background:var(--accent2); }
  .side-nav button.active .ico{ color:var(--accent2); }
  .side-nav .ico{ width:17px; text-align:center; flex:none; font-size:15px; color:var(--sidebar-text-dim); transition:color .15s; }
  .sidebar-foot{ margin-top:auto; padding-top:16px; border-top:1px solid rgba(255,255,255,.08); }
  .user-chip{ display:flex; align-items:center; gap:10px; padding:8px; margin-bottom:4px; border-radius:10px; transition:background .15s; }
  .user-chip:hover{ background:var(--sidebar-hover); }
  .user-chip .av{ width:32px; height:32px; border-radius:50%; background:var(--accent2); color:#fff; display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-weight:700; font-size:12.5px; flex:none; box-shadow:0 0 0 2px var(--sidebar-bg), 0 0 0 3.5px color-mix(in srgb, var(--accent2) 50%, transparent); }
  .user-chip .who{ min-width:0; }
  .user-chip .name{ font-size:13px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:var(--sidebar-text); }
  .user-chip .role{ font-size:11px; color:var(--sidebar-text-dim); }
  .sidebar-foot .linklike{ color:var(--sidebar-text-dim); }
  .sidebar-foot .linklike:hover{ color:var(--sidebar-text); }
  .main-col{ flex:1; display:flex; flex-direction:column; min-width:0; position:relative; }
  .main-col::before{ content:""; position:absolute; top:-60px; right:-60px; width:280px; height:280px; border-radius:50%; background:radial-gradient(circle, color-mix(in srgb, var(--accent2) 10%, transparent), transparent 70%); pointer-events:none; z-index:0; }
  .main{ position:relative; z-index:1; }
  .topbar{ display:flex; align-items:center; justify-content:flex-start; gap:16px; padding:12px 24px; border-bottom:1px solid var(--border); background:var(--surface); }
  .topbar-search{ display:flex; align-items:center; gap:8px; background:var(--bg); border:1px solid var(--border); border-radius:8px; padding:7px 12px; max-width:320px; flex:1; }
  .topbar-search .ico{ font-size:13px; opacity:.5; }
  .topbar-search input{ border:none; background:none; margin:0; padding:0; font-size:13.5px; flex:1; }
  .topbar-search input:focus{ outline:none; }
  .topbar-search .kbd{ font-family:var(--font-body); font-weight:600; font-size:11px; color:var(--text-muted); background:var(--bg-alt); border:1px solid var(--border); border-radius:4px; padding:1px 6px; cursor:pointer; }
  .topbar-right{ display:flex; align-items:center; gap:10px; margin-left:auto; }
  .icon-btn{ width:36px; height:36px; border-radius:10px; border:1px solid var(--border); background:color-mix(in srgb, var(--text) 4%, transparent); color:var(--text-muted); cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:15px; position:relative; }
  .icon-btn:hover{ background:color-mix(in srgb, var(--text) 7%, transparent); color:var(--text); }
  .notif-badge{ position:absolute; top:-4px; right:-4px; background:var(--bad); color:#fff; font-size:10px; font-weight:700; min-width:16px; height:16px; border-radius:20px; display:flex; align-items:center; justify-content:center; padding:0 3px; }

  /* Daraltılabilir sidebar (admin panelle aynı) */
  .app-shell.is-collapsed .sidebar{ width:72px; padding:20px 10px; }
  .app-shell.is-collapsed .sidebar .brand-t, .app-shell.is-collapsed .sidebar span:not(.ico),
  .app-shell.is-collapsed .side-group-label, .app-shell.is-collapsed .side-nav button span:not(.ico),
  .app-shell.is-collapsed .side-nav a span:not(.ico), .app-shell.is-collapsed .user-chip .who,
  .app-shell.is-collapsed .sidebar-foot .linklike, .app-shell.is-collapsed .brand-row .chev{ display:none; }
  .app-shell.is-collapsed .side-nav button, .app-shell.is-collapsed .side-nav a{ justify-content:center; }
  @media (max-width:820px){ .app-shell.is-collapsed .sidebar{ width:100%; padding:12px 16px; } }

  /* Komut paleti (⌘K) — admin panelle birebir aynı */
  .cmdk-overlay{ position:fixed; inset:0; background:rgba(9,9,11,.55); backdrop-filter:blur(2px); z-index:9998; display:flex; align-items:flex-start; justify-content:center; padding-top:14vh; opacity:0; pointer-events:none; transition:opacity .15s; }
  .cmdk-overlay.is-open{ opacity:1; pointer-events:auto; }
  .cmdk-box{ width:100%; max-width:560px; background:var(--surface); border:1px solid var(--border); border-radius:16px; box-shadow:0 30px 70px -12px rgba(0,0,0,.45); overflow:hidden; transform:translateY(-8px); transition:transform .15s; }
  .cmdk-overlay.is-open .cmdk-box{ transform:translateY(0); }
  .cmdk-input-row{ display:flex; align-items:center; gap:10px; padding:14px 18px; border-bottom:1px solid var(--border); }
  .cmdk-input-row .ico{ opacity:.5; }
  .cmdk-input-row input{ border:none; background:none; margin:0; padding:0; height:auto; font-size:15px; flex:1; }
  .cmdk-input-row input:focus{ outline:none; }
  .cmdk-input-row .kbd{ font-family:var(--font-body); font-weight:600; font-size:11px; color:var(--text-muted); background:var(--bg-alt); border:1px solid var(--border); border-radius:4px; padding:2px 6px; }
  .cmdk-list{ max-height:340px; overflow-y:auto; padding:6px; }
  .cmdk-group-label{ font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--text-muted); padding:10px 10px 4px; }
  .cmdk-item{ display:flex; align-items:center; gap:11px; padding:9px 10px; border-radius:9px; cursor:pointer; font-size:13.5px; color:var(--text); }
  .cmdk-item .ico{ width:16px; text-align:center; flex:none; color:var(--text-muted); font-size:14px; }
  .cmdk-item .sub{ margin-left:auto; font-size:11.5px; color:var(--text-muted); }
  .cmdk-item.is-active{ background:color-mix(in srgb, var(--text) 7%, transparent); }
  .cmdk-item.is-active .ico{ color:var(--accent2); }
  .cmdk-empty{ padding:26px 18px; text-align:center; color:var(--text-muted); font-size:13px; }
  .main{ flex:1; padding:20px 28px; width:100%; max-width:none; }
  @media (max-width:820px){
    .app-shell{ flex-direction:column; }
    .sidebar{ width:100%; flex-direction:row; align-items:center; padding:12px 16px; border-right:none; border-bottom:1px solid var(--border); }
    .sidebar .brand{ margin-bottom:0; margin-right:16px; }
    .side-nav{ flex-direction:row; }
    .sidebar-foot{ margin-top:0; margin-left:auto; padding-top:0; border-top:none; display:flex; align-items:center; }
    .user-chip{ margin-bottom:0; }
    .main{ padding:28px 18px; }
  }
  .panel-head{ display:flex; justify-content:space-between; align-items:flex-start; gap:16px; margin-bottom:26px; flex-wrap:wrap; }
  .panel-head p{ color:var(--text-muted); font-size:14.5px; margin:6px 0 0; }
  .btn{ display:inline-flex; align-items:center; gap:6px; padding:10px 18px; border-radius:8px; font-weight:600; font-size:13.5px; text-decoration:none; border:1px solid var(--border); cursor:pointer; font-family:var(--font-body); background:var(--surface); color:var(--text); }
  .btn:hover{ border-color:var(--accent); }
  .btn-primary{ background:var(--accent2); color:#fff; border-color:var(--accent2); }
  .btn-primary:hover{ background:var(--accent2-ink); border-color:var(--accent2-ink); }
  /* Gemi/konteyner takip linkleri — mobilde PC'deki gibi doğrudan, büyük ve
     tek dokunuşla tıklanabilir olsun diye tam genişlik + alt alta diziliyor
     (yan yana küçük butonlarda parmakla isabet etmek zorlaşıyordu). */
  /* Özet kartının hemen altında, sayfayı kaydırmaya gerek kalmadan gemi/konteyner
     takip kartına atlayan kısayol — özellikle mobilde işe yarıyor. */
  .jump-link{ display:inline-flex; align-items:center; gap:6px; margin-top:16px; font-size:13.5px; font-weight:700; color:var(--accent2-ink); text-decoration:none; background:color-mix(in srgb, var(--accent2) 10%, transparent); border:1px solid color-mix(in srgb, var(--accent2) 28%, transparent); padding:9px 14px; border-radius:6px; }
  .jump-link:hover{ background:color-mix(in srgb, var(--accent2) 16%, transparent); }
  .tracking-links{ display:flex; gap:10px; flex-wrap:wrap; }
  .tracking-links .btn{ padding:13px 20px; font-size:14px; }
  @media (max-width:560px){
    .tracking-links{ flex-direction:column; }
    .tracking-links .btn{ width:100%; justify-content:center; padding:15px 18px; }
  }

  /* shadcn/ui "Card" bileşeniyle birebir: rounded-lg + ince kenarlık + shadow-sm */
  .panel{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-card); padding:20px 22px; margin-bottom:14px; box-shadow:var(--card-shadow); }
  .chart-row{ display:grid; grid-template-columns:1.4fr 1fr; gap:12px; margin-bottom:14px; }
  @media (max-width:820px){ .chart-row{ grid-template-columns:1fr; } }
  .panel h2{ letter-spacing:-.02em; }
  .tarih, .ozet-meta b, .durum-pill, .ilerleme-txt, .liste-baslik .no{ font-variant-numeric:tabular-nums; }
  .empty-state{ background:var(--surface); border:1px dashed var(--border); border-radius:16px; padding:40px; text-align:center; color:var(--text-muted); }

  /* Sipariş listesi — kutu-kutu kartlar yerine tek panel içinde satır satır
     liste (tablo hissi): bilgi yoğunluğu daha yüksek, gerçek bir SaaS
     panelindeki liste görünümüne daha yakın. */
  .siparis-liste{ background:var(--surface); border:1px solid var(--border); border-radius:8px; overflow:hidden; }
  .siparis-satir{ display:flex; align-items:center; gap:16px; padding:12px 16px; cursor:pointer; border-bottom:1px solid var(--border); transition:background .1s; }
  .siparis-satir:last-child{ border-bottom:none; }
  .siparis-satir:hover{ background:var(--bg-alt); }
  .siparis-satir .ico{ width:40px; height:40px; border-radius:50%; background:color-mix(in srgb, var(--accent2) 12%, transparent); color:var(--accent2); display:flex; align-items:center; justify-content:center; font-size:16px; flex:none; }
  .siparis-satir .info{ flex:1; min-width:0; }
  .siparis-satir .no{ font-weight:600; font-variant-numeric:tabular-nums; font-size:11.5px; color:var(--text-muted); letter-spacing:.01em; }
  .siparis-satir .ad{ font-weight:600; font-size:14.5px; margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .siparis-satir .sag{ display:flex; align-items:center; gap:14px; flex:none; }
  .siparis-satir .chev{ color:var(--text-muted); font-size:13px; }
  .pill{ display:inline-flex; align-items:center; gap:5px; font-family:var(--font-body); font-size:11.5px; font-weight:600; text-transform:none; letter-spacing:0; padding:4px 10px; border-radius:20px; background:var(--bg-alt); color:var(--text-muted); border:1px solid var(--border); white-space:nowrap; }
  .pill::before{ content:""; width:6px; height:6px; border-radius:50%; background:currentColor; }
  .back{ background:none; border:none; color:var(--text-muted); font-size:13.5px; cursor:pointer; margin-bottom:18px; padding:0; font-weight:600; display:inline-flex; align-items:center; gap:4px; }
  .back:hover{ color:var(--text); }
  .siparis-no-tag{ font-family:var(--font-code); font-variant-numeric:tabular-nums; font-weight:600; font-size:13px; color:var(--accent-ink); letter-spacing:.02em; margin-bottom:6px; }

  /* ================= Sipariş detay: özet kartı ================= */
  .ozet-card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-card); padding:18px 22px; margin-bottom:14px; }
  /* Analitik sayfası KPI kartları — admin panelle aynı dil */
  .stat-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:20px; }
  @media (max-width:960px){ .stat-grid{ grid-template-columns:repeat(2,1fr); } }
  @media (max-width:600px){ .stat-grid{ grid-template-columns:1fr; } }
  .stat-card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-card); padding:18px 20px; box-shadow:var(--card-shadow); }
  .stat-ico-badge{ width:32px; height:32px; border-radius:9px; display:flex; align-items:center; justify-content:center; font-size:14px; flex:none; }
  .stat-ico-badge.tone-blue{ background:rgba(83,133,198,.16); color:var(--accent-blue,#5385c6); }
  .stat-ico-badge.tone-green{ background:rgba(61,185,133,.16); color:var(--accent2); }
  .stat-ico-badge.tone-purple{ background:rgba(168,162,255,.16); color:var(--accent-purple,#a8a2ff); }
  .stat-ico-badge.tone-orange{ background:rgba(232,179,85,.16); color:var(--accent); }
  .stat-head{ font-size:11.5px; font-weight:600; color:var(--text-muted); }
  .chart-row{ display:grid; grid-template-columns:1.3fr 1fr; gap:12px; margin-bottom:14px; }
  @media (max-width:900px){ .chart-row{ grid-template-columns:1fr; } }
  .chart-card h2{ font-size:15px; }
  .ozet-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:16px; flex-wrap:wrap; margin-bottom:18px; }
  .ozet-top h2{ font-size:18px; margin:2px 0 0; }
  .durum-pill{ display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; padding:6px 13px; border-radius:20px; background:color-mix(in srgb, var(--accent) 14%, transparent); color:var(--accent-ink); border:1px solid color-mix(in srgb, var(--accent) 32%, transparent); white-space:nowrap; }
  /* Süreç fazına göre renklendirilmiş rozetler — admin paneliyle aynı dil. */
  .pill.st-blue{ background:#eff6ff; color:#1d4ed8; border-color:#bfdbfe; }
  .pill.st-purple{ background:#faf5ff; color:#7e22ce; border-color:#e9d5ff; }
  .pill.st-orange{ background:#fff7ed; color:#c2410c; border-color:#fed7aa; }
  .pill.st-amber{ background:#fffbeb; color:#b45309; border-color:#fde68a; }
  .pill.st-teal{ background:#f0fdfa; color:#0f766e; border-color:#99f6e4; }
  .pill.st-pink{ background:#fdf2f8; color:#be185d; border-color:#fbcfe8; }
  .pill.st-cyan{ background:#ecfeff; color:#0e7490; border-color:#a5f3fc; }
  .pill.st-green{ background:var(--good-bg); color:var(--good); border-color:var(--good-bd); }
  .pill.st-red{ background:var(--bad-bg); color:var(--bad); border-color:var(--bad-bd); }
  .ozet-meta{ display:flex; gap:28px; flex-wrap:wrap; font-size:13.5px; color:var(--text-muted); margin-bottom:20px; }
  .ozet-meta b{ display:block; color:var(--text); font-family:var(--font-code); font-size:14px; margin-top:2px; font-weight:600; }
  /* Adım adım süreç göstergesi — kurumsal kargo takip siteleri gibi net,
     tek bakışta "neredeyim" cevabı. */
  .adim-takip{ display:flex; align-items:flex-start; padding:6px 4px; }
  .adim{ flex:1; display:flex; flex-direction:column; align-items:center; position:relative; text-align:center; }
  .adim-daire{ width:38px; height:38px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:15px; background:var(--bg-alt); color:var(--text-muted); border:2px solid var(--border); z-index:1; flex:none; transition:all .2s; }
  /* Tamamlanan aşama = her zaman yeşil (bitti hissi net olsun); sıradaki/aktif
     aşama = fazına özgü canlı renk (mavi/mor/turuncu/camgöbeği). Böylece şerit
     baştan sona tek renk değil, ilerledikçe renk renk yeşile dönüşüyor. */
  .adim.done .adim-daire{ background:var(--good); color:#fff; border-color:var(--good); }
  .adim.current .adim-daire{ background:#fff; color:var(--accent2); border-color:var(--accent2); box-shadow:0 0 0 4px color-mix(in srgb, var(--accent2) 16%, transparent); }
  .adim.iptal .adim-daire{ background:var(--bad-bg); color:var(--bad); border-color:var(--bad-bd); }
  .adim.current.renk-blue .adim-daire{ background:#fff; color:#2563eb; border-color:#2563eb; box-shadow:0 0 0 4px rgba(37,99,235,.16); }
  .adim.current.renk-purple .adim-daire{ background:#fff; color:#9333ea; border-color:#9333ea; box-shadow:0 0 0 4px rgba(147,51,234,.16); }
  .adim.current.renk-orange .adim-daire{ background:#fff; color:#ea580c; border-color:#ea580c; box-shadow:0 0 0 4px rgba(234,88,12,.16); }
  .adim.current.renk-cyan .adim-daire{ background:#fff; color:#0e7490; border-color:#0e7490; box-shadow:0 0 0 4px rgba(14,116,144,.16); }
  .adim.current.renk-green .adim-daire{ background:#fff; color:var(--good); border-color:var(--good); box-shadow:0 0 0 4px var(--good-bg); }
  .adim.done .adim-daire{ color:#fff; }
  .adim-ad{ font-size:11.5px; font-weight:600; color:var(--text-muted); margin-top:8px; max-width:80px; line-height:1.3; }
  .adim.done .adim-ad, .adim.current .adim-ad{ color:var(--text); }
  .adim-cizgi{ position:absolute; top:19px; left:50%; width:100%; height:2px; background:var(--border); z-index:0; }
  .adim.done .adim-cizgi{ background:var(--good); }
  @media (max-width:600px){ .adim-ad{ display:none; } .adim-daire{ width:30px; height:30px; font-size:12px; } .adim-cizgi{ top:15px; } }
  .ilerleme-bar-wrap{ display:flex; align-items:center; gap:12px; }
  .ilerleme-bar{ flex:1; height:8px; border-radius:6px; background:var(--bg-alt); overflow:hidden; }
  .ilerleme-bar .fill{ height:100%; background:linear-gradient(90deg, var(--accent2), var(--accent)); border-radius:6px; transition:width .3s; }
  .ilerleme-txt{ font-family:var(--font-code); font-size:12px; color:var(--text-muted); white-space:nowrap; }

  /* ================= Tabs ================= */
  .tabs{ display:flex; gap:4px; border-bottom:1px solid var(--border); margin-bottom:22px; }
  .tab-btn{ background:none; border:none; padding:11px 4px; margin-right:24px; font-family:var(--font-body); font-weight:700; font-size:14px; color:var(--text-muted); cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-1px; }
  .tab-btn.active{ color:var(--text); border-bottom-color:var(--accent); }
  .tab-btn .cnt{ font-family:var(--font-code); font-size:11px; color:var(--text-muted); margin-left:4px; }

  /* ================= Faz akordeonu ================= */
  .faz-list{ display:flex; flex-direction:column; gap:10px; }
  .faz{ background:var(--surface); border:1px solid var(--border); border-radius:8px; overflow:hidden; }
  .faz.current{ border-color:var(--accent2); }
  .faz-head{ display:flex; align-items:center; gap:14px; padding:16px 18px; cursor:pointer; user-select:none; }
  .faz-head:hover{ background:var(--bg-alt); }
  .faz-num{ width:30px; height:30px; border-radius:50%; flex:none; display:flex; align-items:center; justify-content:center; font-family:var(--font-code); font-weight:700; font-size:12.5px; background:var(--border); color:var(--text-muted); }
  .faz.done .faz-num{ background:var(--good); color:#fff; }
  .faz.current .faz-num{ background:var(--accent2); color:#fff; }
  .faz-title{ flex:1; min-width:0; }
  .faz-title .ad{ font-family:var(--font-display); font-weight:600; font-size:15.5px; }
  .faz-title .alt{ font-size:12.5px; color:var(--text-muted); margin-top:2px; }
  .faz-badge{ font-family:var(--font-code); font-size:11px; color:var(--text-muted); white-space:nowrap; }
  .faz.done .faz-badge{ color:var(--good); font-weight:600; }
  .faz.current .faz-badge{ color:var(--accent2-ink); font-weight:600; }
  .faz-chev{ color:var(--text-muted); font-size:12px; transition:transform .15s; flex:none; }
  .faz.open .faz-chev{ transform:rotate(90deg); }
  .faz-body{ display:none; padding:2px 18px 18px 62px; border-top:1px solid var(--border); }
  .faz.open .faz-body{ display:block; padding-top:14px; }
  /* Faza özgü canlı renk — .faz.current .faz-num artık her fazda aynı mavi yerine kendi rengi. */
  .faz.current.renk-blue .faz-num{ background:#2563eb; } .faz.current.renk-blue .faz-badge{ color:#2563eb; } .faz.current.renk-blue{ border-color:#2563eb; }
  .faz.current.renk-purple .faz-num{ background:#9333ea; } .faz.current.renk-purple .faz-badge{ color:#9333ea; } .faz.current.renk-purple{ border-color:#9333ea; }
  .faz.current.renk-orange .faz-num{ background:#ea580c; } .faz.current.renk-orange .faz-badge{ color:#ea580c; } .faz.current.renk-orange{ border-color:#ea580c; }
  .faz.current.renk-cyan .faz-num{ background:#0e7490; } .faz.current.renk-cyan .faz-badge{ color:#0e7490; } .faz.current.renk-cyan{ border-color:#0e7490; }
  .faz.current.renk-green .faz-num{ background:var(--good); } .faz.current.renk-green .faz-badge{ color:var(--good); } .faz.current.renk-green{ border-color:var(--good); }
  .mini-step{ display:flex; gap:10px; padding:9px 0; border-bottom:1px solid var(--border); align-items:baseline; }
  .mini-step:last-child{ border-bottom:none; }
  .mini-step .ico{ width:16px; flex:none; font-size:12px; color:var(--text-muted); }
  .mini-step.done .ico{ color:var(--good); font-weight:700; }
  .mini-step.current .ico{ color:var(--accent2-ink); }
  .mini-step .body{ flex:1; min-width:0; }
  .mini-step .ad{ font-size:14px; font-weight:600; }
  .mini-step.done .ad{ color:var(--good); }
  .mini-step.pending .ad{ color:var(--text-muted); font-weight:500; }
  .mini-step .not{ font-size:12.5px; color:var(--text-muted); margin-top:2px; }
  .mini-step .tarih{ font-family:var(--font-code); font-size:11px; color:var(--text-muted); flex:none; white-space:nowrap; }
  .faz.current .ico{ color:var(--accent2-ink); }
  .faz.current.renk-blue .mini-step.current .ico{ color:#2563eb; }
  .faz.current.renk-purple .mini-step.current .ico{ color:#9333ea; }
  .faz.current.renk-orange .mini-step.current .ico{ color:#ea580c; }
  .faz.current.renk-cyan .mini-step.current .ico{ color:#0e7490; }
  .faz.current.renk-green .mini-step.current .ico{ color:var(--good); }

  .belge-item{ display:flex; justify-content:space-between; align-items:center; padding:14px 16px; background:var(--surface); border:1px solid var(--border); border-radius:8px; margin-bottom:10px; }
  .belge-item .ad{ font-size:14px; font-weight:600; }
  .belge-item .tip{ font-family:var(--font-code); font-size:11px; color:var(--text-muted); margin-top:2px; }
  .belge-item a{ color:var(--accent2-ink); font-size:13px; font-weight:700; text-decoration:none; }

  /* ---- Toast bildirim sistemi — admin panelle aynı dil, alert() yerine ---- */
  .toast-stack{ position:fixed; right:20px; bottom:20px; z-index:9999; display:flex; flex-direction:column; gap:10px; max-width:340px; }
  .toast{ display:flex; align-items:flex-start; gap:10px; background:var(--surface); border:1px solid var(--border); border-radius:12px;
    padding:12px 14px; box-shadow:0 12px 32px -8px rgba(0,0,0,.25); font-size:13.5px; color:var(--text); animation:toastIn .25s cubic-bezier(.2,.8,.3,1); }
  .toast .ico{ flex:none; width:22px; height:22px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:12px; margin-top:1px; }
  .toast.ok .ico{ background:var(--good-bg); color:var(--good); }
  .toast.err .ico{ background:var(--bad-bg); color:var(--bad); }
  .toast.info .ico{ background:color-mix(in srgb, var(--accent2) 14%, transparent); color:var(--accent2); }
  .toast .msg{ flex:1; line-height:1.4; }
  .toast.is-leaving{ animation:toastOut .2s ease forwards; }
  @keyframes toastIn{ from{ opacity:0; transform:translateY(10px) scale(.96); } to{ opacity:1; transform:translateY(0) scale(1); } }
  @keyframes toastOut{ to{ opacity:0; transform:translateY(6px) scale(.96); } }
  @media (prefers-reduced-motion: reduce){ .toast{ animation:none; } .toast.is-leaving{ animation:none; opacity:0; } }
</style>
</head>
<body>
<div class="theme-toggle" id="themeToggle">
  <button data-mode="light">☀ Açık</button>
  <button data-mode="dark">☾ Koyu</button>
  <button data-mode="system">Sistem</button>
</div>

<div id="app"></div>
<div class="toast-stack" id="toastStack" aria-live="polite"></div>
<div class="cmdk-overlay" id="cmdkOverlay">
  <div class="cmdk-box" role="dialog" aria-label="Komut paleti">
    <div class="cmdk-input-row">
      <span class="ico"><i class="bi bi-search"></i></span>
      <input id="cmdkInput" placeholder="Sipariş no veya sayfa ara..." autocomplete="off">
      <span class="kbd">Esc</span>
    </div>
    <div class="cmdk-list" id="cmdkList"></div>
  </div>
</div>

<script>
const API = '';
function showToast(msg, type) {
  type = type || 'info';
  const stack = document.getElementById('toastStack');
  if (!stack) { alert(msg); return; }
  const ico = type === 'ok' ? 'bi-check-lg' : type === 'err' ? 'bi-exclamation-lg' : 'bi-info-lg';
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.innerHTML = `<span class="ico"><i class="bi ${ico}"></i></span><span class="msg"></span>`;
  el.querySelector('.msg').textContent = msg;
  stack.appendChild(el);
  setTimeout(() => { el.classList.add('is-leaving'); setTimeout(() => el.remove(), 220); }, 4200);
}
// Ctrl+/ — admin panelle aynı klavye kısayolu: koyu/açık/sistem temayı döngüsel değiştirir
window.addEventListener('keydown', (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key === '/') {
    e.preventDefault();
    const buttons = document.querySelectorAll('#themeToggle button');
    if (!buttons.length) return;
    const order = ['light', 'dark', 'system'];
    const current = localStorage.getItem('tema') || 'system';
    const next = order[(order.indexOf(current) + 1) % order.length];
    const btn = Array.from(buttons).find(b => b.dataset.mode === next);
    if (btn) btn.click();
  }
});
let token = localStorage.getItem('tk_token');
let musteriAdi = localStorage.getItem('tk_ad') || '';
const _siparisParam = new URLSearchParams(location.search).get('siparis');
let view = token ? (_siparisParam ? 'detay' : 'liste') : (location.hash === '#rfq' ? 'rfq' : 'giris'); // giris | rfq | liste | detay
let aktifSiparisNo = _siparisParam || null;

function render() {
  const app = document.getElementById('app');
  if (view === 'giris') { app.innerHTML = authShell(girisEkrani()); return; }
  if (view === 'rfq') { app.innerHTML = authShell(rfqEkrani()); return; }
  // Post-auth: her zaman panel kabuğu (sidebar + içerik) — tüm kullanıcı işlemleri burada.
  app.innerHTML = panelShell('<div class="empty-state">Yükleniyor…</div>', view);
  if (localStorage.getItem('tk_musteri_sidebar') === 'collapsed') document.querySelector('.app-shell').classList.add('is-collapsed');
  if (view === 'liste') siparisListesiYukle();
  else if (view === 'detay') siparisDetayYukle(aktifSiparisNo);
  else if (view === 'ayarlar') ayarlarYukle();
  else if (view === 'analitik') musteriAnalitikYukle();
}

async function ayarlarYukle() {
  const main = document.querySelector('.main');
  try {
    const res = await fetch(API + '/api/tk/musteri/profil', { headers: {'Authorization':'Bearer ' + token} });
    if (res.status === 401) { cikisYap(); return; }
    const p = await res.json();
    main.innerHTML = `<div class="panel-fade">
      <div class="panel-head"><div><h2>Ayarlar</h2><p>Hesap bilgilerinizi ve şifrenizi buradan yönetin.</p></div></div>
      <div class="panel" style="max-width:520px; margin-bottom:20px;">
        <h2 style="font-size:16px; margin-bottom:14px;">Hesap Bilgileri</h2>
        <div id="profilErr" class="err"></div>
        <div id="profilOk" style="display:none; color:var(--good); font-size:13px; margin-bottom:12px;">✓ Kaydedildi.</div>
        <label>Ad Soyad</label>
        <input id="pAdSoyad" value="${(p.ad_soyad||'').replace(/"/g,'&quot;')}">
        <label>Firma</label>
        <input id="pFirma" value="${(p.firma||'').replace(/"/g,'&quot;')}">
        <label>Telefon</label>
        <input id="pTelefon" value="${(p.telefon||'').replace(/"/g,'&quot;')}">
        <label>E-posta</label>
        <input value="${p.email}" disabled style="opacity:.6;">
        <p style="font-size:11.5px; color:var(--text-muted); margin:-8px 0 14px;">E-posta değişikliği için ekiple iletişime geçin.</p>
        <button class="btn btn-primary" onclick="profilKaydet()">Bilgileri Kaydet</button>
      </div>
      <div class="panel" style="max-width:520px;">
        <h2 style="font-size:16px; margin-bottom:14px;">Şifre Değiştir</h2>
        <div id="sifreErr" class="err"></div>
        <div id="sifreOk" style="display:none; color:var(--good); font-size:13px; margin-bottom:12px;">✓ Şifreniz güncellendi.</div>
        <label>Mevcut Şifre</label>
        <input id="pMevcutSifre" type="password">
        <label>Yeni Şifre</label>
        <input id="pYeniSifre" type="password">
        <button class="btn btn-primary" onclick="sifreDegistirKaydet()">Şifreyi Güncelle</button>
      </div>
    </div>`;
  } catch (e) { main.innerHTML = '<div class="panel err">Yüklenemedi.</div>'; }
}

async function profilKaydet() {
  const errBox = document.getElementById('profilErr');
  const okBox = document.getElementById('profilOk');
  errBox.textContent = ''; okBox.style.display = 'none';
  const ad_soyad = document.getElementById('pAdSoyad').value.trim();
  if (!ad_soyad) { errBox.textContent = 'Ad soyad boş olamaz.'; return; }
  const body = {
    ad_soyad,
    firma: document.getElementById('pFirma').value.trim() || null,
    telefon: document.getElementById('pTelefon').value.trim() || null,
  };
  const res = await fetch(API + '/api/tk/musteri/profil', {
    method:'POST', headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},
    body: JSON.stringify(body)
  });
  if (!res.ok) { const d = await res.json(); errBox.textContent = d.detail || 'Bir hata oluştu'; return; }
  musteriAdi = ad_soyad; localStorage.setItem('tk_ad', musteriAdi);
  okBox.style.display = 'block';
}

async function sifreDegistirKaydet() {
  const errBox = document.getElementById('sifreErr');
  const okBox = document.getElementById('sifreOk');
  errBox.textContent = ''; okBox.style.display = 'none';
  const mevcut_sifre = document.getElementById('pMevcutSifre').value;
  const yeni_sifre = document.getElementById('pYeniSifre').value;
  if (!mevcut_sifre || !yeni_sifre) { errBox.textContent = 'Her iki alanı da doldurun.'; return; }
  const res = await fetch(API + '/api/tk/musteri/sifre-degistir', {
    method:'POST', headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},
    body: JSON.stringify({mevcut_sifre, yeni_sifre})
  });
  if (!res.ok) { const d = await res.json(); errBox.textContent = d.detail || 'Bir hata oluştu'; return; }
  document.getElementById('pMevcutSifre').value = '';
  document.getElementById('pYeniSifre').value = '';

async function tekrarSiparisVer(eskiSiparis) {
  if (!confirm(`"${eskiSiparis.urun_aciklamasi}" için aynı bilgilerle yeni bir talep oluşturulsun mu?`)) return;
  try {
    const res = await fetch(API + '/api/tk/siparis-olustur', {
      method:'POST', headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},
      body: JSON.stringify({
        urun_aciklamasi: eskiSiparis.urun_aciklamasi,
        miktar: eskiSiparis.miktar || null,
        hedef_fiyat: eskiSiparis.hedef_fiyat || null,

    const d = await res.json();

// Adminator'ın .dd-wrap.is-open mekanizması — admin panelle birebir aynı, z-index yığın bağlamı
// sorunlarından kaçınmak için açılınca position:fixed'e geçip JS ile konumlanıyor.
function ddMenuKonumla(wrap) {
  const trigger = wrap.querySelector('[data-dropdown]');
  const menu = wrap.querySelector('.dd-menu');
  if (!trigger || !menu) return;
  const r = trigger.getBoundingClientRect();
  menu.style.position = 'fixed';
  menu.style.top = (r.bottom + 10) + 'px';
  menu.style.right = (window.innerWidth - r.right) + 'px';
  menu.style.left = 'auto';
  menu.style.zIndex = '9999';
}
function initDropdowns() {
  document.addEventListener('click', (e) => {
    const trigger = e.target.closest('[data-dropdown]');
    if (trigger) {
      e.stopPropagation();
      const wrap = trigger.closest('.dd-wrap');
      if (!wrap) return;
      const willOpen = !wrap.classList.contains('is-open');
      document.querySelectorAll('.dd-wrap.is-open').forEach(w => { if (w !== wrap) w.classList.remove('is-open'); });
      wrap.classList.toggle('is-open', willOpen);
      if (willOpen) { ddMenuKonumla(wrap); if (wrap.querySelector('#bildirimPop')) bildirimIcerikDoldur(); }
      return;
    }
    if (!e.target.closest('.dd-wrap')) document.querySelectorAll('.dd-wrap.is-open').forEach(w => w.classList.remove('is-open'));
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') document.querySelectorAll('.dd-wrap.is-open').forEach(w => w.classList.remove('is-open'));
  });
  window.addEventListener('resize', () => { document.querySelectorAll('.dd-wrap.is-open').forEach(ddMenuKonumla); });
}
initDropdowns();

// ---- Komut paleti (⌘K) — sayfalar + kendi siparişleri arasında hızlı arama ----
const CMDK_PAGES_MUSTERI = [
  { label: 'Siparişlerim', ico: 'bi-box-seam', go: () => { view = 'liste'; render(); } },
  { label: 'Yeni Talep', ico: 'bi-plus-circle', go: () => { view = 'rfq'; render(); } },
  { label: 'Vergi Hesaplama', ico: 'bi-calculator', go: () => { location.href = '/hesapla.html'; } },
  { label: 'Ayarlar', ico: 'bi-gear', go: () => { view = 'ayarlar'; render(); } },
];
let cmdkActiveIdx = 0;
function cmdkResultsMusteri(q) {
  q = (q || '').trim().toLowerCase();
  if (!q) return { pages: CMDK_PAGES_MUSTERI, orders: [] };
  const pages = CMDK_PAGES_MUSTERI.filter(p => p.label.toLowerCase().includes(q));
  const orders = musteriSiparisCache.filter(r =>
    [r.siparis_no, r.urun_aciklamasi].some(v => (v || '').toLowerCase().includes(q))
  ).slice(0, 6);
  return { pages, orders };
}
function cmdkRender() {
  const input = document.getElementById('cmdkInput');
  const list = document.getElementById('cmdkList');
  if (!input || !list) return;
  const { pages, orders } = cmdkResultsMusteri(input.value);
  const items = [
    ...pages.map(p => ({ label: p.label, ico: p.ico, run: p.go })),
    ...orders.map(o => ({ label: o.siparis_no, sub: o.urun_aciklamasi || '', ico: 'bi-box-seam',
      run: () => { aktifSiparisNo = o.siparis_no; view = 'detay'; render(); } })),
  ];
  cmdkActiveIdx = Math.min(cmdkActiveIdx, Math.max(0, items.length - 1));
  if (!items.length) { list.innerHTML = '<div class="cmdk-empty">Sonuç bulunamadı</div>'; return; }
  let html = '';
  if (pages.length) html += '<div class="cmdk-group-label">Sayfalar</div>';
  items.forEach((it, i) => {
    if (i === pages.length && orders.length) html += '<div class="cmdk-group-label">Siparişleriniz</div>';
    html += `<div class="cmdk-item${i === cmdkActiveIdx ? ' is-active' : ''}" data-idx="${i}">
      <span class="ico"><i class="bi ${it.ico}"></i></span><span>${it.label}</span>${it.sub ? `<span class="sub">${it.sub}</span>` : ''}
    </div>`;
  });
  list.innerHTML = html;
  list.querySelectorAll('.cmdk-item').forEach(el => {
    el.addEventListener('click', () => { items[Number(el.dataset.idx)].run(); cmdkClose(); });
  });
  list._items = items;
}
function cmdkOpen() {
  const overlay = document.getElementById('cmdkOverlay');
  const input = document.getElementById('cmdkInput');
  if (!overlay) return;
  overlay.classList.add('is-open');
  cmdkActiveIdx = 0;
  input.value = '';
  cmdkRender();
  setTimeout(() => input.focus(), 20);
}
function cmdkClose() {
  const overlay = document.getElementById('cmdkOverlay');
  if (overlay) overlay.classList.remove('is-open');
}
function initCmdk() {
  const overlay = document.getElementById('cmdkOverlay');
  const input = document.getElementById('cmdkInput');
  if (!overlay || !input) return;
  overlay.addEventListener('click', (e) => { if (e.target === overlay) cmdkClose(); });
  input.addEventListener('input', () => { cmdkActiveIdx = 0; cmdkRender(); });
  input.addEventListener('keydown', (e) => {
    const list = document.getElementById('cmdkList');
    const items = list._items || [];
    if (e.key === 'ArrowDown') { e.preventDefault(); cmdkActiveIdx = Math.min(items.length - 1, cmdkActiveIdx + 1); cmdkRender(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); cmdkActiveIdx = Math.max(0, cmdkActiveIdx - 1); cmdkRender(); }
    else if (e.key === 'Enter') { e.preventDefault(); if (items[cmdkActiveIdx]) { items[cmdkActiveIdx].run(); cmdkClose(); } }
    else if (e.key === 'Escape') { cmdkClose(); }
  });
}
window.addEventListener('keydown', (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); cmdkOpen(); return; }
  if ((e.metaKey || e.ctrlKey) && e.key === '\\') { e.preventDefault(); toggleSidebar(); return; }
});
initCmdk();

// Durum kodunu, tablo/pill'lerde kullanılan renk kategorisine çevirir — admin
// panelindeki durumRenkSinifi() ile birebir aynı mantık.
function durumRenkSinifi(durum) {
  if (durum === 'iptal_edildi') return 'st-red';
  if (['numune_revizyon_istendi','beklemede'].includes(durum)) return 'st-amber';
  if (durum === 'teslim_edildi') return 'st-green';
  if (['talep_alindi','fabrika_gorusuluyor','teklif_hazir'].includes(durum)) return 'st-blue';
  if (durum.startsWith('numune_')) return 'st-purple';
  if (durum.startsWith('uretim_') || durum === 'uretimde') return 'st-orange';
  if (['sevkiyat_belgeleri_hazirlaniyor','konteyner','yukleme_odeme_bekleniyor','gemide','teslimat_yolda'].includes(durum)) return 'st-teal';
  if (durum.startsWith('gumruk_')) return 'st-pink';
  return '';
}

// Müşterinin kendi siparişlerinden gerçek bir süreç-fazı dağılım grafiği —
// admin panelindeki barGrafigi() ile aynı mantık, tek müşteriye özel veriyle.
function musteriFazGrafigi(rows) {
  const fazlar = [
    ['Talep/Teklif', r => ['talep_alindi','fabrika_gorusuluyor','teklif_hazir'].includes(r.durum)],
    ['Numune', r => r.durum.startsWith('numune_')],
    ['Üretim', r => r.durum.startsWith('uretim_') || r.durum === 'uretimde'],
    ['Sevkiyat', r => ['sevkiyat_belgeleri_hazirlaniyor','konteyner','yukleme_odeme_bekleniyor','gemide','teslimat_yolda'].includes(r.durum)],
    ['Gümrük', r => r.durum.startsWith('gumruk_')],
    ['Teslim', r => r.durum === 'teslim_edildi'],
  ];
  const veriler = fazlar.map(([ad, f], i) => ({ad, n: rows.filter(f).length, renk: i % 2 === 0 ? '#ea580c' : '#14b8a6'}));
  if (!veriler.some(v => v.n > 0)) return '';
  const maxN = Math.max(1, ...veriler.map(v => v.n));
  const W = 560, H = 130, PAD = 20, barW = (W - PAD*2) / veriler.length * 0.55;
  const stepX = (W - PAD*2) / veriler.length;
  const bars = veriler.map((v,i) => {
    const h = (v.n / maxN) * (H - PAD*2 - 14);
    const x = PAD + i*stepX + (stepX - barW)/2;
    const y = H - PAD - h;
    return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${Math.max(h,2).toFixed(1)}" rx="3" fill="${v.renk}"/>
      <text x="${(x+barW/2).toFixed(1)}" y="${(y-6).toFixed(1)}" font-size="10" font-weight="700" fill="var(--text)" text-anchor="middle">${v.n}</text>
      <text x="${(x+barW/2).toFixed(1)}" y="${(H-PAD+12).toFixed(1)}" font-size="8.5" fill="var(--text-muted)" text-anchor="middle">${v.ad}</text>`;
  }).join('');
  return `<div class="panel" style="margin-bottom:0;">
    <h2 style="font-size:15px;">Siparişleriniz — Süreç Fazına Göre</h2>
    <p style="color:var(--text-muted); font-size:12.5px; margin:0 0 10px;">Toplam ${rows.length} sipariş, gerçek dağılım</p>
    <svg viewBox="0 0 ${W} ${H}" style="width:100%; height:auto; max-width:480px;">${bars}</svg>
  </div>`;
}

// Admin panelindeki halka grafikle birebir aynı dil — burada müşterinin
// KENDİ siparişlerinin teslim oranını gösteriyor.
function musteriTamamlanmaHalkasi(rows) {
  const toplam = rows.length;
  const tamamlanan = rows.filter(r => r.durum === 'teslim_edildi').length;
  const yuzde = toplam > 0 ? Math.round((tamamlanan / toplam) * 100) : 0;
  const R = 70, C = 2 * Math.PI * R;
  const dolu = (yuzde / 100) * C;
  return `<div class="panel" style="margin-bottom:0; display:flex; flex-direction:column; align-items:center; text-align:center;">
    <h2 style="font-size:15px; align-self:flex-start;">Teslimat Oranınız</h2>
    <p style="color:var(--text-muted); font-size:12.5px; margin:0 0 10px; align-self:flex-start;">Teslim edilen / toplam sipariş</p>
    <svg viewBox="0 0 180 180" style="width:150px; height:150px;">
      <circle cx="90" cy="90" r="${R}" fill="none" stroke="var(--bg-alt)" stroke-width="16"/>
      <circle cx="90" cy="90" r="${R}" fill="none" stroke="var(--accent2)" stroke-width="16" stroke-linecap="round"
        stroke-dasharray="${dolu.toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 90 90)"/>
      <text x="90" y="84" text-anchor="middle" font-size="28" font-weight="700" fill="var(--text)" font-family="var(--font-display)">%${yuzde}</text>
      <text x="90" y="106" text-anchor="middle" font-size="11" fill="var(--text-muted)">${tamamlanan}/${toplam}</text>
    </svg>
  </div>`;
}

// ---- Analitik (müşteri) — Nellavio'nun Analytics sayfasının karşılığı, sadece kendi
// siparişlerinize ait gerçek verilerle: KPI kartları, aylık talep trendi, son siparişler. ----
function musteriAylikTrendGrafigi(rows) {
  const yil = new Date().getFullYear();
  const aylar = ['Oca','Şub','Mar','Nis','May','Haz','Tem','Ağu','Eyl','Eki','Kas','Ara'];
  const sayim = new Array(12).fill(0);
  rows.forEach(r => { const d = new Date(r.olusturulma); if (d.getFullYear() === yil) sayim[d.getMonth()]++; });
  const maxN = Math.max(1, ...sayim);
  const W = 560, H = 150, PAD = 22, stepX = (W - PAD*2) / 12, barW = stepX * 0.55;
  const bars = sayim.map((n, i) => {
    const h = (n / maxN) * (H - PAD*2 - 14);
    const x = PAD + i*stepX + (stepX - barW)/2, y = H - PAD - h;
    return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${Math.max(h,1).toFixed(1)}" rx="3" fill="var(--accent2)"/>
      <text x="${(x+barW/2).toFixed(1)}" y="${(H-PAD+12).toFixed(1)}" font-size="8.5" fill="var(--text-muted)" text-anchor="middle">${aylar[i]}</text>`;
  }).join('');
  return `<div class="panel" style="margin-bottom:0;">
    <h2 style="font-size:15px;">${yil} Talep Trendiniz</h2>
    <p style="color:var(--text-muted); font-size:12.5px; margin:0 0 10px;">Aylara göre oluşturduğunuz talep sayısı</p>
    <svg viewBox="0 0 ${W} ${H}" style="width:100%; height:auto;">${bars}</svg>
  </div>`;
}
function musteriSonSiparisler(rows) {
  const son = [...rows].sort((a, b) => new Date(b.olusturulma) - new Date(a.olusturulma)).slice(0, 6);
  return `<div class="panel" style="margin-bottom:0;">
    <h2 style="font-size:15px; margin-bottom:2px;">Son Siparişleriniz</h2>
    <p style="color:var(--text-muted); font-size:12.5px; margin:0 0 12px;">En yeni 6 talep</p>
    ${son.length ? son.map(r => `<div style="display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid var(--border); cursor:pointer;" onclick="aktifSiparisNo='${r.siparis_no}'; view='detay'; render();">
      <div style="width:30px; height:30px; border-radius:9px; background:var(--bg-alt); display:flex; align-items:center; justify-content:center; flex:none;"><i class="bi bi-box-seam" style="font-size:13px; color:var(--text-muted);"></i></div>
      <div style="flex:1; min-width:0;"><div style="font-size:13px; font-weight:600;">${r.siparis_no}</div><div style="font-size:11px; color:var(--text-muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${r.urun_aciklamasi}</div></div>
      <span class="pill ${durumRenkSinifi(r.durum)}">${r.durum_adi}</span>
    </div>`).join('') : '<div class="empty-state">Henüz siparişiniz yok.</div>'}
  </div>`;
}

// Süreç, kullanıcıya tek düz liste yerine altı mantıksal FAZ hâlinde gösterilir
// (RFQ→teklif, numune, üretim, sevkiyat, gümrük, teslimat — sunumun Bölüm 07-08
// ayrımıyla aynı). Tamamlanan/gelecek fazlar özet satıra sıkışır, mevcut faz
// otomatik açık gelir — 19 adımı tek uzun sütun hâlinde dökmek yerine.
const FAZLAR = [
  { ad: 'Talep &amp; Teklif', renk:'blue', kodlar: ['talep_alindi','fabrika_gorusuluyor','teklif_hazir'] },
  { ad: 'Numune', renk:'purple', kodlar: ['numune_odeme_bekleniyor','numune_uretiliyor','numune_kalite_kontrolde','numune_onayinizi_bekliyor'] },
  { ad: 'Üretim', renk:'orange', kodlar: ['uretim_odeme_bekleniyor','uretimde','uretim_kalite_kontrolde'] },
  { ad: 'Sevkiyat', renk:'cyan', kodlar: ['sevkiyat_belgeleri_hazirlaniyor','konteyner','yukleme_odeme_bekleniyor','gemide'] },
  { ad: 'Gümrük', renk:'cyan', kodlar: ['gumruk_beyanname','gumruk_vergi_odeme','gumruk_muayene'] },
  { ad: 'Teslimat', renk:'green', kodlar: ['teslimat_yolda','teslim_edildi'] },
];
let detayTab = 'surec';
let acikFazIndex = 0;
let detayVeriCache = null;
let mesajCache = [];

async function siparisDetayYukle(siparisNo) {
  const main = document.querySelector('.main');
  try {
    const res = await fetch(API + '/api/tk/siparis/' + encodeURIComponent(siparisNo), { headers: {'Authorization':'Bearer ' + token} });
    if (res.status === 401) { cikisYap(); return; }
    if (!res.ok) { main.innerHTML = '<div class="panel err">Sipariş bulunamadı.</div>'; return; }
    const d = await res.json();
    detayVeriCache = d;
    const mesajlar = await fetch(API + '/api/tk/siparis/' + encodeURIComponent(siparisNo) + '/mesajlar', { headers: {'Authorization':'Bearer ' + token} }).then(r => r.json()).catch(() => []);
    mesajCache = mesajlar;

    // Özel durum (revizyon/beklemede/iptal) ana akışta bir "adım" değil, üstüne
    // binen bir durum — ilerlemeyi en son ulaşılan LİNEER adıma göre hesaplıyoruz,
    // özel durumu ayrı bir uyarı bandında gösteriyoruz.
    const lineerKodlar = new Set(d.durum_sirasi.map(s => s.kod));
    let sonLineerDurum = null;
    for (let i = d.gecmis.length - 1; i >= 0; i--) {
      if (lineerKodlar.has(d.gecmis[i].durum)) { sonLineerDurum = d.gecmis[i].durum; break; }
    }
    if (sonLineerDurum === null && lineerKodlar.has(d.durum)) sonLineerDurum = d.durum;
    const suankiIndex = d.durum_sirasi.findIndex(s => s.kod === sonLineerDurum);
    acikFazIndex = FAZLAR.findIndex(f => f.kodlar.includes(sonLineerDurum));
    if (acikFazIndex < 0) acikFazIndex = 0;

    main.innerHTML = '<div class="panel-fade">' + detaySayfasi(d, suankiIndex) + '</div>';
  } catch (e) { main.innerHTML = '<div class="panel err">Yüklenemedi.</div>'; }
}

// Adım adım, kolay takip edilebilir yatay süreç göstergesi — 19 durumu tek tek
// değil, gerçek 6 ana faza indirger. Kargo takip siteleri gibi "neredeyim"
// sorusuna tek bakışta cevap verir.
const ANA_FAZLAR = [
  { ad:'Talep & Teklif', ico:'bi-file-earmark-text', renk:'blue', test: k => ['talep_alindi','fabrika_gorusuluyor','teklif_hazir'].includes(k) },
  { ad:'Numune', ico:'bi-flask', renk:'purple', test: k => k.startsWith('numune_') },
  { ad:'Üretim', ico:'bi-gear', renk:'orange', test: k => k.startsWith('uretim_') || k === 'uretimde' },
  { ad:'Sevkiyat', ico:'bi-truck', renk:'cyan', test: k => ['sevkiyat_belgeleri_hazirlaniyor','konteyner','yukleme_odeme_bekleniyor','gemide','teslimat_yolda'].includes(k) },
  { ad:'Gümrük', ico:'bi-shield-check', renk:'cyan', test: k => k.startsWith('gumruk_') },
  { ad:'Teslim', ico:'bi-box-seam', renk:'green', test: k => k === 'teslim_edildi' },
];
function adimTakipcisi(d) {
  let fazIdx = ANA_FAZLAR.findIndex(f => f.test(d.durum));
  if (fazIdx === -1 && d.durum === 'numune_revizyon_istendi') fazIdx = 1;
  const iptal = d.durum === 'iptal_edildi';
  return `<div class="adim-takip">
    ${ANA_FAZLAR.map((f, i) => {
      let durum = 'pending';
      if (iptal) durum = 'iptal';
      else if (i < fazIdx) durum = 'done';
      else if (i === fazIdx) durum = 'current';
      return `<div class="adim ${durum} renk-${f.renk}">
        <div class="adim-daire"><i class="bi ${durum==='done' ? 'bi-check-lg' : f.ico}"></i></div>
        <div class="adim-ad">${f.ad}</div>
        ${i < ANA_FAZLAR.length - 1 ? '<div class="adim-cizgi"></div>' : ''}
      </div>`;
    }).join('')}
  </div>`;
}

function detaySayfasi(d, suankiIndex) {
  const toplam = d.durum_sirasi.length;
  const tamamlanan = Math.max(suankiIndex, 0) + (suankiIndex >= 0 ? 1 : 0);

    const renk = d.durum === 'iptal_edildi' ? 'var(--signal)' : 'var(--accent)';

      <div style="font-weight:700; font-size:15px; color:${renk};">⚠ ${ozelBilgi ? ozelBilgi.ad : d.durum}</div>

  // null ise "0 bekliyor" gibi uydurma bir şey göstermek yerine hiç basmıyoruz).

  const o = d.odeme;
  if (o && o.toplam_tutar != null) {

      <div style="display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid var(--border); font-size:13px;">
        <div><b>${Number(g.tutar).toLocaleString('tr-TR')} ${g.para_birimi}</b>${g.aciklama ? ` <span style="color:var(--text-muted);">— ${g.aciklama}</span>` : ''}</div>
        <div style="color:var(--text-muted); font-size:11.5px;">${new Date(g.tarih).toLocaleDateString('tr-TR')}</div>
      </div>`).join('') : '';
    odemeCard = `<div class="panel" style="margin-bottom:20px;">
      <h2 style="font-size:16px; margin-bottom:14px;">💳 Ödeme Durumu</h2>
      <div class="row2" style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; margin-bottom:14px;">
        <div style="background:var(--bg-alt); border:1px solid var(--border); border-radius:12px; padding:12px 14px;">
          <div style="font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.04em; color:var(--text-muted); margin-bottom:4px;">Toplam Bedel</div>
          <div style="font-weight:800; font-size:17px;">${Number(o.toplam_tutar).toLocaleString('tr-TR')} ${o.para_birimi}</div>
        </div>
        <div style="background:var(--bg-alt); border:1px solid var(--border); border-radius:12px; padding:12px 14px;">
          <div style="font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.04em; color:var(--text-muted); margin-bottom:4px;">Ödenen</div>

          <div style="font-weight:800; font-size:17px; color:${o.bekleyen > 0 ? 'var(--bad)' : 'var(--good)'};">${Number(o.bekleyen).toLocaleString('tr-TR')} ${o.para_birimi}</div>
        </div>
      </div>
      ${odemeGecmisiHtml}
    </div>`;
  }

  // Mesajlaşma (Faz 2) — "kara kutu değiliz" mesajını somutlaştıran, sipariş
  // bazlı soru-cevap kanalı. WhatsApp/e-posta yerine sistem içinde kalır.
  const mesajBalonlari = mesajCache.length ? mesajCache.map(m => `
    <div style="display:flex; ${m.gonderen_tip === 'musteri' ? 'justify-content:flex-end;' : ''} margin-bottom:10px;">
      <div style="max-width:78%; padding:10px 14px; border-radius:14px; font-size:13.5px; line-height:1.5;
        background:${m.gonderen_tip === 'musteri' ? 'var(--accent2)' : 'var(--bg-alt)'};
        color:${m.gonderen_tip === 'musteri' ? '#fff' : 'var(--text)'};">
        <div>${m.mesaj.replace(/</g,'&lt;')}</div>
        <div style="font-size:10.5px; opacity:.7; margin-top:4px;">${m.gonderen_tip === 'musteri' ? 'Siz' : 'Tedarik Ağı Ekibi'} · ${new Date(m.tarih).toLocaleString('tr-TR', {day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}</div>
      </div>
    </div>`).join('') : '<p style="color:var(--text-muted); font-size:13px; margin:0;">Bir sorunuz mu var? Buradan yazabilirsiniz.</p>';
  const mesajCard = `<div class="panel" style="margin-bottom:20px;">
    <h2 style="font-size:16px; margin-bottom:4px;">💬 Ekiple Mesajlaş</h2>
    <p style="color:var(--text-muted); font-size:13px; margin:0 0 14px;">Sürecinizle ilgili bir sorunuz varsa doğrudan buradan sorabilirsiniz.</p>
    <div style="max-height:300px; overflow-y:auto; margin-bottom:14px;">${mesajBalonlari}</div>
    <div style="display:flex; gap:8px;">
      <input id="mesajInput" placeholder="Mesajınızı yazın..." style="flex:1; margin-bottom:0;" onkeydown="if(event.key==='Enter'){musteriMesajGonder('${d.siparis_no}')}">
      <button class="btn btn-primary" style="margin:0;" onclick="musteriMesajGonder('${d.siparis_no}')">Gönder</button>
    </div>
  </div>`;

  let sevkiyatCard = '';
  if (d.sevkiyat) {
    const s = d.sevkiyat;
    sevkiyatCard = `<div class="panel" id="gemi-takip" style="margin-bottom:20px; scroll-margin-top:16px;">
      <h2 style="font-size:16px; margin-bottom:14px;">🚢 Gemi &amp; Taşıyıcı Takibi</h2>
      <div class="ozet-meta" style="margin-bottom:18px;">
        ${s.tasiyici_firma ? `<div>Taşıyıcı<b style="font-family:var(--font-body);">${s.tasiyici_firma}</b></div>` : ''}
        ${s.gemi_adi ? `<div>Gemi adı<b style="font-family:var(--font-body);">${s.gemi_adi}</b></div>` : ''}
        ${s.sefer_no ? `<div>Sefer no<b>${s.sefer_no}</b></div>` : ''}
        ${s.konsimento_no ? `<div>Konşimento (B/L)<b>${s.konsimento_no}</b></div>` : ''}
        ${s.konteyner_no ? `<div>Konteyner no<b>${s.konteyner_no}</b></div>` : ''}
      </div>
      <div class="tracking-links">
        ${s.tasiyici_takip_url ? `<a href="${s.tasiyici_takip_url}" target="_blank" rel="noopener" class="btn btn-primary">🚢 ${s.tasiyici_firma || 'Taşıyıcı'} Sitesinde Takip Et →</a>` : ''}
        ${s.konteyner_takip_url ? `<a href="${s.konteyner_takip_url}" target="_blank" rel="noopener" class="btn btn-primary">📦 Konteyner Takibi (${s.konteyner_no}) →</a>` : ''}
        ${s.marinetraffic_url ? `<a href="${s.marinetraffic_url}" target="_blank" rel="noopener" class="btn">🌊 Marine Traffic'te Ara →</a>` : ''}
        ${s.vesselfinder_url ? `<a href="${s.vesselfinder_url}" target="_blank" rel="noopener" class="btn">VesselFinder'da Ara →</a>` : ''}
      </div>
      ${s.konteyner_takip_kaynagi ? `<p style="font-size:11.5px; color:var(--text-muted); margin:10px 0 0;">Konteyner takibi kaynağı: ${s.konteyner_takip_kaynagi}${s.konteyner_takip_kaynagi.includes('genel') ? ' — bu taşıyıcı sistemde kayıtlı değil' : (s.konteyner_takip_kaynagi.includes('resmi takip sayfası') ? '' : ' (konteyner no otomatik dolu)')}</p>` : ''}
    </div>`;
  }

  return `
    <button class="back" onclick="view='liste'; render();">← Siparişlerime dön</button>
    <div class="ozet-card">
      <div class="ozet-top">
        <div>
          <div class="siparis-no-tag">${d.siparis_no}</div>
          <h2>${d.urun_aciklamasi}</h2>
        </div>
        <span class="durum-pill">${d.ozel_durum_mu ? d.durum_adi : suankiAd}</span>
      </div>
      <div class="ozet-meta">
        <div>Miktar<b>${d.miktar || '—'}</b></div>
        <div>Hedef fiyat<b>${d.hedef_fiyat || '—'}</b></div>
        <div>Toplam aşama<b>${toplam}</b></div>
      </div>
      <button class="btn" style="margin-top:14px;" onclick='tekrarSiparisVer(${JSON.stringify({urun_aciklamasi:d.urun_aciklamasi, miktar:d.miktar, hedef_fiyat:d.hedef_fiyat}).replace(/'/g,"&apos;")})'><i class="bi bi-arrow-repeat"></i> Bu Ürünü Tekrar Sipariş Ver</button>
      <div class="ilerleme-bar-wrap">
        <div class="ilerleme-bar"><div class="fill" style="width:${yuzde}%;"></div></div>
        <div class="ilerleme-txt">${yuzde}%</div>
      </div>
      ${d.sevkiyat ? `<a href="#gemi-takip" class="jump-link">🚢 Gemi &amp; Konteyner Takip Ekranına Git ↓</a>` : ''}
    </div>
    <div class="panel">${adimTakipcisi(d)}</div>
    ${ozelBanner}
    ${odemeCard}
    ${sevkiyatCard}
    ${mesajCard}
    <div class="tabs">
      <button class="tab-btn ${detayTab==='surec'?'active':''}" onclick="detayTab='surec'; rerenderDetay();">Süreç Takibi</button>
      <button class="tab-btn ${detayTab==='belgeler'?'active':''}" onclick="detayTab='belgeler'; rerenderDetay();">Belgeler <span class="cnt">${d.belgeler.length}</span></button>
    </div>
    <div id="detayIcerik">${detayTab === 'surec' ? fazAkordeonu(d, suankiIndex) : belgelerListesi(d)}</div>
  `;
}

function rerenderDetay() {
  if (!detayVeriCache) return;
  const d = detayVeriCache;
  const lineerKodlar = new Set(d.durum_sirasi.map(s => s.kod));
  let sonLineerDurum = null;
  for (let i = d.gecmis.length - 1; i >= 0; i--) {
    if (lineerKodlar.has(d.gecmis[i].durum)) { sonLineerDurum = d.gecmis[i].durum; break; }
  }
  const suankiIndex = d.durum_sirasi.findIndex(s => s.kod === sonLineerDurum);
  document.querySelector('.main').innerHTML = detaySayfasi(d, suankiIndex);
}

function fazToggle(i) {
  acikFazIndex = (acikFazIndex === i) ? -1 : i;
  document.getElementById('detayIcerik').innerHTML = fazAkordeonu(detayVeriCache, hesaplaSuankiIndex(detayVeriCache));
}

function hesaplaSuankiIndex(d) {
  const lineerKodlar = new Set(d.durum_sirasi.map(s => s.kod));
  let sonLineerDurum = null;
  for (let i = d.gecmis.length - 1; i >= 0; i--) {
    if (lineerKodlar.has(d.gecmis[i].durum)) { sonLineerDurum = d.gecmis[i].durum; break; }
  }
  // Geçmiş kaydında eşleşme yoksa (ör. durum elle/toplu güncellenmiş, geçmiş
  // satırı hiç oluşmamış) siparişin GERÇEK durumuna düşüyoruz — sessizce
  // "Talep Alındı"ya (index 0) geri dönüp yanlış aşama göstermek yerine.
  if (sonLineerDurum === null && lineerKodlar.has(d.durum)) sonLineerDurum = d.durum;
  return d.durum_sirasi.findIndex(s => s.kod === sonLineerDurum);
}

function fazAkordeonu(d, suankiIndex) {
  const suankiKod = suankiIndex >= 0 ? d.durum_sirasi[suankiIndex].kod : null;
  let html = '<div class="faz-list">';
  FAZLAR.forEach((faz, fi) => {
    const adimlar = faz.kodlar.map(kod => d.durum_sirasi.find(s => s.kod === kod)).filter(Boolean);
    const fazIndeksleri = adimlar.map(a => d.durum_sirasi.findIndex(s => s.kod === a.kod));
    const fazBaslangic = Math.min(...fazIndeksleri);
    const fazBitis = Math.max(...fazIndeksleri);
    const durumCls = fazBitis <= suankiIndex ? 'done' : (fazBaslangic <= suankiIndex && suankiIndex <= fazBitis ? 'current' : '');
    const tamamlananSayi = adimlar.filter(a => d.durum_sirasi.findIndex(s => s.kod === a.kod) <= suankiIndex).length;
    const acik = acikFazIndex === fi;
    const badge = durumCls === 'done' ? `✓ Tamamlandı (${adimlar.length}/${adimlar.length})`
      : durumCls === 'current' ? `${tamamlananSayi}/${adimlar.length} · sürüyor`
      : `${adimlar.length} aşama · başlamadı`;

    let miniSteps = '';
    adimlar.forEach(s => {
      const idx = d.durum_sirasi.findIndex(x => x.kod === s.kod);
      const gecmisKaydi = d.gecmis.find(g => g.durum === s.kod);
      const cls = idx < suankiIndex ? 'done' : (idx === suankiIndex ? 'current' : 'pending');
      const ico = cls === 'pending' ? '○' : (cls === 'current' ? '●' : '✓');
      miniSteps += `<div class="mini-step ${cls}">
        <div class="ico">${ico}</div>
        <div class="body">
          <div class="ad">${s.ad}</div>
          ${gecmisKaydi && gecmisKaydi.not_metni ? `<div class="not">${gecmisKaydi.not_metni}</div>` : ''}
        </div>
        ${gecmisKaydi ? `<div class="tarih">${new Date(gecmisKaydi.tarih).toLocaleDateString('tr-TR')}</div>` : ''}
      </div>`;
    });

    html += `<div class="faz ${durumCls} renk-${faz.renk} ${acik ? 'open' : ''}">
      <div class="faz-head" onclick="fazToggle(${fi})">
        <div class="faz-num">${durumCls === 'done' ? '✓' : (fi+1)}</div>
        <div class="faz-title">
          <div class="ad">${faz.ad}</div>
          <div class="alt">${adimlar.length} aşama</div>
        </div>
        <div class="faz-badge">${badge}</div>
        <div class="faz-chev">▸</div>
      </div>
      <div class="faz-body">${miniSteps}</div>
    </div>`;
  });
  html += '</div>';
  return html;
}

function belgelerListesi(d) {
  if (!d.belgeler.length) {
    return '<div class="empty-state">Henüz belge yüklenmedi. Süreç ilerledikçe konşimento, fatura ve diğer belgeler burada görünecek.</div>';
  }
  let html = '';
  d.belgeler.forEach(b => {
    html += `<div class="belge-item">
      <div><div class="ad">${b.dosya_adi}</div><div class="tip">${b.belge_tipi}</div></div>
      <a href="${b.dosya_url}" target="_blank" rel="noopener">İndir →</a>
    </div>`;
  });
  return html;
}

render();

(function initTheme() {
  const root = document.documentElement;
  const buttons = document.querySelectorAll('#themeToggle button');
  function apply(mode) {
    // Adminator'ın CSS'i --bg-card/--t-base/--primary gibi kendi token'larını sadece
    // :root[data-theme=light/dark] altında tanımlıyor (prefers-color-scheme fallback'ı yok) —
    // admin panelinde bulduğumuz aynı hata: attribute hiç set edilmeyince bu değişkenler boş
    // kalıyordu. "Sistem" modunda bile gerçek tercihi JS ile çözüp attribute'u açıkça yazıyoruz.
    const resolved = mode === 'system'
      ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
      : mode;
    root.setAttribute('data-theme', resolved);
    buttons.forEach(b => b.classList.toggle('active', b.dataset.mode === mode));
  }
  const saved = localStorage.getItem('tema') || 'system';
  apply(saved);
  buttons.forEach(b => b.addEventListener('click', () => { localStorage.setItem('tema', b.dataset.mode); apply(b.dataset.mode); }));
})();
</script>
</body>
</html>
