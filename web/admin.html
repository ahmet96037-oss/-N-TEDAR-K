<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin — Çin Tedarik Ağı</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Inter+Tight:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f8fafc; --bg-alt:#f1f5f9; --surface:#ffffff; --text:#0f172a; --text-muted:#64748b;
    --accent:#2451c4; --accent-ink:#1c3d99; --accent2:#0f766e; --accent2-ink:#0b5750;
    --signal:#c0362c; --signal-ink:#9c2c23; --border:#e2e8f0;
    --font-display: "Inter Tight","Inter",-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    --font-body: "Inter",-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    --font-code: ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0b1220; --bg-alt:#111a2c; --surface:#141d31; --text:#e7ecf5; --text-muted:#8a94a8;
      --accent:#5b8def; --accent-ink:#8fb0f5; --accent2:#2fb8a6; --accent2-ink:#6fd6c8;
      --signal:#ef6b60; --signal-ink:#f29a92; --border:#243252;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0b1220; --bg-alt:#111a2c; --surface:#141d31; --text:#e7ecf5; --text-muted:#8a94a8;
    --accent:#5b8def; --accent-ink:#8fb0f5; --accent2:#2fb8a6; --accent2-ink:#6fd6c8;
    --signal:#ef6b60; --signal-ink:#f29a92; --border:#243252;
  }
  *{box-sizing:border-box;}
  body{ margin:0; background:var(--bg); color:var(--text); font-family:var(--font-body); font-size:15px; line-height:1.5; }
  .wrap{ max-width:1000px; margin:0 auto; padding:40px 24px 80px; }
  header h1{ font-family:var(--font-display); font-weight:800; font-size:26px; letter-spacing:-.02em; margin:0 0 24px; }
  .panel{ background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:24px; margin-bottom:20px; box-shadow:0 1px 2px rgba(15,23,42,.04); }
  label{ display:block; font-size:11.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-muted); margin-bottom:6px; font-weight:600;}
  input, select, textarea{ width:100%; font-size:14.5px; padding:10px 11px; border-radius:6px; border:1px solid var(--border); background:var(--bg); color:var(--text); font-family:inherit; margin-bottom:14px; }
  button.primary{ background:var(--accent); color:#fff; border:none; padding:10px 18px; border-radius:6px; font-weight:600; font-size:14px; cursor:pointer; }
  button.primary:hover{ background:var(--accent-ink); }
  .err{ color:var(--signal-ink); font-size:13px; margin-bottom:10px; }
  table{ width:100%; border-collapse:collapse; font-size:13.5px; }
  th,td{ text-align:left; padding:10px 12px; border-bottom:1px solid var(--border); }
  th{ font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--text-muted); font-weight:600; }
  tr:hover{ background:var(--bg-alt); cursor:pointer; }
  .siparis-no{ font-family:var(--font-code); font-variant-numeric:tabular-nums; font-weight:600; color:var(--accent-ink); }
  .pill{ display:inline-block; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; padding:3px 9px; border-radius:20px; background:color-mix(in srgb, var(--accent2) 12%, transparent); color:var(--accent2-ink); border:1px solid color-mix(in srgb, var(--accent2) 30%, transparent); }
  .back{ background:none; border:none; color:var(--text-muted); font-size:13.5px; cursor:pointer; margin-bottom:16px; padding:0; font-weight:600; }
  .row2{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  h2{ font-family:var(--font-display); font-weight:700; font-size:19px; letter-spacing:-.01em; margin:0 0 4px; }
  .meta{ font-size:13px; color:var(--text-muted); margin-bottom:18px; }
</style>
</head>
<body>
<div class="wrap">
  <header><h1>Çin Tedarik Ağı — Admin</h1></header>
  <div id="app"></div>
</div>
<script>
const API = '';
let token = localStorage.getItem('tk_admin_token');
let view = token ? 'liste' : 'giris';
let aktifSiparisNo = null;
const DURUMLAR = [
  ['talep_alindi','Talep Alındı'],
  ['fabrika_gorusuluyor','Fabrika Görüşülüyor'],
  ['teklif_hazir','Teklif Hazır'],
  ['numune_odeme_bekleniyor','Numune Ödemesi Bekleniyor'],
  ['numune_uretiliyor','Numune Üretiliyor'],
  ['numune_kalite_kontrolde','Numune Kalite Kontrolünde'],
  ['numune_onayinizi_bekliyor','Numune Onayınızı Bekliyor'],
  ['uretim_odeme_bekleniyor','Üretim Ödemesi Bekleniyor'],
  ['uretimde','Üretimde'],
  ['uretim_kalite_kontrolde','Üretim Kalite Kontrolünde'],
  ['sevkiyat_belgeleri_hazirlaniyor','Sevkiyat Belgeleri Hazırlanıyor'],
  ['konteyner','Konteynere Yüklendi'],
  ['yukleme_odeme_bekleniyor','Yükleme Öncesi Ödeme Bekleniyor'],
  ['gemide','Gemide'],
  ['gumruk_beyanname','Gümrük Beyannamesi Veriliyor'],
  ['gumruk_vergi_odeme','Gümrük Vergisi Ödemesi Bekleniyor'],
  ['gumruk_muayene','Gümrükte Muayene'],
  ['teslimat_yolda','Teslimat İçin Yolda'],
  ['teslim_edildi','Teslim Edildi'],
];
const OZEL_DURUMLAR = [
  ['numune_revizyon_istendi','⚠ Numune Revizyonu İstendi'],
  ['beklemede','⚠ Süreç Beklemede'],
  ['iptal_edildi','✕ İptal Edildi'],
];

function render() {
  const app = document.getElementById('app');
  if (view === 'giris') app.innerHTML = girisEkrani();
  else if (view === 'liste') { app.innerHTML = 'Yükleniyor…'; listeYukle(); }
  else if (view === 'detay') { app.innerHTML = 'Yükleniyor…'; detayYukle(aktifSiparisNo); }
}

function girisEkrani() {
  return `<div class="panel" style="max-width:400px;">
    <h2>Admin Girişi</h2>
    <div id="err" class="err"></div>
    <label>E-posta</label><input id="email" type="email">
    <label>Şifre</label><input id="sifre" type="password">
    <button class="primary" onclick="girisYap()">Giriş Yap</button>
  </div>`;
}

async function girisYap() {
  const email = document.getElementById('email').value.trim();
  const sifre = document.getElementById('sifre').value;
  const err = document.getElementById('err');
  try {
    const res = await fetch(API + '/api/tk/admin/giris', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({email, sifre})});
    if (!res.ok) { const d = await res.json(); err.textContent = d.detail; return; }
    const d = await res.json();
    token = d.token; localStorage.setItem('tk_admin_token', token);
    view = 'liste'; render();
  } catch(e) { err.textContent = 'Bağlantı hatası'; }
}

async function listeYukle() {
  const app = document.getElementById('app');
  const res = await fetch(API + '/api/tk/admin/siparisler', {headers:{'Authorization':'Bearer '+token}});
  if (res.status === 401) { localStorage.removeItem('tk_admin_token'); token=null; view='giris'; render(); return; }
  const rows = await res.json();
  let html = '<div class="panel"><table><thead><tr><th>Sipariş No</th><th>Müşteri</th><th>Ürün</th><th>Durum</th><th>Tarih</th></tr></thead><tbody>';
  rows.forEach(r => {
    html += `<tr onclick="aktifSiparisNo='${r.siparis_no}'; view='detay'; render();">
      <td class="siparis-no">${r.siparis_no}</td>
      <td>${r.musteri}${r.firma ? ' ('+r.firma+')' : ''}<br><span style="color:var(--text-muted);font-size:12px;">${r.email}</span></td>
      <td>${r.urun_aciklamasi}</td>
      <td><span class="pill" style="${r.durum==='iptal_edildi' ? 'background:color-mix(in srgb, var(--signal) 14%, transparent); color:var(--signal-ink); border-color:color-mix(in srgb, var(--signal) 35%, transparent);' : (['numune_revizyon_istendi','beklemede'].includes(r.durum) ? 'background:color-mix(in srgb, var(--accent) 14%, transparent); color:var(--accent-ink); border-color:color-mix(in srgb, var(--accent) 35%, transparent);' : '')}">${r.durum_adi}</span></td>
      <td style="font-family:var(--font-code); font-variant-numeric:tabular-nums;">${new Date(r.olusturulma).toLocaleDateString('tr-TR')}</td>
    </tr>`;
  });
  html += '</tbody></table></div>';
  app.innerHTML = html;
}

async function detayYukle(siparisNo) {
  const app = document.getElementById('app');
  const res = await fetch(API + '/api/tk/siparis/' + encodeURIComponent(siparisNo), {headers:{'Authorization':'Bearer '+token}});
  const d = await res.json();
  let durumOpts = '<optgroup label="Ana Akış">' + DURUMLAR.map(([k,a]) => `<option value="${k}" ${k===d.durum?'selected':''}>${a}</option>`).join('') + '</optgroup>'
    + '<optgroup label="Özel Durumlar">' + OZEL_DURUMLAR.map(([k,a]) => `<option value="${k}" ${k===d.durum?'selected':''}>${a}</option>`).join('') + '</optgroup>';
  app.innerHTML = `
    <button class="back" onclick="view='liste'; render();">← Listeye dön</button>
    <div class="panel">
      <h2>${d.siparis_no}</h2>
      <div class="meta">${d.urun_aciklamasi} · ${d.miktar||'—'}</div>
      <label>Durum güncelle</label>
      <select id="durumSec">${durumOpts}</select>
      <label>Not (opsiyonel)</label>
      <textarea id="durumNot" rows="2"></textarea>
      <button class="primary" onclick="durumGuncelle('${d.siparis_no}')">Durumu Kaydet</button>
    </div>
    <div class="panel">
      <h2>Belge Ekle</h2>
      <div class="row2">
        <div><label>Belge tipi</label><input id="belgeTipi" placeholder="ör. Konşimento"></div>
        <div><label>Dosya adı</label><input id="belgeAdi" placeholder="ör. BL_2026001.pdf"></div>
      </div>
      <label>Dosya URL</label><input id="belgeUrl" placeholder="https://...">
      <label>Açıklama (opsiyonel)</label><input id="belgeAciklama">
      <button class="primary" onclick="belgeEkle('${d.siparis_no}')">Belge Ekle</button>
    </div>
    <div class="panel">
      <h2>Mevcut Belgeler</h2>
      ${d.belgeler.length ? d.belgeler.map(b => `<div style="padding:8px 0; border-bottom:1px solid var(--border);">${b.dosya_adi} <span style="color:var(--text-muted);font-size:12px;">(${b.belge_tipi})</span> — <a href="${b.dosya_url}" target="_blank" style="color:var(--accent-ink);">indir</a></div>`).join('') : '<span style="color:var(--text-muted);">Henüz belge yok.</span>'}
    </div>
    <div class="panel">
      <h2>Durum Geçmişi</h2>
      ${d.gecmis.map(g => `<div style="padding:8px 0; border-bottom:1px solid var(--border);"><b>${g.durum_adi}</b> — ${g.not_metni||''} <span style="color:var(--text-muted);font-size:12px;">(${new Date(g.tarih).toLocaleString('tr-TR')})</span></div>`).join('')}
    </div>
  `;
}

async function durumGuncelle(siparisNo) {
  const durum = document.getElementById('durumSec').value;
  const not_metni = document.getElementById('durumNot').value.trim() || null;
  await fetch(API + '/api/tk/admin/siparis/' + encodeURIComponent(siparisNo) + '/durum', {
    method:'POST', headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},
    body: JSON.stringify({durum, not_metni})
  });
  detayYukle(siparisNo);
}

async function belgeEkle(siparisNo) {
  const belge_tipi = document.getElementById('belgeTipi').value.trim();
  const dosya_adi = document.getElementById('belgeAdi').value.trim();
  const dosya_url = document.getElementById('belgeUrl').value.trim();
  const aciklama = document.getElementById('belgeAciklama').value.trim() || null;
  if (!belge_tipi || !dosya_adi || !dosya_url) { alert('Belge tipi, dosya adı ve URL zorunlu.'); return; }
  await fetch(API + '/api/tk/admin/siparis/' + encodeURIComponent(siparisNo) + '/belge', {
    method:'POST', headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},
    body: JSON.stringify({belge_tipi, dosya_adi, dosya_url, aciklama})
  });
  detayYukle(siparisNo);
}

render();
</script>
</body>
</html>
