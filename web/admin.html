<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 40 40%22><rect width=%2240%22 height=%2240%22 rx=%229%22 fill=%22%230f3d63%22/><ellipse cx=%2220%22 cy=%2220%22 rx=%2214%22 ry=%227%22 fill=%22none%22 stroke=%22%23ffffff%22 stroke-opacity=%220.16%22 stroke-width=%221%22/><ellipse cx=%2220%22 cy=%2220%22 rx=%227%22 ry=%2214%22 fill=%22none%22 stroke=%22%23ffffff%22 stroke-opacity=%220.16%22 stroke-width=%221%22/><path d=%22M9,28 C15,24 25,16 31,12%22 fill=%22none%22 stroke=%22%23d99a2b%22 stroke-width=%222%22 stroke-linecap=%22round%22 stroke-dasharray=%220.5 4.2%22/><circle cx=%229%22 cy=%2228%22 r=%222.6%22 fill=%22%23ffffff%22/><circle cx=%2231%22 cy=%2212%22 r=%222.6%22 fill=%22%23d99a2b%22/></svg>">
<title>Admin — Tedarik Ağı</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<style>
  :root{
    /* Marka paleti — ithalat/ihracat/lojistik sektörünün tanıdık dili: koyu lacivert + amber/sarı vurgu (TransitFlow ve benzeri profesyonel lojistik temalarından esinlenildi) */
    --bg:#fafafa; --bg-alt:#f4f4f5; --surface:#ffffff; --text:#09090b; --text-muted:#71717a;
    --good:#12b76a; --good-bg:#ecfdf3; --good-bd:#6ce9a6; --bad:#f04438; --bad-bg:#fef3f2; --bad-bd:#fda29b;
    --accent:#d99a2b; --accent-ink:#a8721a; --accent2:#465fff; --accent2-ink:#3641f5;
    --signal:#c0392b; --signal-ink:#96271b; --border:#dbe0e8;
    --font-display: "Inter",-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    --font-body: "Inter",-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    --font-code: "IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }
  /* Karanlık mod da aynı referans tasarımın (shadcn) kendi koyu paletiyle —
     eski lacivert marka rengi değil, nötr zinc tonları. */
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#09090b; --bg-alt:#18181b; --surface:#18181b; --text:#fafafa; --text-muted:#a1a1aa;
      --good:#6ce9a6; --good-bg:#052e16; --good-bd:#039855; --bad:#fda29b; --bad-bg:#450a0a; --bad-bd:#d92d20;
      --accent:#e8b355; --accent-ink:#f3c878; --accent2:#7592ff; --accent2-ink:#9cb9ff;
      --signal:#e2725f; --signal-ink:#f0a08e; --border:#27272a;
    }
  }
  :root[data-theme="dark"]{
    --bg:#09090b; --bg-alt:#18181b; --surface:#18181b; --text:#fafafa; --text-muted:#a1a1aa;
    --good:#6ce9a6; --good-bg:#052e16; --good-bd:#039855; --bad:#fda29b; --bad-bg:#450a0a; --bad-bd:#d92d20;
    --accent:#e8b355; --accent-ink:#f3c878; --accent2:#7592ff; --accent2-ink:#9cb9ff;
    --signal:#e2725f; --signal-ink:#f0a08e; --border:#27272a;
  }
  *{box-sizing:border-box;}
  body{ margin:0; background:var(--bg); color:var(--text); font-family:var(--font-body); font-size:15px; line-height:1.5; overflow-x:hidden; }
  a{ color:inherit; }

  .theme-toggle{ display:flex; gap:2px; background:var(--bg-alt); border:1px solid var(--border); border-radius:20px; padding:3px; flex:none; }
  .theme-toggle button{ width:auto; border:none; background:transparent; color:var(--text-muted); font-family:var(--font-body); font-size:12px; font-weight:600; padding:5px 10px; border-radius:16px; cursor:pointer; }
  .theme-toggle button.active{ background:var(--accent2); color:#fff; }

  label{ display:block; font-size:11.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-muted); margin-bottom:8px; font-weight:600; line-height:1.4; }
  input, select, textarea{ width:100%; font-size:14.5px; padding:10px 11px; border-radius:6px; border:1px solid var(--border); background:var(--bg); color:var(--text); font-family:inherit; margin-bottom:18px; box-sizing:border-box; height:42px; }
  textarea{ height:auto; }
  /* Native dosya seçme kutusu diğer input'larla aynı yükseklikte, düğmesi
     tema rengiyle uyumlu görünsün diye ayrıca stillendi — aksi halde tarayıcı
     varsayılanı diğer alanlarla hizasız/kayık görünüyordu. */
  input[type="file"]{ padding:6px 11px; display:flex; align-items:center; font-size:13.5px; color:var(--text-muted); cursor:pointer; }
  input[type="file"]::file-selector-button{ font-family:inherit; font-size:13px; font-weight:600; padding:7px 14px; margin-right:12px; border-radius:6px; border:1px solid var(--border); background:var(--surface); color:var(--text); cursor:pointer; }
  input[type="file"]::file-selector-button:hover{ background:var(--bg-alt); }
  input:focus, select:focus, textarea:focus{ outline:2px solid var(--accent); outline-offset:1px; }
  button.primary{ background:var(--accent2); color:#fff; border:none; padding:10px 18px; border-radius:30px; font-weight:700; font-size:14px; cursor:pointer; }
  button.primary:hover{ background:var(--accent2-ink); }
  button.secondary{ background:var(--surface); color:var(--text); border:1px solid var(--border); padding:10px 18px; border-radius:30px; font-weight:700; font-size:14px; cursor:pointer; }
  button.secondary:hover{ border-color:var(--accent); }
  button:disabled{ opacity:.4; cursor:not-allowed; }
  .linklike{ background:none; border:none; color:var(--accent-ink); font-weight:600; cursor:pointer; padding:0; font-size:13px; text-decoration:underline; }
  .err{ color:var(--signal-ink); font-size:13px; margin-bottom:10px; }
  .demo-box{ font-size:13px; line-height:1.5; color:var(--accent2-ink); background:color-mix(in srgb, var(--accent2) 10%, transparent); border:1px solid color-mix(in srgb, var(--accent2) 28%, transparent); border-radius:6px; padding:10px 13px; margin-bottom:16px; }

  .panel-fade{ animation:panelFadeIn .45s cubic-bezier(.2,.7,.3,1); }
  @keyframes panelFadeIn{ from{ opacity:0; filter:blur(6px); transform:translateY(8px); } to{ opacity:1; filter:blur(0); transform:translateY(0); } }
  @media (prefers-reduced-motion: reduce){ .panel-fade{ animation:none; } }
  .row2{ display:grid; grid-template-columns:1fr 1fr; gap:18px; }
  @media (max-width:600px){ .row2{ grid-template-columns:1fr; } }
  h2{ font-family:var(--font-display); font-weight:700; font-size:20px; letter-spacing:-.01em; margin:0 0 10px; }
  .liste-satir{ display:flex; justify-content:space-between; align-items:center; gap:12px; padding:13px 0; border-bottom:1px solid var(--border); }
  .liste-satir:last-child{ border-bottom:none; }
  .liste-baslik{ font-size:14px; font-weight:600; }
  .liste-alt{ font-size:12px; color:var(--text-muted); margin-top:3px; }
  .gecmis-satir{ padding:14px 0; border-bottom:1px solid var(--border); }
  .gecmis-satir:last-child{ border-bottom:none; }
  .gecmis-satir .durum{ font-weight:700; font-size:14.5px; }
  .gecmis-satir .not{ font-size:13.5px; color:var(--text-muted); margin-top:4px; line-height:1.5; }
  .gecmis-satir .meta{ font-family:var(--font-code); font-size:11px; color:var(--text-muted); margin-top:6px; margin-bottom:0; }

  /* ---- Auth screen: tam ekran fotoğraf + ortalanmış cam kart ---- */
  .auth-wrap{ min-height:100vh; position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:40px 20px; overflow:hidden; }
  .auth-wrap .theme-toggle{ position:absolute; top:20px; right:20px; z-index:2; }
  .auth-bg{ position:absolute; inset:0; z-index:0; }
  .auth-bg img{ width:100%; height:100%; object-fit:cover; }
  .auth-scrim{ position:absolute; inset:0; background:linear-gradient(175deg, rgba(9,9,11,.86) 0%, rgba(9,9,11,.78) 50%, rgba(9,9,11,.92) 100%); }
  .auth-glass-wrap{ position:relative; z-index:1; width:100%; max-width:380px; display:flex; flex-direction:column; align-items:center; }
  .auth-badge{ width:52px; height:52px; border-radius:50%; background:rgba(255,255,255,.12); display:flex; align-items:center; justify-content:center; margin-bottom:22px; box-shadow:0 8px 24px -8px rgba(0,0,0,.5); }
  .auth-badge svg{ width:30px; height:30px; }
  .auth-card{ width:100%; background:linear-gradient(135deg, rgba(255,255,255,.08), rgba(255,255,255,.02)); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px); border:1px solid rgba(255,255,255,.12); border-radius:26px; box-shadow:0 24px 60px -12px rgba(0,0,0,.6); padding:36px 32px; }
  .auth-card .badge{ display:inline-block; font-family:var(--font-code); font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:#c7d2ff; background:rgba(70,95,255,.18); border:1px solid rgba(70,95,255,.35); padding:3px 10px; border-radius:20px; margin-bottom:16px; }
  .auth-card h2{ font-size:24px; margin-bottom:6px; color:#fff; }
  .auth-card .lede{ color:rgba(255,255,255,.6); font-size:14px; margin:0 0 24px; }
  .auth-card label{ color:rgba(255,255,255,.7); }
  .auth-card input{ background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.14); color:#fff; }
  .auth-card input::placeholder{ color:rgba(255,255,255,.35); }
  .auth-card input:focus{ border-color:rgba(255,255,255,.35); background:rgba(255,255,255,.1); }
  .auth-card .demo-box{ background:rgba(70,95,255,.16); border-color:rgba(70,95,255,.35); color:#c7d2ff; }
  .auth-card .demo-box b{ color:#fff; }
  .auth-card .err{ color:#ff8a8a; }
  .auth-meta{ position:relative; z-index:1; display:flex; gap:26px; font-family:var(--font-code); font-size:11.5px; color:rgba(255,255,255,.5); margin-top:26px; flex-wrap:wrap; justify-content:center; }
  .auth-meta b{ display:block; color:#fff; font-family:var(--font-body); font-size:14px; margin-top:3px; font-weight:700; }
  @media (max-width:480px){ .auth-card{ padding:28px 22px; } }

  /* ---- App shell ---- */
  .app-shell{ display:flex; min-height:100vh; align-items:stretch; }
  /* ---- Sidebar: paylaşılan referansla birebir — açık/beyaz zemin, ince sağ
     kenarlık, net grup etiketleri, chevron'lu marka satırı, Bootstrap Icons. ---- */
  .sidebar{ width:252px; flex:none; background:var(--surface); border-right:1px solid var(--border); padding:20px 14px; display:flex; flex-direction:column; }
  .brand-row{ display:flex; align-items:center; justify-content:space-between; padding:6px; margin-bottom:18px; border-radius:8px; cursor:pointer; }
  .brand-row:hover{ background:var(--bg-alt); }
  .brand-row .chev{ color:var(--text-muted); font-size:12px; }
  .sidebar .brand{ font-family:var(--font-display); font-weight:700; font-size:14px; text-decoration:none; color:var(--text); display:flex; align-items:center; gap:10px; }
  .sidebar .brand svg{ width:26px; height:26px; flex:none; }
  .sidebar .brand-t{ line-height:1.25; letter-spacing:-.01em; }
  .sidebar .brand-sub{ font-family:var(--font-body); font-weight:400; font-size:11px; letter-spacing:.02em; text-transform:none; color:var(--text-muted); }
  .side-group-label{ font-size:11px; font-weight:600; letter-spacing:.01em; text-transform:none; color:var(--text-muted); padding:0 10px; margin:16px 0 6px; }
  .side-group-label:first-of-type{ margin-top:0; }
  .side-nav{ display:flex; flex-direction:column; gap:1px; }
  .side-nav button{ display:flex; align-items:center; gap:11px; padding:7px 10px; border-radius:10px; font-weight:600; font-size:14px; color:var(--text); cursor:pointer; border:none; background:none; text-align:left; width:100%; font-family:var(--font-body); transition:background .12s, color .12s; position:relative; }
  .side-nav button:hover{ background:var(--bg-alt); }
  .side-nav button.active{ background:color-mix(in srgb, var(--accent2) 12%, transparent); color:var(--accent2); font-weight:700; }
  .side-nav button.active .ico{ color:var(--accent2); }
  .side-nav .ico{ width:16px; text-align:center; flex:none; font-size:14.5px; color:var(--text-muted); }
  .sidebar-foot{ margin-top:auto; padding-top:14px; border-top:1px solid var(--border); }
  .user-chip{ display:flex; align-items:center; gap:10px; padding:6px; margin-bottom:6px; }
  .user-chip .av{ width:28px; height:28px; border-radius:50%; background:var(--accent2); color:#fff; display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-weight:700; font-size:12px; flex:none; }
  .user-chip b{ color:var(--text); }
  .user-chip .role{ font-size:11px; color:var(--text-muted); }
  .sidebar-foot .theme-toggle{ margin-bottom:8px; width:100%; justify-content:center; }
  .main-col{ flex:1; display:flex; flex-direction:column; min-width:0; position:relative; }
  .topbar{ display:flex; align-items:center; justify-content:space-between; gap:16px; padding:12px 24px; border-bottom:1px solid var(--border); background:var(--surface); }
  /* Ana sayfadaki gibi, çok hafif dekoratif blob — sadece köşede, dikkat dağıtmadan
     marka kimliğini panele de taşıyor. */
  .main-col::before{ content:""; position:absolute; top:-60px; right:-60px; width:280px; height:280px; border-radius:50%; background:radial-gradient(circle, color-mix(in srgb, var(--accent2) 10%, transparent), transparent 70%); pointer-events:none; z-index:0; }
  .main{ position:relative; z-index:1; }
  .topbar-search{ display:flex; align-items:center; gap:8px; background:var(--bg); border:1px solid var(--border); border-radius:8px; padding:7px 12px; max-width:380px; flex:1; }
  .topbar-search .ico{ font-size:13px; opacity:.5; }
  .topbar-search input{ border:none; background:none; margin:0; padding:0; font-size:13.5px; flex:1; }
  .topbar-search input:focus{ outline:none; }
  .topbar-search .kbd{ font-family:var(--font-body); font-weight:600; font-size:11px; color:var(--text-muted); background:var(--bg-alt); border:1px solid var(--border); border-radius:4px; padding:1px 6px; }
  .topbar-toggle .theme-toggle{ position:static; box-shadow:none; }
  .main{ flex:1; padding:28px 40px; width:100%; max-width:none; }
  @media (max-width:820px){
    .app-shell{ flex-direction:column; }
    .sidebar{ width:100%; padding:14px 16px; border-right:none; border-bottom:1px solid var(--border); }
    .sidebar-foot{ margin-top:14px; padding-top:14px; }
    .main{ padding:24px 18px; }
  }

  .panel-head{ display:flex; justify-content:space-between; align-items:flex-start; gap:16px; margin-bottom:22px; flex-wrap:wrap; }
  /* shadcn admin dashboard referansındaki stat kartlarıyla birebir: ikon+etiket
     başlık satırı, büyük rakam, alt açıklama, alt satırda "Detaylar" linki. */
  .stat-grid{ display:grid; grid-template-columns:repeat(5,1fr); gap:18px; margin-bottom:28px; }
  @media (max-width:960px){ .stat-grid{ grid-template-columns:repeat(3,1fr); } }
  @media (max-width:600px){ .stat-grid{ grid-template-columns:repeat(2,1fr); } }
  /* Ana sayfadaki yumuşak, ikon rozetli kart diliyle birebir — sert köşeli,
     ince çerçeveli "kurumsal dashboard" hissi yerine daire ikon + bol boşluk. */
  .stat-card{ background:var(--surface); border:1px solid var(--border); border-radius:20px; padding:22px 20px; box-shadow:0 4px 16px -4px rgba(70,95,255,.08); transition:transform .15s, box-shadow .15s; }
  .stat-card:hover{ transform:translateY(-2px); box-shadow:0 10px 24px -6px rgba(70,95,255,.16); }
  .stat-ico-badge{ width:44px; height:44px; border-radius:50%; background:color-mix(in srgb, var(--accent2) 12%, transparent); color:var(--accent2); display:flex; align-items:center; justify-content:center; font-size:18px; margin-bottom:14px; }
  /* Referanstaki gibi kart başına farklı renk — hepsi aynı indigo yerine
     mavi/mor/turuncu/kırmızı dönüşümlü, göz için daha canlı bir dashboard. */
  .stat-ico-badge.tone-blue{ background:#eff6ff; color:#2563eb; }
  .stat-ico-badge.tone-purple{ background:#faf5ff; color:#9333ea; }
  .stat-ico-badge.tone-orange{ background:#fff7ed; color:#ea580c; }
  .stat-ico-badge.tone-red{ background:var(--bad-bg); color:var(--bad); }
  .stat-ico-badge.tone-indigo{ background:color-mix(in srgb, var(--accent2) 12%, transparent); color:var(--accent2); }
  .stat-card .stat-head{ display:flex; align-items:center; gap:6px; font-size:12.5px; font-weight:600; color:var(--text-muted); margin-bottom:6px; }
  .stat-card .stat-head .ico{ font-size:13px; opacity:.7; }
  .stat-card .v{ font-family:var(--font-display); font-weight:800; font-size:36px; color:var(--text); letter-spacing:-.02em; font-variant-numeric:tabular-nums; line-height:1.15; }
  .stat-card .l{ font-size:11.5px; color:var(--text-muted); margin-top:2px; line-height:1.4; }
  .stat-card .stat-foot{ display:flex; justify-content:space-between; align-items:center; margin-top:12px; padding-top:10px; border-top:1px solid var(--border); font-size:11.5px; }
  .stat-card .stat-foot .det{ color:#2563eb; font-weight:600; text-decoration:none; cursor:pointer; }
  .stat-card .info-ico{ margin-left:auto; opacity:.4; cursor:help; font-size:11px; }
  .trend-badge{ display:inline-flex; align-items:center; gap:5px; font-weight:700; font-size:11px; padding:2px 7px 2px 2px; border-radius:20px; }
  /* Phoenix (prium.github.io/phoenix-tailwind) referansındaki kompakt dolu
     renkli daire trend göstergesi — büyük ok yerine küçük, dolu bir nokta. */
  .trend-badge .dot{ width:16px; height:16px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:9px; flex:none; }
  .trend-badge.up .dot{ background:var(--good); color:#fff; }
  .trend-badge.down .dot{ background:var(--bad); color:#fff; }
  .trend-badge.up{ color:var(--good); background:var(--good-bg); border:1px solid var(--good-bd); }
  .trend-badge.down{ color:var(--bad); background:var(--bad-bg); border:1px solid var(--bad-bd); }

  /* Sayfa başlığı — paylaşılan referanstaki gibi büyük kalın H1 + sağda
     dolgu(dark)/çerçeveli(outline) buton ikilisi. */
  .breadcrumb{ display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--text-muted); margin-bottom:10px; }
  .breadcrumb i{ font-size:10px; opacity:.6; }
  .page-head{ display:flex; justify-content:space-between; align-items:flex-start; gap:16px; margin-bottom:22px; flex-wrap:wrap; }
  .page-head h1{ font-family:var(--font-display); font-weight:700; font-size:26px; letter-spacing:-.02em; margin:0; }
  .page-head p{ color:var(--text-muted); font-size:13.5px; margin:4px 0 0; }
  .page-head-actions{ display:flex; gap:10px; flex:none; }
  .btn-dark{ background:var(--accent2); color:#fff; border:none; padding:9px 16px; border-radius:30px; font-weight:600; font-size:13.5px; cursor:pointer; font-family:var(--font-body); }
  .btn-dark:hover{ background:var(--accent2-ink); }
  .btn-outline{ background:var(--surface); color:var(--text); border:1px solid var(--border); padding:9px 16px; border-radius:30px; font-weight:600; font-size:13.5px; cursor:pointer; font-family:var(--font-body); }
  .btn-outline:hover{ background:var(--bg-alt); }
  .chart-card svg{ display:block; }
  .chart-row{ display:grid; grid-template-columns:1.3fr 1fr .8fr; gap:16px; margin-bottom:20px; }
  .chart-row .panel{ margin-bottom:0; }
  @media (max-width:900px){ .chart-row{ grid-template-columns:1fr; } }
  .filter-row{ display:flex; gap:12px; margin-bottom:18px; flex-wrap:wrap; }
  .filter-row input{ flex:1; min-width:220px; margin-bottom:0; }
  .filter-row select{ width:auto; min-width:180px; margin-bottom:0; }
  .panel-head p{ color:var(--text-muted); font-size:14px; margin:6px 0 0; }
  /* shadcn/ui "Card" bileşeniyle birebir: rounded-lg + ince kenarlık + shadow-sm */
  .panel{ background:var(--surface); border:1px solid var(--border); border-radius:20px; padding:26px; margin-bottom:20px; box-shadow:0 4px 16px -4px rgba(70,95,255,.06); }
  .panel h2{ letter-spacing:-.02em; }
  .empty-state{ background:var(--surface); border:1px dashed var(--border); border-radius:16px; padding:36px; text-align:center; color:var(--text-muted); }
  /* Müşteri panelindekiyle birebir aynı adım göstergesi. */
  .adim-takip{ display:flex; align-items:flex-start; padding:6px 4px; }
  .adim{ flex:1; display:flex; flex-direction:column; align-items:center; position:relative; text-align:center; }
  .adim-daire{ width:38px; height:38px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:15px; background:var(--bg-alt); color:var(--text-muted); border:2px solid var(--border); z-index:1; flex:none; transition:all .2s; }
  .adim.done .adim-daire{ background:var(--good); color:#fff; border-color:var(--good); }

  /* Önceki/Sıradaki aşama kartları — ikon rozetli, pill butonlu. */

  .table-wrap{ overflow-x:auto; }
  table{ width:100%; border-collapse:collapse; font-size:13.5px; font-family:var(--font-body); }

  .row-cust{ display:flex; align-items:center; gap:10px; }
  .row-cust .av{ width:30px; height:30px; border-radius:50%; background:color-mix(in srgb, var(--accent2) 14%, transparent); color:var(--accent2); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:11.5px; flex:none; }
  .pill{ display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:600; letter-spacing:0; text-transform:none; padding:4px 10px; border-radius:20px; background:var(--bg-alt); color:var(--text-muted); border:1px solid var(--border); white-space:nowrap; }
  .pill::before{ content:""; width:6px; height:6px; border-radius:50%; background:currentColor; }
  .pill.st-blue{ background:#eff6ff; color:#1d4ed8; border-color:#bfdbfe; }
  .pill.st-purple{ background:#faf5ff; color:#7e22ce; border-color:#e9d5ff; }
  .pill.st-orange{ background:#fff7ed; color:#c2410c; border-color:#fed7aa; }
  .pill.st-amber{ background:#fffbeb; color:#b45309; border-color:#fde68a; }
  .pill.st-teal{ background:#f0fdfa; color:#0f766e; border-color:#99f6e4; }
  .pill.st-pink{ background:#fdf2f8; color:#be185d; border-color:#fbcfe8; }
  .pill.st-cyan{ background:#ecfeff; color:#0e7490; border-color:#a5f3fc; }

</style>
</head>
<body>
<div id="app"></div>
<script>
const API = '';
let token = localStorage.getItem('tk_admin_token');
let adminEmail = localStorage.getItem('tk_admin_email') || '';
const _siparisParam = new URLSearchParams(location.search).get('siparis');
let view = token ? (_siparisParam ? 'detay' : 'liste') : 'giris';
let aktifSiparisNo = _siparisParam || null;
// Müşteri panelindeki adım göstergesiyle BİREBİR aynı — admin da aynı görsel
// dilde "neredeyiz" görsün, iki panel arasında tutarsızlık olmasın.
const ANA_FAZLAR = [
  { ad:'Talep & Teklif', ico:'bi-file-earmark-text', renk:'blue', test: k => ['talep_alindi','fabrika_gorusuluyor','teklif_hazir'].includes(k) },
  { ad:'Numune', ico:'bi-flask', renk:'purple', test: k => k.startsWith('numune_') },
  { ad:'Üretim', ico:'bi-gear', renk:'orange', test: k => k.startsWith('uretim_') || k === 'uretimde' },
  { ad:'Sevkiyat', ico:'bi-truck', renk:'cyan', test: k => ['sevkiyat_belgeleri_hazirlaniyor','konteyner','yukleme_odeme_bekleniyor','gemide','teslimat_yolda'].includes(k) },
  { ad:'Gümrük', ico:'bi-shield-check', renk:'cyan', test: k => k.startsWith('gumruk_') },
  { ad:'Teslim', ico:'bi-box-seam', renk:'green', test: k => k === 'teslim_edildi' },
];
function adimTakipcisi(durum) {
  let fazIdx = ANA_FAZLAR.findIndex(f => f.test(durum));
  if (fazIdx === -1 && durum === 'numune_revizyon_istendi') fazIdx = 1;
  const iptal = durum === 'iptal_edildi';
  return `<div class="adim-takip">
    ${ANA_FAZLAR.map((f, i) => {
      let d = 'pending';
      if (iptal) d = 'iptal';
      else if (i < fazIdx) d = 'done';
      else if (i === fazIdx) d = 'current';
      return `<div class="adim ${d} renk-${f.renk}">
        <div class="adim-daire"><i class="bi ${d==='done' ? 'bi-check-lg' : f.ico}"></i></div>
        <div class="adim-ad">${f.ad}</div>
        ${i < ANA_FAZLAR.length - 1 ? '<div class="adim-cizgi"></div>' : ''}
      </div>`;
    }).join('')}
  </div>`;
}

const DURUMLAR = [
  ['talep_alindi','Talep Alındı'],
  ['fabrika_gorusuluyor','Fabrika Görüşülüyor'],
  ['teklif_hazir','Teklif Hazır'],
  ['numune_odeme_bekleniyor','Numune Ödemesi Bekleniyor'],
  ['numune_uretiliyor','Numune Üretiliyor'],
  ['numune_kalite_kontrolde','Numune Kalite Kontrolünde'],
  ['numune_onayinizi_bekliyor','Numune Onayınızı Bekliyor'],
  ['uretim_odeme_bekleniyor','Üretim Ödemesi Bekleniyor'],
  ['uretimde','Üretimde'],
  ['uretim_kalite_kontrolde','Üretim Kalite Kontrolünde'],
  ['sevkiyat_belgeleri_hazirlaniyor','Sevkiyat Belgeleri Hazırlanıyor'],

const OZEL_DURUMLAR = [

// Backend CARRIER_REGISTRY ile birebir aynı (src/tracking_api.py) — sadece
// gerçekten headless tarayıcıyla test edilip doğrulanan taşıyıcılar.

  ['maersk','Maersk'],
  ['cosco','COSCO Shipping'],
  ['msc','MSC'],
  ['cma_cgm','CMA CGM'],

];

// Durum kodunu, tablo/pill'lerde kullanılan renk kategorisine çevirir —
// 19 aşamalı gerçek süreç fazlarına göre (Talep/Numune/Üretim/Sevkiyat/Gümrük/Teslim).
// Müşteri avatarlarına isimden türetilmiş, sabit (her seferinde aynı) bir renk
// atar — hepsi tek bir indigo yerine mavi/mor/turuncu/pembe/camgöbeği/yeşil
// arasında dönerek görsel çeşitlilik ve "kimin kim olduğunu" ayırt etmeyi kolaylaştırır.
const AVATAR_PALET = [
  ['#eff6ff', '#2563eb'], ['#faf5ff', '#9333ea'], ['#fff7ed', '#ea580c'],
  ['#fdf2f8', '#db2777'], ['#ecfeff', '#0e7490'], ['#ecfdf3', '#12b76a'],
  ['#fefce8', '#a16207'], ['#eef2ff', '#4f46e5'],
];
function avatarRengi(isim) {
  let h = 0;
  for (let i = 0; i < (isim||'?').length; i++) h = (h * 31 + isim.charCodeAt(i)) >>> 0;
  return AVATAR_PALET[h % AVATAR_PALET.length];
}

function durumRenkSinifi(durum) {
  // Her faz kendi net renginde, hiçbiri mavi ailesiyle karışmasın diye özenle
  // ayrıştırıldı — özellikle "Gemide" (sipariş hacminin büyük kısmı) artık
  // camgöbeği/mavi değil, sıcak turkuaz-yeşil (teal) tonunda.
  if (durum === 'iptal_edildi') return 'st-red';
  if (['numune_revizyon_istendi','beklemede'].includes(durum)) return 'st-amber';
  if (durum === 'teslim_edildi') return 'st-green';
  if (['talep_alindi','fabrika_gorusuluyor','teklif_hazir'].includes(durum)) return 'st-blue';
  if (durum.startsWith('numune_')) return 'st-purple';
  if (durum.startsWith('uretim_') || durum === 'uretimde') return 'st-orange';
  if (['sevkiyat_belgeleri_hazirlaniyor','konteyner','yukleme_odeme_bekleniyor','gemide','teslimat_yolda'].includes(durum)) return 'st-teal';
  if (durum.startsWith('gumruk_')) return 'st-pink';
  return '';
}

function themeToggleHtml() {
  return `<div class="theme-toggle" id="themeToggle">
    <button data-mode="light">☀</button>
    <button data-mode="dark">☾</button>
    <button data-mode="system">Sis</button>
  </div>`;
}

function render() {
  const app = document.getElementById('app');
  if (view === 'giris') { app.innerHTML = authShell(girisEkrani()); initTheme(); return; }
  app.innerHTML = panelShell('<div class="empty-state">Yükleniyor…</div>', view);
  initTheme();
  if (view === 'liste') listeYukle();
  else if (view === 'detay') detayYukle(aktifSiparisNo);
  else if (view === 'musteriler') musterilerYukle();
  else if (view === 'yeni-siparis') { document.querySelector('.main').innerHTML = yeniSiparisEkrani(); ysMusteriDropdownDoldur(); }
}

  return `

      <div class="auth-bg">
        <img src="assets/photos/ship_aerial.jpg" alt="Açık denizde konteyner gemisi">

      </div>
      <div class="auth-glass-wrap">
        <a href="/" class="auth-badge"><svg viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="9" fill="#465fff"/><ellipse cx="20" cy="20" rx="14" ry="7" fill="none" stroke="#ffffff" stroke-opacity="0.25"/><ellipse cx="20" cy="20" rx="7" ry="14" fill="none" stroke="#ffffff" stroke-opacity="0.25"/><path d="M9,28 C15,24 25,16 31,12" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-dasharray="0.5 4.2"/><circle cx="9" cy="28" r="2.6" fill="#ffffff"/><circle cx="31" cy="12" r="2.6" fill="#ffffff"/></svg></a>
        <div class="auth-card panel-fade">${innerHtml}</div>

        </div>
      </div>

}

function panelShell(innerHtml, activeView) {
  const initial = (adminEmail || '?').trim().charAt(0).toUpperCase();
  return `
    <div class="app-shell">
      <div class="sidebar">
        <div class="brand-row">
          <div class="brand"><svg viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="9" fill="#0f3d63"/><ellipse cx="20" cy="20" rx="14" ry="7" fill="none" stroke="#ffffff" stroke-opacity="0.16"/><ellipse cx="20" cy="20" rx="7" ry="14" fill="none" stroke="#ffffff" stroke-opacity="0.16"/><path d="M9,28 C15,24 25,16 31,12" fill="none" stroke="#d99a2b" stroke-width="2" stroke-linecap="round" stroke-dasharray="0.5 4.2"/><circle cx="9" cy="28" r="2.6" fill="#ffffff"/><circle cx="31" cy="12" r="2.6" fill="#d99a2b"/></svg><div><div class="brand-t">Tedarik Ağı</div><div class="brand-sub">Admin Paneli</div></div></div>
          <span class="chev">⌄</span>
        </div>

          <button class="${activeView==='liste'||activeView==='detay' ? 'active' : ''}" onclick="view='liste'; render();"><span class="ico"><i class="bi bi-grid-1x2"></i></span> Siparişler</button>
          <button class="${activeView==='yeni-siparis' ? 'active' : ''}" onclick="view='yeni-siparis'; render();"><span class="ico"><i class="bi bi-plus-circle"></i></span> Yeni Sipariş</button>
          <button class="${activeView==='musteriler' ? 'active' : ''}" onclick="view='musteriler'; render();"><span class="ico"><i class="bi bi-building"></i></span> Müşteriler</button>

            <span class="kbd">⌘K</span>

function topbarAra(v) {
  // Üstteki arama kutusu, liste görünümündeki filtre kutusuyla aynı işi görür —

function girisEkrani() {
  return `
    <span class="badge">Yalnızca ekip erişimi</span>

async function girisYap() {
  const email = document.getElementById('email').value.trim();
  const sifre = document.getElementById('sifre').value;
  const err = document.getElementById('err');
  try {
    const res = await fetch(API + '/api/tk/admin/giris', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({email, sifre})});
    if (!res.ok) { const d = await res.json(); err.textContent = d.detail; return; }
    const d = await res.json();
    token = d.token; localStorage.setItem('tk_admin_token', token);
    adminEmail = email; localStorage.setItem('tk_admin_email', email);
    view = 'liste'; render();
  } catch(e) { err.textContent = 'Bağlantı hatası'; }
}

function musteriSiparislerineGit(email) {
  view = 'liste'; render();
  setTimeout(() => {
    const el = document.getElementById('filtreArama');
    if (el) { el.value = email; siparisSayfa = 1; siparisListesiCiz(); }

function cikisYap() {
  localStorage.removeItem('tk_admin_token'); localStorage.removeItem('tk_admin_email');

let siparisRowsCache = [];
let musteriRowsCache = [];

// Stat kartı — paylaşılan referans tasarımdaki gibi ikon+etiket başlığı, büyük
// rakam, alt açıklama ve (varsa GERÇEK, hesaplanmış) yeşil/kırmızı trend rozeti.
// trendPct null ise rozet hiç basılmıyor — uydurma yüzde göstermiyoruz.
function statCard(icon, label, value, caption, colorMode, trendPct, badgeTone) {
  const valColor = colorMode === 'bad' ? 'var(--bad)' : (colorMode === 'good' ? 'var(--good)' : 'var(--text)');
  let badge = '';
  if (trendPct !== undefined && trendPct !== null) {
    const up = trendPct >= 0;
    badge = `<span class="trend-badge ${up ? 'up' : 'down'}"><span class="dot"><i class="bi bi-arrow-${up ? 'up' : 'down'}"></i></span> %${Math.abs(trendPct)}</span>`;
  }
  return `<div class="stat-card">
    <div class="stat-ico-badge tone-${badgeTone || 'indigo'}">${icon}</div>
    <div class="stat-head">${label} <span class="info-ico" title="${caption}">ⓘ</span></div>
    <div class="v" style="color:${valColor};">${Number(value).toLocaleString('tr-TR')}</div>
    <div class="l">${caption}</div>
    <div class="stat-foot">
      <a class="det" onclick="document.getElementById('siparisListe').scrollIntoView({behavior:'smooth'})">Detaylar →</a>
      ${badge}
    </div>
  </div>`;
}

// İki seri (yeni talep / tamamlanan) alan grafiği — referanstaki turuncu+yeşil
// iki katmanlı area chart diliyle, ama uydurma değil gerçek haftalık verilerle.
function alanGrafigi(rows) {
  const haftalar = [];
  const simdi = Date.now();
  for (let i = 5; i >= 0; i--) {
    const bas = simdi - (i+1)*7*24*60*60*1000;
    const bit = simdi - i*7*24*60*60*1000;
    const yeni = rows.filter(r => { const t = new Date(r.olusturulma).getTime(); return t >= bas && t < bit; }).length;
    const tamam = rows.filter(r => { if (r.durum !== 'teslim_edildi' || !r.guncellenme) return false; const t = new Date(r.guncellenme).getTime(); return t >= bas && t < bit; }).length;
    haftalar.push({yeni, tamam, etiket: new Date(bit).toLocaleDateString('tr-TR', {day:'2-digit', month:'2-digit'})});
  }
  const maxN = Math.max(1, ...haftalar.map(h => Math.max(h.yeni, h.tamam)));
  const W = 560, H = 160, PAD = 26;
  const stepX = (W - PAD*2) / (haftalar.length - 1);
  // Düz çizgi segmentleri yerine yumuşak eğri (Catmull-Rom → kübik bezier
  // dönüşümü) — referanstaki gibi akıcı bir alan grafiği için.
  const yumusakYol = (pts) => {
    if (pts.length < 2) return '';
    let d = `M${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`;
    for (let i = 0; i < pts.length - 1; i++) {
      const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
      const c1x = p1[0] + (p2[0] - p0[0]) / 6, c1y = p1[1] + (p2[1] - p0[1]) / 6;
      const c2x = p2[0] - (p3[0] - p1[0]) / 6, c2y = p2[1] - (p3[1] - p1[1]) / 6;
      d += ` C${c1x.toFixed(1)},${c1y.toFixed(1)} ${c2x.toFixed(1)},${c2y.toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`;
    }
    return d;
  };
  const seri = (key, renk) => {
    const pts = haftalar.map((h,i) => [PAD + i*stepX, H - PAD - (h[key] / maxN) * (H - PAD*2)]);
    const path = yumusakYol(pts);
    const area = path + ` L${pts[pts.length-1][0]},${H-PAD} L${pts[0][0]},${H-PAD} Z`;
    const dots = pts.map(p => `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="2.5" fill="${renk}"/>`).join('');
    // Referanstaki gibi her noktanın gerçek değeri, noktanın hemen üstünde.
    const degerEtiketleri = pts.map((p,i) => `<text x="${p[0].toFixed(1)}" y="${(p[1]-9).toFixed(1)}" font-size="9" font-weight="700" fill="${renk}" text-anchor="middle">${haftalar[i][key]}</text>`).join('');
    return `<path d="${area}" fill="${renk}" fill-opacity="0.14"/><path d="${path}" fill="none" stroke="${renk}" stroke-width="2.5"/>${dots}${degerEtiketleri}`;
  };
  const labels = haftalar.map((h,i) => `<text x="${(PAD+i*stepX).toFixed(1)}" y="${H-6}" font-size="9.5" fill="var(--text-muted)" text-anchor="middle">${h.etiket}</text>`).join('');
  return `<div class="panel chart-card">
    <h2 style="font-size:15px;">Haftalık Sipariş Hacmi</h2>
    <p style="color:var(--text-muted); font-size:12.5px; margin:0 0 10px;">Turuncu: yeni talep · Yeşil: tamamlanan (son 6 hafta, gerçek veri)</p>
    <svg viewBox="0 0 ${W} ${H}" style="width:100%; height:auto;">
      ${seri('yeni', '#ea580c')}${seri('tamam', '#14b8a6')}${labels}
    </svg>
  </div>`;
}

// Süreç fazına göre gerçek sipariş dağılımı — turuncu/yeşil dönüşümlü çubuk
// grafik (referanstaki "Subscriptions" bar chart diliyle).
function barGrafigi(rows) {
  const fazlar = [
    ['Talep/Teklif', r => ['talep_alindi','fabrika_gorusuluyor','teklif_hazir'].includes(r.durum)],
    ['Numune', r => r.durum.startsWith('numune_')],
    ['Üretim', r => r.durum.startsWith('uretim_') || r.durum === 'uretimde'],
    ['Sevkiyat', r => ['sevkiyat_belgeleri_hazirlaniyor','konteyner','yukleme_odeme_bekleniyor','gemide','teslimat_yolda'].includes(r.durum)],
    ['Gümrük', r => r.durum.startsWith('gumruk_')],
    ['Teslim', r => r.durum === 'teslim_edildi'],
  ];
  const veriler = fazlar.map(([ad, f], i) => ({ad, n: rows.filter(f).length, renk: i % 2 === 0 ? '#ea580c' : '#14b8a6'}));
  const maxN = Math.max(1, ...veriler.map(v => v.n));
  const W = 380, H = 160, PAD = 22, barW = (W - PAD*2) / veriler.length * 0.55;
  const stepX = (W - PAD*2) / veriler.length;
  const bars = veriler.map((v,i) => {
    const h = (v.n / maxN) * (H - PAD*2 - 14);
    const x = PAD + i*stepX + (stepX - barW)/2;
    const y = H - PAD - h;
    return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${h.toFixed(1)}" rx="3" fill="${v.renk}"/>
      <text x="${(x+barW/2).toFixed(1)}" y="${(H-PAD+12).toFixed(1)}" font-size="8.5" fill="var(--text-muted)" text-anchor="middle">${v.ad}</text>`;
  }).join('');
  return `<div class="panel chart-card">
    <h2 style="font-size:15px;">Süreç Fazına Göre Dağılım</h2>
    <p style="color:var(--text-muted); font-size:12.5px; margin:0 0 10px;">Aktif ve tamamlanan tüm siparişler, gerçek sayım</p>
    <svg viewBox="0 0 ${W} ${H}" style="width:100%; height:auto;">${bars}</svg>
  </div>`;
}

// Referanstaki halka/donut gösterge — ortada büyük rakamla. Uydurma bir "ilerleme"
// değil: gerçekten teslim edilmiş sipariş oranını gösteriyor.
function tamamlanmaHalkasi(rows) {
  const toplam = rows.length;
  const tamamlanan = rows.filter(r => r.durum === 'teslim_edildi').length;
  const yuzde = toplam > 0 ? Math.round((tamamlanan / toplam) * 100) : 0;
  const R = 70, C = 2 * Math.PI * R;
  const dolu = (yuzde / 100) * C;
  return `<div class="panel chart-card" style="display:flex; flex-direction:column; align-items:center; text-align:center;">
    <h2 style="font-size:15px; align-self:flex-start;">Tamamlanma Oranı</h2>
    <p style="color:var(--text-muted); font-size:12.5px; margin:0 0 10px; align-self:flex-start;">Teslim edilen / toplam sipariş</p>
    <svg viewBox="0 0 180 180" style="width:170px; height:170px;">
      <circle cx="90" cy="90" r="${R}" fill="none" stroke="var(--bg-alt)" stroke-width="16"/>
      <circle cx="90" cy="90" r="${R}" fill="none" stroke="var(--accent2)" stroke-width="16" stroke-linecap="round"
        stroke-dasharray="${dolu.toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 90 90)"/>
      <text x="90" y="84" text-anchor="middle" font-size="30" font-weight="700" fill="var(--text)" font-family="var(--font-display)">%${yuzde}</text>
      <text x="90" y="106" text-anchor="middle" font-size="11" fill="var(--text-muted)">${tamamlanan}/${toplam} sipariş</text>
    </svg>
  </div>`;
}

// Basit CSV dışa aktarma — harici kütüphane gerektirmez. Değerlerdeki
// virgül/tırnak/satır sonu CSV kaçış kuralına göre işlenir.
function csvIndir(rows, alanlar, dosyaAdi) {
  const kacir = (v) => {
    const s = (v === null || v === undefined) ? '' : String(v);
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  };
  const satirlar = [alanlar.join(',')].concat(rows.map(r => alanlar.map(a => kacir(r[a])).join(',')));
  const blob = new Blob(['﻿' + satirlar.join('\n')], {type: 'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = dosyaAdi;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function kopyala(metin, event) {
  navigator.clipboard.writeText(metin);
  const el = event.target;
  const eski = el.textContent;
  el.textContent = '✓';
  setTimeout(() => { el.textContent = eski; }, 900);
  if (event) event.stopPropagation();
}

async function listeYukle() {
  const main = document.querySelector('.main');
  const res = await fetch(API + '/api/tk/admin/siparisler', {headers:{'Authorization':'Bearer '+token}});
  if (res.status === 401) { cikisYap(); return; }
  siparisRowsCache = await res.json();

  const ozelSet = new Set(['numune_revizyon_istendi','beklemede','iptal_edildi']);
  const bitmisSet = new Set(['teslim_edildi','iptal_edildi']);
  const simdi = Date.now();
  const yediGunOnce = simdi - 7*24*60*60*1000;
  const onDortGunOnce = simdi - 14*24*60*60*1000;
  const besGunOnce = simdi - 5*24*60*60*1000;
  const buHaftaKayitlar = siparisRowsCache.filter(r => new Date(r.olusturulma).getTime() >= yediGunOnce);
  const gecenHaftaKayitlar = siparisRowsCache.filter(r => { const t = new Date(r.olusturulma).getTime(); return t >= onDortGunOnce && t < yediGunOnce; });
  // Trend rozeti SADECE gerçekten karşılaştırılabilir veri varsa (geçen hafta en az
  // 1 kayıt) gösteriliyor — yoksa uydurma bir yüzde göstermek yerine rozeti hiç basmıyoruz.
  const haftaTrend = gecenHaftaKayitlar.length > 0
    ? Math.round(((buHaftaKayitlar.length - gecenHaftaKayitlar.length) / gecenHaftaKayitlar.length) * 100)
    : null;
  const stats = {
    toplam: siparisRowsCache.length,
    aktif: siparisRowsCache.filter(r => r.durum !== 'teslim_edildi' && !ozelSet.has(r.durum)).length,
    ozel: siparisRowsCache.filter(r => ozelSet.has(r.durum)).length,
    buHafta: buHaftaKayitlar.length,
    gecenHafta: gecenHaftaKayitlar.length,
    haftaTrend,
    geciken: siparisRowsCache.filter(r => !bitmisSet.has(r.durum) && r.guncellenme && new Date(r.guncellenme).getTime() < besGunOnce).length,
  };

  let html = `<div class="breadcrumb">Genel <i class="bi bi-chevron-right"></i> Siparişler</div>
  <div class="page-head">
    <div><h1>Siparişler</h1><p>${siparisRowsCache.length} sipariş listeleniyor — talepten teslimata tüm süreç.</p></div>
    <div class="page-head-actions">
      <button class="btn-outline" onclick="csvIndir(siparisRowsCache, ['siparis_no','urun_aciklamasi','miktar','durum','olusturulma'], 'siparisler.csv')">⬇ Dışa Aktar</button>
      <button class="btn-dark" onclick="view='yeni-siparis'; render();">＋ Yeni Sipariş</button>
    </div>
  </div>
  <div class="stat-grid">
    ${statCard('<i class="bi bi-box-seam"></i>', 'Toplam Sipariş', stats.toplam, 'tüm zamanlar', null, null, 'blue')}
    ${statCard('<i class="bi bi-gear-wide-connected"></i>', 'Aktif Süreçte', stats.aktif, 'devam eden sipariş', null, null, 'purple')}
    ${statCard('<i class="bi bi-exclamation-triangle"></i>', 'Dikkat Gerektiren', stats.ozel, 'beklemede / revizyon / iptal', stats.ozel > 0 ? 'bad' : null, null, 'orange')}
    ${statCard('<i class="bi bi-calendar-week"></i>', 'Bu Hafta', stats.buHafta, 'geçen hafta: ' + stats.gecenHafta, null, stats.haftaTrend, 'indigo')}
    ${statCard('<i class="bi bi-hourglass-split"></i>', 'Gecikme Riski', stats.geciken, '5+ gündür aynı aşamada', stats.geciken > 0 ? 'bad' : 'good', null, 'red')}
  </div>
  <div class="chart-row">${alanGrafigi(siparisRowsCache)}${barGrafigi(siparisRowsCache)}${tamamlanmaHalkasi(siparisRowsCache)}</div>
  <div id="siparisListe"></div>
  <div class="filter-row">
    <input id="filtreArama" placeholder="Sipariş no, müşteri, firma veya ürün ara..." oninput="siparisSayfa=1; siparisListesiCiz()">
    <select id="filtreDurum" onchange="siparisSayfa=1; siparisListesiCiz()">
      <option value="">Tüm durumlar</option>
      <optgroup label="Ana Akış">${DURUMLAR.map(([k,a]) => `<option value="${k}">${a}</option>`).join('')}</optgroup>
      <optgroup label="Özel Durumlar">${OZEL_DURUMLAR.map(([k,a]) => `<option value="${k}">${a}</option>`).join('')}</optgroup>
    </select>
  </div>
  <div id="siparisTablo"></div>`;
  main.innerHTML = html;
  siparisListesiCiz();
}

let siparisSayfa = 1;
const SIPARIS_SAYFA_BOYU = 8;

function siparisListesiCiz() {
  const kutu = document.getElementById('siparisTablo');
  if (!kutu) return;
  const arama = (document.getElementById('filtreArama').value || '').toLowerCase().trim();
  const durumFiltre = document.getElementById('filtreDurum').value;
  const tumRows = siparisRowsCache.filter(r => {
    if (durumFiltre && r.durum !== durumFiltre) return false;
    if (!arama) return true;
    return [r.siparis_no, r.musteri, r.firma, r.email, r.urun_aciklamasi].some(v => (v||'').toLowerCase().includes(arama));
  });
  if (tumRows.length === 0) {
    kutu.innerHTML = '<div class="empty-state">Kriterlere uyan sipariş yok.</div>';
    return;
  }
  const toplamSayfa = Math.max(1, Math.ceil(tumRows.length / SIPARIS_SAYFA_BOYU));
  if (siparisSayfa > toplamSayfa) siparisSayfa = toplamSayfa;
  const bas = (siparisSayfa - 1) * SIPARIS_SAYFA_BOYU;
  const rows = tumRows.slice(bas, bas + SIPARIS_SAYFA_BOYU);
  let html = '<div class="table-card"><div class="table-wrap"><table><thead><tr><th>Sipariş No</th><th>Müşteri</th><th>Ürün</th><th>Durum</th><th>Tarih</th></tr></thead><tbody>';
  rows.forEach(r => {
    const baslar = (r.musteri || '?').trim().charAt(0).toUpperCase();
    const [avBg, avFg] = avatarRengi(r.musteri || r.email || '?');
    html += `<tr onclick="aktifSiparisNo='${r.siparis_no}'; view='detay'; render();">
      <td class="siparis-no">${r.siparis_no} <span onclick="kopyala('${r.siparis_no}', event)" title="Kopyala" style="cursor:pointer; opacity:.4; font-size:11px;"><i class="bi bi-copy"></i></span></td>
      <td><div class="row-cust"><div class="av" style="background:${avBg}; color:${avFg};">${baslar}</div><div>${r.musteri}${r.firma ? ' <span style=\"color:var(--text-muted); font-weight:400;\">('+r.firma+')</span>' : ''}<br><a href="mailto:${r.email}" onclick="event.stopPropagation()" style="color:var(--text-muted); font-size:12px; text-decoration:none;">${r.email}</a></div></div></td>
      <td>${r.urun_aciklamasi}</td>
      <td><span class="pill ${durumRenkSinifi(r.durum)}">${r.durum_adi}</span></td>
      <td style="font-variant-numeric:tabular-nums; color:var(--text-muted);">${new Date(r.olusturulma).toLocaleDateString('tr-TR', {day:'2-digit', month:'short', year:'numeric'})}</td>
    </tr>`;
  });
  html += '</tbody></table></div>';
  html += `<div class="pagination">
    <span>${tumRows.length} kayıttan ${bas+1}-${Math.min(bas+SIPARIS_SAYFA_BOYU, tumRows.length)} arası gösteriliyor</span>
    <div class="pagination-btns">
      <button ${siparisSayfa<=1?'disabled':''} onclick="siparisSayfa--; siparisListesiCiz();"><i class="bi bi-chevron-left"></i></button>
      <span class="pagination-sayfa">Sayfa ${siparisSayfa} / ${toplamSayfa}</span>
      <button ${siparisSayfa>=toplamSayfa?'disabled':''} onclick="siparisSayfa++; siparisListesiCiz();"><i class="bi bi-chevron-right"></i></button>
    </div>
  </div></div>`;
  html += `<div style="margin-top:16px;"><button class="secondary" onclick="csvIndir(siparisRowsCache, ['siparis_no','musteri','firma','email','urun_aciklamasi','durum_adi','olusturulma'], 'siparisler.csv')">⬇ CSV Olarak İndir</button></div>`;
  kutu.innerHTML = html;
}

async function siparisOlustur() {
  const mod = document.getElementById('ysMusteriMod').value;
  const errBox = document.getElementById('ysErr');
  const basariBox = document.getElementById('ysBasari');
  errBox.textContent = ''; basariBox.innerHTML = '';
  const body = {
    urun_aciklamasi: document.getElementById('ysUrun').value.trim(),
    miktar: document.getElementById('ysMiktar').value.trim() || null,
    hedef_fiyat: document.getElementById('ysFiyat').value.trim() || null,
    baslangic_durumu: document.getElementById('ysDurum').value,
  };
  if (mod === 'mevcut') {
    const id = document.getElementById('ysMusteriId').value;
    if (!id) { errBox.textContent = 'Bir müşteri seçin veya "Yeni müşteri" seçeneğini kullanın.'; return; }
    body.musteri_id = parseInt(id, 10);
  } else {
    body.yeni_ad_soyad = document.getElementById('ysAd').value.trim();
    body.yeni_firma = document.getElementById('ysFirma').value.trim() || null;
    body.yeni_email = document.getElementById('ysEmail').value.trim();
    body.yeni_telefon = document.getElementById('ysTel').value.trim() || null;
    if (!body.yeni_ad_soyad || !body.yeni_email) { errBox.textContent = 'Yeni müşteri için ad soyad ve e-posta zorunlu.'; return; }
  }
  if (!body.urun_aciklamasi) { errBox.textContent = 'Ürün açıklaması zorunlu.'; return; }
  try {
    const res = await fetch(API + '/api/tk/admin/siparis-olustur', {
      method:'POST', headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},
      body: JSON.stringify(body)
    });
    if (!res.ok) { const d = await res.json(); errBox.textContent = d.detail || 'Bir hata oluştu'; return; }
    const d = await res.json();
    if (d.gecici_sifre) {
      basariBox.innerHTML = `<div class="panel" style="border-color:var(--accent2); background:color-mix(in srgb, var(--accent2) 8%, transparent); margin-bottom:16px;">
        <b>${d.siparis_no}</b> oluşturuldu. Yeni müşteri hesabı açıldı — geçici şifre: <b style="font-family:var(--font-code);">${d.gecici_sifre}</b><br>
        <span style="font-size:12.5px; color:var(--text-muted);">Bu şifreyi müşteriye iletin, panelinize giriş yaptıktan sonra bir daha gösterilmeyecek.</span>
      </div>`;
    } else {
      aktifSiparisNo = d.siparis_no; view = 'detay'; render(); return;
    }
  } catch (e) { errBox.textContent = 'Bağlantı hatası'; }
}

async function detayYukle(siparisNo) {
  const main = document.querySelector('.main');
  const res = await fetch(API + '/api/tk/siparis/' + encodeURIComponent(siparisNo), {headers:{'Authorization':'Bearer '+token}});
  const d = await res.json();
  let durumOpts = '<optgroup label="Ana Akış">' + DURUMLAR.map(([k,a]) => `<option value="${k}" ${k===d.durum?'selected':''}>${a}</option>`).join('') + '</optgroup>'
    + '<optgroup label="Özel Durumlar">' + OZEL_DURUMLAR.map(([k,a]) => `<option value="${k}" ${k===d.durum?'selected':''}>${a}</option>`).join('') + '</optgroup>';

  // Ana akışta sıradaki aşama — admin tek tıkla ilerletebilsin diye. Özel bir
  // durumdaysa (ör. beklemede) veya zaten son aşamadaysa "ilerlet" butonu
  // gösterilmiyor, sadece aşağıdaki serbest seçim kutusu kullanılıyor.
  const suankiIdx = DURUMLAR.findIndex(([k]) => k === d.durum);
  const siradaki = (suankiIdx >= 0 && suankiIdx < DURUMLAR.length - 1) ? DURUMLAR[suankiIdx + 1] : null;
  const onceki = (suankiIdx > 0) ? DURUMLAR[suankiIdx - 1] : null;
  const ilerlemeYuzde = suankiIdx >= 0 ? Math.round(((suankiIdx + 1) / DURUMLAR.length) * 100) : null;

  // Sevkiyat & Gemi Takibi formu her aşamada gereksiz yere görünmesin diye
  // sadece "sevkiyat belgeleri hazırlanıyor" ile "gümrükte muayene" arasında
  // (konteynere yükleme, gemi, gümrük süreci) gösteriliyor — daha önceki
  // aşamalarda (talep/numune/üretim) veya sonrasında (teslim edildi) alakasız.
  // Zaten sevkiyat bilgisi girilmiş bir siparişte, aşama ne olursa olsun
  // (ör. teslim edildi) veriyi görüp düzenleyebilsin diye yine gösteriliyor.
  const sevkiyatBasIdx = DURUMLAR.findIndex(([k]) => k === 'sevkiyat_belgeleri_hazirlaniyor');
  const sevkiyatBitIdx = DURUMLAR.findIndex(([k]) => k === 'gumruk_muayene');
  const sevkiyatSuAsamaDaMi = suankiIdx >= sevkiyatBasIdx && suankiIdx <= sevkiyatBitIdx;
  const sevkiyatVeriVarMi = d.sevkiyat && (d.sevkiyat.gemi_adi || d.sevkiyat.tasiyici_firma || d.sevkiyat.konteyner_no);
  const sevkiyatPaneliHtml = (!sevkiyatSuAsamaDaMi && !sevkiyatVeriVarMi) ? '' : `<div class="panel">
      <h2>Sevkiyat &amp; Gemi Takibi</h2>
      <p style="color:var(--text-muted); font-size:13px; margin:0 0 14px;">Bu bilgiler girilince müşteri panelinde taşıyıcı takip linki ve VesselFinder araması otomatik görünür.</p>
      <div class="row2">
        <div>
          <label>Taşıyıcı (kayıtlı — konşimento no otomatik dolar)</label>
          <select id="sTasiyiciKey" onchange="document.getElementById('sTasiyiciDiger').style.display = this.value==='diger' ? 'block' : 'none'; konteynerOnizlemeGuncelle();">
            <option value="">— Seçilmedi —</option>
            ${TASIYICILAR.map(([k,a]) => `<option value="${k}" ${d.sevkiyat?.tasiyici_key===k?'selected':''}>${a}</option>`).join('')}
            <option value="diger" ${(!d.sevkiyat?.tasiyici_key && d.sevkiyat?.tasiyici_firma) ? 'selected' : ''}>Diğer / listede yok</option>
          </select>
        </div>
        <div><label>Gemi adı</label><input id="sGemi" placeholder="ör. MSC ISTANBUL" value="${d.sevkiyat?.gemi_adi || ''}"></div>
      </div>
      <div id="sTasiyiciDiger" style="display:${(!d.sevkiyat?.tasiyici_key && d.sevkiyat?.tasiyici_firma) ? 'block' : 'none'};">
        <label>Taşıyıcı adı (serbest metin)</label>
        <input id="sTasiyici" placeholder="ör. Yang Ming" value="${(!d.sevkiyat?.tasiyici_key && d.sevkiyat?.tasiyici_firma) ? d.sevkiyat.tasiyici_firma : ''}">
      </div>
      <div class="row2">
        <div><label>Sefer no (opsiyonel)</label><input id="sSefer" value="${d.sevkiyat?.sefer_no || ''}"></div>
        <div><label>Konşimento no (B/L)</label><input id="sKonsimento" value="${d.sevkiyat?.konsimento_no || ''}"></div>
      </div>
      <label>Konteyner no (opsiyonel — girilirse müşteri panelinde ayrı bir "Konteyner Takibi" butonu görünür)</label>
      <input id="sKonteyner" placeholder="ör. MSCU1234567" value="${d.sevkiyat?.konteyner_no || ''}" oninput="konteynerOnizlemeGuncelle()">
      <div id="sKonteynerOnizleme" style="margin:-10px 0 16px; font-size:12.5px;"></div>
      <label>Taşıyıcı takip linki — SADECE bu sevkiyat için taşıyıcıdan gerçekten aldığınız link varsa girin (girilirse yukarıdaki kayıtlı taşıyıcı otomatik linkinin önüne geçer)</label>
      <input id="sUrl" placeholder="https://www.maersk.com/tracking/..." value="${d.sevkiyat?.tasiyici_takip_url || ''}">
      <button class="primary" onclick="sevkiyatGuncelle('${d.siparis_no}')">Sevkiyat Bilgisini Kaydet</button>
    </div>`;

  main.innerHTML = `
    <div class="breadcrumb">Genel <i class="bi bi-chevron-right"></i> Siparişler <i class="bi bi-chevron-right"></i> ${d.siparis_no}</div>
    <button class="back" onclick="view='liste'; render();">← Listeye dön</button>
    <div class="panel">
      <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:16px; flex-wrap:wrap;">
        <div>
          <h2>${d.siparis_no}</h2>
          <div class="meta" style="margin-bottom:0;">${d.urun_aciklamasi} · ${d.miktar||'—'}</div>
        </div>
        <span class="pill ${durumRenkSinifi(d.durum)}" style="font-size:12.5px; padding:6px 14px;">${d.durum_adi}</span>
      </div>
      ${ilerlemeYuzde !== null ? `
        <div style="height:6px; border-radius:6px; background:var(--bg-alt); overflow:hidden; margin:16px 0 6px;">
          <div style="height:100%; width:${ilerlemeYuzde}%; background:linear-gradient(90deg, var(--accent2), var(--accent));"></div>
        </div>
        <div style="font-size:11.5px; color:var(--text-muted); font-variant-numeric:tabular-nums;">${suankiIdx+1}/${DURUMLAR.length} aşama · %${ilerlemeYuzde}</div>
      ` : ''}
    </div>
    <div class="panel">${adimTakipcisi(d.durum)}</div>
    <div class="panel">
      <div style="display:flex; gap:10px; flex-wrap:wrap;">
        ${onceki ? `
          <div class="faz-nav-card">
            <div class="faz-nav-label"><i class="bi bi-arrow-left"></i> Önceki Aşama</div>
            <div class="faz-nav-ad">${onceki[1]}</div>
            <button class="secondary" style="width:100%;" onclick="ilerlet('${d.siparis_no}','${onceki[0]}')">Bu Aşamaya Geri Al</button>
          </div>
        ` : '<div class="faz-nav-card" style="display:flex; align-items:center; justify-content:center; color:var(--text-muted); font-size:13px;">İlk aşamadasınız</div>'}
        ${siradaki ? `
          <div class="faz-nav-card" style="background:color-mix(in srgb, var(--accent2) 6%, var(--bg-alt)); border-color:color-mix(in srgb, var(--accent2) 25%, var(--border));">
            <div class="faz-nav-label" style="color:var(--accent2);">Sıradaki Aşama <i class="bi bi-arrow-right"></i></div>
            <div class="faz-nav-ad">${siradaki[1]}</div>
            <button class="primary" style="width:100%;" onclick="ilerlet('${d.siparis_no}','${siradaki[0]}')">Bu Aşamaya İlerlet</button>
          </div>
        ` : `<div class="faz-nav-card" style="display:flex; align-items:center; justify-content:center; gap:8px; color:var(--good); font-weight:700; font-size:13.5px;"><i class="bi bi-check-circle"></i> Son aşamada</div>`}
      </div>
    </div>
    <div class="panel">
      <div class="stat-ico-badge tone-orange" style="margin-bottom:10px;"><i class="bi bi-lock"></i></div>
      <h2 style="font-size:16px;">İç Not <span style="font-weight:400; font-size:12px; color:var(--text-muted); text-transform:none; letter-spacing:0;">— sadece ekip görür</span></h2>
      <p style="color:var(--text-muted); font-size:13px; margin:0 0 14px;">Müşteri panelinde asla görünmez. Ör. "ödeme gecikmesi yaşadı, takip et", "zor müşteri, dikkatli ol".</p>
      <textarea id="icNot" rows="3" placeholder="Ekip içi not...">${d.ic_not || ''}</textarea>
      <button class="secondary" onclick="icNotKaydet('${d.siparis_no}')">İç Notu Kaydet</button>
    </div>
    <div class="panel">
      <h2 style="font-size:16px;">Durumu Elle Ayarla</h2>
      <p style="color:var(--text-muted); font-size:13px; margin:0 0 14px;">Bir aşama geri almak, atlamak veya özel bir duruma (beklemede, iptal, revizyon) almak için kullanın.</p>
      <label>Durum</label>
      <select id="durumSec">${durumOpts}</select>
      <label>Not (opsiyonel)</label>
      <textarea id="durumNot" rows="2"></textarea>
      <button class="primary" onclick="durumGuncelle('${d.siparis_no}')">Durumu Kaydet</button>
    </div>
    ${sevkiyatPaneliHtml}
    <div class="panel">
      <h2>Belge Ekle</h2>
      <p style="color:var(--text-muted); font-size:13px; margin:0 0 14px;">Sürecin herhangi bir aşamasında PDF veya JPG olarak belge ekleyebilirsiniz — konşimento, fatura, çeki listesi, numune/QC raporu, gümrük beyannamesi vb.</p>
      <div class="row2">
        <div>
          <label>Belge tipi</label>
          <select id="belgeTipi" onchange="document.getElementById('belgeTipiDiger').style.display = this.value==='diger' ? 'block' : 'none';">
            <option value="Konşimento (B/L)">Konşimento (B/L)</option>
            <option value="Ticari Fatura">Ticari Fatura</option>
            <option value="Çeki Listesi">Çeki Listesi (Packing List)</option>
            <option value="Menşe Şehadetnamesi">Menşe Şehadetnamesi</option>
            <option value="Numune / QC Raporu">Numune / QC Raporu</option>
            <option value="Gümrük Beyannamesi">Gümrük Beyannamesi</option>
            <option value="diger">Diğer</option>
          </select>
        </div>
        <div><label>Dosya (PDF veya JPG)</label><input id="belgeDosya" type="file" accept=".pdf,.jpg,.jpeg,.png"></div>
      </div>
      <div id="belgeTipiDiger" style="display:none;"><label>Belge tipi (serbest metin)</label><input id="belgeTipiOzel" placeholder="ör. Sigorta poliçesi"></div>
      <label>Açıklama (opsiyonel)</label><input id="belgeAciklama">
      <button class="primary" onclick="belgeEkle('${d.siparis_no}')" id="belgeEkleBtn">Belgeyi Yükle</button>
    </div>
    <div class="panel">
      <h2>Mevcut Belgeler</h2>
      ${d.belgeler.length ? d.belgeler.map(b => `<div class="liste-satir"><div><div class="liste-baslik">${b.dosya_adi}</div><div class="liste-alt">${b.belge_tipi}${b.yukleyen_email ? ' · ' + b.yukleyen_email : ''}</div></div><a href="${b.dosya_url}" target="_blank" style="color:var(--accent-ink); font-weight:600; font-size:13px; text-decoration:none;">İndir →</a></div>`).join('') : '<span style="color:var(--text-muted); font-size:14px;">Henüz belge yok.</span>'}
    </div>
    <div class="panel">
      <h2>Durum Geçmişi</h2>
      ${d.gecmis.slice().reverse().map(g => `<div class="gecmis-satir">
        <div class="durum">${g.durum_adi}</div>
        ${g.not_metni ? `<div class="not">${g.not_metni}</div>` : ''}
        <div class="meta">${new Date(g.tarih).toLocaleString('tr-TR')}${g.degistiren_email ? ' · ' + g.degistiren_email : ''}</div>
      </div>`).join('')}
    </div>
  `;
  konteynerOnizlemeGuncelle();
}

// Backend'deki CARRIER_REGISTRY ile birebir aynı — admin taşıyıcı seçince/
// konteyner no girince, müşteri panelinde çıkacak GERÇEK linki burada canlı
// önizleme olarak görsün. Üç kademe: 1) konteyner no'yu otomatik dolduran
// doğrulanmış deep-link  2) doğrulanmamışsa taşıyıcının KENDİ resmi takip
// sayfası (3. parti site değil)  3) taşıyıcı hiç kayıtlı değilse track-trace.com.
const KONTEYNER_DEEPLINK = {
  maersk: no => `https://www.maersk.com/tracking/${encodeURIComponent(no)}`,
  cosco: no => `https://elines.coscoshipping.com/ebusiness/cargoTracking?trackingType=CONTAINER&number=${encodeURIComponent(no)}`,
  one: no => `https://ecomm.one-line.com/one-ecom/manage-shipment/cargo-tracking?ctrack-field=${encodeURIComponent(no)}&trakNoParam=${encodeURIComponent(no)}`,
};
const KONTEYNER_HOMEPAGE = {
  msc: 'https://www.msc.com/tr/track-a-shipment',
  cma_cgm: 'https://www.cma-cgm.com/ebusiness/tracking',
  hapag_lloyd: 'https://www.hapag-lloyd.com/en/online-business/track/track-by-booking-solution.html',
};
// Otomatik-dolan taşıyıcılarda konteyner no henüz girilmemişken gösterilecek
// genel (boş) takip sayfası — no girilince yukarıdaki KONTEYNER_DEEPLINK devreye girer.
const KONTEYNER_HOMEPAGE_ALT = {
  maersk: 'https://www.maersk.com/tracking',
  cosco: 'https://elines.coscoshipping.com/ebusiness/cargoTracking',
  one: 'https://ecomm.one-line.com/one-ecom/manage-shipment/cargo-tracking',
};
function konteynerOnizlemeGuncelle() {
  const kutu = document.getElementById('sKonteynerOnizleme');
  if (!kutu) return;
  const key = document.getElementById('sTasiyiciKey')?.value;
  const no = document.getElementById('sKonteyner')?.value.trim();
  const firmaAdi = TASIYICILAR.find(t=>t[0]===key)?.[1] || key;
  // Konteyner no henüz girilmemiş olsa bile, taşıyıcı seçilir seçilmez altında
  // o firmanın linki görünsün (konteyner no varsa otomatik dolu, yoksa firmanın
  // genel takip sayfası) — "acenteyi seçtiğim gibi link gelsin" isteği bu.
  if (!key) { kutu.innerHTML = ''; return; }
  if (KONTEYNER_DEEPLINK[key]) {
    const url = no ? KONTEYNER_DEEPLINK[key](no) : KONTEYNER_HOMEPAGE_ALT[key];
    const etiket = no ? 'konteyner no otomatik dolu' : 'konteyner no girilince otomatik dolacak';
    kutu.innerHTML = `<i class="bi bi-link-45deg"></i> Müşteriye gösterilecek link (${etiket}, ${firmaAdi}): <a href="${url}" target="_blank" style="color:var(--accent2);">${url}</a>`;
  } else if (KONTEYNER_HOMEPAGE[key]) {
    const url = KONTEYNER_HOMEPAGE[key];
    kutu.innerHTML = `<i class="bi bi-link-45deg"></i> Müşteriye gösterilecek link (${firmaAdi} resmi takip sayfası — bu firma için otomatik doldurma doğrulanamadı, konteyner no'yu müşteri sayfada kendisi girer): <a href="${url}" target="_blank" style="color:var(--accent2);">${url}</a>`;
  } else {
    // "Diğer" (sistemde kayıtlı olmayan bir taşıyıcı elle girildiğinde) ya da
    // eşleşmeyen bir key — konteyner no yoksa bile genel arama sayfasına gider,
    // no varsa doğrudan o numarayla aratır.
    const url = no
      ? `https://www.track-trace.com/container?number=${encodeURIComponent(no)}`
      : `https://www.track-trace.com/container`;
    const kaynakEtiketi = key === 'diger' ? 'Diğer / sistemde kayıtlı olmayan taşıyıcı' : (firmaAdi + ' kayıtlı bir taşıyıcı değil');
    kutu.innerHTML = `<i class="bi bi-link-45deg"></i> Müşteriye gösterilecek link (genel konteyner arama, ${kaynakEtiketi}): <a href="${url}" target="_blank" style="color:var(--accent2);">${url}</a>`;
  }
}

async function sevkiyatGuncelle(siparisNo) {
  const secilenKey = document.getElementById('sTasiyiciKey').value;
  const body = {
    tasiyici_key: (secilenKey && secilenKey !== 'diger') ? secilenKey : null,
    tasiyici_firma: secilenKey === 'diger' ? (document.getElementById('sTasiyici').value.trim() || null) : null,
    gemi_adi: document.getElementById('sGemi').value.trim() || null,
    sefer_no: document.getElementById('sSefer').value.trim() || null,
    konsimento_no: document.getElementById('sKonsimento').value.trim() || null,
    konteyner_no: document.getElementById('sKonteyner').value.trim() || null,
    tasiyici_takip_url: document.getElementById('sUrl').value.trim() || null,
  };
  await fetch(API + '/api/tk/admin/siparis/' + encodeURIComponent(siparisNo) + '/sevkiyat', {
    method:'POST', headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},
    body: JSON.stringify(body)
  });
  detayYukle(siparisNo);
}

async function icNotKaydet(siparisNo) {
  const ic_not = document.getElementById('icNot').value.trim() || null;
  await fetch(API + '/api/tk/admin/siparis/' + encodeURIComponent(siparisNo) + '/ic-not', {
    method:'POST', headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},
    body: JSON.stringify({ic_not})
  });
}

async function ilerlet(siparisNo, durum) {
  await fetch(API + '/api/tk/admin/siparis/' + encodeURIComponent(siparisNo) + '/durum', {
    method:'POST', headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},
    body: JSON.stringify({durum, not_metni: null})
  });
  detayYukle(siparisNo);
}

async function durumGuncelle(siparisNo) {
  const durum = document.getElementById('durumSec').value;
  const not_metni = document.getElementById('durumNot').value.trim() || null;
  await fetch(API + '/api/tk/admin/siparis/' + encodeURIComponent(siparisNo) + '/durum', {
    method:'POST', headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},
    body: JSON.stringify({durum, not_metni})
  });
  detayYukle(siparisNo);
}

async function belgeEkle(siparisNo) {
  const secilenTip = document.getElementById('belgeTipi').value;
  const belge_tipi = secilenTip === 'diger' ? document.getElementById('belgeTipiOzel').value.trim() : secilenTip;
  const dosyaInput = document.getElementById('belgeDosya');
  const dosya = dosyaInput.files[0];
  const aciklama = document.getElementById('belgeAciklama').value.trim() || null;
  if (!belge_tipi || !dosya) { alert('Belge tipi ve dosya seçimi zorunlu.'); return; }
  const btn = document.getElementById('belgeEkleBtn');
  btn.disabled = true; btn.textContent = 'Yükleniyor...';
  const form = new FormData();
  form.append('dosya', dosya);
  form.append('belge_tipi', belge_tipi);
  if (aciklama) form.append('aciklama', aciklama);
  try {
    const res = await fetch(API + '/api/tk/admin/siparis/' + encodeURIComponent(siparisNo) + '/belge-yukle', {
      method:'POST', headers:{'Authorization':'Bearer '+token}, body: form
    });
    if (!res.ok) { const e = await res.json().catch(()=>({})); alert('Yükleme başarısız: ' + (e.detail||res.status)); return; }
  } finally {
    btn.disabled = false; btn.textContent = 'Belgeyi Yükle';
  }
  detayYukle(siparisNo);
}

function initTheme() {
  const root = document.documentElement;
  const buttons = document.querySelectorAll('#themeToggle button');
  function apply(mode) {
    if (mode === 'light') root.setAttribute('data-theme', 'light');
    else if (mode === 'dark') root.setAttribute('data-theme', 'dark');
    else root.removeAttribute('data-theme');
    buttons.forEach(b => b.classList.toggle('active', b.dataset.mode === mode));
  }
  const saved = localStorage.getItem('tema') || 'system';
  apply(saved);
  buttons.forEach(b => b.addEventListener('click', () => { localStorage.setItem('tema', b.dataset.mode); apply(b.dataset.mode); }));
}

render();
</script>
