<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 40 40%22><rect width=%2240%22 height=%2240%22 rx=%229%22 fill=%22%230f3d63%22/><ellipse cx=%2220%22 cy=%2220%22 rx=%2214%22 ry=%227%22 fill=%22none%22 stroke=%22%23ffffff%22 stroke-opacity=%220.16%22 stroke-width=%221%22/><ellipse cx=%2220%22 cy=%2220%22 rx=%227%22 ry=%2214%22 fill=%22none%22 stroke=%22%23ffffff%22 stroke-opacity=%220.16%22 stroke-width=%221%22/><path d=%22M9,28 C15,24 25,16 31,12%22 fill=%22none%22 stroke=%22%23d99a2b%22 stroke-width=%222%22 stroke-linecap=%22round%22 stroke-dasharray=%220.5 4.2%22/><circle cx=%229%22 cy=%2228%22 r=%222.6%22 fill=%22%23ffffff%22/><circle cx=%2231%22 cy=%2212%22 r=%222.6%22 fill=%22%23d99a2b%22/></svg>">
<title>Admin — Çin Tedarik Ağı</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    /* Marka paleti — ithalat/ihracat/lojistik sektörünün tanıdık dili: koyu lacivert + amber/sarı vurgu (TransitFlow ve benzeri profesyonel lojistik temalarından esinlenildi) */
    --bg:#f5f6f8; --bg-alt:#eaedf2; --surface:#ffffff; --text:#0b1f38; --text-muted:#5b6b80;
    --accent:#d99a2b; --accent-ink:#a8721a; --accent2:#0f3d63; --accent2-ink:#0a2c47;
    --signal:#c0392b; --signal-ink:#96271b; --border:#dbe0e8;
    --font-display: "Inter",-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    --font-body: "Inter",-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    --font-code: "IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0b1420; --bg-alt:#101c2c; --surface:#132132; --text:#e8edf3; --text-muted:#93a3b8;
      --accent:#e8b355; --accent-ink:#f3c878; --accent2:#4f8fc0; --accent2-ink:#7ab3dd;
      --signal:#e2725f; --signal-ink:#f0a08e; --border:#233246;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0b1420; --bg-alt:#101c2c; --surface:#132132; --text:#e8edf3; --text-muted:#93a3b8;
    --accent:#e8b355; --accent-ink:#f3c878; --accent2:#4f8fc0; --accent2-ink:#7ab3dd;
    --signal:#e2725f; --signal-ink:#f0a08e; --border:#233246;
  }
  *{box-sizing:border-box;}
  body{ margin:0; background:var(--bg); color:var(--text); font-family:var(--font-body); font-size:15px; line-height:1.5; overflow-x:hidden; }
  a{ color:inherit; }

  .theme-toggle{ display:flex; gap:2px; background:var(--bg-alt); border:1px solid var(--border); border-radius:20px; padding:3px; flex:none; }
  .theme-toggle button{ width:auto; border:none; background:transparent; color:var(--text-muted); font-family:var(--font-body); font-size:12px; font-weight:600; padding:5px 10px; border-radius:16px; cursor:pointer; }
  .theme-toggle button.active{ background:var(--accent2); color:#fff; }

  label{ display:block; font-size:11.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-muted); margin-bottom:8px; font-weight:600; line-height:1.4; }
  input, select, textarea{ width:100%; font-size:14.5px; padding:10px 11px; border-radius:6px; border:1px solid var(--border); background:var(--bg); color:var(--text); font-family:inherit; margin-bottom:18px; }
  input:focus, select:focus, textarea:focus{ outline:2px solid var(--accent); outline-offset:1px; }
  button.primary{ background:var(--accent); color:#fff; border:none; padding:10px 18px; border-radius:6px; font-weight:700; font-size:14px; cursor:pointer; }
  button.primary:hover{ background:var(--accent-ink); }
  button.secondary{ background:var(--surface); color:var(--text); border:1px solid var(--border); padding:10px 18px; border-radius:6px; font-weight:700; font-size:14px; cursor:pointer; }
  button.secondary:hover{ border-color:var(--accent); }
  button:disabled{ opacity:.4; cursor:not-allowed; }
  .linklike{ background:none; border:none; color:var(--accent-ink); font-weight:600; cursor:pointer; padding:0; font-size:13px; text-decoration:underline; }
  .err{ color:var(--signal-ink); font-size:13px; margin-bottom:10px; }
  .demo-box{ font-size:13px; line-height:1.5; color:var(--accent2-ink); background:color-mix(in srgb, var(--accent2) 10%, transparent); border:1px solid color-mix(in srgb, var(--accent2) 28%, transparent); border-radius:6px; padding:10px 13px; margin-bottom:16px; }

  .panel-fade{ animation:panelFadeIn .45s cubic-bezier(.2,.7,.3,1); }
  @keyframes panelFadeIn{ from{ opacity:0; filter:blur(6px); transform:translateY(8px); } to{ opacity:1; filter:blur(0); transform:translateY(0); } }
  @media (prefers-reduced-motion: reduce){ .panel-fade{ animation:none; } }
  .row2{ display:grid; grid-template-columns:1fr 1fr; gap:18px; }
  @media (max-width:600px){ .row2{ grid-template-columns:1fr; } }
  h2{ font-family:var(--font-display); font-weight:700; font-size:20px; letter-spacing:-.01em; margin:0 0 10px; }
  .liste-satir{ display:flex; justify-content:space-between; align-items:center; gap:12px; padding:13px 0; border-bottom:1px solid var(--border); }
  .liste-satir:last-child{ border-bottom:none; }
  .liste-baslik{ font-size:14px; font-weight:600; }
  .liste-alt{ font-size:12px; color:var(--text-muted); margin-top:3px; }
  .gecmis-satir{ padding:14px 0; border-bottom:1px solid var(--border); }
  .gecmis-satir:last-child{ border-bottom:none; }
  .gecmis-satir .durum{ font-weight:700; font-size:14.5px; }
  .gecmis-satir .not{ font-size:13.5px; color:var(--text-muted); margin-top:4px; line-height:1.5; }
  .gecmis-satir .meta{ font-family:var(--font-code); font-size:11px; color:var(--text-muted); margin-top:6px; margin-bottom:0; }

  /* ---- Auth screen ---- */
  .auth-wrap{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; position:relative; }
  .auth-wrap .theme-toggle{ position:absolute; top:20px; right:20px; }
  .auth-card{ width:100%; max-width:380px; background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:36px; }
  .auth-card .badge{ display:inline-block; font-family:var(--font-code); font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--accent2-ink); background:color-mix(in srgb, var(--accent2) 12%, transparent); border:1px solid color-mix(in srgb, var(--accent2) 30%, transparent); padding:3px 10px; border-radius:20px; margin-bottom:16px; }
  .auth-card h2{ font-size:24px; margin-bottom:6px; }
  .auth-card .lede{ color:var(--text-muted); font-size:14px; margin:0 0 24px; }

  /* ---- App shell ---- */
  .app-shell{ display:flex; min-height:100vh; align-items:stretch; }
  /* ---- Sidebar: ana sayfadaki koyu lacivert + amber navbar diliyle birebir aynı
     kimlik — kapsül aktif sekme, amber vurgu, beyaz marka yazısı. ---- */
  .sidebar{ width:240px; flex:none; background:linear-gradient(180deg, #0d2138, #0a1c31); border-right:none; padding:26px 16px; display:flex; flex-direction:column; }
  .sidebar .brand{ font-family:var(--font-display); font-weight:800; font-size:16px; text-decoration:none; color:#fff; margin-bottom:2px; padding:0 6px; display:flex; align-items:center; gap:9px; }
  .sidebar .brand svg{ width:26px; height:26px; flex:none; }
  .sidebar .brand-sub{ font-family:var(--font-code); font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:#e8b355; padding:0 6px; margin-bottom:28px; }
  .side-nav{ display:flex; flex-direction:column; gap:3px; }
  .side-nav button{ display:flex; align-items:center; gap:10px; padding:10px 13px; border-radius:22px; font-weight:600; font-size:13.8px; color:rgba(255,255,255,.66); cursor:pointer; border:none; background:none; text-align:left; width:100%; font-family:var(--font-body); transition:background .15s, color .15s; }
  .side-nav button:hover{ background:rgba(255,255,255,.08); color:#fff; }
  .side-nav button.active{ background:#e8b355; color:#0a1c31; }
  .side-nav .ico{ width:18px; text-align:center; flex:none; }
  .sidebar-foot{ margin-top:auto; padding-top:16px; border-top:1px solid rgba(255,255,255,.1); }
  .user-chip{ display:flex; align-items:center; gap:10px; padding:8px 6px; margin-bottom:8px; }
  .user-chip .av{ width:30px; height:30px; border-radius:50%; background:#e8b355; color:#0a1c31; display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-weight:800; font-size:13px; flex:none; }
  .user-chip b{ color:#fff; }
  .user-chip .role{ font-size:11.5px; color:rgba(255,255,255,.5); }
  .sidebar-foot .theme-toggle{ margin-bottom:10px; width:100%; justify-content:center; background:rgba(255,255,255,.06); border-color:rgba(255,255,255,.12); }
  .sidebar-foot .theme-toggle button{ color:rgba(255,255,255,.6); }
  .sidebar-foot .linklike{ color:rgba(255,255,255,.5); }
  .main{ flex:1; padding:40px 44px; max-width:1080px; }
  @media (max-width:820px){
    .app-shell{ flex-direction:column; }
    .sidebar{ width:100%; padding:14px 16px; border-right:none; border-bottom:1px solid var(--border); }
    .sidebar-foot{ margin-top:14px; padding-top:14px; }
    .main{ padding:24px 18px; }
  }

  .panel-head{ display:flex; justify-content:space-between; align-items:flex-start; gap:16px; margin-bottom:22px; flex-wrap:wrap; }
  .stat-grid{ display:grid; grid-template-columns:repeat(5,1fr); gap:1px; background:var(--border); border:1px solid var(--border); border-radius:8px; overflow:hidden; margin-bottom:24px; }
  @media (max-width:960px){ .stat-grid{ grid-template-columns:repeat(3,1fr); } }
  @media (max-width:600px){ .stat-grid{ grid-template-columns:repeat(2,1fr); } }
  .stat-card{ background:var(--surface); padding:18px 20px; border-top:3px solid var(--accent2); }
  .stat-card .v{ font-family:var(--font-code); font-weight:600; font-size:26px; color:var(--accent-ink); }
  .stat-card .l{ font-size:12px; color:var(--text-muted); margin-top:4px; line-height:1.4; }
  .filter-row{ display:flex; gap:12px; margin-bottom:18px; flex-wrap:wrap; }
  .filter-row input{ flex:1; min-width:220px; margin-bottom:0; }
  .filter-row select{ width:auto; min-width:180px; margin-bottom:0; }
  .panel-head p{ color:var(--text-muted); font-size:14px; margin:6px 0 0; }
  .panel{ background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:24px; margin-bottom:20px; }
  .empty-state{ background:var(--surface); border:1px dashed var(--border); border-radius:8px; padding:36px; text-align:center; color:var(--text-muted); }

  .table-card{ background:var(--surface); border:1px solid var(--border); border-radius:8px; overflow:hidden; }
  .table-wrap{ overflow-x:auto; }
  table{ width:100%; border-collapse:collapse; font-size:13.5px; }
  th,td{ text-align:left; padding:12px 16px; border-bottom:1px solid var(--border); white-space:nowrap; }
  th{ font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-muted); font-weight:600; background:var(--bg-alt); }
  tbody tr{ cursor:pointer; transition:background .1s; }
  tbody tr:hover{ background:var(--bg-alt); }
  tbody tr:last-child td{ border-bottom:none; }
  .siparis-no{ font-family:var(--font-code); font-variant-numeric:tabular-nums; font-weight:600; color:var(--accent-ink); }
  .pill{ display:inline-block; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; padding:3px 9px; border-radius:20px; background:color-mix(in srgb, var(--accent2) 12%, transparent); color:var(--accent2-ink); border:1px solid color-mix(in srgb, var(--accent2) 30%, transparent); white-space:nowrap; }
  .back{ background:none; border:none; color:var(--text-muted); font-size:13.5px; cursor:pointer; margin-bottom:16px; padding:0; font-weight:600; }
  .meta{ font-size:13px; color:var(--text-muted); margin-bottom:18px; }
</style>
</head>
<body>
<div id="app"></div>
<script>
const API = '';
let token = localStorage.getItem('tk_admin_token');
let adminEmail = localStorage.getItem('tk_admin_email') || '';
const _siparisParam = new URLSearchParams(location.search).get('siparis');
let view = token ? (_siparisParam ? 'detay' : 'liste') : 'giris';
let aktifSiparisNo = _siparisParam || null;
const DURUMLAR = [
  ['talep_alindi','Talep Alındı'],
  ['fabrika_gorusuluyor','Fabrika Görüşülüyor'],
  ['teklif_hazir','Teklif Hazır'],
  ['numune_odeme_bekleniyor','Numune Ödemesi Bekleniyor'],
  ['numune_uretiliyor','Numune Üretiliyor'],
  ['numune_kalite_kontrolde','Numune Kalite Kontrolünde'],
  ['numune_onayinizi_bekliyor','Numune Onayınızı Bekliyor'],
  ['uretim_odeme_bekleniyor','Üretim Ödemesi Bekleniyor'],
  ['uretimde','Üretimde'],
  ['uretim_kalite_kontrolde','Üretim Kalite Kontrolünde'],
  ['sevkiyat_belgeleri_hazirlaniyor','Sevkiyat Belgeleri Hazırlanıyor'],
  ['konteyner','Konteynere Yüklendi'],
  ['yukleme_odeme_bekleniyor','Yükleme Öncesi Ödeme Bekleniyor'],
  ['gemide','Gemide'],
  ['gumruk_beyanname','Gümrük Beyannamesi Veriliyor'],
  ['gumruk_vergi_odeme','Gümrük Vergisi Ödemesi Bekleniyor'],
  ['gumruk_muayene','Gümrükte Muayene'],
  ['teslimat_yolda','Teslimat İçin Yolda'],
  ['teslim_edildi','Teslim Edildi'],
];
const OZEL_DURUMLAR = [
  ['numune_revizyon_istendi','⚠ Numune Revizyonu İstendi'],
  ['beklemede','⚠ Süreç Beklemede'],
  ['iptal_edildi','✕ İptal Edildi'],
];
// Backend CARRIER_REGISTRY ile birebir aynı (src/tracking_api.py) — sadece
// gerçekten headless tarayıcıyla test edilip doğrulanan taşıyıcılar.
const TASIYICILAR = [
  ['maersk','Maersk'],
  ['cosco','COSCO Shipping'],
  ['msc','MSC'],
  ['cma_cgm','CMA CGM'],
  ['hapag_lloyd','Hapag-Lloyd'],
  ['one','ONE (Ocean Network Express)'],
];

function themeToggleHtml() {
  return `<div class="theme-toggle" id="themeToggle">
    <button data-mode="light">☀</button>
    <button data-mode="dark">☾</button>
    <button data-mode="system">Sis</button>
  </div>`;
}

function render() {
  const app = document.getElementById('app');
  if (view === 'giris') { app.innerHTML = authShell(girisEkrani()); initTheme(); return; }
  app.innerHTML = panelShell('<div class="empty-state">Yükleniyor…</div>', view);
  initTheme();
  if (view === 'liste') listeYukle();
  else if (view === 'detay') detayYukle(aktifSiparisNo);
  else if (view === 'musteriler') musterilerYukle();
  else if (view === 'yeni-siparis') { document.querySelector('.main').innerHTML = yeniSiparisEkrani(); ysMusteriDropdownDoldur(); }
}

function authShell(innerHtml) {
  return `
    <div class="auth-wrap">
      ${themeToggleHtml()}
      <div class="auth-card panel-fade">${innerHtml}</div>
    </div>`;
}

function panelShell(innerHtml, activeView) {
  const initial = (adminEmail || '?').trim().charAt(0).toUpperCase();
  return `
    <div class="app-shell">
      <div class="sidebar">
        <div class="brand"><svg viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="9" fill="#0f3d63"/><ellipse cx="20" cy="20" rx="14" ry="7" fill="none" stroke="#ffffff" stroke-opacity="0.16"/><ellipse cx="20" cy="20" rx="7" ry="14" fill="none" stroke="#ffffff" stroke-opacity="0.16"/><path d="M9,28 C15,24 25,16 31,12" fill="none" stroke="#d99a2b" stroke-width="2" stroke-linecap="round" stroke-dasharray="0.5 4.2"/><circle cx="9" cy="28" r="2.6" fill="#ffffff"/><circle cx="31" cy="12" r="2.6" fill="#d99a2b"/></svg>Çin Tedarik Ağı</div>
        <div class="brand-sub">Admin Paneli</div>
        <div class="side-nav">
          <button class="${activeView==='liste'||activeView==='detay' ? 'active' : ''}" onclick="view='liste'; render();"><span class="ico">📋</span> Siparişler</button>
          <button class="${activeView==='yeni-siparis' ? 'active' : ''}" onclick="view='yeni-siparis'; render();"><span class="ico">＋</span> Yeni Sipariş</button>
          <button class="${activeView==='musteriler' ? 'active' : ''}" onclick="view='musteriler'; render();"><span class="ico">🏢</span> Müşteriler</button>
        </div>
        <div class="sidebar-foot">
          ${themeToggleHtml()}
          <div class="user-chip">
            <div class="av">${initial}</div>
            <div><div style="font-size:13px; font-weight:700;">${adminEmail || 'Admin'}</div><div class="role">Yönetici</div></div>
          </div>
          <button class="linklike" onclick="cikisYap()">Çıkış Yap</button>
        </div>
      </div>
      <div class="main panel-fade">${innerHtml}</div>
    </div>`;
}

function girisEkrani() {
  return `
    <span class="badge">Yalnızca ekip erişimi</span>
    <h2>Admin Girişi</h2>
    <p class="lede">Sipariş durumlarını güncellemek ve belge yüklemek için giriş yapın.</p>
    <div class="demo-box">
      <b>Hızlı test için:</b> Bilgiler otomatik dolduruldu, doğrudan "Giriş Yap"a basabilirsiniz.
    </div>
    <div id="err" class="err"></div>
    <label>E-posta</label><input id="email" type="email" value="ekip@cintedarikagi.com">
    <label>Şifre</label><input id="sifre" type="password" value="ekip1234">
    <button class="primary" style="width:100%;" onclick="girisYap()">Giriş Yap</button>
  `;
}

async function girisYap() {
  const email = document.getElementById('email').value.trim();
  const sifre = document.getElementById('sifre').value;
  const err = document.getElementById('err');
  try {
    const res = await fetch(API + '/api/tk/admin/giris', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({email, sifre})});
    if (!res.ok) { const d = await res.json(); err.textContent = d.detail; return; }
    const d = await res.json();
    token = d.token; localStorage.setItem('tk_admin_token', token);
    adminEmail = email; localStorage.setItem('tk_admin_email', email);
    view = 'liste'; render();
  } catch(e) { err.textContent = 'Bağlantı hatası'; }
}

function cikisYap() {
  localStorage.removeItem('tk_admin_token'); localStorage.removeItem('tk_admin_email');
  token = null; adminEmail = ''; view = 'giris'; render();
}

let siparisRowsCache = [];
let musteriRowsCache = [];

// Basit CSV dışa aktarma — harici kütüphane gerektirmez. Değerlerdeki
// virgül/tırnak/satır sonu CSV kaçış kuralına göre işlenir.
function csvIndir(rows, alanlar, dosyaAdi) {
  const kacir = (v) => {
    const s = (v === null || v === undefined) ? '' : String(v);
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  };
  const satirlar = [alanlar.join(',')].concat(rows.map(r => alanlar.map(a => kacir(r[a])).join(',')));
  const blob = new Blob(['﻿' + satirlar.join('\n')], {type: 'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = dosyaAdi;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function kopyala(metin, event) {
  navigator.clipboard.writeText(metin);
  const el = event.target;
  const eski = el.textContent;
  el.textContent = '✓';
  setTimeout(() => { el.textContent = eski; }, 900);
  if (event) event.stopPropagation();
}

async function listeYukle() {
  const main = document.querySelector('.main');
  const res = await fetch(API + '/api/tk/admin/siparisler', {headers:{'Authorization':'Bearer '+token}});
  if (res.status === 401) { cikisYap(); return; }
  siparisRowsCache = await res.json();

  const ozelSet = new Set(['numune_revizyon_istendi','beklemede','iptal_edildi']);
  const bitmisSet = new Set(['teslim_edildi','iptal_edildi']);
  const yediGunOnce = Date.now() - 7*24*60*60*1000;
  const besGunOnce = Date.now() - 5*24*60*60*1000;
  const stats = {
    toplam: siparisRowsCache.length,
    aktif: siparisRowsCache.filter(r => r.durum !== 'teslim_edildi' && !ozelSet.has(r.durum)).length,
    ozel: siparisRowsCache.filter(r => ozelSet.has(r.durum)).length,
    buHafta: siparisRowsCache.filter(r => new Date(r.olusturulma).getTime() >= yediGunOnce).length,
    geciken: siparisRowsCache.filter(r => !bitmisSet.has(r.durum) && r.guncellenme && new Date(r.guncellenme).getTime() < besGunOnce).length,
  };

  let html = `<div class="panel-head">
    <div><h2>Tüm Siparişler</h2><p>${siparisRowsCache.length} sipariş listeleniyor.</p></div>
    <button class="primary" style="width:auto;" onclick="view='yeni-siparis'; render();">＋ Yeni Sipariş</button>
  </div>
  <div class="stat-grid">
    <div class="stat-card"><div class="v">${stats.toplam}</div><div class="l">Toplam sipariş</div></div>

    <select id="filtreDurum" onchange="siparisListesiCiz()">
      <option value="">Tüm durumlar</option>

function siparisListesiCiz() {
  const kutu = document.getElementById('siparisTablo');
  if (!kutu) return;
  const arama = (document.getElementById('filtreArama').value || '').toLowerCase().trim();
  const durumFiltre = document.getElementById('filtreDurum').value;
  const rows = siparisRowsCache.filter(r => {
    if (durumFiltre && r.durum !== durumFiltre) return false;
    if (!arama) return true;
    return [r.siparis_no, r.musteri, r.firma, r.email, r.urun_aciklamasi].some(v => (v||'').toLowerCase().includes(arama));
  });
  if (rows.length === 0) {
    kutu.innerHTML = '<div class="empty-state">Kriterlere uyan sipariş yok.</div>';
    return;
  }
  let html = '<div class="table-card"><div class="table-wrap"><table><thead><tr><th>Sipariş No</th><th>Müşteri</th><th>Ürün</th><th>Durum</th><th>Tarih</th></tr></thead><tbody>';
  rows.forEach(r => {
    html += `<tr onclick="aktifSiparisNo='${r.siparis_no}'; view='detay'; render();">
      <td class="siparis-no">${r.siparis_no} <span onclick="kopyala('${r.siparis_no}', event)" title="Kopyala" style="cursor:pointer; opacity:.5; font-size:11px;">📋</span></td>
      <td>${r.musteri}${r.firma ? ' ('+r.firma+')' : ''}<br><a href="mailto:${r.email}" onclick="event.stopPropagation()" style="color:var(--text-muted); font-size:12px; text-decoration:none;">✉ ${r.email}</a></td>
      <td>${r.urun_aciklamasi}</td>
      <td><span class="pill" style="${r.durum==='iptal_edildi' ? 'background:color-mix(in srgb, var(--signal) 14%, transparent); color:var(--signal-ink); border-color:color-mix(in srgb, var(--signal) 35%, transparent);' : (['numune_revizyon_istendi','beklemede'].includes(r.durum) ? 'background:color-mix(in srgb, var(--accent) 14%, transparent); color:var(--accent-ink); border-color:color-mix(in srgb, var(--accent) 35%, transparent);' : '')}">${r.durum_adi}</span></td>
      <td style="font-family:var(--font-code); font-variant-numeric:tabular-nums;">${new Date(r.olusturulma).toLocaleDateString('tr-TR')}</td>
    </tr>`;
  });
  html += '</tbody></table></div></div>';
  html += `<div style="margin-top:16px;"><button class="secondary" onclick="csvIndir(siparisRowsCache, ['siparis_no','musteri','firma','email','urun_aciklamasi','durum_adi','olusturulma'], 'siparisler.csv')">⬇ CSV Olarak İndir</button></div>`;
  kutu.innerHTML = html;
}

async function musterilerYukle() {
  const main = document.querySelector('.main');

  if (res.status === 401) { cikisYap(); return; }
  const rows = await res.json();
  let html = `<div class="panel-head"><div><h2>Müşteriler</h2><p>${rows.length} kayıtlı müşteri.</p></div></div>`;
  if (rows.length === 0) {
    html += '<div class="empty-state">Henüz müşteri yok.</div>';

    html += '<div class="table-card"><div class="table-wrap"><table><thead><tr><th>Ad Soyad</th><th>Firma</th><th>İletişim</th><th>Sipariş</th><th>Son sipariş</th></tr></thead><tbody>';
    rows.forEach(m => {

        <td>
          <a href="mailto:${m.email}" style="color:var(--accent-ink); text-decoration:none; font-weight:600;">✉ ${m.email}</a>
          ${m.telefon ? `<br><a href="https://wa.me/${waNo}" target="_blank" rel="noopener" style="color:var(--accent2-ink); text-decoration:none; font-size:12.5px; font-weight:600;">💬 ${m.telefon}</a>` : ''}
        </td>
        <td class="siparis-no">${m.siparis_sayisi}</td>
        <td style="font-family:var(--font-code); font-variant-numeric:tabular-nums;">${m.son_siparis ? new Date(m.son_siparis).toLocaleDateString('tr-TR') : '—'}</td>
      </tr>`;

async function siparisOlustur() {
  const mod = document.getElementById('ysMusteriMod').value;
  const errBox = document.getElementById('ysErr');
  const basariBox = document.getElementById('ysBasari');
  errBox.textContent = ''; basariBox.innerHTML = '';
  const body = {
    urun_aciklamasi: document.getElementById('ysUrun').value.trim(),
    miktar: document.getElementById('ysMiktar').value.trim() || null,
    hedef_fiyat: document.getElementById('ysFiyat').value.trim() || null,
    baslangic_durumu: document.getElementById('ysDurum').value,
  };
  if (mod === 'mevcut') {
    const id = document.getElementById('ysMusteriId').value;
    if (!id) { errBox.textContent = 'Bir müşteri seçin veya "Yeni müşteri" seçeneğini kullanın.'; return; }
    body.musteri_id = parseInt(id, 10);
  } else {
    body.yeni_ad_soyad = document.getElementById('ysAd').value.trim();
    body.yeni_firma = document.getElementById('ysFirma').value.trim() || null;
    body.yeni_email = document.getElementById('ysEmail').value.trim();
    body.yeni_telefon = document.getElementById('ysTel').value.trim() || null;
    if (!body.yeni_ad_soyad || !body.yeni_email) { errBox.textContent = 'Yeni müşteri için ad soyad ve e-posta zorunlu.'; return; }
  }
  if (!body.urun_aciklamasi) { errBox.textContent = 'Ürün açıklaması zorunlu.'; return; }
  try {
    const res = await fetch(API + '/api/tk/admin/siparis-olustur', {
      method:'POST', headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},
      body: JSON.stringify(body)
    });
    if (!res.ok) { const d = await res.json(); errBox.textContent = d.detail || 'Bir hata oluştu'; return; }
    const d = await res.json();
    if (d.gecici_sifre) {
      basariBox.innerHTML = `<div class="panel" style="border-color:var(--accent2); background:color-mix(in srgb, var(--accent2) 8%, transparent); margin-bottom:16px;">
        <b>${d.siparis_no}</b> oluşturuldu. Yeni müşteri hesabı açıldı — geçici şifre: <b style="font-family:var(--font-code);">${d.gecici_sifre}</b><br>
        <span style="font-size:12.5px; color:var(--text-muted);">Bu şifreyi müşteriye iletin, panelinize giriş yaptıktan sonra bir daha gösterilmeyecek.</span>
      </div>`;
    } else {
      aktifSiparisNo = d.siparis_no; view = 'detay'; render(); return;
    }
  } catch (e) { errBox.textContent = 'Bağlantı hatası'; }
}

}

async function icNotKaydet(siparisNo) {
  const ic_not = document.getElementById('icNot').value.trim() || null;
  await fetch(API + '/api/tk/admin/siparis/' + encodeURIComponent(siparisNo) + '/ic-not', {
    method:'POST', headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},
    body: JSON.stringify({ic_not})
  });
}

async function ilerlet(siparisNo, durum) {
  await fetch(API + '/api/tk/admin/siparis/' + encodeURIComponent(siparisNo) + '/durum', {
    method:'POST', headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},

async function belgeEkle(siparisNo) {
  const secilenTip = document.getElementById('belgeTipi').value;
  const belge_tipi = secilenTip === 'diger' ? document.getElementById('belgeTipiOzel').value.trim() : secilenTip;
  const dosyaInput = document.getElementById('belgeDosya');
  const dosya = dosyaInput.files[0];
  const aciklama = document.getElementById('belgeAciklama').value.trim() || null;
  if (!belge_tipi || !dosya) { alert('Belge tipi ve dosya seçimi zorunlu.'); return; }
  const btn = document.getElementById('belgeEkleBtn');
  btn.disabled = true; btn.textContent = 'Yükleniyor...';
  const form = new FormData();
  form.append('dosya', dosya);
  form.append('belge_tipi', belge_tipi);
  if (aciklama) form.append('aciklama', aciklama);
  try {
    const res = await fetch(API + '/api/tk/admin/siparis/' + encodeURIComponent(siparisNo) + '/belge-yukle', {
      method:'POST', headers:{'Authorization':'Bearer '+token}, body: form
    });
    if (!res.ok) { const e = await res.json().catch(()=>({})); alert('Yükleme başarısız: ' + (e.detail||res.status)); return; }
  } finally {
    btn.disabled = false; btn.textContent = 'Belgeyi Yükle';
  }
  detayYukle(siparisNo);
}

function initTheme() {
  const root = document.documentElement;
  const buttons = document.querySelectorAll('#themeToggle button');
  function apply(mode) {
    if (mode === 'light') root.setAttribute('data-theme', 'light');
    else if (mode === 'dark') root.setAttribute('data-theme', 'dark');
    else root.removeAttribute('data-theme');
    buttons.forEach(b => b.classList.toggle('active', b.dataset.mode === mode));
  }
  const saved = localStorage.getItem('tema') || 'system';
  apply(saved);
  buttons.forEach(b => b.addEventListener('click', () => { localStorage.setItem('tema', b.dataset.mode); apply(b.dataset.mode); }));
}

render();
</script>
