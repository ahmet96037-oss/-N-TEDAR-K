async function listeYukle() {
  const main = document.querySelector('.main');
  const res = await fetch(API + '/api/tk/admin/siparisler', {headers:{'Authorization':'Bearer '+token}});
  if (res.status === 401) { cikisYap(); return; }
  siparisRowsCache = await res.json();

  const ozelSet = new Set(['numune_revizyon_istendi','beklemede','iptal_edildi']);
  const bitmisSet = new Set(['teslim_edildi','iptal_edildi']);
  const simdi = Date.now();
  const yediGunOnce = simdi - 7*24*60*60*1000;
  const onDortGunOnce = simdi - 14*24*60*60*1000;
  const besGunOnce = simdi - 5*24*60*60*1000;
  const buHaftaKayitlar = siparisRowsCache.filter(r => new Date(r.olusturulma).getTime() >= yediGunOnce);
  const gecenHaftaKayitlar = siparisRowsCache.filter(r => { const t = new Date(r.olusturulma).getTime(); return t >= onDortGunOnce && t < yediGunOnce; });
  // Trend rozeti SADECE gerçekten karşılaştırılabilir veri varsa (geçen hafta en az
  // 1 kayıt) gösteriliyor — yoksa uydurma bir yüzde göstermek yerine rozeti hiç basmıyoruz.
  const haftaTrend = gecenHaftaKayitlar.length > 0
    ? Math.round(((buHaftaKayitlar.length - gecenHaftaKayitlar.length) / gecenHaftaKayitlar.length) * 100)
    : null;
  const stats = {
    toplam: siparisRowsCache.length,
    aktif: siparisRowsCache.filter(r => r.durum !== 'teslim_edildi' && !ozelSet.has(r.durum)).length,
    ozel: siparisRowsCache.filter(r => ozelSet.has(r.durum)).length,
    buHafta: buHaftaKayitlar.length,
    gecenHafta: gecenHaftaKayitlar.length,
    haftaTrend,
    geciken: siparisRowsCache.filter(r => !bitmisSet.has(r.durum) && r.guncellenme && new Date(r.guncellenme).getTime() < besGunOnce).length,
  };
  // Tahsilat özeti — sadece tutar GİRİLMİŞ siparişlerden gerçek toplam; para
  // birimi karışıksa ana kartta ilk (en çok kullanılan) birimi gösterip
  // diğerlerini alt yazıda belirtiyoruz, uydurma tek bir toplam basmıyoruz.
  const tutarli = siparisRowsCache.filter(r => r.toplam_tutar != null);
  const paraBirimGrup = {};
  tutarli.forEach(r => {
    const cur = r.para_birimi || 'USD';
    if (!paraBirimGrup[cur]) paraBirimGrup[cur] = { toplam: 0, odenen: 0 };
    paraBirimGrup[cur].toplam += Number(r.toplam_tutar);
    paraBirimGrup[cur].odenen += Number(r.odenen_toplam || 0);
  });
  const paraBirimleri = Object.keys(paraBirimGrup).sort((a,b) => paraBirimGrup[b].toplam - paraBirimGrup[a].toplam);
  const anaPara = paraBirimleri[0];
  const bekleyenTutar = anaPara ? (paraBirimGrup[anaPara].toplam - paraBirimGrup[anaPara].odenen) : 0;
  const paraSembol = { USD:'$', EUR:'€', TRY:'₺', GBP:'£' };
  const bekleyenCaption = tutarli.length === 0
    ? 'henüz tutar girilmedi'
    : (paraBirimleri.length > 1 ? `${tutarli.length} siparişte tutar girili · +${paraBirimleri.length-1} para birimi daha` : `${tutarli.length} siparişte tutar girili`);

  let html = `<div class="breadcrumb">Genel <i class="bi bi-chevron-right"></i> Siparişler</div>
  <div class="page-head">
    <div><h1>Siparişler</h1><p>${siparisRowsCache.length} sipariş listeleniyor — talepten teslimata tüm süreç.</p></div>
    <div class="page-head-actions" style="position:relative;">
      <button class="btn-outline" onclick="toggleKartAyar(event)"><i class="bi bi-sliders"></i> Kartları Düzenle</button>
      <div id="kartAyarPop" class="kart-ayar-pop" style="display:none;"></div>
      <button class="btn-outline" onclick="csvIndir(siparisRowsCache, ['siparis_no','urun_aciklamasi','miktar','durum','olusturulma'], 'siparisler.csv')">⬇ Dışa Aktar</button>
      <button class="btn-dark" onclick="view='yeni-siparis'; render();">＋ Yeni Sipariş</button>
    </div>
  </div>
  <div class="stat-grid" id="statGrid">
    ${statCard('<i class="bi bi-box-seam"></i>', 'Toplam Sipariş', stats.toplam, 'tüm zamanlar', null, null, 'blue', '', 'toplam')}
    ${statCard('<i class="bi bi-gear-wide-connected"></i>', 'Aktif Süreçte', stats.aktif, 'devam eden sipariş', null, null, 'purple', '', 'aktif')}
    ${statCard('<i class="bi bi-exclamation-triangle"></i>', 'Dikkat Gerektiren', stats.ozel, 'beklemede / revizyon / iptal', stats.ozel > 0 ? 'bad' : null, null, 'orange', '', 'ozel')}
    ${statCard('<i class="bi bi-calendar-week"></i>', 'Bu Hafta', stats.buHafta, 'geçen hafta: ' + stats.gecenHafta, null, stats.haftaTrend, 'indigo', '', 'buhafta')}
    ${statCard('<i class="bi bi-hourglass-split"></i>', 'Gecikme Riski', stats.geciken, '5+ gündür aynı aşamada', stats.geciken > 0 ? 'bad' : 'good', null, 'red', '', 'geciken')}
    ${statCard('<i class="bi bi-cash-coin"></i>', 'Bekleyen Tahsilat', bekleyenTutar, bekleyenCaption, null, null, 'green', paraSembol[anaPara] || (anaPara ? anaPara+' ' : ''), 'tahsilat')}
  </div>
  <div class="chart-row chart-row-4">${alanGrafigi(siparisRowsCache)}${barGrafigi(siparisRowsCache)}${tamamlanmaHalkasi(siparisRowsCache)}${topMusteriGrafigi(siparisRowsCache)}</div>
  <div id="ulkeHaritaKutu"></div>
  <div id="siparisListe"></div>
  <div class="filter-row">
    <input id="filtreArama" placeholder="Sipariş no, müşteri, firma veya ürün ara..." oninput="siparisSayfa=1; siparisListesiCiz()">
    <select id="filtreDurum" onchange="siparisSayfa=1; siparisListesiCiz()">
      <option value="">Tüm durumlar</option>
      <optgroup label="Ana Akış">${DURUMLAR.map(([k,a]) => `<option value="${k}">${a}</option>`).join('')}</optgroup>
      <optgroup label="Özel Durumlar">${OZEL_DURUMLAR.map(([k,a]) => `<option value="${k}">${a}</option>`).join('')}</optgroup>
    </select>
  </div>
  <div id="siparisTablo"></div>`;
  main.innerHTML = html;
  siparisListesiCiz();
  // Tedarikçi ülkeleri haritası — dashboard'a ayrı, hafif bir istek olarak sonradan doldurulur
  // (siparişler listesini bloklamasın diye) — Nellavio'nun ana sayfadaki RevenuePerCountry'sinin karşılığı.
  fetch(API + '/api/tk/admin/tedarikciler', {headers:{'Authorization':'Bearer '+token}})
    .then(r => r.ok ? r.json() : [])
    .then(async (tedRows) => {
      const kutu = document.getElementById('ulkeHaritaKutu');
      if (kutu) kutu.innerHTML = tedarikciUlkeHaritasi(tedRows);
    }).catch(() => {});
}

let siparisSayfa = 1;
const SIPARIS_SAYFA_BOYU = 8;
const siparisSecili = new Set(); // çoklu seçim (Nellavio'daki tablo çoklu-seçim özelliği)

function siparisListesiCiz() {
  const kutu = document.getElementById('siparisTablo');
  if (!kutu) return;
  const arama = (document.getElementById('filtreArama').value || '').toLowerCase().trim();
  const durumFiltre = document.getElementById('filtreDurum').value;
  const tumRows = siparisRowsCache.filter(r => {
    if (durumFiltre && r.durum !== durumFiltre) return false;
    if (!arama) return true;
    return [r.siparis_no, r.musteri, r.firma, r.email, r.urun_aciklamasi].some(v => (v||'').toLowerCase().includes(arama));
  });
  if (tumRows.length === 0) {
    kutu.innerHTML = '<div class="empty-state">Kriterlere uyan sipariş yok.</div>';
    return;
  }
  const toplamSayfa = Math.max(1, Math.ceil(tumRows.length / SIPARIS_SAYFA_BOYU));
  if (siparisSayfa > toplamSayfa) siparisSayfa = toplamSayfa;
  const bas = (siparisSayfa - 1) * SIPARIS_SAYFA_BOYU;
  const rows = tumRows.slice(bas, bas + SIPARIS_SAYFA_BOYU);
  const sayfaTumSecili = rows.length > 0 && rows.every(r => siparisSecili.has(r.siparis_no));
  let html = '';
  if (siparisSecili.size > 0) {
    html += `<div class="bulk-bar"><b>${siparisSecili.size}</b> sipariş seçildi
      <button class="btn-outline" onclick="siparisSecili.clear(); siparisListesiCiz();">Seçimi Temizle</button>
      <button class="btn-outline" onclick="siparisSecilenleriIndir('csv')">⬇ CSV</button>
      <button class="btn-outline" onclick="siparisSecilenleriIndir('xlsx')">⬇ XLSX</button>
    </div>`;
  }
  html += '<div class="table-card"><div class="table-wrap"><table><thead><tr>'
    + `<th style="width:34px;"><input type="checkbox" ${sayfaTumSecili ? 'checked' : ''} onchange="siparisSayfaTumunuSec(this.checked)"></th>`
    + '<th>Sipariş No</th><th>Müşteri</th><th>Ürün</th><th>Durum</th><th>Tarih</th></tr></thead><tbody>';
  rows.forEach(r => {
    const baslar = (r.musteri || '?').trim().charAt(0).toUpperCase();
    const [avBg, avFg] = avatarRengi(r.musteri || r.email || '?');
    html += `<tr onclick="aktifSiparisNo='${r.siparis_no}'; view='detay'; render();">
      <td onclick="event.stopPropagation()"><input type="checkbox" ${siparisSecili.has(r.siparis_no) ? 'checked' : ''} onchange="siparisSatirSec('${r.siparis_no}', this.checked)"></td>
      <td class="siparis-no">${r.siparis_no} <span onclick="kopyala('${r.siparis_no}', event)" title="Kopyala" style="cursor:pointer; opacity:.4; font-size:11px;"><i class="bi bi-copy"></i></span>${r.okunmamis_mesaj > 0 ? `<span title="${r.okunmamis_mesaj} okunmamış mesaj" style="display:inline-flex; align-items:center; gap:3px; margin-left:6px; font-size:10.5px; font-weight:700; color:#fff; background:var(--bad); padding:1px 7px; border-radius:20px;"><i class="bi bi-chat-dots-fill"></i> ${r.okunmamis_mesaj}</span>` : ''}</td>
      <td><div class="row-cust"><div class="av" style="background:${avBg}; color:${avFg};">${baslar}</div><div>${r.musteri}${r.firma ? ' <span style=\"color:var(--text-muted); font-weight:400;\">('+r.firma+')</span>' : ''}<br><a href="mailto:${r.email}" onclick="event.stopPropagation()" style="color:var(--text-muted); font-size:12px; text-decoration:none;">${r.email}</a></div></div></td>
      <td>${r.urun_aciklamasi}</td>
      <td><span class="pill ${durumRenkSinifi(r.durum)}">${r.durum_adi}</span></td>
      <td style="font-variant-numeric:tabular-nums; color:var(--text-muted);">${new Date(r.olusturulma).toLocaleDateString('tr-TR', {day:'2-digit', month:'short', year:'numeric'})}</td>
    </tr>`;
  });
  html += '</tbody></table></div>';
  html += `<div class="pagination">
    <span>${tumRows.length} kayıttan ${bas+1}-${Math.min(bas+SIPARIS_SAYFA_BOYU, tumRows.length)} arası gösteriliyor</span>
    <div class="pagination-btns">
      <button ${siparisSayfa<=1?'disabled':''} onclick="siparisSayfa--; siparisListesiCiz();"><i class="bi bi-chevron-left"></i></button>
      <span class="pagination-sayfa">Sayfa ${siparisSayfa} / ${toplamSayfa}</span>
      <button ${siparisSayfa>=toplamSayfa?'disabled':''} onclick="siparisSayfa++; siparisListesiCiz();"><i class="bi bi-chevron-right"></i></button>
    </div>
  </div></div>`;
  html += `<div style="margin-top:16px; display:flex; gap:10px;">
    <button class="secondary" onclick="csvIndir(siparisRowsCache, ['siparis_no','musteri','firma','email','urun_aciklamasi','durum_adi','olusturulma'], 'siparisler.csv')">⬇ CSV</button>
    <button class="secondary" onclick="xlsxIndir(siparisRowsCache, ['siparis_no','musteri','firma','email','urun_aciklamasi','durum_adi','olusturulma'], {siparis_no:'Sipariş No', musteri:'Müşteri', firma:'Firma', email:'E-posta', urun_aciklamasi:'Ürün', durum_adi:'Durum', olusturulma:'Tarih'}, 'siparisler.xlsx')">⬇ XLSX</button>
  </div>`;
  kutu.innerHTML = html;
}

function siparisSatirSec(no, secili) {
  if (secili) siparisSecili.add(no); else siparisSecili.delete(no);
  siparisListesiCiz();
}
function siparisSayfaTumunuSec(hepsi) {
  const bas = (siparisSayfa - 1) * SIPARIS_SAYFA_BOYU;
  const arama = (document.getElementById('filtreArama').value || '').toLowerCase().trim();
  const durumFiltre = document.getElementById('filtreDurum').value;
  const tumRows = siparisRowsCache.filter(r => {
    if (durumFiltre && r.durum !== durumFiltre) return false;
    if (!arama) return true;
    return [r.siparis_no, r.musteri, r.firma, r.email, r.urun_aciklamasi].some(v => (v||'').toLowerCase().includes(arama));
  });
  tumRows.slice(bas, bas + SIPARIS_SAYFA_BOYU).forEach(r => { if (hepsi) siparisSecili.add(r.siparis_no); else siparisSecili.delete(r.siparis_no); });
  siparisListesiCiz();
}
function siparisSecilenleriIndir(tip) {
  const rows = siparisRowsCache.filter(r => siparisSecili.has(r.siparis_no));
  const alanlar = ['siparis_no','musteri','firma','email','urun_aciklamasi','durum_adi','olusturulma'];
  if (tip === 'xlsx') xlsxIndir(rows, alanlar, {siparis_no:'Sipariş No', musteri:'Müşteri', firma:'Firma', email:'E-posta', urun_aciklamasi:'Ürün', durum_adi:'Durum', olusturulma:'Tarih'}, 'secili-siparisler.xlsx');
  else csvIndir(rows, alanlar, 'secili-siparisler.csv');
}

  const errBox = document.getElementById('ysErr');
  const basariBox = document.getElementById('ysBasari');
  errBox.textContent = ''; basariBox.innerHTML = '';
  const body = {
    urun_aciklamasi: document.getElementById('ysUrun').value.trim(),
    miktar: document.getElementById('ysMiktar').value.trim() || null,
    hedef_fiyat: document.getElementById('ysFiyat').value.trim() || null,
    baslangic_durumu: document.getElementById('ysDurum').value,
  };
  if (mod === 'mevcut') {
    const id = document.getElementById('ysMusteriId').value;
    if (!id) { errBox.textContent = 'Bir müşteri seçin veya "Yeni müşteri" seçeneğini kullanın.'; return; }
    body.musteri_id = parseInt(id, 10);
  } else {
    body.yeni_ad_soyad = document.getElementById('ysAd').value.trim();
    body.yeni_firma = document.getElementById('ysFirma').value.trim() || null;
    body.yeni_email = document.getElementById('ysEmail').value.trim();
    body.yeni_telefon = document.getElementById('ysTel').value.trim() || null;
    if (!body.yeni_ad_soyad || !body.yeni_email) { errBox.textContent = 'Yeni müşteri için ad soyad ve e-posta zorunlu.'; return; }
  }
  if (!body.urun_aciklamasi) { errBox.textContent = 'Ürün açıklaması zorunlu.'; return; }
  try {
    const res = await fetch(API + '/api/tk/admin/siparis-olustur', {
      method:'POST', headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},
      body: JSON.stringify(body)
    });
    if (!res.ok) { const d = await res.json(); errBox.textContent = d.detail || 'Bir hata oluştu'; return; }
    const d = await res.json();
    if (d.gecici_sifre) {
      basariBox.innerHTML = `<div class="panel" style="border-color:var(--accent2); background:color-mix(in srgb, var(--accent2) 8%, transparent); margin-bottom:16px;">
        <b>${d.siparis_no}</b> oluşturuldu. Yeni müşteri hesabı açıldı — geçici şifre: <b style="font-family:var(--font-code);">${d.gecici_sifre}</b><br>
        <span style="font-size:12.5px; color:var(--text-muted);">Bu şifreyi müşteriye iletin, panelinize giriş yaptıktan sonra bir daha gösterilmeyecek.</span>
      </div>`;
    } else {
      aktifSiparisNo = d.siparis_no; view = 'detay'; render(); return;
    }
  } catch (e) { errBox.textContent = 'Bağlantı hatası'; }
}

const KONTEYNER_DEEPLINK = {
  maersk: no => `https://www.maersk.com/tracking/${encodeURIComponent(no)}`,
  cosco: no => `https://elines.coscoshipping.com/ebusiness/cargoTracking?trackingType=CONTAINER&number=${encodeURIComponent(no)}`,
  one: no => `https://ecomm.one-line.com/one-ecom/manage-shipment/cargo-tracking?ctrack-field=${encodeURIComponent(no)}&trakNoParam=${encodeURIComponent(no)}`,
};
const KONTEYNER_HOMEPAGE = {
  msc: 'https://www.msc.com/tr/track-a-shipment',
  cma_cgm: 'https://www.cma-cgm.com/ebusiness/tracking',
  hapag_lloyd: 'https://www.hapag-lloyd.com/en/online-business/track/track-by-booking-solution.html',
};
// Otomatik-dolan taşıyıcılarda konteyner no henüz girilmemişken gösterilecek
// genel (boş) takip sayfası — no girilince yukarıdaki KONTEYNER_DEEPLINK devreye girer.
const KONTEYNER_HOMEPAGE_ALT = {
  maersk: 'https://www.maersk.com/tracking',
  cosco: 'https://elines.coscoshipping.com/ebusiness/cargoTracking',
  one: 'https://ecomm.one-line.com/one-ecom/manage-shipment/cargo-tracking',
};
function konteynerOnizlemeGuncelle() {
  const kutu = document.getElementById('sKonteynerOnizleme');
  if (!kutu) return;
  const key = document.getElementById('sTasiyiciKey')?.value;
  const no = document.getElementById('sKonteyner')?.value.trim();
  const firmaAdi = TASIYICILAR.find(t=>t[0]===key)?.[1] || key;
  // Konteyner no henüz girilmemiş olsa bile, taşıyıcı seçilir seçilmez altında
  // o firmanın linki görünsün (konteyner no varsa otomatik dolu, yoksa firmanın
  // genel takip sayfası) — "acenteyi seçtiğim gibi link gelsin" isteği bu.
  if (!key) { kutu.innerHTML = ''; return; }
  if (KONTEYNER_DEEPLINK[key]) {
    const url = no ? KONTEYNER_DEEPLINK[key](no) : KONTEYNER_HOMEPAGE_ALT[key];
    const etiket = no ? 'konteyner no otomatik dolu' : 'konteyner no girilince otomatik dolacak';
    kutu.innerHTML = `<i class="bi bi-link-45deg"></i> Müşteriye gösterilecek link (${etiket}, ${firmaAdi}): <a href="${url}" target="_blank" style="color:var(--accent2);">${url}</a>`;
  } else if (KONTEYNER_HOMEPAGE[key]) {
    const url = KONTEYNER_HOMEPAGE[key];
    kutu.innerHTML = `<i class="bi bi-link-45deg"></i> Müşteriye gösterilecek link (${firmaAdi} resmi takip sayfası — bu firma için otomatik doldurma doğrulanamadı, konteyner no'yu müşteri sayfada kendisi girer): <a href="${url}" target="_blank" style="color:var(--accent2);">${url}</a>`;
  } else {
    // "Diğer" (sistemde kayıtlı olmayan bir taşıyıcı elle girildiğinde) ya da
    // eşleşmeyen bir key — konteyner no yoksa bile genel arama sayfasına gider,
    // no varsa doğrudan o numarayla aratır.
    const url = no
      ? `https://www.track-trace.com/container?number=${encodeURIComponent(no)}`
      : `https://www.track-trace.com/container`;
    const kaynakEtiketi = key === 'diger' ? 'Diğer / sistemde kayıtlı olmayan taşıyıcı' : (firmaAdi + ' kayıtlı bir taşıyıcı değil');
    kutu.innerHTML = `<i class="bi bi-link-45deg"></i> Müşteriye gösterilecek link (genel konteyner arama, ${kaynakEtiketi}): <a href="${url}" target="_blank" style="color:var(--accent2);">${url}</a>`;
  }
}

async function belgeEkle(siparisNo) {
  const secilenTip = document.getElementById('belgeTipi').value;
  const belge_tipi = secilenTip === 'diger' ? document.getElementById('belgeTipiOzel').value.trim() : secilenTip;
  const dosyaInput = document.getElementById('belgeDosya');
  const dosya = dosyaInput.files[0];
  const aciklama = document.getElementById('belgeAciklama').value.trim() || null;
  if (!belge_tipi || !dosya) { showToast('Belge tipi ve dosya seçimi zorunlu.', 'err'); return; }
  const btn = document.getElementById('belgeEkleBtn');
  btn.disabled = true; btn.textContent = 'Yükleniyor...';
  const form = new FormData();
  form.append('dosya', dosya);
  form.append('belge_tipi', belge_tipi);
  if (aciklama) form.append('aciklama', aciklama);
  try {
    const res = await fetch(API + '/api/tk/admin/siparis/' + encodeURIComponent(siparisNo) + '/belge-yukle', {
      method:'POST', headers:{'Authorization':'Bearer '+token}, body: form
    });
    if (!res.ok) { const e = await res.json().catch(()=>({})); showToast('Yükleme başarısız: ' + (e.detail||res.status), 'err'); return; }
  } finally {
    btn.disabled = false; btn.textContent = 'Belgeyi Yükle';
  }
  showToast('Belge yüklendi.', 'ok');
  detayYukle(siparisNo);
}

function initTheme() {
  const root = document.documentElement;
  const buttons = document.querySelectorAll('#themeToggle button');
  function apply(mode) {
    if (mode === 'light') root.setAttribute('data-theme', 'light');
    else if (mode === 'dark') root.setAttribute('data-theme', 'dark');
    else root.removeAttribute('data-theme');
    buttons.forEach(b => b.classList.toggle('active', b.dataset.mode === mode));
  }
  const saved = localStorage.getItem('tema') || 'system';
  apply(saved);
  buttons.forEach(b => b.addEventListener('click', () => {
    localStorage.setItem('tema', b.dataset.mode); apply(b.dataset.mode);
    // Harita CSS custom property'leri otomatik izlemiyor — tema değişince aynı veriyle yeniden çiz
    if (ulkeMapSonParam) ulkeMapBaslat(ulkeMapSonParam.containerId, ulkeMapSonParam.ulkeSayim);
  }));
}

// ---- Toast bildirim sistemi ----
function showToast(msg, type) {
  type = type || 'info';
  const stack = document.getElementById('toastStack');
  if (!stack) { alert(msg); return; }
  const ico = type === 'ok' ? 'bi-check-lg' : type === 'err' ? 'bi-exclamation-lg' : 'bi-info-lg';
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.innerHTML = `<span class="ico"><i class="bi ${ico}"></i></span><span class="msg"></span>`;
  el.querySelector('.msg').textContent = msg;
  stack.appendChild(el);
  setTimeout(() => {
    el.classList.add('is-leaving');
    setTimeout(() => el.remove(), 220);
  }, 4200);
}

// ---- Komut paleti (⌘K) ----
const CMDK_PAGES = [
  { label: 'Siparişler', ico: 'bi-grid-1x2', go: () => { view = 'liste'; render(); } },
  { label: 'Yeni Sipariş', ico: 'bi-plus-circle', go: () => { view = 'yeni-siparis'; render(); } },
  { label: 'Müşteriler', ico: 'bi-building', go: () => { view = 'musteriler'; render(); } },
  { label: 'Tedarikçiler', ico: 'bi-shop', go: () => { view = 'tedarikciler'; render(); } },
  { label: 'Ayarlar', ico: 'bi-gear', go: () => { view = 'ayarlar'; render(); } },
];
let cmdkActiveIdx = 0;
function cmdkResults(q) {
  q = (q || '').trim().toLowerCase();
  if (!q) return { pages: CMDK_PAGES, orders: [] };
  const pages = CMDK_PAGES.filter(p => p.label.toLowerCase().includes(q));
  const orders = (siparisRowsCache || []).filter(r =>
    [r.siparis_no, r.musteri, r.firma, r.urun_aciklamasi].some(v => (v || '').toLowerCase().includes(q))
  ).slice(0, 6);
  return { pages, orders };
}
function cmdkRender() {
  const input = document.getElementById('cmdkInput');
  const list = document.getElementById('cmdkList');
  if (!input || !list) return;
  const { pages, orders } = cmdkResults(input.value);
  const items = [
    ...pages.map(p => ({ kind: 'page', label: p.label, ico: p.ico, run: p.go })),
    ...orders.map(o => ({ kind: 'order', label: o.siparis_no, sub: o.musteri || o.firma || '', ico: 'bi-box-seam',
      run: () => { aktifSiparisNo = o.siparis_no; view = 'detay'; render(); } })),
  ];
  cmdkActiveIdx = Math.min(cmdkActiveIdx, Math.max(0, items.length - 1));
  if (!items.length) { list.innerHTML = '<div class="cmdk-empty">Sonuç bulunamadı</div>'; return; }
  let html = '';
  if (pages.length) html += '<div class="cmdk-group-label">Sayfalar</div>';
  items.forEach((it, i) => {
    if (it.kind === 'order' && i === pages.length) html += '<div class="cmdk-group-label">Siparişler</div>';
    html += `<div class="cmdk-item${i === cmdkActiveIdx ? ' is-active' : ''}" data-idx="${i}">
      <span class="ico"><i class="bi ${it.ico}"></i></span><span>${it.label}</span>${it.sub ? `<span class="sub">${it.sub}</span>` : ''}
    </div>`;
  });
  list.innerHTML = html;
  list.querySelectorAll('.cmdk-item').forEach(el => {
    el.addEventListener('click', () => { items[Number(el.dataset.idx)].run(); cmdkClose(); });
  });
  list._items = items;
}
function cmdkOpen() {
  const overlay = document.getElementById('cmdkOverlay');
  const input = document.getElementById('cmdkInput');
  if (!overlay) return;
  overlay.classList.add('is-open');
  cmdkActiveIdx = 0;
  input.value = '';
  cmdkRender();
  setTimeout(() => input.focus(), 20);
}
function cmdkClose() {
  const overlay = document.getElementById('cmdkOverlay');
  if (overlay) overlay.classList.remove('is-open');
}
function initCmdk() {
  const overlay = document.getElementById('cmdkOverlay');
  const input = document.getElementById('cmdkInput');
  if (!overlay || !input) return;
  overlay.addEventListener('click', (e) => { if (e.target === overlay) cmdkClose(); });
  input.addEventListener('input', () => { cmdkActiveIdx = 0; cmdkRender(); });
  input.addEventListener('keydown', (e) => {
    const list = document.getElementById('cmdkList');
    const items = list._items || [];
    if (e.key === 'ArrowDown') { e.preventDefault(); cmdkActiveIdx = Math.min(items.length - 1, cmdkActiveIdx + 1); cmdkRender(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); cmdkActiveIdx = Math.max(0, cmdkActiveIdx - 1); cmdkRender(); }
    else if (e.key === 'Enter') { e.preventDefault(); if (items[cmdkActiveIdx]) { items[cmdkActiveIdx].run(); cmdkClose(); } }
    else if (e.key === 'Escape') { cmdkClose(); }
  });
}

// ---- Sidebar daralt/genişlet ----
function toggleSidebar() {
  const shell = document.querySelector('.app-shell');
  if (!shell) return;
  const collapsed = shell.classList.toggle('is-collapsed');
  localStorage.setItem('tk_admin_sidebar', collapsed ? 'collapsed' : 'expanded');
}

// ---- Genel klavye kısayolları: ⌘/Ctrl+K komut paleti, Ctrl+\ sidebar, Ctrl+/ tema ----
function initShortcuts() {
  window.addEventListener('keydown', (e) => {
    const overlay = document.getElementById('cmdkOverlay');
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); cmdkOpen(); return; }
    if ((e.metaKey || e.ctrlKey) && e.key === '\\') { e.preventDefault(); toggleSidebar(); return; }
    if ((e.metaKey || e.ctrlKey) && e.key === '/') {
      e.preventDefault();
      const buttons = document.querySelectorAll('#themeToggle button');
      if (!buttons.length) return;
      const order = ['light', 'dark', 'system'];
      const current = localStorage.getItem('tema') || 'system';
      const next = order[(order.indexOf(current) + 1) % order.length];
      const btn = Array.from(buttons).find(b => b.dataset.mode === next);
      if (btn) btn.click();
      return;
    }
    if (e.key === 'Escape' && overlay && overlay.classList.contains('is-open')) cmdkClose();
  });
}

// Aksiyon butonları async loader'lar tarafından .main içine sonradan yazıldığı için (render()
// senkron dönüyor), her DOM değişiminde RBAC kısıtlamasını yeniden uygulayan bir observer kullanılıyor
// — tek tek her fonksiyona rbacUygula() eklemek yerine, tek yerden garanti altına alınıyor.
function initRbacObserver() {
  const app = document.getElementById('app');
  if (!app) return;
  let t = null;
  new MutationObserver(() => { clearTimeout(t); t = setTimeout(rbacUygula, 30); }).observe(app, { childList: true, subtree: true });
}

// ---- Açılır menüler (bildirim zili, hesap avatarı) — Adminator'ın init.js'indeki initDropdowns()
// mantığının birebir karşılığı: .dd-wrap.is-open sınıfını CSS zaten animasyonluyor. render() DOM'u
// her seferinde yeniden yazdığı için event delegation kullanıyoruz (elementlere tek tek bağlamaya gerek yok). ----
function initDropdowns() {
  document.addEventListener('click', (e) => {
    const trigger = e.target.closest('[data-dropdown]');
    if (trigger) {
      e.stopPropagation();
      const wrap = trigger.closest('.dd-wrap');
      if (!wrap) return;
      const willOpen = !wrap.classList.contains('is-open');
      document.querySelectorAll('.dd-wrap.is-open').forEach(w => { if (w !== wrap) w.classList.remove('is-open'); });
      wrap.classList.toggle('is-open', willOpen);
      if (willOpen && wrap.querySelector('#bildirimPop')) bildirimIcerikDoldur();
      return;
    }
    if (!e.target.closest('.dd-wrap')) document.querySelectorAll('.dd-wrap.is-open').forEach(w => w.classList.remove('is-open'));
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') document.querySelectorAll('.dd-wrap.is-open').forEach(w => w.classList.remove('is-open'));
  });
}

initCmdk();
initShortcuts();
initRbacObserver();
initDropdowns();
render();
