<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 40 40%22><rect width=%2240%22 height=%2240%22 rx=%229%22 fill=%22%230f3d63%22/><ellipse cx=%2220%22 cy=%2220%22 rx=%2214%22 ry=%227%22 fill=%22none%22 stroke=%22%23ffffff%22 stroke-opacity=%220.16%22 stroke-width=%221%22/><ellipse cx=%2220%22 cy=%2220%22 rx=%227%22 ry=%2214%22 fill=%22none%22 stroke=%22%23ffffff%22 stroke-opacity=%220.16%22 stroke-width=%221%22/><path d=%22M9,28 C15,24 25,16 31,12%22 fill=%22none%22 stroke=%22%23d99a2b%22 stroke-width=%222%22 stroke-linecap=%22round%22 stroke-dasharray=%220.5 4.2%22/><circle cx=%229%22 cy=%2228%22 r=%222.6%22 fill=%22%23ffffff%22/><circle cx=%2231%22 cy=%2212%22 r=%222.6%22 fill=%22%23d99a2b%22/></svg>">
<title>Admin — Tedarik Ağı</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Adminator (puikinsh/Adminator-admin-dashboard, MIT) — gerçek, framework gerektirmeyen
     kaynak koddan derlenip alınan tasarım sistemi: fontlar, renk token'ları, sidebar/topbar/
     kart bileşenleri birebir bu projeden. Sadece --primary rengini kendi yeşilimize çeviriyoruz
     (aşağıdaki override bloğu), gerisi orijinal. -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link href="assets/adminator/adminator.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js" defer></script>
<link href="https://cdn.jsdelivr.net/npm/jsvectormap@1.7.0/dist/jsvectormap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/jsvectormap@1.7.0/dist/jsvectormap.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/jsvectormap@1.7.0/dist/maps/world.js" defer></script>
<style>
  /* Adminator'ın mavi --primary'sini marka yeşilimize çeviriyoruz. */
  :root[data-theme="light"]{ --primary:#18915d !important; --primary-light:#1fae70 !important; --primary-dark:#137a4d !important; --primary-soft:#e9f7f0 !important; --primary-ring:rgba(31,174,112,.18) !important; }
  :root[data-theme="dark"]{ --primary:#3db985 !important; --primary-light:#5fd39f !important; --primary-dark:#2f9d70 !important; --primary-soft:#0f2a20 !important; --primary-ring:rgba(61,185,133,.24) !important; }
</style>
<style>
  :root{
    /* Adminator'ın gerçek derlenmiş CSS'inden (assets/adminator/adminator.css) birebir alınan
       değerler — kendi eski token isimlerimizi (--bg, --surface, --accent2 vb.) koruyoruz ki
       onları kullanan tüm mevcut sayfa kodumuz değişmeden yeni paleti otomatik alsın. */
    --bg:#F0F4F8; --bg-alt:#F1F5F9; --surface:#ffffff; --text:#1E293B; --text-muted:#64748B;
    --good:#10B981; --good-bg:#ECFDF5; --good-bd:#6ee7b7; --bad:#EF4444; --bad-bg:#FEF2F2; --bad-bd:#fca5a5;
    --accent:#F59E0B; --accent-ink:#b45309; --accent2:#18915d; --accent2-ink:#137a4d; --accent2-fill:#1fae70;
    --accent-blue:#0EA5E9; --accent-purple:#8B5CF6;
    --signal:#EF4444; --signal-ink:#b91c1c; --border:#E4E8EF;
    --sidebar-bg:var(--surface); --sidebar-text:var(--text); --sidebar-text-dim:var(--text-muted); --sidebar-hover:#F8FAFC;
    --radius-card:14px; --radius-sm:10px; --card-shadow:0 1px 3px 0 rgb(15 23 42 / 0.06), 0 1px 2px -1px rgb(15 23 42 / 0.04);
    --font-display: "Inter Tight","Inter",-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    --font-body: "Inter",-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    --font-code: "JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0B1120; --bg-alt:#1A2237; --surface:#141B2D; --text:#F1F5F9; --text-muted:#94A3B8;
      --good:#34D399; --good-bg:#0F2A20; --good-bd:#34D399; --bad:#F87171; --bad-bg:#2B1414; --bad-bd:#F87171;
      --accent:#FBBF24; --accent-ink:#fbbf24; --accent2:#3db985; --accent2-ink:#2f9d70; --accent2-fill:#368060;
      --accent-blue:#38BDF8; --accent-purple:#A78BFA;
      --signal:#F87171; --signal-ink:#fca5a5; --border:#222C42;
      --sidebar-hover:#1C2438; --card-shadow:0 1px 3px 0 rgb(0 0 0 / 0.3), 0 1px 2px -1px rgb(0 0 0 / 0.25);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0B1120; --bg-alt:#1A2237; --surface:#141B2D; --text:#F1F5F9; --text-muted:#94A3B8;
    --good:#34D399; --good-bg:#0F2A20; --good-bd:#34D399; --bad:#F87171; --bad-bg:#2B1414; --bad-bd:#F87171;
    --accent:#FBBF24; --accent-ink:#fbbf24; --accent2:#3db985; --accent2-ink:#2f9d70; --accent2-fill:#368060;
    --accent-blue:#38BDF8; --accent-purple:#A78BFA;
    --signal:#F87171; --signal-ink:#fca5a5; --border:#222C42;
    --sidebar-hover:#1C2438; --card-shadow:0 1px 3px 0 rgb(0 0 0 / 0.3), 0 1px 2px -1px rgb(0 0 0 / 0.25);
  }
  :root[data-theme="light"]{
    --bg:#F0F4F8; --bg-alt:#F1F5F9; --surface:#ffffff; --text:#1E293B; --text-muted:#64748B;
    --good:#10B981; --good-bg:#ECFDF5; --good-bd:#6ee7b7; --bad:#EF4444; --bad-bg:#FEF2F2; --bad-bd:#fca5a5;
    --accent:#F59E0B; --accent-ink:#b45309; --accent2:#18915d; --accent2-ink:#137a4d; --accent2-fill:#1fae70;
    --accent-blue:#0EA5E9; --accent-purple:#8B5CF6;
    --signal:#EF4444; --signal-ink:#b91c1c; --border:#E4E8EF;
    --sidebar-hover:#F8FAFC; --card-shadow:0 1px 3px 0 rgb(15 23 42 / 0.06), 0 1px 2px -1px rgb(15 23 42 / 0.04);
  }
  *{box-sizing:border-box;}
  body{ margin:0; background:var(--bg); color:var(--text); font-family:var(--font-body); font-size:15px; line-height:1.5; overflow-x:hidden; }
  a{ color:inherit; }

  .theme-toggle{ display:flex; gap:2px; background:var(--bg-alt); border:1px solid var(--border); border-radius:20px; padding:3px; flex:none; }
  .theme-toggle button{ width:auto; border:none; background:transparent; color:var(--text-muted); font-family:var(--font-body); font-size:12px; font-weight:600; padding:5px 10px; border-radius:16px; cursor:pointer; }
  .theme-toggle button.active{ background:var(--accent2); color:#fff; }

  label{ display:block; font-size:11.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-muted); margin-bottom:8px; font-weight:600; line-height:1.4; }
  input, select, textarea{ width:100%; font-size:14.5px; padding:10px 11px; border-radius:10px; border:1px solid var(--border); background:var(--bg); color:var(--text); font-family:inherit; margin-bottom:18px; box-sizing:border-box; height:42px; }
  textarea{ height:auto; }
  /* Native dosya seçme kutusu diğer input'larla aynı yükseklikte, düğmesi
     tema rengiyle uyumlu görünsün diye ayrıca stillendi — aksi halde tarayıcı
     varsayılanı diğer alanlarla hizasız/kayık görünüyordu. */
  input[type="file"]{ padding:6px 11px; display:flex; align-items:center; font-size:13.5px; color:var(--text-muted); cursor:pointer; }
  input[type="file"]::file-selector-button{ font-family:inherit; font-size:13px; font-weight:600; padding:7px 14px; margin-right:12px; border-radius:6px; border:1px solid var(--border); background:var(--surface); color:var(--text); cursor:pointer; }
  input[type="file"]::file-selector-button:hover{ background:var(--bg-alt); }
  input:focus, select:focus, textarea:focus{ outline:2px solid var(--accent); outline-offset:1px; }
  button.primary{ background:var(--accent2-fill); color:#fff; border:none; padding:10px 18px; border-radius:8px; font-weight:600; font-size:14px; cursor:pointer; }
  button.primary:hover{ background:var(--accent2-ink); }
  button.secondary{ background:color-mix(in srgb, var(--text) 5%, transparent); color:var(--text); border:1px solid var(--border); padding:10px 18px; border-radius:8px; font-weight:600; font-size:14px; cursor:pointer; }
  button.secondary:hover{ border-color:var(--accent); }
  button:disabled{ opacity:.4; cursor:not-allowed; }
  .linklike{ background:none; border:none; color:var(--accent-ink); font-weight:600; cursor:pointer; padding:0; font-size:13px; text-decoration:underline; }
  .err{ color:var(--signal-ink); font-size:13px; margin-bottom:10px; }
  .demo-box{ font-size:13px; line-height:1.5; color:var(--accent2-ink); background:color-mix(in srgb, var(--accent2) 10%, transparent); border:1px solid color-mix(in srgb, var(--accent2) 28%, transparent); border-radius:6px; padding:10px 13px; margin-bottom:16px; }

  .panel-fade{ animation:panelFadeIn .45s cubic-bezier(.2,.7,.3,1); }
  @keyframes panelFadeIn{ from{ opacity:0; filter:blur(6px); transform:translateY(8px); } to{ opacity:1; filter:blur(0); transform:translateY(0); } }
  @media (prefers-reduced-motion: reduce){ .panel-fade{ animation:none; } }
  .row2{ display:grid; grid-template-columns:1fr 1fr; gap:18px; }
  @media (max-width:600px){ .row2{ grid-template-columns:1fr; } }
  h2{ font-family:var(--font-display); font-weight:700; font-size:20px; letter-spacing:-.01em; margin:0 0 10px; }
  .liste-satir{ display:flex; justify-content:space-between; align-items:center; gap:12px; padding:13px 0; border-bottom:1px solid var(--border); }
  .liste-satir:last-child{ border-bottom:none; }
  .liste-baslik{ font-size:14px; font-weight:600; }
  .liste-alt{ font-size:12px; color:var(--text-muted); margin-top:3px; }
  .gecmis-satir{ padding:14px 0; border-bottom:1px solid var(--border); }
  .gecmis-satir:last-child{ border-bottom:none; }
  .gecmis-satir .durum{ font-weight:700; font-size:14.5px; }
  .gecmis-satir .not{ font-size:13.5px; color:var(--text-muted); margin-top:4px; line-height:1.5; }
  .gecmis-satir .meta{ font-family:var(--font-code); font-size:11px; color:var(--text-muted); margin-top:6px; margin-bottom:0; }

  /* ---- Auth screen: tam ekran fotoğraf + ortalanmış cam kart ---- */
  .auth-wrap{ min-height:100vh; position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:40px 20px; overflow:hidden; }
  .auth-wrap .theme-toggle{ position:absolute; top:20px; right:20px; z-index:2; }
  .auth-bg{ position:absolute; inset:0; z-index:0; }
  .auth-bg img{ width:100%; height:100%; object-fit:cover; }
  .auth-scrim{ position:absolute; inset:0; background:linear-gradient(175deg, rgba(9,9,11,.86) 0%, rgba(9,9,11,.78) 50%, rgba(9,9,11,.92) 100%); }
  .auth-glass-wrap{ position:relative; z-index:1; width:100%; max-width:380px; display:flex; flex-direction:column; align-items:center; }
  .auth-badge{ width:52px; height:52px; border-radius:50%; background:rgba(255,255,255,.12); display:flex; align-items:center; justify-content:center; margin-bottom:22px; box-shadow:0 8px 24px -8px rgba(0,0,0,.5); }
  .auth-badge svg{ width:30px; height:30px; }
  .auth-card{ width:100%; background:linear-gradient(135deg, rgba(255,255,255,.08), rgba(255,255,255,.02)); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px); border:1px solid rgba(255,255,255,.12); border-radius:26px; box-shadow:0 24px 60px -12px rgba(0,0,0,.6); padding:36px 32px; }
  .auth-card .badge{ display:inline-block; font-family:var(--font-code); font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:#c7d2ff; background:rgba(31,174,112,.18); border:1px solid rgba(31,174,112,.35); padding:3px 10px; border-radius:20px; margin-bottom:16px; }
  .auth-card h2{ font-size:24px; margin-bottom:6px; color:#fff; }
  .auth-card .lede{ color:rgba(255,255,255,.6); font-size:14px; margin:0 0 24px; }
  .auth-card label{ color:rgba(255,255,255,.7); }
  .auth-card input{ background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.14); color:#fff; }
  .auth-card input::placeholder{ color:rgba(255,255,255,.35); }
  .auth-card input:focus{ border-color:rgba(255,255,255,.35); background:rgba(255,255,255,.1); }
  .auth-card .demo-box{ background:rgba(31,174,112,.16); border-color:rgba(31,174,112,.35); color:#c7d2ff; }
  .auth-card .demo-box b{ color:#fff; }
  .auth-card .err{ color:#ff8a8a; }
  .auth-meta{ position:relative; z-index:1; display:flex; gap:26px; font-family:var(--font-code); font-size:11.5px; color:rgba(255,255,255,.5); margin-top:26px; flex-wrap:wrap; justify-content:center; }
  .auth-meta b{ display:block; color:#fff; font-family:var(--font-body); font-size:14px; margin-top:3px; font-weight:700; }
  @media (max-width:480px){ .auth-card{ padding:28px 22px; } }

  /* ---- App shell ---- */
  .app-shell{ display:flex; min-height:100vh; align-items:stretch; }
  /* ---- Sidebar: paylaşılan referansla birebir — açık/beyaz zemin, ince sağ
     kenarlık, net grup etiketleri, chevron'lu marka satırı, Bootstrap Icons. ---- */
  /* Sidebar her zaman koyu (tema modundan bağımsız) — içerik alanının açık/koyu geçişinden
     ayrı, kendi kimliği olan bir kontrast şeridi. Nellavio demo görselindeki koyu sidebar +
     açık içerik ayrımıyla aynı dil. */
  .sidebar{ width:264px; flex:none; background:var(--sidebar-bg); border-right:1px solid rgba(255,255,255,.06); padding:20px 16px; display:flex; flex-direction:column; }
  .brand-row{ display:flex; align-items:center; justify-content:space-between; padding:8px; margin-bottom:22px; border-radius:12px; cursor:pointer; }
  .brand-row:hover{ background:var(--sidebar-hover); }
  .brand-row .chev{ color:var(--sidebar-text-dim); font-size:12px; transition:transform .15s; }
  .app-shell.is-collapsed .brand-row .chev{ transform:rotate(-90deg); }
  .sidebar .brand{ font-family:var(--font-display); font-weight:700; font-size:15.5px; letter-spacing:-.01em; text-decoration:none; color:var(--sidebar-text); display:flex; align-items:center; gap:11px; }
  .sidebar .brand svg{ width:28px; height:28px; flex:none; border-radius:8px; }
  .sidebar .brand-t{ line-height:1.25; letter-spacing:-.01em; }
  .sidebar .brand-sub{ font-family:var(--font-body); font-weight:400; font-size:11px; letter-spacing:.02em; text-transform:none; color:var(--sidebar-text-dim); }
  .side-group-label{ font-size:10.5px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--sidebar-text-dim); padding:0 12px; margin:22px 0 10px; }
  .side-group-label:first-of-type{ margin-top:0; }
  .side-nav{ display:flex; flex-direction:column; gap:3px; }
  .side-nav button{ display:flex; align-items:center; gap:12px; padding:10px 12px; border-radius:10px; font-weight:600; font-size:14px; color:var(--sidebar-text-dim); cursor:pointer; border:none; background:none; text-align:left; width:100%; font-family:var(--font-body); transition:background .15s, color .15s; position:relative; }
  .side-nav button:hover{ background:var(--sidebar-hover); color:var(--sidebar-text); }
  .side-nav button:hover .ico{ color:var(--sidebar-text); }
  .side-nav button.active{ background:color-mix(in srgb, var(--accent2) 12%, var(--sidebar-hover)); color:var(--sidebar-text); font-weight:700; }
  /* Aktif öğede sol tarafta ince, yeşil bir vurgu çizgisi — referans dashboard'daki
     seçili sekme göstergesiyle aynı dil, sadece renkli kutu yerine ince bir işaret. */
  .side-nav button.active::before{ content:""; position:absolute; left:-16px; top:50%; transform:translateY(-50%);
    width:3px; height:18px; border-radius:0 3px 3px 0; background:var(--accent2); }
  .side-nav button.active .ico{ color:var(--accent2); }
  .side-nav .ico{ width:17px; text-align:center; flex:none; font-size:15px; color:var(--sidebar-text-dim); transition:color .15s; }
  .sidebar-foot{ margin-top:auto; padding-top:16px; border-top:1px solid rgba(255,255,255,.08); }
  .user-chip{ display:flex; align-items:center; gap:10px; padding:8px; margin-bottom:4px; border-radius:10px; transition:background .15s; }
  .user-chip:hover{ background:var(--sidebar-hover); }
  .user-chip .av{ width:32px; height:32px; border-radius:50%; background:var(--accent2); color:#fff; display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-weight:700; font-size:12.5px; flex:none; box-shadow:0 0 0 2px var(--sidebar-bg), 0 0 0 3.5px color-mix(in srgb, var(--accent2) 50%, transparent); }
  .user-chip b, .user-chip > div > div:first-child{ color:var(--sidebar-text); }
  .user-chip .role{ font-size:11px; color:var(--sidebar-text-dim); }
  .sidebar-foot .linklike{ color:var(--sidebar-text-dim); }
  .sidebar-foot .linklike:hover{ color:var(--sidebar-text); }
  .sidebar-foot .theme-toggle{ margin-bottom:8px; width:100%; justify-content:center; background:var(--sidebar-hover); border-color:rgba(255,255,255,.1); }
  .sidebar-foot .theme-toggle button{ color:var(--sidebar-text-dim); }
  .main-col{ flex:1; display:flex; flex-direction:column; min-width:0; position:relative; }
  .topbar{ display:flex; align-items:center; justify-content:space-between; gap:16px; padding:12px 24px; border-bottom:1px solid var(--border); background:var(--surface); }
  /* Ana sayfadaki gibi, çok hafif dekoratif blob — sadece köşede, dikkat dağıtmadan
     marka kimliğini panele de taşıyor. */
  .main-col::before{ content:""; position:absolute; top:-60px; right:-60px; width:280px; height:280px; border-radius:50%; background:radial-gradient(circle, color-mix(in srgb, var(--accent2) 10%, transparent), transparent 70%); pointer-events:none; z-index:0; }
  .main{ position:relative; z-index:1; }
  .topbar-search{ display:flex; align-items:center; gap:8px; background:var(--bg); border:1px solid var(--border); border-radius:8px; padding:7px 12px; max-width:380px; flex:1; }
  .topbar-search .ico{ font-size:13px; opacity:.5; }
  .topbar-search input{ border:none; background:none; margin:0; padding:0; font-size:13.5px; flex:1; }
  .topbar-search input:focus{ outline:none; }
  .topbar-search .kbd{ font-family:var(--font-body); font-weight:600; font-size:11px; color:var(--text-muted); background:var(--bg-alt); border:1px solid var(--border); border-radius:4px; padding:1px 6px; }
  .topbar-toggle{ display:flex; align-items:center; gap:10px; }
  .topbar-toggle .theme-toggle{ position:static; box-shadow:none; }
  .icon-btn{ width:36px; height:36px; border-radius:10px; border:1px solid var(--border); background:color-mix(in srgb, var(--text) 4%, transparent); color:var(--text-muted); cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:15px; position:relative; }
  .icon-btn:hover{ background:color-mix(in srgb, var(--text) 7%, transparent); color:var(--text); }
  .notif-badge{ position:absolute; top:-4px; right:-4px; background:var(--bad); color:#fff; font-size:10px; font-weight:700; min-width:16px; height:16px; border-radius:20px; display:flex; align-items:center; justify-content:center; padding:0 3px; }
  .main{ flex:1; padding:20px 28px; width:100%; max-width:none; }
  @media (max-width:820px){
    .app-shell{ flex-direction:column; }
    .sidebar{ width:100%; padding:14px 16px; border-right:none; border-bottom:1px solid var(--border); }
    .sidebar-foot{ margin-top:14px; padding-top:14px; }
    .main{ padding:24px 18px; }
  }

  /* ---- Daraltılabilir sidebar (Ctrl+\ veya marka satırındaki oka tıkla) — Adminator'ın kendi
     "rail mode" (72px, sadece ikon) tasarımını manuel bir tetikleyiciyle de erişilebilir kılıyoruz.
     .shell bir grid olduğu için sidebar genişliği grid-template-columns'tan geliyor. ---- */
  .shell.is-collapsed{ grid-template-columns:72px 1fr; }
  .app-shell.is-collapsed .sidebar{ padding:20px 10px; }
  .app-shell.is-collapsed .brand-text, .app-shell.is-collapsed .nav-label,
  .app-shell.is-collapsed .nav-link span, .app-shell.is-collapsed .workspace-text,
  .app-shell.is-collapsed .workspace-chev, .app-shell.is-collapsed .brand-row .chev{ display:none; }
  .app-shell.is-collapsed .nav-link{ justify-content:center; }
  .app-shell.is-collapsed .workspace{ justify-content:center; }
  @media (max-width:820px){ .shell.is-collapsed{ grid-template-columns:1fr; } .app-shell.is-collapsed .sidebar{ width:100%; padding:14px 16px; } }

  /* ---- Toast bildirim sistemi — alert() yerine sağ altta beliren, kendi kendine kapanan kart ---- */
  .toast-stack{ position:fixed; right:20px; bottom:20px; z-index:9999; display:flex; flex-direction:column; gap:10px; max-width:340px; }
  .toast{ display:flex; align-items:flex-start; gap:10px; background:var(--surface); border:1px solid var(--border); border-radius:12px;
    padding:12px 14px; box-shadow:0 12px 32px -8px rgba(0,0,0,.25); font-size:13.5px; color:var(--text); animation:toastIn .25s cubic-bezier(.2,.8,.3,1); }
  .toast .ico{ flex:none; width:22px; height:22px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:12px; margin-top:1px; }
  .toast.ok .ico{ background:var(--good-bg); color:var(--good); }
  .toast.err .ico{ background:var(--bad-bg); color:var(--bad); }
  .toast.info .ico{ background:color-mix(in srgb, var(--accent2) 14%, transparent); color:var(--accent2); }
  .toast .msg{ flex:1; line-height:1.4; }
  .toast.is-leaving{ animation:toastOut .2s ease forwards; }
  @keyframes toastIn{ from{ opacity:0; transform:translateY(10px) scale(.96); } to{ opacity:1; transform:translateY(0) scale(1); } }
  @keyframes toastOut{ to{ opacity:0; transform:translateY(6px) scale(.96); } }
  @media (prefers-reduced-motion: reduce){ .toast{ animation:none; } .toast.is-leaving{ animation:none; opacity:0; } }

  /* ---- Komut paleti (⌘K) — arama kutusundaki kısayolla açılan, klavyeyle gezilen hızlı gezinme ---- */
  .cmdk-overlay{ position:fixed; inset:0; background:rgba(9,9,11,.55); backdrop-filter:blur(2px); z-index:9998; display:flex; align-items:flex-start; justify-content:center; padding-top:14vh; opacity:0; pointer-events:none; transition:opacity .15s; }
  .cmdk-overlay.is-open{ opacity:1; pointer-events:auto; }
  .cmdk-box{ width:100%; max-width:560px; background:var(--surface); border:1px solid var(--border); border-radius:16px; box-shadow:0 30px 70px -12px rgba(0,0,0,.45); overflow:hidden; transform:translateY(-8px); transition:transform .15s; }
  .cmdk-overlay.is-open .cmdk-box{ transform:translateY(0); }
  .cmdk-input-row{ display:flex; align-items:center; gap:10px; padding:14px 18px; border-bottom:1px solid var(--border); }
  .cmdk-input-row .ico{ opacity:.5; }
  .cmdk-input-row input{ border:none; background:none; margin:0; padding:0; height:auto; font-size:15px; flex:1; }
  .cmdk-input-row input:focus{ outline:none; }
  .cmdk-input-row .kbd{ font-family:var(--font-body); font-weight:600; font-size:11px; color:var(--text-muted); background:var(--bg-alt); border:1px solid var(--border); border-radius:4px; padding:2px 6px; }
  .cmdk-list{ max-height:340px; overflow-y:auto; padding:6px; }
  .cmdk-group-label{ font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--text-muted); padding:10px 10px 4px; }
  .cmdk-item{ display:flex; align-items:center; gap:11px; padding:9px 10px; border-radius:9px; cursor:pointer; font-size:13.5px; color:var(--text); }
  .cmdk-item .ico{ width:16px; text-align:center; flex:none; color:var(--text-muted); font-size:14px; }
  .cmdk-item .sub{ margin-left:auto; font-size:11.5px; color:var(--text-muted); }
  .cmdk-item.is-active{ background:color-mix(in srgb, var(--accent2) 12%, transparent); }
  .cmdk-item.is-active .ico{ color:var(--accent2); }
  .cmdk-empty{ padding:26px 18px; text-align:center; color:var(--text-muted); font-size:13px; }

  .panel-head{ display:flex; justify-content:space-between; align-items:flex-start; gap:16px; margin-bottom:22px; flex-wrap:wrap; }
  /* shadcn admin dashboard referansındaki stat kartlarıyla birebir: ikon+etiket
     başlık satırı, büyük rakam, alt açıklama, alt satırda "Detaylar" linki. */
  .stat-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:20px; }
  @media (max-width:960px){ .stat-grid{ grid-template-columns:repeat(2,1fr); } }
  @media (max-width:600px){ .stat-grid{ grid-template-columns:repeat(1,1fr); } }
  /* Ana sayfadaki yumuşak, ikon rozetli kart diliyle birebir — sert köşeli,
     ince çerçeveli "kurumsal dashboard" hissi yerine daire ikon + bol boşluk. */
  .stat-card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-card); padding:18px 20px; box-shadow:var(--card-shadow); transition:border-color .15s; }
  /* Ödeme paneli içindeki küçük özet kutucukları (Toplam/Ödenen/Bekleyen) */
  .stat-mini-tile{ background:var(--bg-alt); border:1px solid var(--border); border-radius:12px; padding:12px 14px; }
  .stat-mini-tile .l{ font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.04em; color:var(--text-muted); margin-bottom:4px; }
  .stat-mini-tile .v{ font-family:var(--font-display); font-weight:800; font-size:18px; font-variant-numeric:tabular-nums; }
  .stat-card:hover{ border-color:color-mix(in srgb, var(--text) 15%, var(--border)); }
  .stat-ico-badge{ width:32px; height:32px; border-radius:9px; background:color-mix(in srgb, var(--accent2) 12%, transparent); color:var(--accent2); display:flex; align-items:center; justify-content:center; font-size:14px; margin-bottom:8px; }
  /* Referanstaki gibi kart başına farklı renk — hepsi aynı indigo yerine
     mavi/mor/turuncu/kırmızı dönüşümlü, göz için daha canlı bir dashboard. */
  .stat-ico-badge.tone-blue{ background:#eff6ff; color:#2563eb; }
  .stat-ico-badge.tone-purple{ background:#faf5ff; color:#9333ea; }
  .stat-ico-badge.tone-orange{ background:#fff7ed; color:#ea580c; }
  .stat-ico-badge.tone-red{ background:var(--bad-bg); color:var(--bad); }
  .stat-ico-badge.tone-indigo{ background:color-mix(in srgb, var(--accent2) 12%, transparent); color:var(--accent2); }
  .stat-card .stat-head{ display:flex; align-items:center; gap:6px; font-size:11.5px; font-weight:600; color:var(--text-muted); margin-bottom:3px; }
  .stat-card .stat-head .ico{ font-size:13px; opacity:.7; }
  .stat-card .v{ font-family:var(--font-display); font-weight:800; font-size:24px; color:var(--text); letter-spacing:-.01em; font-variant-numeric:tabular-nums; line-height:1.15; }
  .stat-card .l{ font-size:10.5px; color:var(--text-muted); margin-top:1px; line-height:1.35; }
  .stat-card .stat-foot{ display:flex; justify-content:space-between; align-items:center; margin-top:8px; padding-top:7px; border-top:1px solid var(--border); font-size:10.5px; }
  .stat-card .stat-foot .det{ color:#2563eb; font-weight:600; text-decoration:none; cursor:pointer; }
  .stat-card .info-ico{ margin-left:auto; opacity:.4; cursor:help; font-size:11px; }
  .trend-badge{ display:inline-flex; align-items:center; gap:5px; font-weight:700; font-size:11px; padding:2px 7px 2px 2px; border-radius:20px; }
  /* Phoenix (prium.github.io/phoenix-tailwind) referansındaki kompakt dolu
     renkli daire trend göstergesi — büyük ok yerine küçük, dolu bir nokta. */
  .trend-badge .dot{ width:16px; height:16px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:9px; flex:none; }
  .trend-badge.up .dot{ background:var(--good); color:#fff; }
  .trend-badge.down .dot{ background:var(--bad); color:#fff; }
  .trend-badge.up{ color:var(--good); background:var(--good-bg); border:1px solid var(--good-bd); }
  .trend-badge.down{ color:var(--bad); background:var(--bad-bg); border:1px solid var(--bad-bd); }

  /* Sayfa başlığı — paylaşılan referanstaki gibi büyük kalın H1 + sağda
     dolgu(dark)/çerçeveli(outline) buton ikilisi. */
  .breadcrumb{ display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--text-muted); margin-bottom:10px; }
  .breadcrumb i{ font-size:10px; opacity:.6; }
  .page-head{ display:flex; justify-content:space-between; align-items:flex-start; gap:16px; margin-bottom:16px; flex-wrap:wrap; }
  .page-head h1{ font-family:var(--font-display); font-weight:700; font-size:20px; letter-spacing:-.01em; margin:0; }
  .page-head p{ color:var(--text-muted); font-size:12.5px; margin:3px 0 0; }
  .page-head-actions{ display:flex; gap:10px; flex:none; position:relative; z-index:1; }
  /* Topbar açılır menüleri (bildirim/hesap) sayfa içeriğinin (Kartları Düzenle vb. butonların)
     ÜSTÜNDE görünmeli — page-head-actions'a kart-ayar-pop için verdiğimiz position:relative
     kendi düşük z-index'li yığın bağlamını yarattığından üstüne çıkabiliyordu. */
  .d-topbar{ position:sticky; z-index:50; }
  .dd-menu{ z-index:200; }
  .btn-dark{ background:var(--accent2-fill); color:#fff; border:none; padding:9px 16px; border-radius:8px; font-weight:600; font-size:13.5px; cursor:pointer; font-family:var(--font-body); }
  .btn-dark:hover{ background:var(--accent2-ink); }
  .btn-outline{ background:color-mix(in srgb, var(--text) 5%, transparent); color:var(--text); border:1px solid var(--border); padding:9px 16px; border-radius:8px; font-weight:600; font-size:13.5px; cursor:pointer; font-family:var(--font-body); }
  .btn-outline:hover{ background:var(--bg-alt); }
  .chart-card svg{ display:block; }
  .chart-row{ display:grid; grid-template-columns:1.3fr 1fr .8fr; gap:12px; margin-bottom:14px; }
  .chart-row-1{ grid-template-columns:1fr; }
  .chart-row-2{ grid-template-columns:1fr 1fr; }
  @media (max-width:900px){ .chart-row-2{ grid-template-columns:1fr; } }
  .chart-row .panel{ margin-bottom:0; }
  @media (max-width:900px){ .chart-row{ grid-template-columns:1fr; } }
  /* 4. grafik (en aktif müşteriler) eklenince biraz daha dengeli dörtlü ızgara */
  .chart-row-4{ grid-template-columns:1.1fr .85fr .65fr .85fr; }
  @media (max-width:1200px){ .chart-row-4{ grid-template-columns:1fr 1fr; } }
  @media (max-width:900px){ .chart-row-4{ grid-template-columns:1fr; } }

  /* Dashboard kartlarını aç/kapat popover'ı */
  .kart-ayar-pop{ position:absolute; top:calc(100% + 6px); left:0; z-index:20; background:var(--surface); border:1px solid var(--border);
    border-radius:12px; box-shadow:0 16px 40px -10px rgba(0,0,0,.25); padding:8px; min-width:200px; }
  .kart-ayar-item{ display:flex; align-items:center; gap:9px; padding:7px 9px; border-radius:8px; font-size:13px; cursor:pointer; }
  .kart-ayar-item:hover{ background:var(--bg-alt); }
  .kart-ayar-item input{ width:auto; height:auto; margin:0; }

  /* Tablo çoklu seçim aksiyon çubuğu */
  .bulk-bar{ display:flex; align-items:center; gap:10px; background:color-mix(in srgb, var(--accent2) 8%, var(--surface)); border:1px solid color-mix(in srgb, var(--accent2) 25%, var(--border));
    border-radius:12px; padding:10px 14px; margin-bottom:10px; font-size:13.5px; }
  .bulk-bar button{ padding:6px 12px; font-size:12.5px; }
  table input[type="checkbox"]{ width:auto; height:auto; margin:0; cursor:pointer; }

  /* Tedarikçi ülkeleri haritası */
  /* Nellavio referansındaki RevenuePerCountry kartıyla aynı oran: harita %65, liste %35,
     sabit bir yükseklik içinde (referansta h-92/h-108 ~ 368-432px) — tüm sayfayı kaplayan
     dev bir harita yerine, kart içinde kontrollü, kompakt bir görünüm. */
  .ulke-harita-grid{ display:flex; gap:20px; align-items:flex-start; height:22rem; }
  .ulke-harita-grid > .ulke-harita-col{ width:65%; height:100%; display:flex; align-items:center; justify-content:center; }
  .ulke-harita-grid > .ulke-liste-col{ width:35%; height:100%; overflow-y:auto; }
  @media (max-width:820px){ .ulke-harita-grid{ flex-direction:column; height:auto; }
    .ulke-harita-grid > .ulke-harita-col, .ulke-harita-grid > .ulke-liste-col{ width:100%; height:auto; } }
  .ulke-harita-wrap{ position:relative; width:100%; max-height:22rem; }
  .ulke-path{ cursor:pointer; transition:fill .1s, fill-opacity .1s; }
  .ulke-path.is-hover{ fill:var(--accent2) !important; fill-opacity:1 !important; stroke:var(--text); stroke-width:1; }
  .ulke-tooltip{ position:absolute; top:0; left:0; opacity:0; pointer-events:none; z-index:5; white-space:nowrap;
    background:var(--text); color:var(--bg); font-size:12.5px; font-weight:600; padding:6px 11px; border-radius:8px;
    box-shadow:0 8px 20px -6px rgba(0,0,0,.35); transition:opacity .08s; }

  /* Takvim */
  .takvim-hafta-etiket{ display:grid; grid-template-columns:repeat(7,1fr); gap:6px; margin-bottom:8px; }
  .takvim-hafta-etiket div{ text-align:center; font-size:11px; font-weight:700; text-transform:uppercase; color:var(--text-muted); }
  .takvim-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:6px; }
  .takvim-gun{ aspect-ratio:1; border-radius:10px; border:1px solid var(--border); background:var(--bg-alt); padding:8px; display:flex; flex-direction:column; gap:6px; }
  .takvim-gun.bos{ border:none; background:none; }
  .takvim-gun .gn{ font-size:12.5px; font-weight:600; color:var(--text-muted); }
  .takvim-gun.bugun{ border-color:var(--accent2); box-shadow:0 0 0 1px var(--accent2); }
  .takvim-gun.bugun .gn{ color:var(--accent2); font-weight:800; }
  .takvim-gun.dolu{ cursor:pointer; background:color-mix(in srgb, var(--accent2) 6%, var(--bg-alt)); }
  .takvim-gun.dolu:hover{ background:color-mix(in srgb, var(--accent2) 12%, var(--bg-alt)); }
  .takvim-badge{ margin-top:auto; font-size:10px; font-weight:700; color:#fff; background:var(--accent2); border-radius:20px; padding:2px 7px; align-self:flex-start; }
  @media (max-width:700px){ .takvim-gun{ padding:5px; } .takvim-badge{ font-size:8.5px; padding:1px 5px; } }
  .filter-row{ display:flex; gap:12px; margin-bottom:18px; flex-wrap:wrap; }
  .filter-row input{ flex:1; min-width:220px; margin-bottom:0; }
  .filter-row select{ width:auto; min-width:180px; margin-bottom:0; }
  .panel-head p{ color:var(--text-muted); font-size:14px; margin:6px 0 0; }
  /* shadcn/ui "Card" bileşeniyle birebir: rounded-lg + ince kenarlık + shadow-sm */
  .panel{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-card); padding:20px 22px; margin-bottom:14px; box-shadow:var(--card-shadow); }
  .panel h2{ letter-spacing:-.02em; }
  .empty-state{ background:var(--surface); border:1px dashed var(--border); border-radius:16px; padding:36px; text-align:center; color:var(--text-muted); }
  /* Müşteri panelindekiyle birebir aynı adım göstergesi. */
  .adim-takip{ display:flex; align-items:flex-start; padding:6px 4px; }
  .adim{ flex:1; display:flex; flex-direction:column; align-items:center; position:relative; text-align:center; }
  .adim-daire{ width:38px; height:38px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:15px; background:var(--bg-alt); color:var(--text-muted); border:2px solid var(--border); z-index:1; flex:none; transition:all .2s; }
  .adim.done .adim-daire{ background:var(--good); color:#fff; border-color:var(--good); }
  .adim.current .adim-daire{ background:#fff; color:var(--accent2); border-color:var(--accent2); box-shadow:0 0 0 4px color-mix(in srgb, var(--accent2) 16%, transparent); }
  .adim.iptal .adim-daire{ background:var(--bad-bg); color:var(--bad); border-color:var(--bad-bd); }
  .adim.current.renk-blue .adim-daire{ background:#fff; color:#2563eb; border-color:#2563eb; box-shadow:0 0 0 4px rgba(37,99,235,.16); }
  .adim.current.renk-purple .adim-daire{ background:#fff; color:#9333ea; border-color:#9333ea; box-shadow:0 0 0 4px rgba(147,51,234,.16); }
  .adim.current.renk-orange .adim-daire{ background:#fff; color:#ea580c; border-color:#ea580c; box-shadow:0 0 0 4px rgba(234,88,12,.16); }
  .adim.current.renk-cyan .adim-daire{ background:#fff; color:#0e7490; border-color:#0e7490; box-shadow:0 0 0 4px rgba(14,116,144,.16); }
  .adim.current.renk-green .adim-daire{ background:#fff; color:var(--good); border-color:var(--good); box-shadow:0 0 0 4px var(--good-bg); }
  .adim.done .adim-daire{ color:#fff; }
  .adim-ad{ font-size:11.5px; font-weight:600; color:var(--text-muted); margin-top:8px; max-width:80px; line-height:1.3; }
  .adim.done .adim-ad, .adim.current .adim-ad{ color:var(--text); }
  .adim-cizgi{ position:absolute; top:19px; left:50%; width:100%; height:2px; background:var(--border); z-index:0; }
  .adim.done .adim-cizgi{ background:var(--good); }
  @media (max-width:600px){ .adim-ad{ display:none; } .adim-daire{ width:30px; height:30px; font-size:12px; } .adim-cizgi{ top:15px; } }
  /* Önceki/Sıradaki aşama kartları — ikon rozetli, pill butonlu. */
  .faz-nav-card{ flex:1; min-width:220px; padding:18px; background:var(--bg-alt); border-radius:16px; border:1px solid var(--border); }
  .faz-nav-card .faz-nav-label{ display:flex; align-items:center; gap:6px; font-size:11px; color:var(--text-muted); text-transform:uppercase; letter-spacing:.05em; font-weight:700; }
  .faz-nav-card .faz-nav-ad{ font-weight:800; font-size:16px; margin:6px 0 14px; }

  /* Kurumsal tablo: mono/kod fontu yok (Inter + tabular-nums), satır başına
     müşteri avatarı, kategoriye göre renklendirilmiş durum rozetleri. */
  .table-card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-card); overflow:hidden; box-shadow:var(--card-shadow); }
  .pagination{ display:flex; align-items:center; justify-content:space-between; padding:14px 20px; border-top:1px solid var(--border); font-size:12.5px; color:var(--text-muted); flex-wrap:wrap; gap:10px; }
  .pagination-btns{ display:flex; align-items:center; gap:10px; }
  .pagination-btns button{ width:28px; height:28px; border-radius:8px; border:1px solid var(--border); background:var(--surface); color:var(--text); cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:12px; }
  .pagination-btns button:hover:not(:disabled){ background:var(--bg-alt); }
  .pagination-btns button:disabled{ opacity:.35; cursor:not-allowed; }
  .pagination-sayfa{ font-weight:600; color:var(--text); }
  .table-wrap{ overflow-x:auto; }
  table{ width:100%; border-collapse:collapse; font-size:13.5px; font-family:var(--font-body); }
  th,td{ text-align:left; padding:11px 16px; border-bottom:1px solid var(--border); white-space:nowrap; }
  th{ font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--text-muted); font-weight:700; background:transparent; padding-top:20px; }
  tbody tr{ cursor:pointer; transition:background .1s; }
  tbody tr:hover{ background:var(--bg-alt); }
  tbody tr:last-child td{ border-bottom:none; }
  .siparis-no{ font-variant-numeric:tabular-nums; font-weight:700; color:var(--text); letter-spacing:-.01em; }
  .row-cust{ display:flex; align-items:center; gap:10px; }
  .row-cust .av{ width:30px; height:30px; border-radius:50%; background:color-mix(in srgb, var(--accent2) 14%, transparent); color:var(--accent2); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:11.5px; flex:none; }
  .pill{ display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:600; letter-spacing:0; text-transform:none; padding:4px 10px; border-radius:20px; background:var(--bg-alt); color:var(--text-muted); border:1px solid var(--border); white-space:nowrap; }
  .pill::before{ content:""; width:6px; height:6px; border-radius:50%; background:currentColor; }
  .pill.st-blue{ background:#eff6ff; color:#1d4ed8; border-color:#bfdbfe; }
  .pill.st-purple{ background:#faf5ff; color:#7e22ce; border-color:#e9d5ff; }
  .pill.st-orange{ background:#fff7ed; color:#c2410c; border-color:#fed7aa; }
  .pill.st-amber{ background:#fffbeb; color:#b45309; border-color:#fde68a; }
  .pill.st-teal{ background:#f0fdfa; color:#0f766e; border-color:#99f6e4; }
  .pill.st-pink{ background:#fdf2f8; color:#be185d; border-color:#fbcfe8; }
  .pill.st-cyan{ background:#ecfeff; color:#0e7490; border-color:#a5f3fc; }
  .pill.st-green{ background:var(--good-bg); color:var(--good); border-color:var(--good-bd); }
  .pill.st-red{ background:var(--bad-bg); color:var(--bad); border-color:var(--bad-bd); }
  .back{ background:none; border:none; color:var(--text-muted); font-size:13.5px; cursor:pointer; margin-bottom:16px; padding:0; font-weight:600; }
  .meta{ font-size:13px; color:var(--text-muted); margin-bottom:18px; }
</style>
</head>
<body>
<div id="app"></div>
<!-- render() her view değişiminde #app'ı komple değiştirdiği için toast/komut paleti #app DIŞINDA —
     yoksa bir bildirim gösterilirken sayfa değişince toast kaybolur, palet açıkken kapanırdı. -->
<div class="toast-stack" id="toastStack" aria-live="polite"></div>
<div class="cmdk-overlay" id="cmdkOverlay">
  <div class="cmdk-box" role="dialog" aria-label="Komut paleti">
    <div class="cmdk-input-row">
      <span class="ico"><i class="bi bi-search"></i></span>
      <input id="cmdkInput" placeholder="Sipariş no, müşteri veya sayfa ara..." autocomplete="off">
      <span class="kbd">Esc</span>
    </div>

<script>
const API = '';
let token = localStorage.getItem('tk_admin_token');
let adminEmail = localStorage.getItem('tk_admin_email') || '';
const _siparisParam = new URLSearchParams(location.search).get('siparis');

// Müşteri panelindeki adım göstergesiyle BİREBİR aynı — admin da aynı görsel
// dilde "neredeyiz" görsün, iki panel arasında tutarsızlık olmasın.
const ANA_FAZLAR = [
  { ad:'Talep & Teklif', ico:'bi-file-earmark-text', renk:'blue', test: k => ['talep_alindi','fabrika_gorusuluyor','teklif_hazir'].includes(k) },
  { ad:'Numune', ico:'bi-flask', renk:'purple', test: k => k.startsWith('numune_') },

  { ad:'Sevkiyat', ico:'bi-truck', renk:'cyan', test: k => ['sevkiyat_belgeleri_hazirlaniyor','konteyner','yukleme_odeme_bekleniyor','gemide','teslimat_yolda'].includes(k) },
  { ad:'Gümrük', ico:'bi-shield-check', renk:'cyan', test: k => k.startsWith('gumruk_') },
  { ad:'Teslim', ico:'bi-box-seam', renk:'green', test: k => k === 'teslim_edildi' },
];
function adimTakipcisi(durum) {

      return `<div class="adim ${d} renk-${f.renk}">

        <div class="adim-ad">${f.ad}</div>
        ${i < ANA_FAZLAR.length - 1 ? '<div class="adim-cizgi"></div>' : ''}

    }).join('')}

}

// Durum kodunu, tablo/pill'lerde kullanılan renk kategorisine çevirir —
// 19 aşamalı gerçek süreç fazlarına göre (Talep/Numune/Üretim/Sevkiyat/Gümrük/Teslim).
// Müşteri avatarlarına isimden türetilmiş, sabit (her seferinde aynı) bir renk
// atar — hepsi tek bir indigo yerine mavi/mor/turuncu/pembe/camgöbeği/yeşil
// arasında dönerek görsel çeşitlilik ve "kimin kim olduğunu" ayırt etmeyi kolaylaştırır.
const AVATAR_PALET = [
  ['#eff6ff', '#2563eb'], ['#faf5ff', '#9333ea'], ['#fff7ed', '#ea580c'],
  ['#fdf2f8', '#db2777'], ['#ecfeff', '#0e7490'], ['#ecfdf3', '#12b76a'],
  ['#fefce8', '#a16207'], ['#eef2ff', '#4f46e5'],
];
function avatarRengi(isim) {
  let h = 0;
  for (let i = 0; i < (isim||'?').length; i++) h = (h * 31 + isim.charCodeAt(i)) >>> 0;
  return AVATAR_PALET[h % AVATAR_PALET.length];
}

function durumRenkSinifi(durum) {
  // Her faz kendi net renginde, hiçbiri mavi ailesiyle karışmasın diye özenle
  // ayrıştırıldı — özellikle "Gemide" (sipariş hacminin büyük kısmı) artık
  // camgöbeği/mavi değil, sıcak turkuaz-yeşil (teal) tonunda.
  if (durum === 'iptal_edildi') return 'st-red';
  if (['numune_revizyon_istendi','beklemede'].includes(durum)) return 'st-amber';
  if (durum === 'teslim_edildi') return 'st-green';
  if (['talep_alindi','fabrika_gorusuluyor','teklif_hazir'].includes(durum)) return 'st-blue';
  if (durum.startsWith('numune_')) return 'st-purple';
  if (durum.startsWith('uretim_') || durum === 'uretimde') return 'st-orange';
  if (['sevkiyat_belgeleri_hazirlaniyor','konteyner','yukleme_odeme_bekleniyor','gemide','teslimat_yolda'].includes(durum)) return 'st-teal';
  if (durum.startsWith('gumruk_')) return 'st-pink';
  return '';
}

// ---- Ülke adı (TR serbest metin) → {en, iso2} — bayrak emoji ve harita eşleştirmesi için.
// Kapsam: tedarik/lojistik sektöründe fiilen karşılaşılan ülkeler; eşleşmeyen ülke sessizce
// atlanır (harita bozulmaz, sadece o ülke vurgulanmaz) — uydurma eşleştirme yapılmaz.
const ULKE_ESLESTIRME = {
  'çin':{en:'China',iso2:'CN'}, 'turkiye':{en:'Turkey',iso2:'TR'}, 'türkiye':{en:'Turkey',iso2:'TR'},
  'vietnam':{en:'Vietnam',iso2:'VN'}, 'hindistan':{en:'India',iso2:'IN'}, 'pakistan':{en:'Pakistan',iso2:'PK'},
  'bangladeş':{en:'Bangladesh',iso2:'BD'}, 'bangladesh':{en:'Bangladesh',iso2:'BD'}, 'endonezya':{en:'Indonesia',iso2:'ID'},
  'tayland':{en:'Thailand',iso2:'TH'}, 'malezya':{en:'Malaysia',iso2:'MY'}, 'güney kore':{en:'South Korea',iso2:'KR'},
  'guney kore':{en:'South Korea',iso2:'KR'}, 'japonya':{en:'Japan',iso2:'JP'}, 'almanya':{en:'Germany',iso2:'DE'},
  'italya':{en:'Italy',iso2:'IT'}, 'i̇talya':{en:'Italy',iso2:'IT'}, 'ispanya':{en:'Spain',iso2:'ES'},
  'fransa':{en:'France',iso2:'FR'}, 'ingiltere':{en:'United Kingdom',iso2:'GB'}, 'birleşik krallık':{en:'United Kingdom',iso2:'GB'},
  'abd':{en:'United States of America',iso2:'US'}, 'amerika':{en:'United States of America',iso2:'US'},
  'hollanda':{en:'Netherlands',iso2:'NL'}, 'polonya':{en:'Poland',iso2:'PL'}, 'birleşik arap emirlikleri':{en:'United Arab Emirates',iso2:'AE'},
  'bae':{en:'United Arab Emirates',iso2:'AE'}, 'mısır':{en:'Egypt',iso2:'EG'}, 'misir':{en:'Egypt',iso2:'EG'},
  'brezilya':{en:'Brazil',iso2:'BR'}, 'meksika':{en:'Mexico',iso2:'MX'}, 'rusya':{en:'Russia',iso2:'RU'},
  'tayvan':{en:'Taiwan',iso2:'TW'}, 'filipinler':{en:'Philippines',iso2:'PH'}, 'kamboçya':{en:'Cambodia',iso2:'KH'},
  'kamboca':{en:'Cambodia',iso2:'KH'}, 'sri lanka':{en:'Sri Lanka',iso2:'LK'}, 'yunanistan':{en:'Greece',iso2:'GR'},
  'portekiz':{en:'Portugal',iso2:'PT'}, 'belçika':{en:'Belgium',iso2:'BE'}, 'belcika':{en:'Belgium',iso2:'BE'},
};
function ulkeEslestir(ulkeMetni) {
  if (!ulkeMetni) return null;
  const key = ulkeMetni.trim().toLowerCase();
  return ULKE_ESLESTIRME[key] || null;
}
function bayrakEmoji(iso2) {
  if (!iso2) return '🏳️';
  return String.fromCodePoint(...iso2.toUpperCase().split('').map(c => 0x1f1e6 + c.charCodeAt(0) - 65));
}
let ulkeMapSayac = 0;
let ulkeMapAktif = null; // jsVectorMap instance'ı — sayfa değişince destroy edilir
// jsVectorMap'i konteyner DOM'a eklendikten SONRA çağırıyoruz (kütüphane var olan bir
// elementin boyutunu ölçerek çiziyor). Koyu/açık temaya göre renkleri elle veriyoruz
// çünkü kütüphane CSS custom property'leri otomatik izlemiyor.
let ulkeMapSonParam = null; // tema değişince aynı haritayı yeni renklerle yeniden çizmek için
function ulkeMapBaslat(containerId, ulkeSayim) {
  if (typeof jsVectorMap === 'undefined') { setTimeout(() => ulkeMapBaslat(containerId, ulkeSayim), 150); return; }
  if (!document.getElementById(containerId)) return;
  ulkeMapSonParam = { containerId, ulkeSayim };
  if (ulkeMapAktif) { try { ulkeMapAktif.destroy(); } catch (e) {} ulkeMapAktif = null; }
  // .destroy() eski SVG'yi konteynerden temizlemiyor (üst üste binmeye sebep oluyordu) — elle boşaltıyoruz
  document.getElementById(containerId).innerHTML = '';
  const koyu = getComputedStyle(document.documentElement).getPropertyValue('--surface').trim() !== '#ffffff';
  const bosRenk = koyu ? '#26242e' : '#e8e8ef';
  const values = {};
  Object.values(ulkeSayim).forEach(v => { values[v.iso2] = v.count; });
  ulkeMapAktif = new jsVectorMap({
    selector: '#' + containerId,
    map: 'world',
    zoomButtons: false,
    zoomOnScroll: false,
    regionsSelectable: false,
    backgroundColor: 'transparent',
    regionStyle: {
      initial: { fill: bosRenk, stroke: koyu ? '#3a3844' : '#d8d8e2', strokeWidth: 0.4 },
      hover: { fill: '#1fae70', cursor: 'pointer' },
    },
    series: {
      regions: [{
        values,
        scale: [koyu ? '#1a4a36' : '#bfe8d6', '#1fae70'],
        normalizeFunction: 'polynomial',
      }],
    },
    onRegionTooltipShow(event, tooltip, code) {
      const eslesen = Object.values(ulkeSayim).find(v => v.iso2 === code);
      if (eslesen) tooltip.text(tooltip.text() + ' — ' + eslesen.count + ' tedarikçi', false);
    },
  });
}
function tedarikciUlkeHaritasi(rows) {
  const ulkeSayim = {};
  rows.forEach(t => {
    const e = ulkeEslestir(t.ulke);
    if (!e) return;
    ulkeSayim[e.en] = ulkeSayim[e.en] || { count: 0, iso2: e.iso2, orijinal: t.ulke };
    ulkeSayim[e.en].count++;
  });
  const containerId = 'ulkeMap' + (++ulkeMapSayac);
  const mapSvg = `<div id="${containerId}" style="width:100%; height:100%;"></div>`;
  setTimeout(() => ulkeMapBaslat(containerId, ulkeSayim), 0);
  const liste = Object.entries(ulkeSayim).sort((a, b) => b[1].count - a[1].count);
  return `<div class="panel" style="margin-bottom:16px;">
    <h2 style="font-size:15px; margin-bottom:2px;">Tedarikçi Ülkeleri</h2>
    <p style="color:var(--text-muted); font-size:12.5px; margin:0 0 14px;">Kayıtlı tedarikçilerin bulunduğu ülkeler, gerçek veri — üzerine gelin, ülke adını görün</p>
    <div class="ulke-harita-grid">
      <div class="ulke-harita-col">${mapSvg}</div>
      <div class="ulke-liste-col">
        <div style="display:flex; justify-content:space-between; font-size:11px; font-weight:700; color:var(--text-muted); text-transform:uppercase; letter-spacing:.04em; padding-bottom:8px; border-bottom:1px solid var(--border); margin-bottom:4px;">
          <span>Ülke</span><span>Tedarikçi</span>
        </div>
        ${liste.length ? liste.map(([en, v]) => `
        <div style="display:flex; align-items:center; gap:9px; padding:8px 0; border-bottom:1px solid var(--border);">
          <span style="font-size:17px;">${bayrakEmoji(v.iso2)}</span>
          <span style="flex:1; font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${v.orijinal}</span>
          <b style="font-variant-numeric:tabular-nums;">${v.count}</b>
        </div>`).join('') : '<p style="color:var(--text-muted); font-size:12.5px;">Henüz eşleşen ülke yok.</p>'}
      </div>
    </div>
  </div>`;
}

  <div class="page-head">
    <div><h1>Tedarikçiler</h1><p>${rows.length} kayıtlı fabrika/tedarikçi — performans, gerçek sipariş verisinden hesaplanıyor.</p></div>
    <div class="page-head-actions"><button class="btn-dark" onclick="tedarikciFormAc()">＋ Yeni Tedarikçi</button></div>
  </div>
  <div id="tedarikciForm"></div>
  ${tedarikciUlkeHaritasi(rows)}`;

    html += '<div class="empty-state">Henüz tedarikçi kaydı yok.</div>';

    html += '<div class="table-card"><div class="table-wrap"><table><thead><tr><th>Tedarikçi</th><th>Konum</th><th>İletişim</th><th>Sipariş</th><th>Tamamlanan</th><th>Ort. Teslim Süresi</th><th></th></tr></thead><tbody>';
    rows.forEach(t => {
      const [avBg, avFg] = avatarRengi(t.ad);
      html += `<tr>
        <td><div class="row-cust"><div class="av" style="background:${avBg}; color:${avFg};">${t.ad.charAt(0).toUpperCase()}</div><div><b>${t.ad}</b>${t.iletisim_kisi ? `<br><span style="color:var(--text-muted); font-size:12px;">${t.iletisim_kisi}</span>` : ''}</div></div></td>
        <td>${[t.sehir, t.ulke].filter(Boolean).join(', ') || '—'}</td>
        <td style="font-size:12.5px;">${t.email ? `<a href="mailto:${t.email}" style="color:var(--text-muted); text-decoration:none;">${t.email}</a><br>` : ''}${t.telefon || ''}</td>
        <td style="font-variant-numeric:tabular-nums;">${t.siparis_sayisi}</td>
        <td style="font-variant-numeric:tabular-nums;">${t.tamamlanan_sayisi}</td>
        <td style="font-variant-numeric:tabular-nums;">${t.ortalama_teslim_gun != null ? t.ortalama_teslim_gun + ' gün' : '—'}</td>
        <td><button class="secondary" style="padding:6px 12px; font-size:12px;" onclick='tedarikciFormAc(${JSON.stringify(t).replace(/'/g,"&apos;")})'>Düzenle</button></td>
      </tr>`;
    });
    html += '</tbody></table></div></div>';
  }
  main.innerHTML = html;
}

    sehir: document.getElementById('tSehir').value.trim() || null,
    iletisim_kisi: document.getElementById('tIletisim').value.trim() || null,
    telefon: document.getElementById('tTelefon').value.trim() || null,
    email: document.getElementById('tEmail').value.trim() || null,
    notlar: document.getElementById('tNotlar').value.trim() || null,

// ---- Takvim — gerçek sipariş tarihlerine göre ay görünümü (Nellavio'daki FullCalendar
// entegrasyonunun sadeleştirilmiş, harici kütüphanesiz karşılığı; sürükle-bırak yerine
// tıklayınca o güne ait siparişlere gidiyor — canlı veriyle çalışan, gerçek bir takvim). ----
let takvimTarih = new Date();
async function takvimYukle() {
  const main = document.querySelector('.main');
  main.innerHTML = '<div class="empty-state">Yükleniyor…</div>';
  if (!siparisRowsCache.length) {
    const res = await fetch(API + '/api/tk/admin/siparisler', {headers:{'Authorization':'Bearer '+token}});
    if (res.status === 401) { cikisYap(); return; }
    siparisRowsCache = await res.json();
  }
  takvimCiz();
}
function takvimCiz() {
  const main = document.querySelector('.main');
  const yil = takvimTarih.getFullYear(), ay = takvimTarih.getMonth();
  const gunler = {};
  siparisRowsCache.forEach(r => {
    const d = new Date(r.olusturulma);
    if (d.getFullYear() === yil && d.getMonth() === ay) {
      const key = d.getDate();
      (gunler[key] = gunler[key] || []).push(r);
    }
  });
  const ilkGun = new Date(yil, ay, 1).getDay(); // 0=Pazar
  const bosBaslangic = (ilkGun + 6) % 7; // Pazartesi başlangıçlı
  const gunSayisi = new Date(yil, ay + 1, 0).getDate();
  const bugun = new Date();
  let hucreler = '';
  for (let i = 0; i < bosBaslangic; i++) hucreler += '<div class="takvim-gun bos"></div>';
  for (let g = 1; g <= gunSayisi; g++) {
    const list = gunler[g] || [];
    const buGun = bugun.getFullYear() === yil && bugun.getMonth() === ay && bugun.getDate() === g;
    hucreler += `<div class="takvim-gun${buGun ? ' bugun' : ''}${list.length ? ' dolu' : ''}" ${list.length ? `onclick="takvimGuneGit(${yil},${ay},${g})"` : ''}>
      <span class="gn">${g}</span>
      ${list.length ? `<span class="takvim-badge">${list.length} sipariş</span>` : ''}
    </div>`;
  }
  main.innerHTML = `<div class="breadcrumb">Genel <i class="bi bi-chevron-right"></i> Takvim</div>
  <div class="page-head"><div><h1>Takvim</h1><p>Siparişlerin oluşturulma tarihlerine göre aylık görünüm.</p></div>
    <div class="page-head-actions">
      <button class="btn-outline" onclick="takvimAyDegistir(-1)"><i class="bi bi-chevron-left"></i></button>
      <span style="align-self:center; font-weight:700; min-width:130px; text-align:center;">${takvimTarih.toLocaleDateString('tr-TR', {month:'long', year:'numeric'})}</span>
      <button class="btn-outline" onclick="takvimAyDegistir(1)"><i class="bi bi-chevron-right"></i></button>
    </div>
  </div>
  <div class="panel">
    <div class="takvim-hafta-etiket">${['Pzt','Sal','Çar','Per','Cum','Cmt','Paz'].map(g => `<div>${g}</div>`).join('')}</div>
    <div class="takvim-grid">${hucreler}</div>
  </div>`;
}
function takvimAyDegistir(delta) {
  takvimTarih = new Date(takvimTarih.getFullYear(), takvimTarih.getMonth() + delta, 1);
  takvimCiz();
}
function takvimGuneGit(yil, ay, gun) {
  const tarihStr = new Date(yil, ay, gun).toLocaleDateString('tr-TR', {day:'2-digit', month:'short'});
  view = 'liste'; render();
  setTimeout(() => {
    const el = document.getElementById('filtreArama');
    if (el) { el.value = tarihStr; siparisSayfa = 1; siparisListesiCiz(); }
  }, 60);
}

// ---- Analitik — Nellavio'nun Analytics sayfasının karşılığı: 4 KPI kartı + yıllık genel
// bakış + en değerli müşteriler + son işlemler, hepsi gerçek sipariş/ödeme verisinden. ----
function analitikKpiKarti(icon, label, value, tone) {
  return `<div class="stat-card" style="display:flex; align-items:flex-start; gap:14px;">
    <div class="stat-ico-badge tone-${tone}" style="width:40px; height:40px; font-size:17px; margin-bottom:0;">${icon}</div>
    <div><div class="stat-head" style="margin-bottom:5px;">${label}</div><div class="v" style="font-size:22px;">${value}</div></div>
  </div>`;
}
function yillikGenelBakisGrafigi(rows) {
  const yil = new Date().getFullYear();
  const aylar = ['Oca','Şub','Mar','Nis','May','Haz','Tem','Ağu','Eyl','Eki','Kas','Ara'];
  const sayim = new Array(12).fill(0);
  rows.forEach(r => { const d = new Date(r.olusturulma); if (d.getFullYear() === yil) sayim[d.getMonth()]++; });
  const maxN = Math.max(1, ...sayim);
  const W = 760, H = 180, PAD = 26, stepX = (W - PAD*2) / 12, barW = stepX * 0.55;
  const bars = sayim.map((n, i) => {
    const h = (n / maxN) * (H - PAD*2 - 14);
    const x = PAD + i*stepX + (stepX - barW)/2, y = H - PAD - h;
    return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${h.toFixed(1)}" rx="3" fill="var(--accent2)"/>
      <text x="${(x+barW/2).toFixed(1)}" y="${(H-PAD+12).toFixed(1)}" font-size="9" fill="var(--text-muted)" text-anchor="middle">${aylar[i]}</text>`;
  }).join('');
  return `<div class="panel chart-card">
    <h2 style="font-size:15px;">${yil} Yılı Genel Bakış</h2>
    <p style="color:var(--text-muted); font-size:12.5px; margin:0 0 10px;">Aylara göre sipariş sayısı, gerçek veri</p>
    <svg viewBox="0 0 ${W} ${H}" style="width:100%; height:auto;">${bars}</svg>
  </div>`;
}
function enDegerliMusteriler(rows) {
  const grup = {};
  rows.forEach(r => {
    const ad = r.musteri || r.email || 'Bilinmiyor';
    grup[ad] = grup[ad] || { odenen: 0, siparis: 0, para: r.para_birimi || 'USD' };
    grup[ad].odenen += Number(r.odenen_toplam || 0);
    grup[ad].siparis++;
  });
  const top = Object.entries(grup).sort((a, b) => b[1].odenen - a[1].odenen).filter(([,v]) => v.odenen > 0).slice(0, 5);
  const paraSembol = { USD:'$', EUR:'€', TRY:'₺', GBP:'£' };
  return `<div class="panel">
    <h2 style="font-size:15px; margin-bottom:2px;">En Değerli Müşteriler</h2>
    <p style="color:var(--text-muted); font-size:12.5px; margin:0 0 12px;">Tahsil edilen tutara göre, gerçek ödeme kayıtları</p>
    ${top.length ? top.map(([ad, v], i) => {
      const [avBg, avFg] = avatarRengi(ad);
      return `<div style="display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid var(--border);">
        <div class="av" style="background:${avBg}; color:${avFg}; width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:12px; flex:none;">${(ad||'?').charAt(0).toUpperCase()}</div>
        <div style="flex:1; min-width:0;"><div style="font-size:13px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${ad}</div><div style="font-size:11px; color:var(--text-muted);">${v.siparis} sipariş</div></div>
        <b style="font-variant-numeric:tabular-nums;">${paraSembol[v.para] || ''}${v.odenen.toLocaleString('tr-TR', {maximumFractionDigits:0})}</b>
      </div>`;
    }).join('') : '<p style="color:var(--text-muted); font-size:12.5px;">Henüz tahsilat kaydı yok.</p>'}
  </div>`;
}
function sonIslemlerListesi(rows) {
  const son = [...rows].sort((a, b) => new Date(b.olusturulma) - new Date(a.olusturulma)).slice(0, 6);
  return `<div class="panel">
    <h2 style="font-size:15px; margin-bottom:2px;">Son İşlemler</h2>
    <p style="color:var(--text-muted); font-size:12.5px; margin:0 0 12px;">En yeni 6 sipariş</p>
    ${son.map(r => `<div style="display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid var(--border); cursor:pointer;" onclick="aktifSiparisNo='${r.siparis_no}'; view='detay'; render();">
      <div style="width:30px; height:30px; border-radius:9px; background:var(--bg-alt); display:flex; align-items:center; justify-content:center; flex:none;"><i class="bi bi-box-seam" style="font-size:13px; color:var(--text-muted);"></i></div>
      <div style="flex:1; min-width:0;"><div style="font-size:13px; font-weight:600;">${r.siparis_no}</div><div style="font-size:11px; color:var(--text-muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${r.musteri || ''} — ${r.urun_aciklamasi}</div></div>
      <span class="pill ${durumRenkSinifi(r.durum)}">${r.durum_adi}</span>
    </div>`).join('')}
  </div>`;
}
async function analitikYukle() {
  const main = document.querySelector('.main');
  main.innerHTML = '<div class="empty-state">Yükleniyor…</div>';
  let rows = siparisRowsCache;
  if (!rows.length) {
    const res = await fetch(API + '/api/tk/admin/siparisler', {headers:{'Authorization':'Bearer '+token}});
    if (res.status === 401) { cikisYap(); return; }
    rows = siparisRowsCache = await res.json();
  }
  const paraSembol = { USD:'$', EUR:'€', TRY:'₺', GBP:'£' };
  const tutarli = rows.filter(r => r.toplam_tutar != null);
  const paraGrup = {};
  tutarli.forEach(r => { const c = r.para_birimi || 'USD'; paraGrup[c] = paraGrup[c] || {toplam:0, odenen:0}; paraGrup[c].toplam += Number(r.toplam_tutar); paraGrup[c].odenen += Number(r.odenen_toplam || 0); });
  const anaPara = Object.keys(paraGrup).sort((a,b) => paraGrup[b].toplam - paraGrup[a].toplam)[0];
  const ciro = anaPara ? paraGrup[anaPara].toplam : 0;
  const tahsilEdilen = anaPara ? paraGrup[anaPara].odenen : 0;
  const aktifMusteri = new Set(rows.map(r => r.email)).size;
  main.innerHTML = `<div class="breadcrumb">Genel <i class="bi bi-chevron-right"></i> Analitik</div>
  <div class="page-head"><div><h1>Analitik</h1><p>Ciro, tahsilat ve müşteri performansı — tamamı gerçek sipariş/ödeme verisinden.</p></div></div>
  <div class="stat-grid">
    ${analitikKpiKarti('<i class="bi bi-truck"></i>', 'Toplam Ciro', anaPara ? paraSembol[anaPara]+ciro.toLocaleString('tr-TR',{maximumFractionDigits:0}) : '—', 'blue')}
    ${analitikKpiKarti('<i class="bi bi-cash-stack"></i>', 'Tahsil Edilen', anaPara ? paraSembol[anaPara]+tahsilEdilen.toLocaleString('tr-TR',{maximumFractionDigits:0}) : '—', 'green')}
    ${analitikKpiKarti('<i class="bi bi-people"></i>', 'Aktif Müşteri', aktifMusteri, 'purple')}
    ${analitikKpiKarti('<i class="bi bi-cart3"></i>', 'Toplam Sipariş', rows.length, 'orange')}
  </div>
  <div class="chart-row chart-row-1" style="margin-top:6px;">${yillikGenelBakisGrafigi(rows)}</div>
  <div class="chart-row chart-row-2">${enDegerliMusteriler(rows)}${sonIslemlerListesi(rows)}</div>`;
}

  const mevcut_sifre = document.getElementById('pMevcutSifre').value;

    method:'POST', headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},

function ekipListesi() {
  try {

  const varsayilan = [{ email: adminEmail || 'ekip@cintedarikagi.com', rol: 'admin' }];

  return varsayilan;
}
function ekipKaydet(liste) { localStorage.setItem('tk_admin_team', JSON.stringify(liste)); }
function benimRolum() {
  const ben = ekipListesi().find(u => u.email === adminEmail);

}

function canManageUsers() { return benimRolum() === 'admin'; }

// Firma/müşteri bazlı sipariş sayısına göre en çok işlem yapılan 5 müşteri — yatay çubuklu sıralama

  const bars = top.map(([ad, n], i) => `

        <span style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:120px;">${ad}</span><b style="color:var(--text);">${n}</b>
      </div>
      <div style="height:6px; border-radius:4px; background:var(--bg-alt); overflow:hidden;">
        <div style="height:100%; width:${(n / maxN * 100).toFixed(0)}%; background:${renkler[i % renkler.length]}; border-radius:4px;"></div>
      </div>

// İki seri (yeni talep / tamamlanan) alan grafiği — referanstaki turuncu+yeşil
// iki katmanlı area chart diliyle, ama uydurma değil gerçek haftalık verilerle.
function alanGrafigi(rows) {
  const haftalar = [];
  const simdi = Date.now();
  for (let i = 5; i >= 0; i--) {
    const bas = simdi - (i+1)*7*24*60*60*1000;
    const bit = simdi - i*7*24*60*60*1000;
    const yeni = rows.filter(r => { const t = new Date(r.olusturulma).getTime(); return t >= bas && t < bit; }).length;
    const tamam = rows.filter(r => { if (r.durum !== 'teslim_edildi' || !r.guncellenme) return false; const t = new Date(r.guncellenme).getTime(); return t >= bas && t < bit; }).length;
    haftalar.push({yeni, tamam, etiket: new Date(bit).toLocaleDateString('tr-TR', {day:'2-digit', month:'2-digit'})});
  }
  const maxN = Math.max(1, ...haftalar.map(h => Math.max(h.yeni, h.tamam)));
  const W = 560, H = 160, PAD = 26;
  const stepX = (W - PAD*2) / (haftalar.length - 1);
  // Düz çizgi segmentleri yerine yumuşak eğri (Catmull-Rom → kübik bezier
  // dönüşümü) — referanstaki gibi akıcı bir alan grafiği için.
  const yumusakYol = (pts) => {
    if (pts.length < 2) return '';
    let d = `M${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`;
    for (let i = 0; i < pts.length - 1; i++) {
      const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
      const c1x = p1[0] + (p2[0] - p0[0]) / 6, c1y = p1[1] + (p2[1] - p0[1]) / 6;
      const c2x = p2[0] - (p3[0] - p1[0]) / 6, c2y = p2[1] - (p3[1] - p1[1]) / 6;
      d += ` C${c1x.toFixed(1)},${c1y.toFixed(1)} ${c2x.toFixed(1)},${c2y.toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`;
    }
    return d;
  };
  const seri = (key, renk) => {
    const pts = haftalar.map((h,i) => [PAD + i*stepX, H - PAD - (h[key] / maxN) * (H - PAD*2)]);
    const path = yumusakYol(pts);
    const area = path + ` L${pts[pts.length-1][0]},${H-PAD} L${pts[0][0]},${H-PAD} Z`;
    const dots = pts.map(p => `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="2.5" fill="${renk}"/>`).join('');
    // Referanstaki gibi her noktanın gerçek değeri, noktanın hemen üstünde.
    const degerEtiketleri = pts.map((p,i) => `<text x="${p[0].toFixed(1)}" y="${(p[1]-9).toFixed(1)}" font-size="9" font-weight="700" fill="${renk}" text-anchor="middle">${haftalar[i][key]}</text>`).join('');
    return `<path d="${area}" fill="${renk}" fill-opacity="0.14"/><path d="${path}" fill="none" stroke="${renk}" stroke-width="2.5"/>${dots}${degerEtiketleri}`;
  };
  const labels = haftalar.map((h,i) => `<text x="${(PAD+i*stepX).toFixed(1)}" y="${H-6}" font-size="9.5" fill="var(--text-muted)" text-anchor="middle">${h.etiket}</text>`).join('');
  return `<div class="panel chart-card">
    <h2 style="font-size:15px;">Haftalık Sipariş Hacmi</h2>
    <p style="color:var(--text-muted); font-size:12.5px; margin:0 0 10px;">Turuncu: yeni talep · Yeşil: tamamlanan (son 6 hafta, gerçek veri)</p>
    <svg viewBox="0 0 ${W} ${H}" style="width:100%; height:auto;">
      ${seri('yeni', '#ea580c')}${seri('tamam', '#14b8a6')}${labels}
    </svg>
  </div>`;
}

// Süreç fazına göre gerçek sipariş dağılımı — turuncu/yeşil dönüşümlü çubuk
// grafik (referanstaki "Subscriptions" bar chart diliyle).
function barGrafigi(rows) {
  const fazlar = [
    ['Talep/Teklif', r => ['talep_alindi','fabrika_gorusuluyor','teklif_hazir'].includes(r.durum)],
    ['Numune', r => r.durum.startsWith('numune_')],
    ['Üretim', r => r.durum.startsWith('uretim_') || r.durum === 'uretimde'],
    ['Sevkiyat', r => ['sevkiyat_belgeleri_hazirlaniyor','konteyner','yukleme_odeme_bekleniyor','gemide','teslimat_yolda'].includes(r.durum)],
    ['Gümrük', r => r.durum.startsWith('gumruk_')],
    ['Teslim', r => r.durum === 'teslim_edildi'],
  ];
  const veriler = fazlar.map(([ad, f], i) => ({ad, n: rows.filter(f).length, renk: i % 2 === 0 ? '#ea580c' : '#14b8a6'}));
  const maxN = Math.max(1, ...veriler.map(v => v.n));
  const W = 380, H = 160, PAD = 22, barW = (W - PAD*2) / veriler.length * 0.55;
  const stepX = (W - PAD*2) / veriler.length;
  const bars = veriler.map((v,i) => {
    const h = (v.n / maxN) * (H - PAD*2 - 14);
    const x = PAD + i*stepX + (stepX - barW)/2;
    const y = H - PAD - h;
    return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${h.toFixed(1)}" rx="3" fill="${v.renk}"/>
      <text x="${(x+barW/2).toFixed(1)}" y="${(H-PAD+12).toFixed(1)}" font-size="8.5" fill="var(--text-muted)" text-anchor="middle">${v.ad}</text>`;
  }).join('');
  return `<div class="panel chart-card">
    <h2 style="font-size:15px;">Süreç Fazına Göre Dağılım</h2>
    <p style="color:var(--text-muted); font-size:12.5px; margin:0 0 10px;">Aktif ve tamamlanan tüm siparişler, gerçek sayım</p>
    <svg viewBox="0 0 ${W} ${H}" style="width:100%; height:auto;">${bars}</svg>
  </div>`;
}

// Referanstaki halka/donut gösterge — ortada büyük rakamla. Uydurma bir "ilerleme"
// değil: gerçekten teslim edilmiş sipariş oranını gösteriyor.
function tamamlanmaHalkasi(rows) {
  const toplam = rows.length;
  const tamamlanan = rows.filter(r => r.durum === 'teslim_edildi').length;
  const yuzde = toplam > 0 ? Math.round((tamamlanan / toplam) * 100) : 0;
  const R = 70, C = 2 * Math.PI * R;
  const dolu = (yuzde / 100) * C;
  return `<div class="panel chart-card" style="display:flex; flex-direction:column; align-items:center; text-align:center;">
    <h2 style="font-size:15px; align-self:flex-start;">Tamamlanma Oranı</h2>
    <p style="color:var(--text-muted); font-size:12.5px; margin:0 0 10px; align-self:flex-start;">Teslim edilen / toplam sipariş</p>
    <svg viewBox="0 0 180 180" style="width:170px; height:170px;">
      <circle cx="90" cy="90" r="${R}" fill="none" stroke="var(--bg-alt)" stroke-width="16"/>
      <circle cx="90" cy="90" r="${R}" fill="none" stroke="var(--accent2)" stroke-width="16" stroke-linecap="round"
        stroke-dasharray="${dolu.toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 90 90)"/>
      <text x="90" y="84" text-anchor="middle" font-size="30" font-weight="700" fill="var(--text)" font-family="var(--font-display)">%${yuzde}</text>
      <text x="90" y="106" text-anchor="middle" font-size="11" fill="var(--text-muted)">${tamamlanan}/${toplam} sipariş</text>
    </svg>
  </div>`;
}

// Basit CSV dışa aktarma — harici kütüphane gerektirmez. Değerlerdeki
// virgül/tırnak/satır sonu CSV kaçış kuralına göre işlenir.
function csvIndir(rows, alanlar, dosyaAdi) {
  const kacir = (v) => {
    const s = (v === null || v === undefined) ? '' : String(v);
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  };
  const satirlar = [alanlar.join(',')].concat(rows.map(r => alanlar.map(a => kacir(r[a])).join(',')));
  const blob = new Blob(['﻿' + satirlar.join('\n')], {type: 'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = dosyaAdi;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// Gerçek .xlsx dışa aktarma (SheetJS/xlsx CDN) — Nellavio'daki "XLSX dışa aktarma" özelliği.
// Kütüphane henüz yüklenmediyse (defer script) kullanıcıyı bekletmeden uyarır.
function xlsxIndir(rows, alanlar, baslikMap, dosyaAdi) {
  if (typeof XLSX === 'undefined') { showToast('Excel modülü henüz yükleniyor, birazdan tekrar deneyin.', 'err'); return; }
  const veri = rows.map(r => {
    const o = {};
    alanlar.forEach(a => { o[baslikMap && baslikMap[a] || a] = r[a]; });
    return o;
  });
  const sheet = XLSX.utils.json_to_sheet(veri);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, sheet, 'Veri');
  XLSX.writeFile(wb, dosyaAdi);
}

function kopyala(metin, event) {

  setTimeout(() => { el.textContent = eski; }, 900);
