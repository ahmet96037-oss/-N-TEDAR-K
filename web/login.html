<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>🔐 Müşteri Girişi</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --dark-main: #0a0e1f;
      --green: #1fae70;
      --white: #f9f9ff;
    }
    body {
      font-family: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #0a0e1f 0%, #1a1f3a 50%, #0d1628 100%);
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
      overflow: hidden;
    }
    body::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 20% 50%, rgba(31,174,112,.1) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(31,174,112,.05) 0%, transparent 50%);
      pointer-events: none;
    }
    .auth-container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 400px;
      background: rgba(15,20,40,.8);
      border: 1px solid rgba(31,174,112,.3);
      border-radius: 16px;
      padding: 40px;
      backdrop-filter: blur(20px);
      box-shadow: 0 8px 32px rgba(31,174,112,.15), 0 0 1px rgba(31,174,112,.1);
    }
    h1 {
      font-size: 28px;
      margin-bottom: 10px;
      color: var(--green);
      text-align: center;
    }
    .subtitle {
      font-size: 13px;
      color: rgba(255,255,255,.6);
      text-align: center;
      margin-bottom: 30px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: .05em;
      color: rgba(255,255,255,.8);
    }
    input {
      width: 100%;
      padding: 12px 14px;
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 8px;
      color: #fff;
      font-size: 14px;
      font-family: 'Manrope', sans-serif;
      transition: all .2s;
    }
    input::placeholder {
      color: rgba(255,255,255,.4);
    }
    input:focus {
      outline: none;
      border-color: var(--green);
      background: rgba(31,174,112,.08);
    }
    button {
      width: 100%;
      padding: 14px;
      background: var(--green);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all .2s;
      margin-top: 20px;
    }
    button:hover {
      background: #178a5a;
    }
    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }
    .error {
      color: #ff6b6b;
      font-size: 13px;
      margin-top: 10px;
      padding: 10px;
      background: rgba(255,107,107,.1);
      border-radius: 6px;
      display: none;
    }
    .error.show {
      display: block;
    }
    .footer {
      margin-top: 30px;
      text-align: center;
      font-size: 13px;
      color: rgba(255,255,255,.6);
    }
    .footer a {
      color: var(--green);
      text-decoration: none;
      font-weight: 600;
    }
    .footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="auth-container">
    <svg width="160" height="48" viewBox="0 0 300 100" xmlns="http://www.w3.org/2000/svg" style="margin-bottom: 20px;">
      <text x="5" y="32" font-size="30" font-weight="900" font-family="Arial, sans-serif" fill="#1fae70">ROUTEX</text>
      <text x="5" y="55" font-size="13" font-weight="700" font-family="Arial, sans-serif" fill="#1fae70" letter-spacing="2">GLOBAL</text>
      <rect x="180" y="8" width="60" height="60" rx="8" ry="8" fill="#FF5722"/>
      <text x="210" y="58" font-size="50" font-weight="900" font-family="Arial, sans-serif" fill="#fff" text-anchor="middle">X</text>
    </svg>
    <p class="subtitle">Müşteri Portal</p>

    <form id="loginForm">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" value="demo@tedarik.com" required>
      </div>

      <div class="form-group">
        <label for="password">Şifre</label>
        <input type="password" id="password" value="demo123456" required>
      </div>

      <button type="submit" id="submitBtn">Giriş Yap</button>
      <div id="error" class="error"></div>

      <div class="footer">
        Hesabın yok mu?
        <a href="/register.html">Kaydol</a>
      </div>
    </form>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const errorEl = document.getElementById('error');
      const btn = document.getElementById('submitBtn');

      errorEl.classList.remove('show');
      btn.disabled = true;

      try {
        const response = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.detail || 'Giriş başarısız');
        }

        // Token'ı localStorage'a kaydet
        localStorage.setItem('access_token', data.access_token);
        localStorage.setItem('customer_id', data.customer_id);

        // Dashboard'a yönlendir
        window.location.href = '/dashboard.html';
      } catch (err) {
        errorEl.textContent = '❌ ' + err.message;
        errorEl.classList.add('show');
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
