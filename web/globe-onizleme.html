<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RouteX Global — 3D Globe Önizleme</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:#050a08; font-family:-apple-system,sans-serif; overflow:hidden;}
  #globeViz{width:100vw;height:100vh;}
  .label{position:absolute; top:24px; left:24px; color:#fff; z-index:10;}
  .label h1{font-size:22px; font-weight:700; margin-bottom:6px;}
  .label p{font-size:13px; color:rgba(255,255,255,.6);}
</style>
</head>
<body>
<div class="label">
  <h1>RouteX Global — Önizleme</h1>
  <p>Çin'den dünyaya bağlantı çizgileri · fare ile döndürebilirsin</p>
</div>
<div id="globeViz"></div>
<script src="https://cdn.jsdelivr.net/npm/globe.gl"></script>
<script>
  const CHINA = {lat: 31.2, lng: 121.47, name: 'Shanghai, Çin'};
  const HUBS = [
    {lat: 41.0, lng: 28.98, name: 'İstanbul, Türkiye'},
    {lat: 40.18, lng: 29.06, name: 'Bursa, Türkiye'},
    {lat: 52.37, lng: 4.90, name: 'Amsterdam, Hollanda'},
    {lat: 45.46, lng: 9.19, name: 'Milano, İtalya'},
    {lat: -23.55, lng: -46.63, name: 'São Paulo, Brezilya'},
    {lat: -26.20, lng: 28.04, name: 'Johannesburg, G.Afrika'},
    {lat: 25.20, lng: 55.27, name: 'Dubai, BAE'},
    {lat: 40.71, lng: -74.01, name: 'New York, ABD'},
    {lat: 51.51, lng: -0.13, name: 'Londra, İngiltere'},
  ];
  const points = [CHINA, ...HUBS];
  const arcs = HUBS.map(h => ({startLat: CHINA.lat, startLng: CHINA.lng, endLat: h.lat, endLng: h.lng}));

  const globe = Globe()
    (document.getElementById('globeViz'))
    .globeImageUrl('https://cdn.jsdelivr.net/npm/three-globe/example/img/earth-dark.jpg')
    .backgroundColor('rgba(0,0,0,0)')
    .pointsData(points)
    .pointLat('lat').pointLng('lng')
    .pointColor(d => d === CHINA ? '#e11d2e' : '#1fae70')
    .pointAltitude(0.01)
    .pointRadius(0.35)
    .pointLabel('name')
    .arcsData(arcs)
    .arcColor(() => ['#1fae70', 'rgba(31,174,112,0)'])
    .arcDashLength(0.4)
    .arcDashGap(2)
    .arcDashAnimateTime(2500)
    .arcStroke(0.5)
    .atmosphereColor('#1fae70')
    .atmosphereAltitude(0.2);

  globe.controls().autoRotate = true;
  globe.controls().autoRotateSpeed = 0.6;
  globe.pointOfView({lat: 25, lng: 60, altitude: 2.2}, 0);

  window.addEventListener('resize', () => {
    globe.width(window.innerWidth).height(window.innerHeight);
  });
</script>
</body>
</html>
